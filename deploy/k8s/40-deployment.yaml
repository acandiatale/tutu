# 웹 UI 에이전트(`sbmig serve`): replica 1(대기 줄이 이 프로세스 안에 있다 — 동시에 도는 빌드 파드 수는 ConfigMap 의
# SBMIG_JOB_MAX_PARALLEL 이 정하고, 웹 파드는 늘리지 않는다), Recreate(볼륨과 파드가 같이 옮겨간다).
# Job 디스패치 모드(README §3, ConfigMap 의 SBMIG_WEB_MODE=k8s-job)에서는 이 파드가 Agent 다: 업로드마다 Job 을 만들고 공유 PVC 로 결과를 받는다 —
# 쿠버네티스 API 권한(회사: 인프라팀의 kubeconfig Secret — 아래 spec 의 설명)과 ReadWriteMany PVC(10-storage.yaml, nfs-csi)가 그 전제다.
# 회사 값(2026-11-09): namespace agent. 이미지는 인프라팀이 자기 레지스트리에 push 한 전체 이름을 받아 image: 에 넣는다(README §1).
# 회사 artifacts.yml 은 이미지에 굽는다(2026-11-10) — ConfigMap 으로 오는 파일은 settings.xml 하나다(20-configmap.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbmig
  namespace: agent
  labels: {app: sbmig}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sbmig}
  template:
    metadata:
      labels: {app: sbmig}
    spec:
      # ── 쿠버네티스 API 권한(Job 을 만들고 지켜본다), 둘 중 하나.
      #    회사(인프라팀 명세, 2026-11-09): kubeconfig Secret 을 /etc/kube 에 마운트하고 env KUBECONFIG 로 가리킨다 — 아래 세 자리가 켜져 있다
      #    (env KUBECONFIG, volumeMounts 의 kubeconfig, volumes 의 kubeconfig). Secret 이름이 다르면 volumes 의 secretName 만, 그 안의 키 이름이
      #    config 가 아니면 env KUBECONFIG 의 파일 이름만 바꾼다. namespace 는 ConfigMap 의 SBMIG_K8S_NAMESPACE 가 정한다.
      #    kubeconfig 가 없는 클러스터(연습용 kind 등): 그 세 자리를 주석 처리하고 45-web-rbac.yaml 을 먼저 apply 한 뒤 아래 줄의 주석을 푼다.
      #    코드는 KUBECONFIG 파일이 있으면 그것으로, 없으면 서비스 계정 토큰으로 쿠버네티스 API 를 부른다(sbmig/web/k8s.py K8sClient.connect).
      # serviceAccountName: sbmig-web
      # hostAliases:                           # 사내 DNS 가 못 푸는 주소(LLM 게이트웨이 등)가 있을 때 — 인프라팀 임시 명세에 있던 항목. Job 틀에도 같은 값
      #   - {ip: CHANGE_ME_IP, hostnames: [CHANGE_ME_GATEWAY_HOST]}
      # nodeSelector: {kubernetes.io/hostname: CHANGE_ME_NODE}   # 레지스트리 없이 이미지를 노드 하나에만 적재했거나 PVC 가 RWO 일 때만 그 노드에 고정(Job 틀도 같은 노드로)
      # imagePullSecrets: [{name: CHANGE_ME_REGISTRY_PULL_SECRET}]   # 레지스트리가 pull 에 인증을 요구할 때만 — 인프라팀이 준 Secret 이름(81-web-job.template 도 같이)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60      # --graceful-timeout 30 + Maven 자식 프로세스(sbmig 이 트리를 정리한다)
      containers:
        - name: agent
          image: CHANGE_ME_REGISTRY/sbmig:CHANGE_ME_TAG   # 인프라팀이 push 한 전체 이름 그대로(README §1); 81-web-job.template 과 같은 값. 태그는 빌드마다 새로(latest 금지)
          imagePullPolicy: IfNotPresent          # 노드에 그 태그가 없을 때만 레지스트리에서 받는다. 레지스트리 없이 노드에 직접 적재하면 Never (README §1.1)
          ports:
            - {name: http, containerPort: 8765}
          # 운영자가 고치는 환경 변수는 두 곳에서: ConfigMap sbmig-env(비밀 아닌 것 — 웹 파드 동작, LLM 게이트웨이 주소·role, SBMIG_<섹션>__<키> 설정
          # 덮어쓰기)와 Secret sbmig-llm(토큰·비밀번호). 뒤의 것이 이기므로 Secret 을 뒤에 둔다. 값은 20-configmap.yaml 의 설명을 본다.
          # 아래 env 는 이 파드에 고정인 값(틀 위치, 컨테이너 경로)이고 같은 이름이 envFrom 에 있어도 env 가 이긴다
          env:
            # Job 틀은 ConfigMap sbmig-job-template 로 들어온다(아래 volumes; README §3). 이미지 안의 사본은 CHANGE_ME 그대로라 쓰지 않는다
            - {name: SBMIG_JOB_TEMPLATE, value: /templates/81-web-job.template.yaml}
            - {name: KUBECONFIG, value: /etc/kube/config}   # 회사 방식(위 설명): 아래 kubeconfig 볼륨의 파일
            # ── 회사 artifacts.yml 은 이미지에 구워져 있다(/app/config/artifacts.yml — PC 에서 시험한 파일 그대로, README §1). 그 안의 PC 경로를 컨테이너
            #    값으로 덮어쓴다: 환경 변수 SBMIG_<섹션>__<키> 가 yml 보다 우선하고, yml 에 그 키가 없어도 해가 없다. 81-web-job.template.yaml 에도 같은 줄이 있다
            - {name: SBMIG_KB__DIR, value: /data/kb-v2}                            # kb.dir — 볼륨의 파일 KB(이미지 안 kb-v2/ 는 비어 있다)
            - {name: SBMIG_BUILD__SETTINGS_FILE, value: /etc/sbmig/settings.xml}   # ConfigMap sbmig-config 의 settings.xml(아래 마운트)
            - {name: SBMIG_BUILD__JAVA_HOME, value: /opt/java21}                   # 이미지의 JDK 21
            - {name: SBMIG_BUILD__MVN, value: mvn}                                 # 이미지의 Maven(PATH)
            - {name: SBMIG_BUILD__LOCAL_REPO, value: "null"}                       # null = Maven 기본 ~/.m2/repository(아래 m2 볼륨)
            - {name: SBMIG_SCRIPT__PYTHON, value: "null"}                          # null = sbmig 를 돌리는 그 python
            - {name: SBMIG_LLM__RECORD_DIR, value: "${LLM_RECORD_DIR:-}"}          # yml 의 PC 경로 대신 sbmig-env 의 LLM_RECORD_DIR 만 따른다(없으면 기록 안 함). sbmig 가 푸는 자리표시 — 그대로 둔다
            # 출력 정제: 로그 줄·저널 줄·예외 traceback 에서 비밀 값(Secret 으로 들어온 값, 실행 중 받은 토큰)을 **쓰는 순간** *** 로 바꾼다 —
            # 파드 로그(kubectl logs)와 화면의 로그 탭에 값이 보이지 않게. 켜져 있으면 report.md 같은 결과 파일은 실행이 끝난 뒤(마지막 정제 뒤)에만 내려받을 수 있다
            - {name: SBMIG_REDACT_OUTPUT, value: "1"}
          envFrom:
            - configMapRef: {name: sbmig-env}
            - secretRef: {name: sbmig-llm}     # IVAS_BASE_URL / IVAS_USER_ID / IVAS_PASSWORD 도 이 Secret 에 있다 — 취약점 조치는 빌드 파드(81)에서 돌고(README §6)
                                               # Job 모드의 이 파드는 그 값을 쓰지 않는다(in-process 모드에서만 이 파드가 조치를 돌린다)
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: m2, mountPath: /home/sbmig/.m2}
            # - {name: config, mountPath: /app/config/artifacts.yml, subPath: artifacts.yml, readOnly: true}   # artifacts.yml 을 ConfigMap 으로 줄 때만(20-configmap.yaml 맨 아래) — 이미지에 구운 파일을 가린다
            - {name: config, mountPath: /etc/sbmig/settings.xml, subPath: settings.xml, readOnly: true}
            - {name: job-template, mountPath: /templates, readOnly: true}
            - {name: kubeconfig, mountPath: /etc/kube, readOnly: true}   # 회사 방식: Secret 의 키 config → /etc/kube/config
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {cpu: "4", memory: 8Gi}      # Maven / OpenRewrite 가 -Xmx4g(build.jvm_args) + Python
          readinessProbe:
            tcpSocket: {port: http}               # 인증 없는 health 경로가 없다(토큰 가드가 403) → tcp 프로브
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: sbmig-data}
        - name: m2
          persistentVolumeClaim: {claimName: sbmig-m2}
        - name: config                          # settings.xml
          configMap: {name: sbmig-config}
        - name: job-template                    # kubectl -n agent create configmap sbmig-job-template --from-file=deploy/k8s/81-web-job.template.yaml
          configMap: {name: sbmig-job-template, optional: true}   # Job 모드(sbmig-env 의 SBMIG_WEB_MODE=k8s-job, 기본)에서는 이 ConfigMap 이 없으면 시작 검증이 MIGRATION_TEMPLATE_INVALID 로 멈춘다 — 40 보다 먼저 만든다
        - name: kubeconfig                      # 회사 방식: 인프라팀이 준 Secret 이름(없으면 파드가 ContainerCreating 에서 기다린다)
          secret: {secretName: agent-kubeconfig, defaultMode: 0400}
