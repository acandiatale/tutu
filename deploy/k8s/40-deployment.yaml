# 웹 UI 에이전트(`sbmig serve`): replica 1(한 번에 한 이관 — 큐가 프로세스 안에 있다), Recreate(RWO 볼륨이 파드와 함께 옮겨간다).
# 요청별 Job 모델만 쓰면 이 Deployment 는 필요 없다(에이전트 역할은 submit-job.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbmig
  labels: {app: sbmig}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sbmig}
  template:
    metadata:
      labels: {app: sbmig}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60      # --graceful-timeout 30 + Maven 자식 프로세스(sbmig 이 트리를 정리한다)
      containers:
        - name: agent
          image: <registry>/sbmig:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8765}
          envFrom:
            - secretRef: {name: sbmig-llm}
          env:
            - {name: SBMIG_MAX_UPLOAD_MB, value: "1024"}
            - {name: SBMIG_WEB_CONFIGS, value: "company.yml"}     # 모든 업로드가 이 config 로 돈다(= sbmig serve --config); 쉼표로 여러 개
            - {name: SBMIG_WEB_OPEN, value: "1"}                 # 사내망 전용 페이지(2026-11-05 결정): 토큰 없이 연다. 토큰을 쓰려면 이 줄을
                                                                 # 지우고 Secret 의 SBMIG_WEB_TOKEN 을 채운다(토큰이 있으면 토큰이 우선)
            # - {name: NO_PROXY, value: "<게이트웨이 호스트>,<nexus 호스트>,localhost,127.0.0.1"}   # 클러스터에 프록시가 걸려 있을 때
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: m2, mountPath: /home/sbmig/.m2}
            - {name: config, mountPath: /app/config/company.yml, subPath: company.yml, readOnly: true}
            - {name: config, mountPath: /etc/sbmig/settings.xml, subPath: settings.xml, readOnly: true}
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {cpu: "4", memory: 8Gi}      # Maven / OpenRewrite 가 -Xmx4g(build.jvm_args) + Python
          readinessProbe:
            tcpSocket: {port: http}               # 인증 없는 health 경로가 없다(토큰 가드가 403) → tcp 프로브
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: sbmig-data}
        - name: m2
          persistentVolumeClaim: {claimName: sbmig-m2}
        - name: config
          configMap: {name: sbmig-config}
