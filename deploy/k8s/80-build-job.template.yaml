# 인프라팀 모델(가이드 2026-11-05, "Biz 클러스터: Agent 가 요청별 빌드 Job 을 생성"): 이관 요청 하나 = Job 하나. 그 파드가 실행 전체를
# 한다 — 소스 받기, sbmig run(OpenRewrite + 재구조화 + 구조 리뷰 + 빌드-수정 루프), 결과 내보내기, 저장소 커밋 — 그리고 종료한다.
# 작업 공간은 emptyDir(파드와 함께 사라짐)이라 파드보다 오래 살아야 하는 것은 deploy/docker/run-job.sh 가 끝나기 전에 밖으로 push 한다:
# 이관된 프로젝트(소스 저장소의 브랜치 sbmig/<run id>), 보고서 / 로그(결과 저장소 또는 RESULT_PUSH_CMD), 파일 KB(KB 저장소).
# Agent 쪽: `kubectl --kubeconfig=/etc/kube/config create -f`(generateName 이라 apply 가 아니라 create); deploy/k8s/submit-job.sh.
# CHANGE_ME_*: namespace, nodeSelector 라벨, image, Secret 이름. 그 밖의 값은 프로젝트 크기에 맞춰 조정한다.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: sbmig-run-
  namespace: CHANGE_ME_NAMESPACE
  labels: {app: sbmig, kind: run}
spec:
  backoffLimit: 0                       # 이관을 무턱대고 재시도하지 않는다(실패한 실행의 보고서가 곧 결과)
  activeDeadlineSeconds: 14400          # 4 시간: 큰 프로젝트는 수정 라운드 12 × Maven 빌드로 1~3 시간
  ttlSecondsAfterFinished: 86400        # `kubectl logs` 용으로 파드 로그를 하루 보존; 결과는 이미 push 됨
  template:
    metadata:
      labels: {app: sbmig, kind: run}
    spec:
      restartPolicy: Never
      nodeSelector:
        customer.example.com/build-worker: "true"     # CHANGE_ME: 빌드 워커 노드의 라벨
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      # imagePullSecrets: [{name: CHANGE_ME_REGISTRY_PULL_SECRET}]      # 레지스트리를 쓸 때만
      containers:
        - name: build
          image: sbmig:CHANGE_ME_TAG                                    # deploy/docker/Dockerfile; 레지스트리가 없으면 이 이름(빌드 워커 노드마다 적재 — README §1.1), 있으면 <registry>/sbmig:<tag>
          imagePullPolicy: Never                                        # 적재된 이미지만; 레지스트리를 쓰면 IfNotPresent
          command: ["/app/deploy/docker/run-job.sh"]
          env:
            # --- 요청 값(Agent 가 Job 마다 채운다: submit-job.sh 가 아래 SBMIG_* 의 value 를 바꿔 넣는다) ---
            - {name: SBMIG_SOURCE_GIT_URL, value: "CHANGE_ME_https://git.company/<group>/<project>.git"}
            - {name: SBMIG_SOURCE_GIT_REF, value: "main"}
            # - {name: SBMIG_SOURCE_ZIP_URL, value: "https://…/project.zip"}     # git 대신 zip 을 내려받을 때
            - {name: SBMIG_RESULT_BRANCH_PREFIX, value: "sbmig/"}                 # 이관된 프로젝트는 <prefix><run id> 브랜치로 push
            - {name: SBMIG_RESULT_GIT_URL, value: ""}                              # 선택: report.md / 로그를 모으는 저장소
            - {name: SBMIG_KB_GIT_URL, value: "CHANGE_ME_https://git.company/<group>/sbmig-kb.git"}   # 파일 KB 는 git 에(실행마다 pull / push)
            - {name: SBMIG_CONFIG, value: "/etc/sbmig/company.yml"}
            - {name: SBMIG_FAIL_JOB_ON_BUILD_FAIL, value: "0"}                      # 1 → 빌드 실패도 0 아닌 종료(Job Failed)
            - {name: GIT_AUTHOR_NAME, value: "sbmig"}
            - {name: GIT_AUTHOR_EMAIL, value: "sbmig@company.example"}
            - {name: GIT_COMMITTER_NAME, value: "sbmig"}
            - {name: GIT_COMMITTER_EMAIL, value: "sbmig@company.example"}
          envFrom:
            - configMapRef: {name: sbmig-env}     # LLM_* 중 비밀 아닌 것(게이트웨이 주소, 에셋 id, 토큰 URL, role 이름) + SBMIG_<섹션>__<키> 덮어쓰기
            - secretRef: {name: sbmig-llm}        # LLM_APP_TOKEN(또는 LLM_API_KEY), NEXUS_USER / NEXUS_PASSWORD — 뒤에 두어 Secret 이 이긴다
            - secretRef: {name: sbmig-git}        # GIT_TOKEN (+ 선택 GIT_USER): 저장소 자격 증명 — 이미지·로그에 넣지 않는다
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: m2, mountPath: /home/sbmig/.m2}
            - {name: config, mountPath: /etc/sbmig/company.yml, subPath: company.yml, readOnly: true}
            - {name: config, mountPath: /etc/sbmig/settings.xml, subPath: settings.xml, readOnly: true}
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {cpu: "4", memory: 8Gi}     # build.jvm_args -Xmx4g + Python
      volumes:
        - name: workspace
          emptyDir: {sizeLimit: 20Gi}
        - name: m2                              # emptyDir = Job 마다 Boot 4 / OpenRewrite / 플러그인을 Nexus 에서 다시 받는다
          emptyDir: {sizeLimit: 10Gi}           # (PVC 가 가능하면 persistentVolumeClaim: {claimName: sbmig-m2} 로 — README §3)
        - name: config
          configMap: {name: sbmig-config}
