# The infra team's model (guide of 2026-11-05, "Biz cluster: the Agent creates one build Job per request"): ONE Job per
# migration request; its pod does the whole run — source in, sbmig run (OpenRewrite + restructure + review + build-fix
# loop), results out, repository commit — and exits. The workspace is an emptyDir (gone with the pod), so everything that
# must outlive the pod is pushed out by deploy/docker/run-job.sh before it ends: the migrated project (branch sbmig/<run id>
# on the source repository), the report / logs (result repository or RESULT_PUSH_CMD) and the file KB (its own repository).
# Agent side: `kubectl --kubeconfig=/etc/kube/config create -f` (generateName → create, not apply); deploy/k8s/submit-job.sh.
# CHANGE_ME_*: namespace, nodeSelector label, image, the Secret names. Other values: tune to the project sizes.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: sbmig-run-
  namespace: CHANGE_ME_NAMESPACE
  labels: {app: sbmig, kind: run}
spec:
  backoffLimit: 0                       # a migration is not retried blindly (the report of a failed run is the result)
  activeDeadlineSeconds: 14400          # 4 h: 12 fix rounds × Maven builds on a big project can take 1–3 h
  ttlSecondsAfterFinished: 86400        # keep the pod's logs a day for `kubectl logs`; the results are already pushed out
  template:
    metadata:
      labels: {app: sbmig, kind: run}
    spec:
      restartPolicy: Never
      nodeSelector:
        customer.example.com/build-worker: "true"     # CHANGE_ME: the build workers' label
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      # imagePullSecrets: [{name: CHANGE_ME_REGISTRY_PULL_SECRET}]
      containers:
        - name: build
          image: <image-registry>/CHANGE_ME_PROJECT/sbmig:CHANGE_ME_TAG    # deploy/docker/Dockerfile (Python + JDK 21 + Maven + git)
          command: ["/app/deploy/docker/run-job.sh"]
          env:
            # --- the request (set by the agent per Job: envsubst / kubectl create -f - with the values filled in) ---
            - {name: SBMIG_SOURCE_GIT_URL, value: "CHANGE_ME_https://git.company/<group>/<project>.git"}
            - {name: SBMIG_SOURCE_GIT_REF, value: "main"}
            # - {name: SBMIG_SOURCE_ZIP_URL, value: "https://…/project.zip"}     # instead of git: a zip to download
            - {name: SBMIG_RESULT_BRANCH_PREFIX, value: "sbmig/"}                 # the migrated project is pushed as <prefix><run id>
            - {name: SBMIG_RESULT_GIT_URL, value: ""}                              # optional: a repository that collects report.md / logs
            - {name: SBMIG_KB_GIT_URL, value: "CHANGE_ME_https://git.company/<group>/sbmig-kb.git"}   # the file KB lives in git (pulled / pushed per run)
            - {name: SBMIG_CONFIG, value: "/etc/sbmig/company.yml"}
            - {name: SBMIG_FAIL_JOB_ON_BUILD_FAIL, value: "0"}                      # 1 → exit non-zero (Job Failed) when the build did not pass
            - {name: GIT_AUTHOR_NAME, value: "sbmig"}
            - {name: GIT_AUTHOR_EMAIL, value: "sbmig@company.example"}
            - {name: GIT_COMMITTER_NAME, value: "sbmig"}
            - {name: GIT_COMMITTER_EMAIL, value: "sbmig@company.example"}
          envFrom:
            - secretRef: {name: sbmig-llm}        # LLM_* (gateway, asset id, token url, app token, roles)
            - secretRef: {name: sbmig-git}        # GIT_TOKEN (+ optional GIT_USER): repository credentials, never baked / logged
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: m2, mountPath: /home/sbmig/.m2}
            - {name: config, mountPath: /etc/sbmig/company.yml, subPath: company.yml, readOnly: true}
            - {name: config, mountPath: /etc/sbmig/settings.xml, subPath: settings.xml, readOnly: true}
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {cpu: "4", memory: 8Gi}     # build.jvm_args -Xmx4g + Python
      volumes:
        - name: workspace
          emptyDir: {sizeLimit: 20Gi}
        - name: m2                              # emptyDir = every Job downloads Boot 4 / OpenRewrite / plugins again from Nexus
          emptyDir: {sizeLimit: 10Gi}           # (ask for a PVC here, or a warmed ~/.m2 layer in the image — README §6)
        - name: config
          configMap: {name: sbmig-config}
