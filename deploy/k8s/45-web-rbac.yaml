# 웹 파드(sbmig serve, Job 디스패치 모드)가 빌드 Job 을 만들고 지켜보는 데 필요한 최소 권한.
# 네임스페이스(회사: agent, 2026-11-09) 안에서만 유효한 Role 이다. 회사는 인프라팀의 kubeconfig Secret(/etc/kube/config)으로
# 권한을 받으므로 이 파일을 쓰지 않는다. kubeconfig 가 없는 클러스터에서만: 이 파일을 Deployment 보다 먼저 apply 하고 40-deployment.yaml 의
# serviceAccountName: sbmig-web 줄의 주석을 푼다(kubeconfig 세 자리는 주석 처리).
# 빌드 Job 파드에는 어떤 권한도 주지 않는다(쿠버네티스 API 를 부르지 않는다).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbmig-web
  namespace: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sbmig-web-jobs
  namespace: agent
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]   # 만들기 · 상태 보기 · 중지(= 삭제)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]                       # Job 이 만든 파드를 찾는다
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]                                        # 진행 화면에 흘릴 로그
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbmig-web-jobs
  namespace: agent
subjects:
  - kind: ServiceAccount
    name: sbmig-web
    namespace: agent
roleRef:
  kind: Role
  name: sbmig-web-jobs
  apiGroup: rbac.authorization.k8s.io
