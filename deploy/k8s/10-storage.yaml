# 에이전트의 영속 상태 — 이미지 안에는 두지 않는다. 웹 UI 에이전트(40-deployment)가 쓴다. RWO 로 충분하다(파드 하나, 한 번에 한 이관).
# 요청별 Job 모델(80-build-job)에서는 작업 공간이 emptyDir 이라 이 PVC 를 쓰지 않는다 — 단, KB 와 ~/.m2 를 PVC 로 두기로 하면
# 같은 이름의 PVC 를 Job 템플릿의 volumes 에 연결한다(deploy/README.md §3).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sbmig-data            # /data: 업로드, 실행 디렉터리(out/), KB(kb.dir), LLM 기록
  labels: {app: sbmig}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
  # storageClassName: <회사 스토리지 클래스>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sbmig-m2              # ~/.m2: Maven 로컬 저장소 — 없으면 실행마다 Nexus 에서 전부 다시 받는다
  labels: {app: sbmig}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
  # storageClassName: <회사 스토리지 클래스>
