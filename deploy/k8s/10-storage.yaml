# 에이전트의 영속 상태 — 이미지 안에는 두지 않는다. 웹 UI 에이전트(40-deployment)가 쓴다. ① 자기 안에서 돌릴 때는 RWO 로 충분하다.
# Job 디스패치 모드(README §3, 2026-11-05 결정: zip·실행 폴더·KB 전부 이 볼륨)에서는 웹 파드와 Job 파드가 동시에 마운트하므로
# sbmig-data 는 ReadWriteMany 여야 한다(안 되면 Job 템플릿에 웹 파드 노드의 nodeAffinity). sbmig-m2 도 Job 템플릿이 함께 쓴다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sbmig-data            # /data: 업로드, 실행 디렉터리(out/), KB(kb.dir), LLM 기록
  labels: {app: sbmig}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
  # storageClassName: <회사 스토리지 클래스>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sbmig-m2              # ~/.m2: Maven 로컬 저장소 — 없으면 실행마다 Nexus 에서 전부 다시 받는다
  labels: {app: sbmig}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
  # storageClassName: <회사 스토리지 클래스>
