# RBAC for the split layouts: the agent must exec into the builder (sidecar: its own pod) and, for the per-request
# builder POD variant (README §3), create / delete pods. Not needed for the single image.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbmig
  labels: {app: sbmig}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sbmig-builder
  labels: {app: sbmig}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbmig-builder
  labels: {app: sbmig}
subjects:
  - kind: ServiceAccount
    name: sbmig
roleRef:
  kind: Role
  name: sbmig-builder
  apiGroup: rbac.authorization.k8s.io
