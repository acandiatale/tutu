# EXAMPLE — the SPLIT layout as a sidecar (deploy/README.md §3): the agent container has no JDK / Maven; a "builder"
# container in the SAME pod holds them, both mount /data, and the agent runs mvn through `kubectl exec -c builder`
# (deploy/docker/mvn-k8s as build.mvn). Same node → no ReadWriteMany storage, no per-request pod creation / deletion,
# the builder lives and dies with the agent. Requires the RBAC of 71-split-rbac.yaml (pods/exec on itself).
# Only worth it when project builds must not run in the container that holds the LLM credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbmig
  labels: {app: sbmig}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sbmig}
  template:
    metadata:
      labels: {app: sbmig}
    spec:
      serviceAccountName: sbmig
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      terminationGracePeriodSeconds: 60
      containers:
        - name: agent
          image: <registry>/sbmig-agent:<tag>      # the single image works too (its own Maven then stays unused)
          ports: [{name: http, containerPort: 8765}]
          envFrom: [{secretRef: {name: sbmig-llm}}]
          env:
            - {name: SBMIG_BUILDER_CONTAINER, value: builder}
            # SBMIG_BUILDER_POD defaults to $HOSTNAME (this pod); the company yml sets build.mvn: /app/deploy/docker/mvn-k8s
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /app/config/company.yml, subPath: company.yml, readOnly: true}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 3Gi}
          readinessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 10, periodSeconds: 10}
        - name: builder
          image: <registry>/sbmig-builder:<tag>   # deploy/docker/Dockerfile.builder
          command: ["sleep", "infinity"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: m2, mountPath: /home/sbmig/.m2}
            - {name: config, mountPath: /etc/sbmig/settings.xml, subPath: settings.xml, readOnly: true}
          resources:
            requests: {cpu: "2", memory: 5Gi}
            limits: {cpu: "4", memory: 6Gi}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: sbmig-data}}
        - {name: m2, persistentVolumeClaim: {claimName: sbmig-m2}}
        - {name: config, configMap: {name: sbmig-config}}
