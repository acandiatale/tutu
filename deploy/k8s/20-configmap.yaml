# Maven 설정(+ 아래 두 번째 문서 = 환경 변수 ConfigMap). settings.xml 은 Maven 이 Nexus 를 보게 하는 미러 설정이고 파드의 /etc/sbmig/settings.xml 로
# 마운트된다. <…> 자리를 회사 값으로 바꾼다. 키·토큰은 여기 두지 않는다(Secret 으로).
# 회사 artifacts.yml 은 여기 없다(2026-11-10): PC 에서 시험한 config/artifacts.yml 을 이미지에 굽는다 — docker build 가 /app/config/ 로 복사한다
# (README §1; --build-arg REQUIRE_CONFIG=artifacts.yml 이 그 파일 없는 빌드를 막는다). 그 파일에 적힌 PC 경로(kb.dir, build.settings_file,
# build.java_home, build.mvn, build.local_repo, script.python, llm.record_dir)는 각 매니페스트의 env SBMIG_<섹션>__<키> 가 컨테이너 값으로 덮어쓴다
# (환경 변수가 yml 보다 우선). 값 하나를 바꾸려면 아래 sbmig-env 의 그룹 3 을 쓰고, 파일 전체를 이미지 재빌드 없이 바꾸려면 이 ConfigMap 맨 아래의
# "ConfigMap 으로 줄 때" 를 따른다. 구운 파일에도 키·토큰은 넣지 않는다(이미지는 레지스트리에 올라간다).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sbmig-config
  namespace: agent
  labels: {app: sbmig}
data:
  settings.xml: |
    <settings>
      <mirrors>
        <mirror>
          <id>company-nexus</id>
          <mirrorOf>*</mirrorOf>
          <url><https://nexus.company/repository/maven-public/></url>
        </mirror>
      </mirrors>
      <!-- Nexus 에 로그인이 필요하면: 값은 Secret 의 NEXUS_USER / NEXUS_PASSWORD 에 두고 여기서는 ${env.…} 로 가리킨다.
           Maven 도 sbmig 도 settings.xml 의 ${env.X} 를 환경 변수로 푼다. <id> 는 위 미러의 <id> 와 같아야 한다.
      <servers>
        <server>
          <id>company-nexus</id>
          <username>${env.NEXUS_USER}</username>
          <password>${env.NEXUS_PASSWORD}</password>
        </server>
      </servers>
      -->
    </settings>
  # ── ConfigMap 으로 줄 때(이미지를 다시 굽지 않고 artifacts.yml 전체를 바꿔야 할 때만): 아래 주석을 풀어 회사 artifacts.yml 내용을 붙이고,
  #    40-deployment.yaml · 81-web-job.template.yaml(· 80-build-job.template.yaml)의 artifacts.yml 마운트 줄 주석을 푼다 — 마운트가 이미지 안의 파일을 가린다.
  #    웹 파드와 Job 파드가 같은 내용을 봐야 한다(접수 때 적은 sha256 을 Worker 가 대조한다): 이 키를 고치면 웹 파드를 재시작한다.
  # artifacts.yml: |
  #   artifacts:
  #     parent: {group_id: <회사 group>, artifact_id: base-parent, version: 4.0.0}
  #     …(config/artifacts.example.yml 이 틀)
---
# 환경 변수 ConfigMap — 비밀이 아닌 설정 전부(토큰·비밀번호는 Secret sbmig-llm / sbmig-git).
# 누가 읽나: 웹 파드(40-deployment.yaml)와 one-Job 모델(80-build-job.template.yaml)은 envFrom 으로 전부 읽는다. 웹이 만드는 Job(81-web-job.template.yaml)은
#   envFrom 을 못 써서 그 틀에 키마다 configMapKeyRef 가 적혀 있다 — 그룹 2 · 3 의 키는 전부 81 에 있다(여기 새 키를 더하면 81 에도 한 줄; tests/deploy 가 본다).
# 언제 읽나: 웹 파드는 시작할 때, Job 파드는 만들어질 때 읽는다. 그래서 이 ConfigMap 을 고친 뒤에는 웹 파드를 재시작한다
#   (kubectl -n agent rollout restart deploy/sbmig) — 안 하면 다음 Job 이 몇 초 만에 웹 파드와 값이 다른 키 이름을 적고 멈춘다(Worker 가 자기
#   환경을 웹 파드의 것과 대조한다; 그룹 1 의 SBMIG_JOB_ENV_PIN 을 warn / off 로 두면 완화된다). 81(Job 틀)을 고쳤을 때도 ConfigMap
#   sbmig-job-template 을 다시 만들고 웹 파드를 재시작한다(웹 파드는 시작할 때 틀을 읽어 둔다).
#   그룹 1 — 웹 파드 동작.   그룹 2 — LLM 게이트웨이(비밀 아닌 것).   그룹 3 — 이미지에 구운 artifacts.yml / default.yml 의 설정 키를 덮어쓰는
#   SBMIG_<섹션>__<키>(밑줄 두 개 = 한 단계 아래; 값은 YAML 로 읽으므로 숫자·true/false·["목록"] 그대로). 시험 운영 중 자주 손대는
#   키만 적었고, 주석을 풀면 그 값이 artifacts.yml 보다 우선한다. 모르는 키 이름은 시작 로그에 `config: … is not a known key` 로 뜬다.
#   컨테이너 경로(SBMIG_KB__DIR, SBMIG_BUILD__SETTINGS_FILE …)는 여기 두지 않는다 — 파드마다 값이 달라 40 / 81 / 80 의 env 에 직접 적혀 있다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sbmig-env
  namespace: agent
  labels: {app: sbmig}
data:
  # ── 1. 웹 파드 ──────────────────────────────────────────────────────────────────────────────────
  SBMIG_WEB_CONFIGS: "artifacts.yml"      # 모든 업로드가 이 config 로 돈다(= sbmig serve --config). 쉼표로 여러 개
  SBMIG_WEB_OPEN: "1"                   # 사내망 전용 페이지(2026-11-05 결정): 토큰 없이 연다. 토큰을 쓰려면 지우고 Secret 의 SBMIG_WEB_TOKEN
  SBMIG_MAX_UPLOAD_MB: "1024"           # 업로드 zip 상한(MB). 0 = 없음. 기본 512
  # 클러스터에서 프록시로 나가야 할 때만(웹 파드와 Job 파드가 같이 읽는다). 사내 게이트웨이 / Nexus 는 보통 NO_PROXY 에 둔다
  # HTTP_PROXY: "http://<프록시 호스트>:<포트>"
  # HTTPS_PROXY: "http://<프록시 호스트>:<포트>"
  # NO_PROXY: "<게이트웨이 호스트>,<nexus 호스트>,localhost,127.0.0.1"
  # 회사 운영 방식(2026-11-10): 업로드마다 Job 하나(공유 PVC). 켜 둔 채로 나간다 — 웹 파드는 시작할 때 권한(kubeconfig Secret)과 Job 틀
  # (ConfigMap sbmig-job-template, README §3 "켜는 법" 4)을 검사하고 어긋나면 뜨지 않는다. 웹 파드가 직접 돌리게 하려면 이 줄을 주석 처리
  SBMIG_WEB_MODE: "k8s-job"
  SBMIG_K8S_NAMESPACE: "agent"          # Job 을 만드는 namespace(회사 값). 이 줄이 없으면 kubeconfig context 의 namespace, 그것도 없으면 default 로 간다
  # 동시에 도는 빌드 파드(Job) 수(회사 값 2026-11-10: 처음에는 3). 넘는 업로드는 올린 순서대로 기다리고 화면에 대기 순번이 보인다.
  # 자리(1 · 2 · 3)마다 Maven 로컬 저장소를 따로 쓴다(PVC sbmig-m2 안의 repository, repository-slot2, repository-slot3 — 한 저장소에
  # 여러 Maven 이 동시에 쓰면 깨질 수 있다). 1 로 두면 예전처럼 한 번에 하나. 바꾼 뒤에는 웹 파드를 다시 띄운다(시작할 때 한 번 읽는다).
  # 파드 하나가 CPU 2 / 메모리 6Gi 를 요청한다(81 의 resources) — 3 이면 노드에 CPU 6 / 메모리 18Gi 여유가 있어야 셋이 같이 돈다
  SBMIG_JOB_MAX_PARALLEL: "3"
  # SBMIG_JOB_TEMPLATE 은 Deployment 의 env 가 /templates/81-web-job.template.yaml 로 정한다(ConfigMap sbmig-job-template) — 여기서는 안 건드린다
  # SBMIG_JOB_STOP_GRACE_S: "2700"      # 멈춤 요청 뒤 Job 삭제까지(초). Maven 빌드 한 번 + OpenRewrite 보다 길어야 보고서를 잃지 않는다
  # SBMIG_JOB_EXIT_GRACE_S: "120"       # 결과 파일(job-status.json)을 쓴 뒤에도 파드가 남아 있으면 이 초 뒤에 그 Job 을 지운다
  # SBMIG_JOB_API_GRACE_S: "300"        # 쿠버네티스 API 가 이 초 동안 답하지 않으면 로그·화면에 크게 알린다. 실행은 실패로 끝나지 않고
  #                                     # 그 자리는 API 가 다시 답해 그 Job 이 끝난 것을 확인할 때까지 비지 않는다(같은 자리에 두 이관이 겹치지 않게)
  # SBMIG_JOB_ENV_PIN: "refuse"         # Job 파드의 환경(그룹 2 · 3 의 값, 설정 파일이 읽는 ${…} 변수)이 이 파드와 다를 때: refuse = 그 Job 은
  #                                     # 돌지 않고 다른 키 이름을 적고 멈춘다(k8s-job 기본) | warn = 저널에 적고 Job 파드의 값으로 돈다 |
  #                                     # off = 대조하지 않는다(local-job 기본). 값은 비교하지 않고 지문만 — 비밀(토큰·비밀번호)은 대조 대상이 아니다
  # ── 2. LLM 게이트웨이(비밀 아닌 것) ─────────────────────────────────────────────────────────────
  LLM_GATEWAY: "agent"                  # 사내 GPT 에이전트 게이트웨이 페이로드. 옛 모양이면 지운다(legacy)
  LLM_BASE_URL: "https://<게이트웨이 호스트>/api/serv/v1/agents/{asset_id}/chat/completions"   # {asset_id} 는 아래 값으로 채워진다
  LLM_ASSET_ID: "<에셋 id>"
  LLM_TOKEN_URL: "https://<게이트웨이 호스트>/<토큰 발급 경로>"
  LLM_MODEL: "build_error_fixer"        # params.role — 수정 1~2회차 + 구조 리뷰(게이트웨이가 모델에 매핑)
  LLM_ESCALATION_MODEL: "escalation_fixer"   # params.role — 케이스 3회차부터 / 정체 뒤
  # LLM_RECIPE_MODEL: ""                # 계획 검토(plan.advisor: llm)의 값싼 모델. 비우면 LLM_MODEL; 기본 흐름(advisor: none)은 안 쓴다.
  #                                     # default.yml 이 읽는 변수라 두 파드의 값을 대조한다 — 81 에도 같은 키 줄이 있다
  # LLM_RECORD_DIR: "/data/llm-records" # 요청·응답 기록(비밀 없음; 프로젝트 소스가 들어간다) — 웹 파드 안에서 돌리는 in-process 모드의 진단용.
  #                                     # Job 모드는 이 변수를 읽지 않는다: 81-web-job.template.yaml 의 SBMIG_WORKER_LLM_RECORDS 두 줄을 푼다
  # LLM_RESPONSE_PATH: ""               # llm-probe 가 응답 본문을 못 찾을 때만
  # ── 3. 자주 조정하는 설정 키(SBMIG_<섹션>__<키>) — 기본값을 적어 두었다 ─────────────────────────
  #    값을 비워 두지 않는다: SBMIG_<섹션>__<키>: "" 는 YAML null 로 읽혀 yml 의 값을 없앤다 — 안 쓸 키는 주석으로 둔다
  # SBMIG_SCRIPT__MAX_LLM_TRIES_PER_CASE: "20"       # 케이스당 LLM 요청 상한(넘으면 BLOCKED repeated_failure). 회사 실행을 보며 줄인다
  # SBMIG_SCRIPT__MAX_AUGMENTS_PER_CASE: "15"        # 그중 보강(augment) 상한
  # SBMIG_SCRIPT__MAX_DECLINES_PER_CASE: "1"         # LLM 거절 몇 번에 needs_owner 로 넘기나
  # SBMIG_LOOP__STALL_LIMIT: "2"                     # 같은 오류 묶음이 이 횟수 반복되면 상위 모델
  # SBMIG_LOOP__PHASES__VERIFY__MAX_ITERATIONS: "50" # 빌드-수정 라운드 상한
  # SBMIG_LOOP__MAX_TOTAL_MINUTES: "240"             # 실행 하나의 시간 상한(분)
  # SBMIG_LOOP__MAX_LLM_CALLS: "0"                   # 프로젝트당 LLM 총 호출 상한. 0 = 없음, -1 = 저장 스크립트만
  # SBMIG_LLM__CASE_THREAD: "false"                  # 케이스 스레드(세션 이어 쓰기). 첫 측정 실행 뒤 true
  # SBMIG_LLM__TIMEOUT_SECONDS: "180"                # 게이트웨이 응답 대기
  # SBMIG_LLM__MAX_OUTPUT_TOKENS: "8000"
  # SBMIG_LLM__TEMPERATURE: "0.0"
  # SBMIG_BUILD__TIMEOUT_MINUTES: "30"               # mvn clean package 한 번의 상한
  # SBMIG_BUILD__REPOSITORY_URL: "https://<nexus>/repository/maven-public/"   # 구운 artifacts.yml 의 값을 덮어쓸 때(환경별 Nexus) — sbmig 가 메타데이터 / pom 을 직접 읽는 주소
  # SBMIG_BUILD__REPOSITORY_TIMEOUT_SECONDS: "10"    # sbmig 의 Nexus 조회(메타데이터 / pom) 대기
  # SBMIG_OPENREWRITE__TIMEOUT_MINUTES: "40"
  # SBMIG_OPENREWRITE__JVM_ARGS: '["-Xmx4g"]'        # OpenRewrite 를 돌리는 Maven 의 힙(MAVEN_OPTS). 파드 memory limit 보다 2 GiB 이상 작게
  # SBMIG_INTAKE__ADF_POLICY: "stop"                 # ADF(JDeveloper) 프로젝트: stop(변환 불가로 끝) | warn
  # SBMIG_LAYOUT__WIRE_BUNDLED_JARS: "true"          # WEB-INF/lib 의 선언 없는 jar 를 재구성 때 연결
  # SBMIG_LIBRARIES__NEXUS_SEARCH: "true"            # jakarta 빌드 탐색에 Nexus 검색 API 사용
  # SBMIG_LIBRARIES__INCLUDE_PRERELEASE: "false"
  # SBMIG_REVIEW__FIX_CRITICAL: "true"               # 구조 리뷰의 critical 을 자동 수정
  # SBMIG_FLEET__MIN_FREE_GB: "5"                    # 디스크 여유 하한(실행 전 확인)
