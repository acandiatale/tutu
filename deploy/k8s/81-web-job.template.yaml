# 웹 파드의 Job 디스패치 모드(2026-11-05 결정: 전달·결과·KB 전부 공유 PVC)가 업로드마다 만드는 Job 의 틀. `sbmig serve` 가
# SBMIG_WEB_MODE=k8s-job 일 때 이 파일(SBMIG_JOB_TEMPLATE)을 읽어 metadata.name(sbmig-<run id>)과 실행별 env 를 채워 생성한다.
#   SBMIG_SOURCE_ZIP=/data/out/<run id>/source.zip, SBMIG_OUT=/data/out, SBMIG_RUN_ID, SBMIG_CONFIG(/app/config/<yml> …),
#   SBMIG_STOP_AFTER / SBMIG_LLM_PROVIDER(고급 설정일 때만) — 그 밖의 값은 이 파일 그대로.
# 웹 파드(40-deployment.yaml)와 같은 이미지(회사 artifacts.yml 이 그 안에 구워져 있다), 같은 ConfigMap / Secret, 같은 PVC 를 같은 경로(/data)에 마운트해야 한다. 두 파드가 동시에
# 마운트하므로 PVC 는 ReadWriteMany 여야 한다(회사: nfs-csi, 10-storage.yaml; RWO 만 되면 hostname nodeSelector 로 웹 파드와 같은 노드에).
# v2.1z-ac (2026-11-09, 배포팀 명세): Worker 는 `python -m sbmig.web.worker` — control/request.json 의 digest(zip·설정·sbmig 버전)를 대조한 뒤 sbmig run 을
# 돌리고, 보고서·로그의 비밀값을 지우고, run id·attempt 가 든 job-status.json 을 쓴다. 웹 파드(Main)는 시작할 때 이 틀을 검증하고 어긋나면 뜨지 않는다
# (sbmig.web.k8s validate_worker_template): 컨테이너 하나, backoffLimit 0 · restartPolicy Never · parallelism/completions 1, envFrom 없음,
# /data(출력 폴더를 품는) 마운트는 PVC 전체를 쓰기 가능으로 정확히 하나, /data/out 아래 마운트 없음, 비밀 env 는 valueFrom 만, LLM_RECORD_DIR 없음.
# 이 파일은 그 규칙대로 쓰여 있다 — 고칠 때 지킨다. Main 은 Job 과 파드에 라벨 sbmig-run-id · sbmig-owner 를 붙이고 자기 라벨의 Job 만 지운다.
# 멈춤: 웹이 <run dir>/stop.request 를 쓰면 엔진이 노드 사이에서 멈춘다(최종 빌드 없음); 그래도 안 끝나면 웹이 Job 을 지운다.
# CHANGE_ME_*: image(인프라팀이 레지스트리에 push 한 전체 이름 — 웹 파드 40-deployment.yaml 과 같은 값, README §1), (필요하면) nodeSelector /
# imagePullSecrets. namespace 는 회사 값 agent(2026-11-09). 설정 파일(artifacts.yml)은 이미지 안의 것을 쓴다 — 웹 파드와 같은 이미지라야 Worker 의
# 설정 sha256 대조가 맞는다(웹이 SBMIG_CONFIG=/app/config/<이름> 을 넘긴다).
apiVersion: batch/v1
kind: Job
metadata:
  name: sbmig-RUN_ID                     # the web pod replaces this (sbmig-<run id>, lower-case)
  namespace: agent
  labels: {app: sbmig, kind: run}
  # Secret 은 immutable 로(30-secret.example.yaml): 값을 바꾸면 새 이름(sbmig-llm-2 …)으로 만들고 아래 secretKeyRef 의 name 과 40-deployment.yaml 의 secretRef 를
  # 함께 바꾼 뒤 이 ConfigMap 을 다시 apply 한다.
spec:
  backoffLimit: 0                       # 이관을 무턱대고 재시도하지 않는다(실패한 실행의 보고서가 곧 결과)
  activeDeadlineSeconds: 14400          # 4 시간 — 이관 + (BUILD SUCCESS 면) 이어 도는 취약점 조치까지. 조치가 보태는 시간은 README §6 "시간"
  ttlSecondsAfterFinished: 3600         # 끝난 Job 과 그 파드를 1 시간 뒤 쿠버네티스가 지운다(삭제 명령은 아무도 내리지 않는다). 끝난 파드는 CPU·메모리를
                                        # 쓰지 않고 목록에 이름과 로그만 남는다 — 하루 수십 건이 돌아도 목록에 한두 개만 보이게 1 시간. 결과·sbmig.log 는
                                        # 볼륨에 남는다. `kubectl logs` 를 더 오래 보려면 늘린다(86400 = 하루).
  template:
    metadata:
      labels: {app: sbmig, kind: run}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false   # 빌드 파드는 쿠버네티스 API 를 부르지 않는다
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      # nodeSelector: {customer.example.com/build-worker: "true"}      # CHANGE_ME: 빌드 워커 노드가 따로 있을 때
      # nodeSelector: {kubernetes.io/hostname: CHANGE_ME_NODE}         # 레지스트리 없이 이미지를 노드 하나에만 적재했을 때: 웹 파드(40-deployment.yaml)와 같은 노드
      # imagePullSecrets: [{name: CHANGE_ME_REGISTRY_PULL_SECRET}]      # 레지스트리가 pull 에 인증을 요구할 때만(인프라팀이 준 Secret 이름; Deployment 도 같이)
      # hostAliases:                                                    # 사내 DNS 가 못 푸는 주소(LLM 게이트웨이 등) — Deployment 와 같은 값. 이 파드가 LLM 을 부른다
      #   - {ip: CHANGE_ME_IP, hostnames: [CHANGE_ME_GATEWAY_HOST]}
      containers:
        - name: build
          image: CHANGE_ME_REGISTRY/sbmig:CHANGE_ME_TAG                 # 웹 파드와 같은 이미지·같은 태그(40-deployment.yaml) — 인프라팀이 push 한 전체 이름
          imagePullPolicy: IfNotPresent                                 # 노드에 그 태그가 없을 때만 pull. 레지스트리 없이 노드에 직접 적재하면 Never (README §1.1)
          command: ["python", "-m", "sbmig.web.worker"]      # v2.1z-ac Worker (입력 검증 → sbmig run → 비밀 정제 → job-status.json). 인프라 one-Job 모델은 80-build-job.template
          env:
            # ── Worker 틀 규칙(sbmig.web.k8s validate_worker_template): envFrom 금지 — 변수마다 출처를 적는다. 이름에 TOKEN / PASSWORD / SECRET /
            #    API_KEY 가 든 변수는 value 가 아니라 valueFrom 이어야 하고(설정 덮어쓰기 SBMIG_<섹션>__<키> 는 비밀이 아니라 예외), LLM_RECORD_DIR ·
            #    SBMIG_WEB_TOKEN 은 Worker 에 있으면 안 된다. ConfigMap / Secret 키가
            #    없으면 optional: true 라 그 변수만 빠진다. 실행별 값(SBMIG_SOURCE_ZIP, SBMIG_OUT, SBMIG_RUN_ID, SBMIG_CONFIG …)은 웹이 Job 을 만들 때 덧붙인다.
            - {name: SBMIG_KB_DIR, value: "/data/kb-v2"}                 # 볼륨의 파일 KB. Worker 가 <run dir>/worker-paths.yml 의 kb.dir 로 넘긴다(마지막 --config — 구운 yml 의 값을 이긴다)
            - {name: SBMIG_FAIL_JOB_ON_BUILD_FAIL, value: "0"}
            # 진단용 LLM 원문 기록(기본은 끔 — 프로젝트 소스가 공유 볼륨에 더 남지 않게). 켤 때는 두 줄을 함께 푼다: 스위치 + 기록 폴더.
            # 스위치 없이 폴더만 주면 Worker 가 그 변수를 자식에게 넘기지 않는다
            # - {name: SBMIG_WORKER_LLM_RECORDS, value: "1"}
            # - {name: SBMIG_LLM__RECORD_DIR, value: "/data/llm-records"}
            # ── 회사 artifacts.yml 은 이미지에 구워져 있다(/app/config/artifacts.yml — PC 에서 시험한 파일 그대로). 그 안의 PC 경로를 컨테이너 값으로
            #    덮어쓴다(환경 변수 SBMIG_<섹션>__<키> 가 yml 보다 우선; 40-deployment.yaml 과 같은 값). kb.dir 은 위 SBMIG_KB_DIR 가 정한다
            - {name: SBMIG_BUILD__SETTINGS_FILE, value: "/etc/sbmig/settings.xml"}   # ConfigMap sbmig-config 의 settings.xml(아래 마운트)
            - {name: SBMIG_BUILD__JAVA_HOME, value: "/opt/java21"}                   # 이미지의 JDK 21
            - {name: SBMIG_BUILD__MVN, value: "mvn"}                                 # 이미지의 Maven(PATH)
            - {name: SBMIG_BUILD__LOCAL_REPO, value: "null"}                         # null = Maven 기본 ~/.m2/repository(아래 m2 볼륨)
            - {name: SBMIG_SCRIPT__PYTHON, value: "null"}                            # null = sbmig 를 돌리는 그 python
            # 비밀 아닌 LLM 게이트웨이 값 — ConfigMap sbmig-env 의 그룹 2 키 하나씩(20-configmap.yaml). Job 파드는 만들어질 때 그 ConfigMap 을 읽는다
            - {name: LLM_GATEWAY, valueFrom: {configMapKeyRef: {name: sbmig-env, key: LLM_GATEWAY, optional: true}}}
            - {name: LLM_BASE_URL, valueFrom: {configMapKeyRef: {name: sbmig-env, key: LLM_BASE_URL, optional: true}}}
            - {name: LLM_ASSET_ID, valueFrom: {configMapKeyRef: {name: sbmig-env, key: LLM_ASSET_ID, optional: true}}}
            - {name: LLM_TOKEN_URL, valueFrom: {configMapKeyRef: {name: sbmig-env, key: LLM_TOKEN_URL, optional: true}}}
            - {name: LLM_MODEL, valueFrom: {configMapKeyRef: {name: sbmig-env, key: LLM_MODEL, optional: true}}}
            - {name: LLM_ESCALATION_MODEL, valueFrom: {configMapKeyRef: {name: sbmig-env, key: LLM_ESCALATION_MODEL, optional: true}}}
            - {name: LLM_RECIPE_MODEL, valueFrom: {configMapKeyRef: {name: sbmig-env, key: LLM_RECIPE_MODEL, optional: true}}}
            - {name: LLM_RESPONSE_PATH, valueFrom: {configMapKeyRef: {name: sbmig-env, key: LLM_RESPONSE_PATH, optional: true}}}
            - {name: NO_PROXY, valueFrom: {configMapKeyRef: {name: sbmig-env, key: NO_PROXY, optional: true}}}
            - {name: HTTP_PROXY, valueFrom: {configMapKeyRef: {name: sbmig-env, key: HTTP_PROXY, optional: true}}}
            - {name: HTTPS_PROXY, valueFrom: {configMapKeyRef: {name: sbmig-env, key: HTTPS_PROXY, optional: true}}}
            # 설정 덮어쓰기 SBMIG_<섹션>__<키> — ConfigMap sbmig-env 의 그룹 3(20-configmap.yaml). 거기서 주석을 푼 키만 이 파드에 들어온다(optional: true).
            # sbmig-env 에 새 키를 더하면 여기에도 같은 모양으로 한 줄(이름 = key) — tests/deploy 가 두 파일을 맞춰 본다
            - {name: SBMIG_SCRIPT__MAX_LLM_TRIES_PER_CASE, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_SCRIPT__MAX_LLM_TRIES_PER_CASE, optional: true}}}
            - {name: SBMIG_SCRIPT__MAX_AUGMENTS_PER_CASE, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_SCRIPT__MAX_AUGMENTS_PER_CASE, optional: true}}}
            - {name: SBMIG_SCRIPT__MAX_DECLINES_PER_CASE, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_SCRIPT__MAX_DECLINES_PER_CASE, optional: true}}}
            - {name: SBMIG_LOOP__STALL_LIMIT, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LOOP__STALL_LIMIT, optional: true}}}
            - {name: SBMIG_LOOP__PHASES__VERIFY__MAX_ITERATIONS, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LOOP__PHASES__VERIFY__MAX_ITERATIONS, optional: true}}}
            - {name: SBMIG_LOOP__MAX_TOTAL_MINUTES, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LOOP__MAX_TOTAL_MINUTES, optional: true}}}
            - {name: SBMIG_LOOP__MAX_LLM_CALLS, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LOOP__MAX_LLM_CALLS, optional: true}}}
            - {name: SBMIG_LLM__CASE_THREAD, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LLM__CASE_THREAD, optional: true}}}
            - {name: SBMIG_LLM__TIMEOUT_SECONDS, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LLM__TIMEOUT_SECONDS, optional: true}}}
            - {name: SBMIG_LLM__MAX_OUTPUT_TOKENS, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LLM__MAX_OUTPUT_TOKENS, optional: true}}}
            - {name: SBMIG_LLM__TEMPERATURE, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LLM__TEMPERATURE, optional: true}}}
            - {name: SBMIG_BUILD__TIMEOUT_MINUTES, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_BUILD__TIMEOUT_MINUTES, optional: true}}}
            - {name: SBMIG_BUILD__REPOSITORY_URL, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_BUILD__REPOSITORY_URL, optional: true}}}
            - {name: SBMIG_BUILD__REPOSITORY_TIMEOUT_SECONDS, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_BUILD__REPOSITORY_TIMEOUT_SECONDS, optional: true}}}
            - {name: SBMIG_OPENREWRITE__TIMEOUT_MINUTES, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_OPENREWRITE__TIMEOUT_MINUTES, optional: true}}}
            - {name: SBMIG_OPENREWRITE__JVM_ARGS, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_OPENREWRITE__JVM_ARGS, optional: true}}}
            - {name: SBMIG_INTAKE__ADF_POLICY, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_INTAKE__ADF_POLICY, optional: true}}}
            - {name: SBMIG_LAYOUT__WIRE_BUNDLED_JARS, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LAYOUT__WIRE_BUNDLED_JARS, optional: true}}}
            - {name: SBMIG_LIBRARIES__NEXUS_SEARCH, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LIBRARIES__NEXUS_SEARCH, optional: true}}}
            - {name: SBMIG_LIBRARIES__INCLUDE_PRERELEASE, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_LIBRARIES__INCLUDE_PRERELEASE, optional: true}}}
            - {name: SBMIG_REVIEW__FIX_CRITICAL, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_REVIEW__FIX_CRITICAL, optional: true}}}
            - {name: SBMIG_FLEET__MIN_FREE_GB, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_FLEET__MIN_FREE_GB, optional: true}}}
            # 취약점 조치(2026-11-11): 이관이 BUILD SUCCESS 로 끝나면 이 파드에서 이어 돈다(README §6). 스위치는 sbmig-env 에 켜져 있다 — 웹 파드와
            # 같은 값이 와야 Worker 의 환경 대조를 통과한다
            - {name: SBMIG_REMEDIATION__AFTER_MIGRATION, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_REMEDIATION__AFTER_MIGRATION, optional: true}}}
            - {name: SBMIG_REMEDIATION__REQUIRE_APPROVAL, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_REMEDIATION__REQUIRE_APPROVAL, optional: true}}}
            - {name: SBMIG_REMEDIATION__FAILED_CANDIDATE, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_REMEDIATION__FAILED_CANDIDATE, optional: true}}}
            - {name: SBMIG_REMEDIATION__IVAS_ANALYSIS_TIMEOUT_MINUTES, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_REMEDIATION__IVAS_ANALYSIS_TIMEOUT_MINUTES, optional: true}}}
            - {name: SBMIG_REMEDIATION__CHAIN_BUDGET_MINUTES, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_REMEDIATION__CHAIN_BUDGET_MINUTES, optional: true}}}
            - {name: SBMIG_REMEDIATION__IGNORE_ACTIONS, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_REMEDIATION__IGNORE_ACTIONS, optional: true}}}
            - {name: SBMIG_REMEDIATION__IVAS_SUMMARY_CHECK, valueFrom: {configMapKeyRef: {name: sbmig-env, key: SBMIG_REMEDIATION__IVAS_SUMMARY_CHECK, optional: true}}}
            # 비밀 — Secret 의 키를 valueFrom 으로만(값을 바꿀 때: 위 metadata 의 immutable Secret 설명)
            - {name: LLM_APP_TOKEN, valueFrom: {secretKeyRef: {name: sbmig-llm, key: LLM_APP_TOKEN, optional: true}}}
            - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: sbmig-llm, key: LLM_API_KEY, optional: true}}}
            - {name: NEXUS_USER, valueFrom: {secretKeyRef: {name: sbmig-llm, key: NEXUS_USER, optional: true}}}
            - {name: NEXUS_PASSWORD, valueFrom: {secretKeyRef: {name: sbmig-llm, key: NEXUS_PASSWORD, optional: true}}}
            # IVAS 접속 값(취약점 조치가 이 빌드 파드에서 돈다, 2026-11-11). optional: true — IVAS 가 없는 클러스터에서도 이관은 돈다(조치는
            # 저널 remediation_skipped 로 건너뛴다). IVAS_BASE_URL 은 비밀이 아니지만 사내 호스트라 같은 Secret 에 둔다. 비밀은 지문 대상이 아니다
            - {name: IVAS_BASE_URL, valueFrom: {secretKeyRef: {name: sbmig-llm, key: IVAS_BASE_URL, optional: true}}}
            - {name: IVAS_USER_ID, valueFrom: {secretKeyRef: {name: sbmig-llm, key: IVAS_USER_ID, optional: true}}}
            - {name: IVAS_PASSWORD, valueFrom: {secretKeyRef: {name: sbmig-llm, key: IVAS_PASSWORD, optional: true}}}
          volumeMounts:
            - {name: data, mountPath: /data}                             # 웹 파드와 같은 PVC, 같은 경로
            - {name: m2, mountPath: /home/sbmig/.m2}
            # - {name: config, mountPath: /app/config/artifacts.yml, subPath: artifacts.yml, readOnly: true}   # artifacts.yml 을 ConfigMap 으로 줄 때만(20-configmap.yaml 맨 아래; 웹 파드도 같이)
            - {name: config, mountPath: /etc/sbmig/settings.xml, subPath: settings.xml, readOnly: true}
          resources:
            # 회사 값(2026-11-12): 빌드 파드 하나에 CPU 2 / 메모리 8Gi, 동시에 3개(SBMIG_JOB_MAX_PARALLEL). requests = limits.
            # 메모리 8Gi 는 Maven 힙 -Xmx4g(openrewrite.jvm_args) + JVM 의 힙 밖 메모리 + Python 을 담는다 — 힙을 올리면 여기도 올린다
            # (힙은 memory limit 보다 2 GiB 이상 작게).
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "2", memory: 8Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: sbmig-data}                 # 10-storage.yaml — ReadWriteMany
        - name: m2
          persistentVolumeClaim: {claimName: sbmig-m2}                   # 공유 .m2 (없으면 emptyDir: {} 로 바꾼다 — 매 Job 이 다시 받는다)
        - name: config                                                 # settings.xml
          configMap: {name: sbmig-config}
