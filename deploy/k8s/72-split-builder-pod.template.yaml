# TEMPLATE — one builder pod PER RUN (per migrated project), created by build.setup_command and deleted by
# build.teardown_command (envsubst fills ${SBMIG_RUN_ID}). Mounted into the agent at /etc/sbmig/builder-pod.yaml.
# Company yml for this variant:
#   build:
#     mvn: /app/deploy/docker/mvn-k8s
#     setup_command: ["sh", "-c", "envsubst < /etc/sbmig/builder-pod.yaml | kubectl apply -f - && kubectl wait --for=condition=Ready pod/sbmig-builder-$SBMIG_RUN_ID --timeout=300s"]
#     teardown_command: ["kubectl", "delete", "pod", "sbmig-builder-$SBMIG_RUN_ID", "--ignore-not-found", "--wait=false"]
# and the agent's environment SBMIG_BUILDER_PER_RUN=1 (mvn-k8s derives the pod name from the run id in the cwd).
# The /data volume must then be ReadWriteMany (the builder pod may land on another node) — or pin both to one node.
apiVersion: v1
kind: Pod
metadata:
  name: sbmig-builder-${SBMIG_RUN_ID}
  labels: {app: sbmig, role: builder, run: "${SBMIG_RUN_ID}"}
spec:
  restartPolicy: Never
  securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
  containers:
    - name: builder
      image: <registry>/sbmig-builder:<tag>
      command: ["sleep", "infinity"]
      volumeMounts:
        - {name: data, mountPath: /data}
        - {name: m2, mountPath: /home/sbmig/.m2}
        - {name: config, mountPath: /etc/sbmig/settings.xml, subPath: settings.xml, readOnly: true}
      resources:
        requests: {cpu: "2", memory: 5Gi}
        limits: {cpu: "4", memory: 6Gi}
  volumes:
    - {name: data, persistentVolumeClaim: {claimName: sbmig-data}}      # ReadWriteMany for this variant
    - {name: m2, persistentVolumeClaim: {claimName: sbmig-m2}}
    - {name: config, configMap: {name: sbmig-config}}
