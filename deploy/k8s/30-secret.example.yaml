# 예시 — 30-secret.yaml 로 복사해(git-ignore) 값을 채우고 `kubectl apply -f 30-secret.yaml`. 실제 값은 절대 커밋하지 않는다.
# 에이전트가 환경에서 읽는 모든 변수 (PC 의 .env = 클러스터의 이 Secret).
apiVersion: v1
kind: Secret
metadata:
  name: sbmig-llm
  labels: {app: sbmig}
type: Opaque
stringData:
  LLM_GATEWAY: agent
  LLM_BASE_URL: https://<게이트웨이 호스트>/api/serv/v1/agents/{asset_id}/chat/completions   # {asset_id} 는 LLM_ASSET_ID 로 채워진다
  LLM_ASSET_ID: <에셋 id>
  LLM_TOKEN_URL: https://<게이트웨이 호스트>/<토큰 발급 경로>
  LLM_APP_TOKEN: <앱 토큰>
  LLM_MODEL: build_error_fixer                 # params.role — 수정 1~2회차 + 구조 리뷰
  LLM_ESCALATION_MODEL: escalation_fixer       # params.role — 3회차부터 / 정체 뒤
  LLM_RECORD_DIR: /data/llm-records            # 웹 UI 에이전트용. Job 모델은 run-job.sh 가 /workspace/out 아래로 둔다
  # SBMIG_WEB_TOKEN: <긴 임의 문자열>   # 선택. 사내망 전용 페이지라 기본은 Deployment 의 SBMIG_WEB_OPEN=1(토큰 없음, 2026-11-05).
  #                                     # 토큰을 두면 모든 요청에 요구되고 브라우저는 http://<host>:8765/?token=<값> 으로 한 번 연다
---
# 요청별 Job 모델(80-build-job)의 저장소 자격 증명: 소스 clone / 브랜치 push, KB·결과 저장소 push
apiVersion: v1
kind: Secret
metadata:
  name: sbmig-git
  labels: {app: sbmig}
type: Opaque
stringData:
  GIT_TOKEN: <git 토큰>
  # GIT_USER: oauth2                           # 토큰 앞에 붙는 사용자 이름 (기본 oauth2; GitLab 은 oauth2, GitHub 는 x-access-token)
