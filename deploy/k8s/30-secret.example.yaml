# EXAMPLE — copy to 30-secret.yaml (git-ignored), fill the values, `kubectl apply -f 30-secret.yaml`. Never commit real values.
# Every variable the agent reads from the environment (.env on the PC = this Secret in the cluster).
apiVersion: v1
kind: Secret
metadata:
  name: sbmig-llm
  labels: {app: sbmig}
type: Opaque
stringData:
  LLM_GATEWAY: agent
  LLM_BASE_URL: https://<gateway host>/api/serv/v1/agents/{asset_id}/chat/completions
  LLM_ASSET_ID: <asset id>
  LLM_TOKEN_URL: https://<gateway host>/<token endpoint>
  LLM_APP_TOKEN: <app token>
  LLM_MODEL: build_error_fixer
  LLM_ESCALATION_MODEL: escalation_fixer
  LLM_RECORD_DIR: /data/llm-records
  SBMIG_WEB_TOKEN: <a long random string — required for --host 0.0.0.0; browsers open http://<host>:8765/?token=<it> once>
