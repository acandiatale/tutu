# 예시 — 30-secret.yaml 로 복사해(git-ignore) 값을 채우고 `kubectl apply -f 30-secret.yaml`. 실제 값은 절대 커밋하지 않는다.
# 비밀인 값만 여기에(IVAS_BASE_URL 은 예외: 사내 호스트라 저장소·ConfigMap 에 두지 않으려고 같이 둔다). 게이트웨이 주소·에셋 id·role 이름 같은 비밀 아닌 LLM_* 는 ConfigMap sbmig-env(20-configmap.yaml)에 있다.
apiVersion: v1
kind: Secret
metadata:
  name: sbmig-llm                       # immutable 권장: 값을 바꾸면 새 이름(sbmig-llm-2 …)으로 만들고 Job 틀(81)의 secretKeyRef 와 40-deployment 의 secretRef 를 함께 바꾼다
  namespace: agent
  labels: {app: sbmig}
immutable: true
type: Opaque
stringData:
  LLM_APP_TOKEN: <앱 토큰>                     # 토큰 교환(LLM_TOKEN_URL)에 쓰는 앱 토큰. 교환이 없는 게이트웨이면 LLM_API_KEY 에 Bearer 값
  # LLM_API_KEY: <bearer 토큰>
  # NEXUS_USER: <nexus 계정>                   # settings.xml 의 <server> 가 ${env.NEXUS_USER} / ${env.NEXUS_PASSWORD} 로 가리킨다(그룹에 로그인이 필요할 때만)
  # NEXUS_PASSWORD: <nexus 비밀번호>
  # 취약점 조치(README §6, 2026-11-11) — 이관이 BUILD SUCCESS 로 끝난 **빌드 파드**가 이어서 쓴다: 81 Job 틀의 secretKeyRef 세 줄(optional)과
  # 80 모델의 envFrom 으로 들어간다(웹 파드도 envFrom 으로 받지만 Job 모드에서는 쓰지 않는다 — in-process 모드에서만 웹 파드가 조치를 돌린다).
  # 세 값이 없으면 조치는 건너뛰고(저널 remediation_skipped, SBMIG-RESULT … remediation=skipped) 이관은 그대로 끝난다. 조치를 쓰지 않으면 세 줄을 주석으로 둔다.
  # 이 Secret 은 immutable 이다: 세 키를 더하려면 새 이름(sbmig-llm-2 …)으로 만들고 40 의 secretRef 와 81 의 secretKeyRef 이름을 모두 바꾼다(README §6 점검표).
  IVAS_BASE_URL: "https://CHANGE_ME_IVAS_HOST[:port]/<base path>"   # IVAS API 주소(https 필수, 끝의 / 없이, 주소 안에 계정·?쿼리 금지). 비밀은 아니지만 사내 호스트라 저장소·yml 에 두지 않는다
  IVAS_USER_ID: <IVAS 계정>                    # POST /session 로그인 계정
  IVAS_PASSWORD: <IVAS 비밀번호>
  # SBMIG_WEB_TOKEN: <긴 임의 문자열>          # 선택. 사내망 전용 페이지라 기본은 ConfigMap 의 SBMIG_WEB_OPEN=1(토큰 없음, 2026-11-05).
  #                                            # 토큰을 두면 모든 요청에 요구되고 브라우저는 http://<host>:8765/?token=<값> 으로 한 번 연다
---
# 요청별 Job 모델(80-build-job)의 저장소 자격 증명: 소스 clone / 브랜치 push, KB·결과 저장소 push
apiVersion: v1
kind: Secret
metadata:
  name: sbmig-git
  namespace: agent
  labels: {app: sbmig}
type: Opaque
stringData:
  GIT_TOKEN: <git 토큰>
  # GIT_USER: oauth2                           # 토큰 앞에 붙는 사용자 이름 (기본 oauth2; GitLab 은 oauth2, GitHub 는 x-access-token)
