# ======================================================================================
# 실제 LLM 검증용 설정: Anthropic API (config/llm-anthropic.yml)
# ======================================================================================
# 회사 게이트웨이 대신 Anthropic API 로 수정 스크립트와 구조 검토가 실제로 어떻게 나오는지 확인할 때 쓴다.
# 회사 운영 설정이 아니다. API 키는 이 파일에 절대 적지 않는다. 실행 전에 환경 변수로만 넣는다.
#   source .venv/bin/activate && export LLM_API_KEY=sk-ant-...
#   sbmig run fixtures/projects/boot3 --config config/artifacts.local-e2e.yml --config config/llm-anthropic.yml --out out/llm
# 모델 역할:
#   llm.model        — 수정 스크립트(수정 루프)와 구조 검토
#   llm.recipe_model — 계획 검토(plan.advisor: llm)
llm:
  provider: anthropic                  # Anthropic API 로 직접 호출
  base_url: https://api.anthropic.com  # Anthropic API 주소
  api_key_env: LLM_API_KEY             # 키가 들어 있는 환경 변수의 이름(키 자체가 아님)
  model: claude-sonnet-5               # 수정 스크립트·구조 검토 모델
  recipe_model: claude-haiku-4-5       # 계획 검토에 쓰는 값싼 모델
  escalation_model: null               # 정체 뒤에 쓸 상위 모델. null = model 을 계속 쓴다
  max_output_tokens: 8000              # 답 하나의 최대 토큰
  timeout_seconds: 180                 # 요청 하나를 기다리는 시간(초)
  record_dir: out/llm-records          # 요청·응답을 모두 남기는 폴더(키는 남기지 않음). 감사와 오프라인 재생에 쓴다

# 계획 검토를 켠다: 규칙으로 만든 계획을 recipe_model 이 보고, catalog.yml 에 있는 레시피만 더할 수 있다.
plan:
  advisor: llm
