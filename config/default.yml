# sbmig default configuration. Company-specific coordinates go in a separate file (see artifacts.example.yml)
# and are passed with:  sbmig run <zip|dir> --config config/artifacts.yml
# Any value can be overridden by env:  SBMIG_LLM__MODEL=... (double underscore = nesting)

target:
  java_version: "21"
  spring_boot_version: "4.1.0"
  spring_framework_version: "7.0.x"

layout:
  module_dir: module
  boot_module: boot-jar
  comp_module: comp-jar
  boot_artifact_suffix: "-boot"
  comp_artifact_suffix: "-comp"
  # minimal  : every as-is source goes to comp-jar; boot-jar holds only the Application class (+ boot resources, @SpringBootTest tests)
  # web-layer: @SpringBootApplication/@Controller/@RestController/@Configuration/@ControllerAdvice classes move to boot-jar
  split_policy: minimal
  # as-is multi-module (non-MSA):  merge = fold every module's sources into comp-jar (the company layout: exactly
  #                                        comp-jar + boot-jar); an as-is module named like boot_module is kept as
  #                                        the boot module (its sources, resources, Application class)
  #                                wrap  = keep the modules as they are under module/ and add boot-jar (N+1 modules)
  multi_module_policy: merge
  # merge: a path present in more than one module → first-wins (first module in <modules> order; the dropped copies
  # are saved under <run dir>/merge-conflicts/ and listed in the Handover) | fail (restructure error, nothing moved)
  merge_collision: first-wins
  # after the in-house parent is set: drop explicit dependency <version>s the new parent chain manages
  # (gte = only when the managed version is the same or newer; any = always; off = keep). Mandatory / optional /
  # parent artifacts and system-scope dependencies are never touched.
  drop_managed_versions: gte
  application_class_name: Application
  starter_by_case:
    pure_java: spring-boot-starter
    servlet_tomcat: spring-boot-starter-webmvc
    spring_legacy: spring-boot-starter-webmvc
    spring_boot: auto
  add_servlet_component_scan: true
  import_xml_bean_configs: true
  msa_parent_policy: per-service-root

openrewrite:
  # verified on Maven Central 2026-10-18: rewrite-maven-plugin 6.46.1.
  # recipe BOM 3.38.0 is published but pins rewrite-migrate-java 3.43.0 / rewrite-spring 6.38.0 which are NOT on
  # Central yet (404) → every run would fail at artifact resolution. 3.37.0 is self-consistent and verified end-to-end.
  plugin_version: "6.46.1"
  recipe_bom_version: "3.37.0"
  recipe_artifacts:
    - org.openrewrite.recipe:rewrite-migrate-java
    - org.openrewrite.recipe:rewrite-spring
    - org.openrewrite.recipe:rewrite-testing-frameworks
    - org.openrewrite.recipe:rewrite-static-analysis
  recipes:
    jdk21:
      - org.openrewrite.java.migrate.UpgradeToJava21
    jakarta:
      - org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta
    spring_boot_4:
      # no UpgradeSpringBoot_4_1 umbrella exists yet (2026-10): 4.0 umbrella + 4.1 properties + our version bump recipe
      - org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0
      - org.openrewrite.java.spring.boot4.SpringBootProperties_4_1
      - com.company.migrate.SpringBoot41Version
      - com.company.migrate.Boot4JacksonTwins       # @JsonComponent → @JacksonComponent & co (pure renames; bodies are migrated by the umbrella)
    spring_framework_7:
      - org.openrewrite.java.spring.framework.UpgradeSpringFramework_7_0
    spring_security_7:
      - org.openrewrite.java.spring.security7.UpgradeSpringSecurity_7_0
    junit5:
      - org.openrewrite.java.testing.junit5.JUnit4to5Migration
  base_recipe_dir: knowledge/recipes/base
  timeout_minutes: 40
  jvm_args: ["-Xmx4g"]
  plugin_goal: run
  download_retry: 1              # recipe run failed / left `x.y.x` versions because a download failed → wait + retry once
  download_retry_wait_s: 30

build:
  mvn: mvn
  settings_file: null          # in-house Nexus settings.xml
  local_repo: null
  java_home: null              # JDK 21 home (strongly recommended to pin)
  offline: false
  extra_args: ["-B", "-ntp", "-Dstyle.color=never"]
  skip_tests: true
  allow_skip_test_compile_fallback: true
  allow_skip_tests_fallback: true  # only runtime test failures left → -DskipTests, flag tests-skipped, tests listed
  timeout_minutes: 30
  source_encoding_policy: set-property   # set-property | convert-utf8 (legacy MS949/EUC-KR sources)
  enforcer_policy: relax-rule            # relax-rule | skip | keep
  werror_policy: remove
  external_package_prefixes: []   # extra library namespaces for error signatures (in-house group ids are added automatically)

loop:
  phases:
    jdk21:       { goal: compile,      max_iterations: 3 }
    spring:      { goal: test-compile, max_iterations: 6 }
    restructure: { goal: package,      max_iterations: 6 }
  max_llm_calls: 60
  max_total_minutes: 180
  stall_limit: 2
  max_clusters_per_iteration: 8
  revert_on_regression: true
  regression_ratio: 1.5
  always_final_verify: true
  oscillation_window: 4
  max_llm_attempts_per_cluster: 2
  blocked_policy:                # LLM attempts allowed before a cluster is BLOCKED and reported (0 = never ask the LLM)
    external_javax_api: 0        # dependency still exposes javax.* → library upgrade, not a code fix
    external_api_incompatible: 1
    artifact_not_found: 0
    parent_not_found: 0
    plugin_incompatible: 1
    unsupported_source: 0
    encoding: 0

llm:
  # The company gateway, configured by .env / environment only (see .env.example):
  #   LLM_BASE_URL  LLM_API_KEY  LLM_MODEL  [LLM_RESPONSE_PATH]
  # Request = requests.post(url, headers={Authorization: Bearer <key>}, json={model, messages, need_origin}, timeout)
  provider: company                # company | openai_compatible | anthropic | fake | plugin
  base_url: "${LLM_BASE_URL}"
  api_key_env: LLM_API_KEY
  model: "${LLM_MODEL:-gpt-6-luna}"
  payload_extra:
    need_origin: true
  response_path: "${LLM_RESPONSE_PATH:-}"   # empty = auto-detect the reply text
  record_dir: "${LLM_RECORD_DIR:-}"   # e.g. out/llm-records in .env: every request/response as llm-NNNN.json (no secrets)
  # role models (round 9): LLM_MODEL = the fix model (code patches, build-fix loop); LLM_ESCALATION_MODEL = used
  # for a cluster after `loop.stall_limit` failed rounds (empty = same as LLM_MODEL); LLM_RECIPE_MODEL = the cheaper
  # model for plan advice + KB recipe candidates (empty = same as LLM_MODEL)
  escalation_model: "${LLM_ESCALATION_MODEL:-}"
  recipe_model: "${LLM_RECIPE_MODEL:-}"
  temperature: 0.0
  max_output_tokens: 8000
  max_context_chars: 60000
  timeout_seconds: 180
  max_retries: 3
  cooldown_seconds: 60             # 2nd transport failure in a row → pause once per run, then retry (0 = unavailable at once)
  max_context_rounds: 2
  prompt_version: v1

kb:
  dir: kb
  use_active_recipes: true
  use_patch_replay: true
  use_hints: true
  harvest: true
  generate_recipe_candidates: true
  auto_promote_after_projects: 2
  try_candidates_in_plan: true     # candidates run with the plan's recipes (as-is classpath) and get credited by the build
  max_hints: 5

plan:
  advisor: none
  intermediate_builds: true
  optional_bump_phase: spring      # in-house optional artifacts are bumped before the first spring-phase build

report:
  formats: [md, json]
  zip_result: true
  include_diff: true

advisories:                        # library advisories (docs/ADVISORIES.md): EOL / no-longer-managed libraries
  enabled: true
  file: knowledge/libraries/advisories.yml
  extra_files: []                  # company additions / overrides, same schema, merged by id (later wins)
  allow_recipes: true              # false → every advisory is "guide" only (no advisory recipes in spring.rewrite)
  policy_overrides: {}             # e.g. {springfox: guide, hystrix: off}
  report_carried_over: true        # handover lists dependencies pinned at as-is versions (unmanaged after the swap)
  ledger: true                     # findings go to kb/ledger.jsonl (resolution=advisory) → fleet learning report
  max_from_here: 40

externalized:                      # settings the code reads that no packaged resource defines (round 8)
  enabled: true
  sentinel: "__SET_ME__"           # grep-able placeholder value; Boot precedence lets env / -D / external files override it
  write_placeholders: true         # block appended to module/boot-jar/src/main/resources/application.properties
  placeholder_file: application.properties
  rules_file: knowledge/config/externalized.yml
  include_test_refs: true
  max_refs_per_key: 3
