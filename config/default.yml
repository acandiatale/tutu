# sbmig default configuration. Company-specific coordinates go in a separate file (see artifacts.example.yml)
# and are passed with:  sbmig run <zip|dir> --config config/artifacts.yml
# Any value can be overridden by env:  SBMIG_LLM__MODEL=... (double underscore = nesting)

target:
  java_version: "21"
  spring_boot_version: "4.1.0"
  spring_framework_version: "7.0.x"

layout:
  # Company layout (2026-10-21): modules directly under the root — {name}-boot (Boot configuration only, parent
  # artifacts.boot_parent), {name}-back (every source incl. controllers, parent comp_parent) and, only when the as-is
  # project has web resources, {name}-front (static files / JSPs, parent comp_parent). {name} = the root artifactId.
  # Pre-9c layout for comparison: module_dir: module, boot_module: boot-jar, comp_module: comp-jar, front_module: null
  module_dir: ""
  boot_module: "{name}-boot"
  comp_module: "{name}-back"
  front_module: "{name}-front"          # null = no front module (web resources stay in the boot module)
  project_name: null                     # overrides {name}
  front_static_dir: src/main/resources/static                          # HTML / css / js / images → jar
  front_jsp_dir: src/main/resources/META-INF/resources/WEB-INF/jsp     # JSPs per Servlet 3 (jar resources)
  # Spring Boot as-is projects (incl. MSA): in-place = keep the directories, change the poms only (root →
  # artifacts.parent, modules matching boot_module_pattern whose pom is a boot app → boot_parent, the rest →
  # comp_parent; a single-module Boot app is wrapped into {name}-boot) | layout = split like the other cases
  boot_as_is: in-place
  boot_module_pattern: "*-boot"
  jsp_boot_packaging: war                # JSPs present → the boot module is a WAR for external Tomcat (front jar holds the JSPs)
  boot_artifact_suffix: "-boot"
  comp_artifact_suffix: "-back"          # artifactIds: <root>-boot / <root>-back / <root>-front
  # minimal  : every as-is source goes to comp-jar; boot-jar holds only the Application class (+ boot resources, @SpringBootTest tests)
  # web-layer: @SpringBootApplication/@Controller/@RestController/@Configuration/@ControllerAdvice classes move to boot-jar
  split_policy: minimal
  # as-is multi-module (non-MSA):  merge = fold every module's sources into comp-jar (the company layout: exactly
  #                                        comp-jar + boot-jar); an as-is module named like boot_module is kept as
  #                                        the boot module (its sources, resources, Application class)
  #                                wrap  = keep the modules as they are under module/ and add boot-jar (N+1 modules)
  multi_module_policy: merge
  # no pom.xml at the root, but sibling poms that depend on each other (APP/BATCH, APP/WEB, APP/EAR …): intake writes a
  # root aggregator pom listing them (dependency order) so they build together and are merged like any multi-module
  generate_aggregator: true
  # merge: a path present in more than one module → first-wins (first module in <modules> order; the dropped copies
  # are saved under <run dir>/merge-conflicts/ and listed in the Handover) | fail (restructure error, nothing moved)
  merge_collision: first-wins
  # (artifacts.mandatory_target: root — the mandatory dependencies are declared in every root pom; see artifacts.example.yml)
  # after the in-house parent is set: drop explicit dependency <version>s the new parent chain manages
  # (gte = only when the managed version is the same or newer; any = always; off = keep). Mandatory / optional /
  # parent artifacts and system-scope dependencies are never touched.
  drop_managed_versions: gte
  application_class_name: Application
  starter_by_case:
    pure_java: spring-boot-starter
    servlet_tomcat: spring-boot-starter-webmvc
    spring_legacy: spring-boot-starter-webmvc
    spring_boot: auto
  add_servlet_component_scan: true
  web_xml_registrations: generate  # web.xml servlets / filters / listeners / error pages / session timeout → generated
                                   # WebXmlRegistrations @Configuration in the boot module (followup = notes only)
  import_xml_bean_configs: true
  msa_parent_policy: per-service-root

openrewrite:
  # verified on Maven Central 2026-10-18: rewrite-maven-plugin 6.46.1.
  # recipe BOM 3.38.0 is published but pins rewrite-migrate-java 3.43.0 / rewrite-spring 6.38.0 which are NOT on
  # Central yet (404) → every run would fail at artifact resolution. 3.37.0 is self-consistent and verified end-to-end.
  plugin_version: "6.46.1"
  recipe_bom_version: "3.37.0"
  recipe_artifacts:
    - org.openrewrite.recipe:rewrite-migrate-java
    - org.openrewrite.recipe:rewrite-spring
    - org.openrewrite.recipe:rewrite-testing-frameworks
    - org.openrewrite.recipe:rewrite-static-analysis
  recipes:
    # v2 (flow-v2, business decision 2026-10-26): ONE OpenRewrite run with only these sets — Java 21, javax → jakarta
    # (projects with Java EE javax imports), and for Spring Boot projects the Boot 4 umbrella + 4.1 properties — then
    # the restructure; every remaining error is fixed by LLM fix scripts ("레시피가 무엇을 바꿀지 모르니 넣지 않는다").
    # Spring Framework 7 / Security 7 / JUnit 5, the project recipes (knowledge/recipes/base), library recipes and KB
    # recipes are not run; the empty sets stay so a company config can opt back in.
    jdk21:
      - org.openrewrite.java.migrate.UpgradeToJava21
    jakarta:
      - org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta
    spring_boot_4:
      - org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0
      - org.openrewrite.java.spring.boot4.SpringBootProperties_4_1
    spring_framework_7: []
    spring_security_7: []
    junit5: []
  base_recipe_dir: knowledge/recipes/base
  timeout_minutes: 40
  jvm_args: ["-Xmx4g"]
  plugin_goal: run
  download_retry: 1              # recipe run failed / left `x.y.x` versions because a download failed → wait + retry once
  download_retry_wait_s: 30
  exclusions: ["**/*.jsp", "**/*.jspx", "**/*.html", "**/*.htm"]   # not parsed by the plugin (XML-parser noise on JSP/HTML)

build:
  mvn: mvn
  settings_file: null          # in-house Nexus settings.xml
  local_repo: null
  java_home: null              # JDK 21 home (strongly recommended to pin)
  offline: false
  extra_args: ["-B", "-ntp", "-Dstyle.color=never"]
  skip_tests: true
  skip_test_compile: true          # -Dmaven.test.skip=true on every build: tests neither compiled nor run
                                   # (flag tests-not-compiled + follow-up); v2 default = the company decision (2026-10-22)
  allow_skip_test_compile_fallback: true
  allow_skip_tests_fallback: true  # only runtime test failures left → -DskipTests, flag tests-skipped, tests listed
  timeout_minutes: 30
  source_encoding_policy: set-property   # set-property | convert-utf8 (legacy MS949/EUC-KR sources)
  enforcer_policy: relax-rule            # relax-rule | skip | keep
  werror_policy: remove
  pom_repositories: keep        # keep | remove — <repositories> declared in the poms (RUNBOOK §0.1; remove needs the mirror)
  external_package_prefixes: []   # extra library namespaces for error signatures (in-house group ids are added automatically)
  require_java_major: 21        # preflight: `mvn -v` must report this Java major, else abort (jdk-not-21); 0 = no check
  retry_negative_cache: true    # "…was cached in the local repository…" → the same build once more with -U

loop:
  # v2: no intermediate builds. transform (all recipes) → restructure → structure review → the first build is the final
  # `mvn clean package`; when it fails, the verify loop fixes the errors case by case with fix scripts and builds again
  phases:
    jdk21:       { goal: compile,      max_iterations: 3, enabled: false }
    spring:      { goal: test-compile, max_iterations: 6, enabled: false }
    restructure: { goal: package,      max_iterations: 6, enabled: false }
    verify:      { goal: package,      max_iterations: 12 }  # the script fix loop (one build per round)
  max_llm_calls: 100
  verify_extra_llm_attempts: 2   # final verify loop: clusters blocked as repeated_failure / oscillation get N more LLM tries
  max_total_minutes: 240
  stall_limit: 2
  max_clusters_per_iteration: 8
  revert_on_regression: true
  regression_ratio: 1.5
  always_final_verify: true
  oscillation_window: 4
  max_llm_attempts_per_cluster: 2
  blocked_policy:                # LLM attempts allowed before a cluster is BLOCKED and reported (0 = never ask the LLM)
    external_javax_api: 0        # dependency still exposes javax.* → library upgrade, not a code fix
    external_api_incompatible: 1
    artifact_not_found: 0
    parent_not_found: 0
    plugin_incompatible: 1
    unsupported_source: 0
    encoding: 0

llm:
  # The company gateway, configured by .env / environment only (see .env.example):
  #   LLM_BASE_URL  LLM_API_KEY  LLM_MODEL  [LLM_RESPONSE_PATH]
  # Request = requests.post(url, headers={Authorization: Bearer <key>}, json={model, messages, need_origin}, timeout)
  provider: company                # company | openai_compatible | anthropic | fake | plugin
  base_url: "${LLM_BASE_URL}"
  api_key_env: LLM_API_KEY
  model: "${LLM_MODEL:-gpt-6-luna}"
  payload_extra:
    need_origin: true
  response_path: "${LLM_RESPONSE_PATH:-}"   # empty = auto-detect the reply text
  record_dir: "${LLM_RECORD_DIR:-}"   # e.g. out/llm-records in .env: every request/response as llm-NNNN.json (no secrets)
  # role models (round 9): LLM_MODEL = the fix model (code patches, build-fix loop); LLM_ESCALATION_MODEL = used
  # for a cluster after `loop.stall_limit` failed rounds (empty = same as LLM_MODEL); LLM_RECIPE_MODEL = the cheaper
  # model for plan advice + KB recipe candidates (empty = same as LLM_MODEL)
  escalation_model: "${LLM_ESCALATION_MODEL:-}"
  recipe_model: "${LLM_RECIPE_MODEL:-}"
  temperature: 0.0
  max_output_tokens: 8000
  max_context_chars: 60000
  timeout_seconds: 180
  max_retries: 3
  cooldown_seconds: 60             # 2nd transport failure in a row → pause once per run, then retry (0 = unavailable at once)
  max_context_rounds: 2
  prompt_version: v1
  # Per-project API cost (report "LLM usage and cost", fleet summary column llm_cost): list prices per 1M tokens.
  # OpenAI developer docs, 2026-10-22 (developers.openai.com/api/docs/models/gpt-5.6-terra, …/gpt-6-luna):
  #   GPT-5.6 Terra  $2.00 in / $12.00 out (cached in $0.20)  — the fix model
  #   GPT-6 Luna     $0.10 in /  $0.50 out (cached in $0.01)  — the recipe model
  # Keys match the model id the gateway sees (exact, else prefix / substring); add the company gateway's own rates here.
  pricing:
    gpt-5.6-terra: { input_per_mtok: 2.00, output_per_mtok: 12.00, cached_input_per_mtok: 0.20 }
    gpt-6-luna:    { input_per_mtok: 0.10, output_per_mtok: 0.50,  cached_input_per_mtok: 0.01 }
  pricing_currency: USD
  pricing_note: "OpenAI list prices as of 2026-10-22 (developers.openai.com model pages); the company gateway may bill differently"

script:                            # v2 fix scripts (docs/v2/PLAN-v2.md §3.2): `def fix(p)` from the LLM, static check, then
                                   # a separate `python -I` process with the helper API p (project-folder files only)
  timeout_seconds: 60              # per run; the process tree is killed after it
  python: null                     # interpreter for the script process (null = the one running sbmig)
  extra_allowed_imports: []        # added to the built-in whitelist (re, json, textwrap, fnmatch, posixpath, …)
  max_code_chars: 30000
  log_lines: 200
  max_files_changed_warn: 40       # a run that changes more files gets a warning note
  reuse: true                      # case seen before → its best stored version runs first, without an LLM call
  reuse_versions: 1
  max_augments_per_case: 3         # LLM extensions per case and run, then BLOCKED (repeated_failure) → Handover

review:                            # v2 structure review: the LLM checks poms / dependencies / modules after the restructure
  enabled: true
  fix_critical: true               # critical findings → one fix script (committed, revertible); warnings → report + kb
  max_pom_chars: 60000
  max_poms: 40
  record: true                     # <kb>/reviews.jsonl

kb:
  dir: kb-v2                       # v2 keeps its own KB (main / company-v1 use kb/)
  # v1 learning paths, off in v2 (the fix-script history per case replaces them; removed in PLAN-v2 step 4)
  ledger: false
  symbol_index: false
  deterministic_candidates: false
  use_active_recipes: false
  use_patch_replay: false
  use_hints: false
  harvest: false
  generate_recipe_candidates: false
  auto_promote_after_projects: 2
  try_candidates_in_plan: false
  max_hints: 5
  # every build error on its own record (what / what was tried / how resolved or why not) + every fix attempt with the
  # code it applied, failures included: kb/errors.jsonl, kb/fix_attempts.jsonl, kb/error_hints.json, <run dir>/error_cases.*
  error_cases: true
  error_hints: false               # v1: past fixes AND failures of the same error → hints in the fix prompt
  error_diff_chars: 12000          # cap of a stored attempt diff, applied after classification (0 = no cap)
  error_excerpt_chars: 1500
  # case catalog: one reusable case per error signature (kb/catalog/<kind>/<class>/<symbol>--<id>.yml, views kb/views/cases.md|csv);
  # a hit applies the case's action; candidate → active after kb.auto_promote_after_projects successes, no failure
  catalog: true
  case_replace: false              # v1: learned text replaces (handler case-replace)
  case_replace_scope: error-lines  # error-lines (the reported lines + imports) | file
  redact_file: knowledge/kb/redact.yml   # secret masking rules added to the built-ins (company patterns go here)
  lock_timeout_seconds: 300        # cross-process kb/.lock wait (web + fleet + kb commands share one KB)

fleet:                             # `sbmig fleet`: ~500 projects one after another
  preflight: true                  # Java / Maven / settings / LLM / disk checked once before the first project
  infra_failure_limit: 3           # N projects in a row ended for an infrastructure reason → wait and re-check
  infra_retry_minutes: 15          # 0 = stop the fleet at once (state kept; `sbmig fleet` again resumes)
  infra_max_waits: 4
  cleanup: build-output            # none | build-output (target/ of the run copy) | workspace (also the project copy)
  min_free_gb: 5                   # free space needed on the output drive before each project (0 = no check)

plan:
  advisor: none
  intermediate_builds: false       # v2: no build between the recipes and the restructure
  optional_bump_phase: restructure # v2: the in-house optional artifacts are bumped inside the restructure
  parent_phase: restructure        # v1 only (the v2 planner always restructures right after the transform)

report:
  formats: [md, json]
  zip_result: true
  include_diff: true
  language: en                     # report.md language: en | ko (report.json, console and logs stay English)
  javax_api_inventory: true        # after the final build: mvn dependency:tree per module → javax API jars still on the
                                   # classpath + the direct dependency that drags each in (section "javax API jars")

advisories:                        # library advisories (docs/ADVISORIES.md): EOL / no-longer-managed libraries
  enabled: true
  file: knowledge/libraries/advisories.yml
  extra_files: []                  # company additions / overrides, same schema, merged by id (later wins)
  allow_recipes: false             # v2: advisories are LLM hints + Handover only (true = advisory recipes in the transform)
  policy_overrides: {}             # e.g. {springfox: guide, hystrix: off}
  report_carried_over: true        # handover lists dependencies pinned at as-is versions (unmanaged after the swap)
  ledger: false                    # v1: findings go to kb/ledger.jsonl (resolution=advisory) → fleet learning report
  max_from_here: 40

externalized:                      # settings the code reads that no packaged resource defines (round 8)
  enabled: true
  sentinel: "__SET_ME__"           # grep-able placeholder value; Boot precedence lets env / -D / external files override it
  write_placeholders: true         # block appended to module/boot-jar/src/main/resources/application.properties
  placeholder_file: application.properties
  rules_file: knowledge/config/externalized.yml
  include_test_refs: true
  max_refs_per_key: 3
