# In-house LLM gateway profile: a plain chat POST (not OpenAI-compatible), driven through LangChain (company
# convention: agents are built on LangGraph / LangChain). The token is NEVER stored here.
#   export LLM_BASE_URL=http://<gateway>/<chat endpoint>    # the FULL URL (http or https) that accepts the POST
#   export LLM_API_KEY=<bearer token>
#   sbmig llm-probe --config config/llm-company.yml          # first: prints the raw response + extracted reply
#   sbmig run <project> --config config/artifacts.yml --config config/llm-company.yml --out out/run
# Request: POST $LLM_BASE_URL, headers {Authorization: Bearer $LLM_API_KEY, Content-Type: application/json},
#          json {"model": "gpt-6-luna", "need_orgin": true, "messages": [{"role": "system", ...}, {"role": "user", ...}]}
# Response: the reply text is auto-detected (choices[0].message.content, content, response, data.content, ...);
#           if `llm-probe` says it cannot be extracted, set `response_path` to the dot path seen in the raw JSON.
llm:
  # the LangChain BaseChatModel is sbmig.llm.langchain.ChatPostModel built from the fields below; set
  # langchain_model: 'pkg.module:factory' to use the company's own LangChain model class instead
  # (provider: chat_post sends the same request without LangChain)
  provider: langchain
  langchain_model: null                # e.g. mycompany.llm:make_chat_model  (fn(cfg) or fn() -> BaseChatModel)
  base_url: "${LLM_BASE_URL}"
  api_key_env: LLM_API_KEY
  model: gpt-6-luna
  recipe_model: gpt-6-luna             # one model for fixes, plan advice and recipe candidates
  escalation_model: null
  payload_extra:
    need_orgin: true
  payload_generation_params: false     # true → also send max_tokens / temperature / stop
  response_path: null                  # e.g. data.result.content
  http_backend: requests               # requests.post(url, headers=, json=, timeout=) — follows the Windows system proxy
                                       # and REQUESTS_CA_BUNDLE; httpx = the default client elsewhere
  verify_ssl: true                     # false, or a CA bundle path when the corporate proxy intercepts TLS
  timeout_seconds: 180
  max_retries: 3
  record_dir: out/llm-records          # every request/response as llm-NNNN.json (no secrets): attach when asking for help

plan:
  advisor: llm

kb:
  generate_recipe_candidates: true
