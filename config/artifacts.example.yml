# Company-specific artifact policy. Copy to config/artifacts.yml and fill in real coordinates.
#   parent      : the in-house parent of the migrated ROOT pom (company: base-parent)          (mandatory)
#   boot_parent : the in-house parent of module/boot-jar/pom.xml (company: boot-jar)           (optional, see below)
#   comp_parent : the in-house parent of module/comp-jar/pom.xml (company: comp-jar)           (optional)
#   mandatory   : 2 dependencies every migrated project must declare                           (mandatory)
#   optional    : 8 in-house artifacts — bump the version ONLY if the as-is project already uses them
# With boot_parent + comp_parent set (the company layout, all in-house artifacts on one line, e.g. 4.0.0) the root
# pom is an aggregator inheriting base-parent, the two module poms inherit their role parents directly (explicit
# groupId / version, the 2 mandatory dependencies in each module pom); an as-is module already inheriting an older
# boot-jar / comp-jar parent (an earlier migration on 1.0.0) is moved to the configured version. Leave both unset
# and the modules inherit the root pom instead.
artifacts:
  parent:
    group_id: com.company.platform
    artifact_id: base-parent
    version: 4.0.0
  boot_parent:
    group_id: com.company.platform
    artifact_id: boot-jar
    version: 4.0.0
  comp_parent:
    group_id: com.company.platform
    artifact_id: comp-jar
    version: 4.0.0
  parent_manages_spring_boot: true      # parent imports/extends spring-boot 4.1.0 → we never pin boot versions ourselves
  parent_manages_java_version: true
  mandatory:
    - { group_id: com.company.platform, artifact_id: company-core,    version: null }   # null = managed by parent
    - { group_id: com.company.platform, artifact_id: company-logging, version: null }
  optional:
    - { group_id: com.company.lib, artifact_id: lib-auth,      version: 3.0.0, aliases: ["com.company.legacy:auth"] }
    - { group_id: com.company.lib, artifact_id: lib-batch,     version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-cache,     version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-crypto,    version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-db,        version: 3.0.0, property_name: lib-db.version }
    - { group_id: com.company.lib, artifact_id: lib-file,      version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-messaging, version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-web,       version: 3.0.0 }
  remove_when_present: []               # e.g. ["com.company.legacy:legacy-bom"]
  mandatory_target: root                # the 2 mandatory dependencies go into every root pom (project root; MSA: each
                                        # service root + the top aggregator) — the company rule; `modules` = role module poms
  optional_version_policy: floor        # floor = never downgrade (default) | pin = exactly the listed version

plan:
  # company runs: apply base-parent / boot-jar / comp-jar right after spring.rewrite, BEFORE the spring build-fix
  # loop, so the loop fixes against the company parent chain (an unresolvable parent then fails fast); the
  # restructure phase keeps only the final verify. `restructure` = after the spring loop (the default).
  parent_phase: spring

build:
  settings_file: null                   # /path/to/nexus-settings.xml
  java_home: null                       # /usr/lib/jvm/java-21

# llm: nothing to set here — the gateway comes from .env (LLM_BASE_URL / LLM_API_KEY / LLM_MODEL); see config/default.yml
