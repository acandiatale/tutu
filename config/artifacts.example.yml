# Company-specific artifact policy. Copy to config/artifacts.yml and fill in real coordinates.
#   parent      : the in-house parent of the migrated ROOT pom (company: xxx-parent, an aggregator)      (mandatory)
#   boot_parent : the in-house parent of the Boot module — `{name}-boot`, or every `*-boot` module of a Boot
#                 as-is / MSA project (company: xxx-boot-jar)                                             (optional)
#   comp_parent : the in-house parent of every other module — `{name}-back`, `{name}-front`, libraries,
#                 services (company: xxx-comp-jar)                                                        (optional)
#   mandatory   : 2 dependencies declared in every migrated ROOT pom (mandatory_target: root)             (mandatory)
#   optional    : 8 in-house artifacts — bump the version ONLY if the as-is project already uses them
# All in-house artifacts sit on one version line (e.g. 4.0.0). With boot_parent + comp_parent set (the company
# layout, round 9c) the root pom inherits `parent` and aggregates `{name}-boot` / `{name}-back` [/ `{name}-front`]
# (explicit groupId / version, `<relativePath/>`); Spring Boot as-is projects keep their directories and only get
# the poms changed; an as-is module already inheriting an older boot-jar / comp-jar parent (an earlier migration
# on 1.0.0) is moved to the configured version. Leave both unset and the modules inherit the root pom instead.
artifacts:
  parent:
    group_id: com.company.platform
    artifact_id: base-parent
    version: 4.0.0
  boot_parent:
    group_id: com.company.platform
    artifact_id: boot-jar
    version: 4.0.0
  comp_parent:
    group_id: com.company.platform
    artifact_id: comp-jar
    version: 4.0.0
  parent_manages_spring_boot: true      # parent imports/extends spring-boot 4.1.0 → we never pin boot versions ourselves
  parent_manages_java_version: true
  mandatory:
    - { group_id: com.company.platform, artifact_id: company-core,    version: null }   # null = managed by parent
    - { group_id: com.company.platform, artifact_id: company-logging, version: null }
    # Every entry takes the same ArtifactSpec fields. A pom-packaged in-house artifact (no jar) needs `type: pom`
    # (written as <type>pom</type>, also added to an as-is declaration that lacks it); a BOM-style one takes
    # `type: pom, scope: import` and goes into <dependencyManagement> instead of <dependencies>. Examples:
    #   - { group_id: com.company.platform, artifact_id: company-deps, version: null, type: pom }
    #   - { group_id: com.company.platform, artifact_id: company-bom,  version: 4.0.0, type: pom, scope: import }
  optional:
    - { group_id: com.company.lib, artifact_id: lib-auth,      version: 3.0.0, aliases: ["com.company.legacy:auth"] }
    - { group_id: com.company.lib, artifact_id: lib-batch,     version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-cache,     version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-crypto,    version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-db,        version: 3.0.0, property_name: lib-db.version }
    - { group_id: com.company.lib, artifact_id: lib-file,      version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-messaging, version: 3.0.0 }
    - { group_id: com.company.lib, artifact_id: lib-web,       version: 3.0.0 }
    # v2.1n: an optional can also be INTRODUCED when the project declares one of its triggers (`when_present`, g:a keys or
    # globs): the curated company artifact replaces the raw library (`replaces: true`, default — the matched declarations are
    # removed) or sits next to it (`replaces: false`). Without `when_present` an optional is only aligned when already used.
    #   - { group_id: com.company.lib, artifact_id: lib-jpa, version: 4.0.0,
    #       when_present: ["org.hibernate:hibernate-core", "org.hibernate.orm:hibernate-core", "org.hibernate:hibernate-entitymanager"] }
  remove_when_present: []               # e.g. ["com.company.legacy:legacy-bom"]
  mandatory_target: root                # the 2 mandatory dependencies go into every root pom (project root; MSA: each
                                        # service root + the top aggregator) — the company rule; `modules` = role module poms
  optional_version_policy: floor        # floor = never downgrade (default) | pin = exactly the listed version

# plan / loop: nothing to set for v2 (flow-v2) — the defaults are the company flow: one OpenRewrite run, restructure,
# structure review, then `mvn clean package` and the script fix loop (loop.phases.verify, 12 rounds). The v1 settings
# `plan.parent_phase: spring` and `loop.phases.verify.max_iterations: 4` of company-v1 must NOT be carried over.

report:
  language: ko                          # report.md in Korean for the operators (report.json stays English)

build:
  # The company does not fix tests (2026-10-22): every build runs with -Dmaven.test.skip=true, so test sources are
  # neither compiled nor run and can never block the migration. The report flags `tests-not-compiled` and the
  # Handover tells the owning team to compile and fix the tests. (`skip_tests: true` alone still COMPILES tests.)
  # v2: also the default in config/default.yml; kept here so the company file says it.
  skip_test_compile: true
  settings_file: null                   # config/settings.nexus.xml — copy config/settings.nexus.example.xml, set the group URL;
                                        # its mirrorOf external:* also covers the <repositories> declared inside the poms
  java_home: null                       # /usr/lib/jvm/java-21
  repository_url: null                  # v2.1d: where sbmig reads maven-metadata.xml / poms to tell the LLM which releases
                                        # exist (same major first); null = the mirror of settings_file (its credentials)

# libraries: the dependency version policy (v2.1d) needs no setting here. People's additions / approvals go to
# <kb dir>/libraries.yml (copy knowledge/libraries/libraries.company.example.yml) — read fresh on every run, no redeploy.

# llm: nothing to set here — the gateway comes from .env (LLM_BASE_URL / LLM_API_KEY / LLM_MODEL); see config/default.yml
