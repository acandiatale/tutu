# Migration notes index used by sbmig.fix.context.ContextPacker.
#   keywords: Python regexes matched (case-sensitive) against error messages, symbols, locations, the cluster
#             file's imports and pom artifactIds. Score = number of distinct keywords that match.
#   cases / phases: restrict the note to these case types / phases (empty = any).
#   always: include regardless of score (budget permitting, dropped last).
# Keep in sync with each note's front-matter (tests/fix/test_notes.py checks it).
notes:
- file: fix-policy.md
  title: Fix policy for the build-fix loop
  keywords: []
  cases: []
  phases: []
  always: true
