# Migration notes index used by sbmig.fix.context.ContextPacker.
#   keywords: Python regexes matched (case-sensitive) against error messages, symbols, locations, the cluster
#             file's imports and pom artifactIds. Score = number of distinct keywords that match.
#   cases: restrict the note to these case types (empty = any).
#   phases: advisory — the v1 phase the note was written for. v2 fixes every error in the `verify` script loop, so
#           `verify` always selects the note (keywords + cases decide); other phases are still narrowed by it.
#   always: kept for the schema; no note is always included (v2.1u: fix-policy.md was deleted — it never reached
#           the script prompt), so every entry says false.
# Keep in sync with each note's front-matter (tests/fix/test_fix_notes.py checks it).
notes:
