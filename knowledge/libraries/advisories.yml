    summary: >-
      Last release 1.9.13 (2013); it still compiles (jackson-mapper-asl / jackson-core-asl stay on their as-is
      version), but nothing migrates non-Spring projects to Jackson 2 / 3 automatically.
    replacement: tools.jackson.core:jackson-databind (Jackson 3; Boot 4 default) or com.fasterxml.jackson.core:jackson-databind
    replacement_version: Boot 4.1 managed (Jackson 3.1.4 / Jackson 2 2.21.4)
    policy: guide
    followup: >-
      Port org.codehaus.jackson.* to com.fasterxml.jackson.* (ObjectMapper, JsonNode, TypeReference, custom
      (de)serializers; @JsonSerialize(include=...) → @JsonInclude) and drop jackson-mapper-asl / jackson-core-asl.
    docs:
