    title_ko: "Apache HttpClient 4.x는 HttpClient 5로 대체되었습니다(이 프로젝트 유형에는 자동 변환 레시피가 없습니다)"
    summary_ko: >-
      4.5.x는 직접 호출하는 코드에서는 계속 동작하지만 Spring Boot BOM에 버전이 없어 기존 버전을 그대로 씁니다. Spring을 쓰지 않는 프로젝트는
      HttpClient 5로 자동 변환되지 않습니다.
    followup_ko: >-
      `org.apache.http.*` 클라이언트 코드를 `org.apache.hc.client5` / `hc.core5`(또는 RestClient)로 옮기고, pom에 직접
      적은 httpclient 4.x 버전을 지워 주세요. 그다음 타임아웃, 커넥션 풀, TLS 설정을 다시 테스트해 주세요.
    docs:
