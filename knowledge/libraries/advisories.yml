    replacement_version: 6.0.1
    followup: Replace the transaction-manager configuration (XA datasources, BitronixTransactionManager bean) with Atomikos 6 or Narayana and test the XA flows.
    title_ko: "Bitronix Transaction Manager는 지원이 종료되었고(2.1.4, 2014) javax.transaction 전용입니다"
    summary_ko: >-
      `org.codehaus.btm:btm`은 2.1.4가 마지막이고 javax.transaction을 구현합니다. Jakarta 버전이 없고 Spring Boot에서도
      starter가 빠져서, jakarta.transaction 코드에는 쓸 수 없습니다.
    followup_ko: >-
      트랜잭션 매니저 설정(XA 데이터소스, `BitronixTransactionManager` 빈)을 Atomikos 6이나 Narayana로 바꾸고 XA 흐름을 테스트해
      주세요.
    replacement_ko: "`com.atomikos:transactions-spring-boot4-starter`(또는 Narayana)"
    docs:
      - https://repo1.maven.org/maven2/org/codehaus/btm/btm/

  # ------------------------------------------------------------------ commons / mapping / search
  - id: commons-collections3
    library: commons-collections3
    status: eol
    title: Commons Collections 3.2.2 is EOL — migrate to commons-collections4
    summary: >-
      3.2.2 (2015) is the last 3.x; it compiles on Java 21 and has no javax dependency, so the build stays green
      (commons-beanutils 1.11.0 still depends on it). The upstream recipe UpgradeApacheCommonsCollections_3_4
      (rewrite-apache 2.30.0, not run by sbmig) shows the mapping: dependency → commons-collections4, IdentityMap →
      IdentityHashMap, FastArrayList → CopyOnWriteArrayList, MapUtils.EMPTY_MAP / ListUtils.EMPTY_LIST → Collections.*
      and org.apache.commons.collections → collections4; generics changes come with it.
    replacement: org.apache.commons:commons-collections4
    replacement_version: 4.5.0 (not managed by Boot)
    followup: >-
      Migrate to commons-collections4 (raw-type / generics fixes included); leave commons-collections 3 on the
      classpath while commons-beanutils 1.x still needs it.
    title_ko: "Commons Collections 3.2.2는 지원이 종료되었습니다. commons-collections4로 옮겨 주세요"
    summary_ko: >-
      3.2.2(2015)가 마지막 3.x입니다. Java 21에서 컴파일되고 javax 의존성도 없어 빌드는 성공합니다(commons-beanutils 1.11.0이 아직 이
      라이브러리에 의존합니다). sbmig가 실행하지 않는 upstream 레시피 `UpgradeApacheCommonsCollections_3_4`(rewrite-apache
      2.30.0)에 변환 기준이 있습니다. 의존성은 commons-collections4로, `IdentityMap`은 `IdentityHashMap`,
      `FastArrayList`는 `CopyOnWriteArrayList`, `MapUtils.EMPTY_MAP` / `ListUtils.EMPTY_LIST`는
      `Collections.*`, `org.apache.commons.collections`는 `collections4`로 바꾸며, 제네릭 수정도 함께 필요합니다.
    followup_ko: >-
      commons-collections4로 옮겨 주세요(raw 타입 / 제네릭 수정 포함). commons-beanutils 1.x가 필요로 하는 동안은
      commons-collections 3을 classpath에 남겨 두세요.
    docs:
      - https://docs.openrewrite.org/recipes/apache/commons/collections/upgradeapachecommonscollections_3_4
      - https://commons.apache.org/proper/commons-collections/
    notes: knowledge/notes/era-libraries.md

