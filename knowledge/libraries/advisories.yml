    title: JasperReports 7 is the Jakarta line but breaks .jrxml / .jasper compatibility and splits the jar
    summary: >-
      The 6.x core jar contains javax.servlet viewer classes. 7.0.0 (2024) refactored for Jakarta: optional features
      moved to separate artifacts (jasperreports-pdf / -openpdf, -excel-poi, -jdt, -servlets, -spring …), some
      packages changed, .jasper files must be recompiled and .jrxml / .jrtx files from 6 can no longer be loaded.
