    title: Spring Data Solr is EOL (4.3.15, 2021) — Boot 3+ has no Solr support; use SolrJ directly
    summary: >-
      spring-data-solr stopped at 4.3.15 and spring-boot-starter-data-solr is gone (no Solr artifact in the Boot 4.1
      BOM). SolrJ itself has no javax EE dependency (9.11.0 = Java 11, 10.0.0 = Java 17) and is not managed by Boot;
      SolrRepository / SolrTemplate code does not survive Spring 7.
    replacement: org.apache.solr:solr-solrj (a SolrClient bean defined by the project)
    replacement_version: 9.11.0 (Solr 9 servers) / 10.0.0
    followup: Replace SolrTemplate / SolrCrudRepository with a SolrClient bean and explicit queries; match the SolrJ major to the Solr server.
    title_ko: "Spring Data Solr는 지원이 종료되었고(4.3.15, 2021) Spring Boot 3부터 Solr 지원이 없습니다. SolrJ를 직접 써 주세요"
    summary_ko: >-
      spring-data-solr는 4.3.15가 마지막이고 spring-boot-starter-data-solr도 없어졌습니다(Spring Boot 4.1 BOM에 Solr
      아티팩트가 없습니다). SolrJ 자체는 javax EE 의존성이 없지만(9.11.0은 Java 11, 10.0.0은 Java 17) Spring Boot BOM에 없고,
      `SolrRepository` / `SolrTemplate` 코드는 Spring 7에서 동작하지 않습니다.
    followup_ko: >-
      `SolrTemplate` / `SolrCrudRepository`를 `SolrClient` 빈과 직접 작성한 쿼리로 바꿔 주세요. SolrJ 메이저 버전은 Solr 서버
      버전에 맞춰 주세요.
    replacement_ko: "`org.apache.solr:solr-solrj`(프로젝트에서 `SolrClient` 빈을 직접 정의)"
    docs:
      - https://repo1.maven.org/maven2/org/springframework/data/spring-data-solr/
      - https://solr.apache.org/guide/solr/latest/deployment-guide/solrj.html

  # ------------------------------------------------------------------ JSON / XML / SOAP / HTTP / security
  # round 10: the Boot umbrella (and an opted-in Framework 7 set) runs CodehausToFasterXML (UpgradeSpringFramework_7_0
  # → UpgradeJackson_2_3; rewrite-jackson 1.28.4); plain Java / servlet projects → jackson1-direct
  - id: jackson1
    library: jackson1
    applies_to: [spring_legacy, spring_boot, msa]
    status: eol
    title: Jackson 1.x (org.codehaus.jackson) is end of life
    summary: >-
      Last release 1.9.13 (2013). The Framework 7 / Boot 4 chains run CodehausToFasterXML, but it maps only 11 types
      (ObjectMapper, JsonSerializer, map.annotate.JsonSerialize(+Inclusion), AnnotationIntrospector(+Pair),
      Jaxb / Jackson / NopAnnotationIntrospector, Serialization / DeserializationConfig$Feature) and 3 packages
      (annotate, map.ext, map.ser). org.codehaus.jackson.JsonNode / JsonParser / JsonGenerator / JsonFactory,
      type.TypeReference, map.JsonMappingException, map.JsonDeserializer and node.* are NOT mapped and end up as
      "package org.codehaus.jackson… does not exist" in the fix loop.
    replacement: tools.jackson.core:jackson-databind (Jackson 3; Boot 4 default) or com.fasterxml.jackson.core:jackson-databind
    replacement_version: Boot 4.1 managed (Jackson 3.1.4 / Jackson 2 2.21.4)
    followup: >-
      Review the remaining org.codehaus.jackson.* code the fix loop ported (JsonNode, TypeReference, custom
      (de)serializers) and @JsonSerialize(include=...) behaviour.
    title_ko: "Jackson 1.x(org.codehaus.jackson)는 지원이 종료되었습니다"
    summary_ko: >-
      마지막 릴리스는 1.9.13(2013)입니다. Spring Framework 7 / Spring Boot 4 레시피가 `CodehausToFasterXML`을 실행하지만,
      이 레시피는 타입 11개(`ObjectMapper`, `JsonSerializer`, `map.annotate.JsonSerialize`(+`Inclusion`),
      `AnnotationIntrospector`(+`Pair`), `Jaxb` / `Jackson` / `NopAnnotationIntrospector`,
      `Serialization` / `DeserializationConfig$Feature`)와 패키지 3개(`annotate`, `map.ext`, `map.ser`)만
      바꿉니다. `org.codehaus.jackson.JsonNode` / `JsonParser` / `JsonGenerator` / `JsonFactory`,
      `type.TypeReference`, `map.JsonMappingException`, `map.JsonDeserializer`, `node.*`은 바뀌지 않아 자동 수정
      단계에서 "package org.codehaus.jackson… does not exist" 오류로 나타납니다.
    followup_ko: >-
      자동 수정 단계에서 옮긴 나머지 `org.codehaus.jackson.*` 코드(`JsonNode`, `TypeReference`, 커스텀 serializer /
      deserializer)와 `@JsonSerialize(include=...)`의 동작을 검토해 주세요.
    replacement_ko: "`tools.jackson.core:jackson-databind`(Jackson 3, Spring Boot 4 기본값) 또는 `com.fasterxml.jackson.core:jackson-databind`"
    docs:
      - https://docs.openrewrite.org/recipes/java/jackson/codehaustofasterxml
      - https://repo1.maven.org/maven2/org/codehaus/jackson/jackson-mapper-asl/
    notes: knowledge/notes/era-libraries.md

  - id: jackson1-direct
    library: jackson1
    applies_to: [pure_java, servlet_tomcat, unknown]
    status: eol
    title: Jackson 1.x (org.codehaus.jackson) is end of life (no Spring recipe chain migrates it here)
    summary: >-
      Last release 1.9.13 (2013); it still compiles (jackson-mapper-asl / jackson-core-asl stay on their as-is
      version), but nothing migrates non-Spring projects to Jackson 2 / 3 automatically.
    replacement: tools.jackson.core:jackson-databind (Jackson 3; Boot 4 default) or com.fasterxml.jackson.core:jackson-databind
    replacement_version: Boot 4.1 managed (Jackson 3.1.4 / Jackson 2 2.21.4)
    followup: >-
      Port org.codehaus.jackson.* to com.fasterxml.jackson.* (ObjectMapper, JsonNode, TypeReference, custom
      (de)serializers; @JsonSerialize(include=...) → @JsonInclude) and drop jackson-mapper-asl / jackson-core-asl.
    title_ko: "Jackson 1.x(org.codehaus.jackson)는 지원이 종료되었습니다(이 프로젝트 유형에는 자동 변환 레시피가 없습니다)"
    summary_ko: >-
      마지막 릴리스는 1.9.13(2013)입니다. jackson-mapper-asl / jackson-core-asl이 기존 버전 그대로 남아 컴파일은 되지만, Spring을
      쓰지 않는 프로젝트는 Jackson 2 / 3으로 자동 변환되지 않습니다.
    followup_ko: >-
      `org.codehaus.jackson.*`을 `com.fasterxml.jackson.*`으로 옮기고(`ObjectMapper`, `JsonNode`,
      `TypeReference`, 커스텀 serializer / deserializer, `@JsonSerialize(include=...)`는 `@JsonInclude`로)
      jackson-mapper-asl / jackson-core-asl을 빼 주세요.
    replacement_ko: "`tools.jackson.core:jackson-databind`(Jackson 3, Spring Boot 4 기본값) 또는 `com.fasterxml.jackson.core:jackson-databind`"
    docs:
      - https://docs.openrewrite.org/recipes/java/jackson/codehaustofasterxml
      - https://repo1.maven.org/maven2/org/codehaus/jackson/jackson-mapper-asl/
    notes: knowledge/notes/era-libraries.md

  - id: json-lib
    library: json-lib
    status: eol
    title: json-lib (net.sf.json) is end of life
    summary: >-
      Last release 2.4 (2010); 2.4 has only classified jars (json-lib-2.4-jdk15.jar), so the dependency needs
      <classifier>jdk15</classifier> or it does not resolve. It compiles on Java 21 but drags commons-lang 2,
      commons-collections 3, commons-beanutils and ezmorph onto the compile classpath.
    replacement: Jackson (tools.jackson.core:jackson-databind, Boot 4 default) or com.google.code.gson:gson
    replacement_version: Boot 4.1 managed
    followup: Replace JSONObject.fromObject / JSONArray / JSONSerializer with ObjectMapper; keep the jdk15 classifier while json-lib is still used.
    title_ko: "json-lib(net.sf.json)은 지원이 종료되었습니다"
    summary_ko: >-
      마지막 릴리스는 2.4(2010)입니다. 2.4에는 classifier가 붙은 jar(json-lib-2.4-jdk15.jar)만 있어서 의존성에
      `<classifier>jdk15</classifier>`가 없으면 받아지지 않습니다. Java 21에서 컴파일은 되지만 commons-lang 2,
      commons-collections 3, commons-beanutils, ezmorph가 compile classpath에 함께 들어옵니다.
    followup_ko: >-
      `JSONObject.fromObject` / `JSONArray` / `JSONSerializer`를 `ObjectMapper`로 바꿔 주세요. json-lib을 쓰는
      동안은 jdk15 classifier를 그대로 두어야 합니다.
    replacement_ko: "Jackson(`tools.jackson.core:jackson-databind`, Spring Boot 4 기본값) 또는 `com.google.code.gson:gson`"
    docs:
      - https://json-lib.sourceforge.net/
      - https://repo1.maven.org/maven2/net/sf/json-lib/json-lib/2.4/
    notes: knowledge/notes/era-libraries.md

  - id: xstream
    artifacts: ["com.thoughtworks.xstream:xstream"]
    status: incompatible
    title: XStream needs --add-opens on Java 17+ and an explicit type allow-list
    summary: >-
      Latest 1.4.21 (2024). It compiles on Java 21, but reflection-based converters need --add-opens
      java.base/java.util=ALL-UNNAMED (and others) at runtime ("since Java 17 it is no longer possible to allow this
      access with a single runtime option"); without a security framework setup older versions are exposed to
      deserialization CVEs.
    replacement: com.thoughtworks.xstream:xstream (bump) or Jackson XML (tools.jackson.dataformat:jackson-dataformat-xml)
    replacement_version: 1.4.21
    followup: Bump to 1.4.21, call xstream.allowTypes(...) / allowTypesByWildcard(...) and add the needed --add-opens to the run script (runtime).
    title_ko: "XStream은 Java 17 이상에서 --add-opens와 허용 타입 목록이 필요합니다"
    summary_ko: >-
      최신 버전은 1.4.21(2024)입니다. Java 21에서 컴파일은 되지만 리플렉션 기반 converter는 실행할 때 `--add-opens
      java.base/java.util=ALL-UNNAMED` 등이 필요합니다("since Java 17 it is no longer possible to allow this
      access with a single runtime option"). 보안 프레임워크를 설정하지 않은 예전 버전은 역직렬화 취약점(CVE)에 노출됩니다.
    followup_ko: >-
      1.4.21로 올리고 `xstream.allowTypes(...)` / `allowTypesByWildcard(...)`를 호출하도록 고친 뒤, 실행 스크립트에 필요한
      `--add-opens`를 추가해 주세요(실행 환경 설정).
    replacement_ko: "`com.thoughtworks.xstream:xstream`(버전 올림) 또는 Jackson XML(`tools.jackson.dataformat:jackson-dataformat-xml`)"
    docs:
      - https://x-stream.github.io/faq.html
      - https://x-stream.github.io/security.html

  - id: jdom1
    artifacts: ["org.jdom:jdom", "jdom:jdom"]
    applies_when_version_below: "2.0"
    status: eol
    title: JDOM 1.x is end of life (JDOM 2 uses package org.jdom2)
    summary: >-
      JDOM 1 (jdom:jdom 1.0, org.jdom:jdom 1.1.x, last 1.1.3) uses package org.jdom; JDOM 2 is org.jdom:jdom2
      (2.0.6.1, Boot-managed) with package org.jdom2 (org.jdom:jdom 2.0.x is already JDOM 2). It compiles on Java 21;
      no recipe in the pinned jars.
    replacement: org.jdom:jdom2
    replacement_version: 2.0.6.1 (Boot 4.1 managed)
    followup: Rename org.jdom.* imports to org.jdom2.* (the API is close) and swap the dependency.
    title_ko: "JDOM 1.x는 지원이 종료되었습니다(JDOM 2는 패키지 org.jdom2를 씁니다)"
    summary_ko: >-
      JDOM 1(jdom:jdom 1.0, org.jdom:jdom 1.1.x, 마지막 1.1.3)은 패키지 `org.jdom`을 쓰고, JDOM 2는
      `org.jdom:jdom2`(2.0.6.1, Spring Boot BOM에 버전 있음)이며 패키지는 `org.jdom2`입니다(org.jdom:jdom 2.0.x는 이미
      JDOM 2입니다). Java 21에서 컴파일되며, sbmig가 쓰는 레시피에는 변환이 없습니다.
    followup_ko: >-
      `org.jdom.*` import를 `org.jdom2.*`로 바꾸고(API는 거의 같습니다) 의존성을 바꿔 주세요.
    docs:
      - https://github.com/hunterhacker/jdom/wiki/JDOM2-Migration-Issues

  - id: axis1
    library: axis1
    status: eol
    title: Apache Axis 1.x (JAX-RPC) is end of life
    summary: >-
      Last release 1.4 (2006), built on javax.xml.rpc / javax.xml.soap with no Jakarta build. Client stubs compile only
      while axis-jaxrpc + axis-saaj (javax namespace) are on the classpath (javax.xml.soap left the JDK in 11); the
      jakarta package sweep renames javax.xml.soap → jakarta.xml.soap, which breaks code that hands SOAP objects to
      Axis 1 APIs. AxisServlet (javax.servlet) cannot run on Tomcat 11 / Boot 4.
    replacement: JAX-WS client generated from the WSDL (com.sun.xml.ws:jaxws-rt + jaxws-maven-plugin), Apache CXF 4.x or Spring WS WebServiceTemplate
    replacement_version: jaxws-rt 4.0.5 / cxf-rt-frontend-jaxws 4.2.4 / spring-ws 5.0.2 (Boot-managed)
    followup: >-
      Keep the javax.xml.rpc / javax.xml.soap imports in Axis code (exclude them from the jakarta rename), declare
      axis-jaxrpc and axis-saaj 1.4 explicitly and plan the regeneration of the stubs with JAX-WS (wsimport) or CXF.
    title_ko: "Apache Axis 1.x(JAX-RPC)는 지원이 종료되었습니다"
    summary_ko: >-
      마지막 릴리스는 1.4(2006)이고 javax.xml.rpc / javax.xml.soap 기반이며 Jakarta 버전이 없습니다. 클라이언트 stub은
      axis-jaxrpc와 axis-saaj(javax 네임스페이스)가 classpath에 있을 때만 컴파일됩니다(javax.xml.soap은 JDK 11에서 빠졌습니다).
      jakarta 패키지 변환이 `javax.xml.soap`을 `jakarta.xml.soap`으로 바꾸면 SOAP 객체를 Axis 1 API에 넘기는 코드가 깨지고,
      `AxisServlet`(javax.servlet)은 Tomcat 11 / Spring Boot 4에서 실행되지 않습니다.
    followup_ko: >-
      Axis 코드의 `javax.xml.rpc` / `javax.xml.soap` import는 그대로 두고(jakarta 이름 변경에서 제외), axis-jaxrpc와
      axis-saaj 1.4를 pom에 직접 선언해 주세요. stub은 JAX-WS(wsimport)나 CXF로 다시 생성할 계획을 세워 주세요.
    replacement_ko: "WSDL로 생성한 JAX-WS 클라이언트(`com.sun.xml.ws:jaxws-rt`와 jaxws-maven-plugin), Apache CXF 4.x 또는 Spring WS `WebServiceTemplate`"
    docs:
      - https://axis.apache.org/axis/
      - https://repo1.maven.org/maven2/org/apache/axis/axis-saaj/1.4/
    notes: knowledge/notes/era-libraries.md

  - id: commons-email1
    artifacts: ["org.apache.commons:commons-email"]
    status: incompatible
    title: Commons Email 1.x is javax.mail only; the Jakarta line commons-email2-jakarta is a milestone
    summary: >-
      commons-email 1.6.0 references javax.mail.*. The Jakarta line has new coordinates and packages:
      org.apache.commons:commons-email2-jakarta (org.apache.commons.mail2.jakarta.*) + commons-email2-core
      (org.apache.commons.mail2.core.EmailException …), only 2.0.0-M1 (2024) on Central. UpgradeSpringBoot_4_0 already
      runs UpdateApacheCommonsEmailDependencies (newVersion 2.0.x); whether it accepts the milestone is unverified.
    replacement: org.apache.commons:commons-email2-jakarta (or Spring JavaMailSender, spring-boot-starter-mail)
    replacement_version: 2.0.0-M1 (milestone)
    followup: >-
      After the recipe check the pom: if commons-email2-jakarta has no resolvable version set 2.0.0-M1 explicitly (a
      milestone in production is the owners' call) or move to JavaMailSender.
    title_ko: "Commons Email 1.x는 javax.mail 전용이고, Jakarta 버전 commons-email2-jakarta는 마일스톤뿐입니다"
    summary_ko: >-
      commons-email 1.6.0은 `javax.mail.*`을 참조합니다. Jakarta 버전은 좌표와 패키지가
      바뀌었고(`org.apache.commons:commons-email2-jakarta`의 `org.apache.commons.mail2.jakarta.*`,
      `commons-email2-core`의 `org.apache.commons.mail2.core.EmailException` 등), Maven Central에는
      2.0.0-M1(2024)만 있습니다. `UpgradeSpringBoot_4_0`이 이미
      `UpdateApacheCommonsEmailDependencies`(newVersion 2.0.x)를 실행하지만, 이 레시피가 마일스톤 버전을 받아들이는지는 확인되지
      않았습니다.
    followup_ko: >-
      레시피가 실행된 뒤 pom을 확인해 주세요. commons-email2-jakarta의 버전을 받을 수 없으면 2.0.0-M1을 직접 적거나(운영에 마일스톤 버전을 쓸지는
      담당 팀이 정해 주세요) `JavaMailSender`로 옮겨 주세요.
    replacement_ko: "`org.apache.commons:commons-email2-jakarta`(또는 Spring `JavaMailSender`, `spring-boot-starter-mail`)"
    docs:
      - https://docs.openrewrite.org/recipes/java/migrate/jakarta/updateapachecommonsemaildependencies
      - https://repo1.maven.org/maven2/org/apache/commons/commons-email2-jakarta/

  - id: commons-configuration1
    artifacts: ["commons-configuration:commons-configuration"]
    status: eol
    title: Commons Configuration 1.x is unmaintained (last 1.10, 2013); 2.x uses package org.apache.commons.configuration2
    summary: >-
      1.10 still compiles on Java 21 but depends on commons-lang 2. Commons Configuration 2 has new coordinates, a new
      package and a builder-based API.
    replacement: org.apache.commons:commons-configuration2
    replacement_version: 2.15.1
    followup: Rewrite PropertiesConfiguration / XMLConfiguration use to configuration2 builders (FileBasedConfigurationBuilder) or Spring @ConfigurationProperties.
    title_ko: "Commons Configuration 1.x는 유지보수되지 않습니다(마지막 1.10, 2013). 2.x는 패키지 org.apache.commons.configuration2를 씁니다"
    summary_ko: >-
      1.10은 Java 21에서 컴파일되지만 commons-lang 2에 의존합니다. Commons Configuration 2는 좌표와 패키지가 바뀌었고 builder 기반
      API를 씁니다.
    followup_ko: >-
      `PropertiesConfiguration` / `XMLConfiguration`을 쓰는 코드를 configuration2
      builder(`FileBasedConfigurationBuilder`)나 Spring `@ConfigurationProperties`로 다시 작성해 주세요.
    docs:
      - https://commons.apache.org/proper/commons-configuration/userguide/upgradeto2_0.html

  - id: cglib
    artifacts: ["cglib:cglib", "cglib:cglib-nodep"]
    status: eol
    title: cglib is unmaintained and does not work reliably on JDK 17+
    summary: >-
      Last release 3.3.0 (2019); its README says it "does not work well (or possibly at all?) in newer JDKs,
      particularly JDK17+". It compiles and Spring uses its own repackaged org.springframework.cglib, so only project
      code calling net.sf.cglib.* (Enhancer, BeanCopier) hits InaccessibleObjectException at runtime without
      --add-opens java.base/java.lang=ALL-UNNAMED.
    replacement: net.bytebuddy:byte-buddy (Boot-managed) or MapStruct / BeanUtils.copyProperties
    replacement_version: Boot 4.1 managed
    followup: Remove cglib when nothing uses it directly; replace BeanCopier / Enhancer use (MapStruct, BeanUtils.copyProperties, ByteBuddy).
    title_ko: "cglib은 유지보수되지 않고 JDK 17 이상에서 안정적으로 동작하지 않습니다"
    summary_ko: >-
      마지막 릴리스는 3.3.0(2019)이고 README에 "does not work well (or possibly at all?) in newer JDKs,
      particularly JDK17+"라고 적혀 있습니다. 컴파일은 되고 Spring은 자체 재패키징한 `org.springframework.cglib`을 쓰므로,
      `net.sf.cglib.*`(`Enhancer`, `BeanCopier`)를 직접 호출하는 프로젝트 코드만 `--add-opens
      java.base/java.lang=ALL-UNNAMED` 없이 실행할 때 `InaccessibleObjectException`이 납니다.
    followup_ko: >-
      cglib을 직접 쓰는 곳이 없으면 의존성을 빼 주세요. `BeanCopier` / `Enhancer`를 쓰는 곳은 MapStruct,
      `BeanUtils.copyProperties`, ByteBuddy로 바꿔 주세요.
    replacement_ko: "`net.bytebuddy:byte-buddy`(Spring Boot BOM에 버전 있음) 또는 MapStruct / `BeanUtils.copyProperties`"
    docs:
      - https://github.com/cglib/cglib

  - id: commons-httpclient3
    library: commons-httpclient3
    status: eol
    title: Jakarta Commons HttpClient 3.x is end of life (since 2011)
    summary: >-
      commons-httpclient 3.1 (2007) is EOL (package org.apache.commons.httpclient). It still compiles on Java 21 but
      receives no fixes; the httpclient4 advisory does not cover it and the httpclient5 recipes start from 4.x.
    replacement: org.apache.httpcomponents.client5:httpclient5 (or Spring RestClient)
    replacement_version: Boot 4.1 managed (5.6.1)
    followup: Rewrite HttpClient / GetMethod / PostMethod / NameValuePair code to httpclient5 (or RestClient) and drop commons-httpclient.
    title_ko: "Jakarta Commons HttpClient 3.x는 지원이 종료되었습니다(2011년부터)"
    summary_ko: >-
      commons-httpclient 3.1(2007, 패키지 `org.apache.commons.httpclient`)은 지원이 종료되었습니다. Java 21에서 컴파일은
      되지만 더 이상 수정이 나오지 않습니다. httpclient4 안내는 이 라이브러리를 다루지 않고, httpclient5 레시피는 4.x 코드만 바꿉니다.
    followup_ko: >-
      `HttpClient` / `GetMethod` / `PostMethod` / `NameValuePair` 코드를 httpclient5(또는 RestClient)로 다시
      작성하고 commons-httpclient를 빼 주세요.
    replacement_ko: "`org.apache.httpcomponents.client5:httpclient5`(또는 Spring RestClient)"
    docs:
      - https://hc.apache.org/httpclient-legacy/
      - https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/
    notes: knowledge/notes/era-libraries.md

  - id: jjwt-legacy
    library: jjwt
    applies_when_version_below: "0.10.0"
    status: incompatible
    title: JJWT 0.9.x needs javax.xml.bind at runtime and its API was rewritten in 0.12
    summary: >-
      jjwt 0.9.1 (io.jsonwebtoken.impl.Base64Codec) calls javax.xml.bind.DatatypeConverter, which left the JDK in 11 —
      NoClassDefFoundError at runtime unless javax.xml.bind:jaxb-api 2.3.1 stays on the classpath. 0.10 split the jar
      into jjwt-api + jjwt-impl + jjwt-jackson; 0.12 removed Jwts.parserBuilder() (Jwts.parser() returns the builder)
      and the parser setters, deprecated parseClaimsJws → parseSignedClaims and SignatureAlgorithm.
    replacement: io.jsonwebtoken:jjwt-api + jjwt-impl (runtime) + jjwt-jackson (runtime)
    replacement_version: 0.13.0
    followup: >-
      Short term keep 0.9.1 and add javax.xml.bind:jaxb-api 2.3.1 (runtime); proper fix: 0.13.0 with
      Jwts.parser().verifyWith(key).build().parseSignedClaims(..) and signWith(Keys.hmacShaKeyFor(bytes)).
    title_ko: "JJWT 0.9.x는 실행할 때 javax.xml.bind가 필요하고, 0.12에서 API가 새로 바뀌었습니다"
    summary_ko: >-
      jjwt 0.9.1(`io.jsonwebtoken.impl.Base64Codec`)은 JDK 11에서 빠진 `javax.xml.bind.DatatypeConverter`를
      호출하므로, `javax.xml.bind:jaxb-api` 2.3.1이 classpath에 없으면 실행 중에 `NoClassDefFoundError`가 납니다. 0.10에서
      jar가 jjwt-api, jjwt-impl, jjwt-jackson으로 나뉘었고, 0.12에서 `Jwts.parserBuilder()`(이제 `Jwts.parser()`가
      builder를 반환합니다)와 parser setter가 삭제되었으며 `parseClaimsJws`(`parseSignedClaims`로 대체)와
      `SignatureAlgorithm`은 deprecated되었습니다.
    followup_ko: >-
      당장은 0.9.1을 유지하고 `javax.xml.bind:jaxb-api` 2.3.1(runtime)을 추가해 주세요. 제대로 고치려면 0.13.0으로 올리고
      `Jwts.parser().verifyWith(key).build().parseSignedClaims(..)`와
      `signWith(Keys.hmacShaKeyFor(bytes))`를 써 주세요.
    replacement_ko: "`io.jsonwebtoken:jjwt-api`와 `jjwt-impl`(runtime), `jjwt-jackson`(runtime)"
    docs:
      - https://github.com/jwtk/jjwt/blob/master/CHANGELOG.md
      - https://github.com/jwtk/jjwt#installation
    notes: knowledge/notes/era-libraries.md

  # ------------------------------------------------------------------ documents (Excel / PDF)
  - id: poi-legacy
    library: poi
    applies_when_version_below: "5.0.0"
    status: superseded
    title: Apache POI 3.x / 4.x APIs removed in POI 5
    summary: >-
      POI 5.5.1 removed the int / short constants deprecated in 3.15–3.17: Cell.CELL_TYPE_* (→ CellType),
      CellStyle.ALIGN_* / VERTICAL_* (→ HorizontalAlignment / VerticalAlignment), BORDER_* (→ BorderStyle), fill
      patterns (→ FillPatternType), Hyperlink.LINK_* (→ HyperlinkType), Font.setBoldweight (→ setBold),
      setCellType(int); poi-ooxml-schemas → poi-ooxml-lite, ooxml-schemas → poi-ooxml-full. The rewrite-apache recipe
      UpgradeApachePoi_5 covers these but is type-attributed (it must run while the old POI still resolves) and is not
      in the recipe catalog yet; HSSFColor.* inner classes are not covered.
    replacement: org.apache.poi:poi / poi-ooxml
    replacement_version: 5.5.1
    followup: >-
      Review the ported constants / style calls and HSSFColor / IndexedColors use, then re-test the generated Excel
      files (fonts, borders, merged cells).
    title_ko: "Apache POI 3.x / 4.x의 API 일부가 POI 5에서 삭제되었습니다"
    summary_ko: >-
      POI 5.5.1에서 3.15~3.17에 deprecated된 int / short 상수가 삭제되었습니다. `Cell.CELL_TYPE_*`(`CellType`으로),
      `CellStyle.ALIGN_*` / `VERTICAL_*`(`HorizontalAlignment` / `VerticalAlignment`로),
      `BORDER_*`(`BorderStyle`로), fill pattern(`FillPatternType`으로),
      `Hyperlink.LINK_*`(`HyperlinkType`으로), `Font.setBoldweight`(`setBold`로), `setCellType(int)`이
      해당하고, poi-ooxml-schemas는 poi-ooxml-lite로, ooxml-schemas는 poi-ooxml-full로 바뀌었습니다. rewrite-apache
      레시피 `UpgradeApachePoi_5`가 이 변경을 다루지만 타입 정보가 필요해 예전 POI가 아직 받아지는 상태에서 실행해야 하고, 레시피 목록에는 아직 들어 있지
      않습니다. `HSSFColor.*` 내부 클래스는 이 레시피도 다루지 않습니다.
    followup_ko: >-
      옮긴 상수 / 스타일 호출과 `HSSFColor` / `IndexedColors`를 쓰는 코드를 검토한 뒤, 생성되는 Excel 파일(글꼴, 테두리, 병합 셀)을 다시
      테스트해 주세요.
    replacement_ko: "`org.apache.poi:poi`와 `poi-ooxml`"
    docs:
      - https://docs.openrewrite.org/recipes/apache/poi/upgradeapachepoi_5
      - https://poi.apache.org/changes.html
    notes: knowledge/notes/era-libraries.md

  - id: jxls1
    artifacts: ["net.sf.jxls:*"]
    status: incompatible
    title: JXLS 1.x (XLSTransformer) is built for POI 3.x and unmaintained
    summary: >-
      net.sf.jxls:jxls-core 1.0.6 (2014) depends on poi 3.9; once POI is 5.x XLSTransformer fails at runtime against
      the removed POI 3 APIs. JXLS 2 (org.jxls:jxls-poi 2.14.0, POI 5.2.2, Java 8) and JXLS 3 (3.2.0, Java 17) use a
      different template syntax (jx:area comments) and API.
    replacement: org.jxls:jxls-poi (2.x for minimal change, 3.x current)
    replacement_version: 2.14.0 / 3.2.0
    followup: Keep POI 3.x pinned for the JXLS 1 modules (if the owners accept it) or port the templates to jx:area markup and JxlsHelper (2.x).
    title_ko: "JXLS 1.x(XLSTransformer)는 POI 3.x용이고 유지보수되지 않습니다"
    summary_ko: >-
      `net.sf.jxls:jxls-core` 1.0.6(2014)은 poi 3.9에 의존하므로, POI가 5.x가 되면 `XLSTransformer`가 삭제된 POI 3
      API 때문에 실행 중에 실패합니다. JXLS 2(`org.jxls:jxls-poi` 2.14.0, POI 5.2.2, Java 8)와 JXLS 3(3.2.0, Java
      17)은 템플릿 문법(jx:area 주석)과 API가 다릅니다.
    followup_ko: >-
      JXLS 1을 쓰는 모듈에 POI 3.x 버전을 직접 지정해 둘지(담당 팀이 받아들이는 경우), 템플릿을 jx:area 표기와 `JxlsHelper`(2.x)로 옮길지 정해
      주세요.
    replacement_ko: "`org.jxls:jxls-poi`(변경을 최소로 하려면 2.x, 최신은 3.x)"
    docs:
      - https://jxls.sourceforge.net/
      - https://repo1.maven.org/maven2/org/jxls/jxls-poi/

  - id: jexcelapi
    artifacts: ["net.sourceforge.jexcelapi:jxl"]
    status: eol
    title: JExcelApi (jxl) is end of life (2.6.12; .xls only)
    summary: No javax EE references; it compiles and runs on Java 21 but is unmaintained and reads / writes only BIFF8 .xls.
    replacement: org.apache.poi:poi (HSSF / XSSF)
    replacement_version: 5.5.1
    followup: Port Workbook / WritableWorkbook code to POI when the module is next touched.
    title_ko: "JExcelApi(jxl)는 지원이 종료되었습니다(2.6.12, .xls만 지원)"
    summary_ko: >-
      javax EE 참조가 없어 Java 21에서 컴파일되고 실행되지만, 유지보수되지 않고 BIFF8 `.xls`만 읽고 쓸 수 있습니다. 대신 Apache POI를 씁니다.
    followup_ko: >-
      다음에 이 모듈을 수정할 때 `Workbook` / `WritableWorkbook` 코드를 POI로 옮겨 주세요.
    replacement_ko: "`org.apache.poi:poi`(HSSF / XSSF 사용)"
    docs:
      - https://jexcelapi.sourceforge.net/

  # ------------------------------------------------------------------ logging / test
  - id: slf4j-1-pin
    artifacts: ["org.slf4j:slf4j-log4j12", "org.slf4j:jcl-over-slf4j"]
    status: incompatible
    title: SLF4J 1.7 pins / bindings silently disable or duplicate logging under Boot 4 (SLF4J 2 + Logback 1.5)
    summary: >-
      Boot 4.1 manages every org.slf4j artifact at 2.0.18. An explicit slf4j-api 1.7.x overrides it and finds no
      provider in Logback 1.5 (NOP logging, build green; the restructure drops explicit versions the new parent
      manages, so this advisory keys on the bindings). slf4j-log4j12 2.x is a relocation to slf4j-reload4j (Log4j 1);
      Spring Framework 7 uses commons-logging 1.3 directly, so jcl-over-slf4j next to it gives two copies of
      org.apache.commons.logging.*.
    replacement: org.slf4j:slf4j-api (Boot-managed) + spring-boot-starter-logging
    replacement_version: 2.0.18 (Boot 4.1 managed)
    followup: >-
      Drop explicit versions on org.slf4j:* and logback, remove slf4j-log4j12 / slf4j-jdk14 / slf4j-simple bindings and
      jcl-over-slf4j; keep log4j-over-slf4j only for leftover Log4j 1 calls.
    title_ko: "SLF4J 1.7 버전 지정이나 바인딩이 남아 있으면 Spring Boot 4(SLF4J 2 + Logback 1.5)에서 로그가 조용히 꺼지거나 중복됩니다"
    summary_ko: >-
      Spring Boot 4.1 BOM은 모든 `org.slf4j` 아티팩트의 버전을 2.0.18로 정합니다. slf4j-api 1.7.x를 직접 적으면 이 버전을 덮어써
      Logback 1.5에서 provider를 찾지 못하고, 빌드는 성공하지만 로그가 출력되지 않습니다(재구성 단계는 새 부모 pom이 정하는 버전을 지우므로 이 안내는 바인딩
      아티팩트로 찾습니다). slf4j-log4j12 2.x는 slf4j-reload4j(Log4j 1)로 relocation된 아티팩트입니다. Spring Framework
      7은 commons-logging 1.3을 직접 쓰므로, jcl-over-slf4j가 함께 있으면 `org.apache.commons.logging.*`이 두 벌
      들어옵니다.
    followup_ko: >-
      `org.slf4j:*`와 logback에 직접 적은 버전을 지우고, slf4j-log4j12 / slf4j-jdk14 / slf4j-simple 바인딩과
      jcl-over-slf4j를 빼 주세요. log4j-over-slf4j는 Log4j 1 호출이 남아 있을 때만 두세요.
    replacement_ko: "`org.slf4j:slf4j-api`(Spring Boot BOM에 버전 있음)와 `spring-boot-starter-logging`"
    docs:
      - https://www.slf4j.org/faq.html#changesInVersion200
      - https://www.slf4j.org/codes.html#noProviders
    notes: knowledge/notes/era-libraries.md

  - id: mockito-legacy
    artifacts: ["org.mockito:mockito-all"]
    status: superseded
    title: Mockito 1.x / 2.x tests do not compile against the managed Mockito 5
    summary: >-
      Boot 4.1 manages mockito 5.23.0; mockito-all stopped at 1.10.19 / 2.0.2-beta and is not managed. The verified
      recipe Mockito1to5Migration exists; Boot 4 also removed @MockBean / @SpyBean (→ @MockitoBean / @MockitoSpyBean).
      Irrelevant while build.skip_test_compile is true (company runs).
    replacement: org.mockito:mockito-core (+ mockito-junit-jupiter)
    replacement_version: 5.23.0 (Boot 4.1 managed)
    followup: Replace mockito-all with mockito-core and run Mockito1to5Migration when the tests come back into scope.
    title_ko: "Mockito 1.x / 2.x 테스트는 Spring Boot BOM의 Mockito 5로 컴파일되지 않습니다"
    summary_ko: >-
      Spring Boot 4.1 BOM의 mockito 버전은 5.23.0이고, mockito-all은 1.10.19 / 2.0.2-beta가 마지막이며 BOM에 없습니다.
      검증된 레시피 `Mockito1to5Migration`이 있고, Spring Boot 4에서는 `@MockBean` / `@SpyBean`도
      삭제되었습니다(`@MockitoBean` / `@MockitoSpyBean`으로 대체). `build.skip_test_compile`이 true인 동안(사내 실행)은
      영향이 없습니다.
    followup_ko: >-
      테스트를 다시 빌드 대상에 넣을 때 mockito-all을 mockito-core로 바꾸고 `Mockito1to5Migration`을 실행해 주세요.
    replacement_ko: "`org.mockito:mockito-core`와 `mockito-junit-jupiter`"
    docs:
      - https://docs.openrewrite.org/recipes/java/testing/mockito/mockito1to5migration

  - id: powermock
    artifacts: ["org.powermock:*"]
    status: eol
    title: PowerMock is unmaintained (last 2.0.9, 2020) and supports only Mockito 2 / JUnit 4
    summary: >-
      powermock-api-mockito2 2.0.9 depends on Mockito 2 APIs and has no JUnit 5 runner; with the managed Mockito 5 the
      tests fail. The verified recipe ReplacePowerMockito rewrites mockStatic / when / spy / Whitebox to plain Mockito.
    replacement: org.mockito:mockito-core (MockedStatic / MockedConstruction)
    replacement_version: 5.23.0 (Boot 4.1 managed)
    followup: Remove PowerMock and rewrite private / final / static mocking with Mockito 5 (or refactor the code under test) when the tests come back into scope.
    title_ko: "PowerMock은 유지보수되지 않고(마지막 2.0.9, 2020) Mockito 2 / JUnit 4만 지원합니다"
    summary_ko: >-
      powermock-api-mockito2 2.0.9는 Mockito 2 API에 의존하고 JUnit 5 runner가 없어서, Spring Boot BOM의 Mockito
      5에서는 테스트가 실패합니다. 검증된 레시피 `ReplacePowerMockito`가 `mockStatic` / `when` / `spy` / `Whitebox`를 일반
      Mockito 코드로 바꿉니다.
    followup_ko: >-
      테스트를 다시 빌드 대상에 넣을 때 PowerMock을 빼고, private / final / static mocking은 Mockito 5로 다시 작성하거나 테스트 대상
      코드를 고쳐 주세요.
    replacement_ko: "`org.mockito:mockito-core`(`MockedStatic` / `MockedConstruction` 사용)"
    docs:
      - https://docs.openrewrite.org/recipes/java/testing/mockito/replacepowermockito
      - https://github.com/powermock/powermock
