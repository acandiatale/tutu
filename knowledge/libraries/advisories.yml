  # ------------------------------------------------------------------ servlet containers (round 10)
  - id: undertow
    library: undertow
    status: incompatible
    title: Undertow is not supported by Spring Boot 4 (spring-boot-starter-undertow is gone)
    summary: >-
      spring-boot-starter-undertow ends at 4.0.0-M1 on Maven Central and the spring-boot-dependencies 4.1.0 BOM manages
      neither the starter nor io.undertow. Swap the starter for spring-boot-starter-tomcat (Boot's default
      container) in the pom (a fix script does it when the build names it); code against io.undertow.* or
      Boot's Undertow customizers (UndertowServletWebServerFactory, UndertowBuilderCustomizer …) no longer compiles.
    replacement: org.springframework.boot:spring-boot-starter-tomcat (or spring-boot-starter-jetty)
    replacement_version: managed by the Boot 4 BOM
    followup: >-
      Remove the Undertow customizer beans, move server.undertow.* properties to server.tomcat.* (threads, max
      connections, access log) and re-test HTTP/2, WebSocket and buffer settings under Tomcat; exclusions of
      spring-boot-starter-tomcat on the web starter can go.
    title_ko: "Spring Boot 4는 Undertow를 지원하지 않습니다(spring-boot-starter-undertow가 없습니다)"
    summary_ko: >-
      `spring-boot-starter-undertow`는 Maven Central에서 4.0.0-M1이 마지막이고, `spring-boot-dependencies`
      4.1.0 BOM에는 이 starter도 `io.undertow`도 없습니다. pom의 starter는 `spring-boot-starter-tomcat`(Spring
      Boot 기본 컨테이너)으로 바꿔야 하며, 빌드 오류에 나오면 자동 수정 단계에서 바꿉니다. `io.undertow.*`나 Spring Boot의 Undertow
      커스터마이저(`UndertowServletWebServerFactory`, `UndertowBuilderCustomizer` 등)를 쓰는 코드는 더 이상 컴파일되지
      않습니다.
    followup_ko: >-
      Undertow 커스터마이저 빈을 지우고 `server.undertow.*` 속성을 `server.tomcat.*`(스레드, 최대 연결 수, 접근 로그)로 옮겨 주세요.
      HTTP/2, WebSocket, 버퍼 설정은 Tomcat에서 다시 테스트해 주세요. web starter에 걸어 둔 `spring-boot-starter-tomcat`
      exclusion은 지워도 됩니다.
    replacement_ko: "`org.springframework.boot:spring-boot-starter-tomcat`(또는 `spring-boot-starter-jetty`)"
    docs:
      - https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
      - https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-starter-undertow/
    notes: knowledge/notes/boot3-to-4.md

  # ------------------------------------------------------------------ JDK-internal / removed JDK APIs (pre-Java-8 code)
  - id: jdk-removed-apis
    library: jdk-removed-apis
    status: incompatible
    title: JDK-internal or removed JDK APIs (sun.misc, sun.security, com.sun.image, javax.activation)
    summary: >-
      The as-is code imports JDK-internal packages or Java EE modules that JDK 11 removed (JEP 320) or JDK 17
      encapsulated (JEP 403). javac 21 with --release 21 does not see them. UpgradeToJava21 (Java8toJava11) adds the
      JAXB / JAX-WS / common-annotations dependencies and rewrites what it can resolve (RenameUnderscoreIdentifier,
      Thread.stop/destroy; UseJavaUtilBase64 too, but OpenRewrite parses on JDK 21 where sun.misc.BASE64Encoder /
      BASE64Decoder no longer resolve, so those calls usually stay); code whose types no longer resolve on JDK 21 is
      ported to java.util.Base64 & co. by the LLM in the build-fix loop with this guidance, marked MIGRATION-TODO where
      the result may differ.
    replacement: java.util.Base64 / javax.imageio / java.security, jakarta.* API jars (JDK replacements)
    replacement_version: JDK 21 (jakarta.xml.bind-api, jakarta.annotation-api, jakarta.activation-api are Boot-managed)
    followup: >-
      Review the ported JDK API calls: sun.misc.BASE64Encoder → java.util.Base64.getEncoder() drops the 76-character
      line breaks the JDK 8 encoder inserted — use Base64.getMimeEncoder() where stored or compared output must keep
      them (BASE64Decoder → Base64.getMimeDecoder() tolerates line breaks); sun.misc.Unsafe still compiles
      (jdk.unsupported) — keep it, but plan VarHandle / FFM;
      JAXB needs jakarta.xml.bind:jakarta.xml.bind-api plus runtime org.glassfish.jaxb:jaxb-runtime (Boot 4 manages
      both); javax.annotation.* → jakarta.annotation:jakarta.annotation-api; javax.activation →
      jakarta.activation-api; `_` is no longer an identifier (renamed); Thread.stop/suspend/resume throw
      UnsupportedOperationException — use interrupt-based cancellation; com.sun.image.codec.jpeg → javax.imageio.ImageIO.
    title_ko: "JDK 내부 API나 JDK에서 삭제된 API를 사용합니다(sun.misc, sun.security, com.sun.image, javax.activation)"
    summary_ko: >-
      기존 코드가 JDK 내부 패키지나, JDK 11에서 삭제된(JEP 320) 또는 JDK 17에서 캡슐화된(JEP 403) Java EE 모듈을 import합니다.
      `--release 21`로 컴파일하는 javac 21에서는 이 패키지를 쓸 수 없습니다. `UpgradeToJava21`(Java8toJava11) 레시피가 JAXB /
      JAX-WS / common-annotations 의존성을 추가하고 처리할 수 있는 코드를 바꿉니다(`RenameUnderscoreIdentifier`,
      `Thread.stop` / `destroy`). `UseJavaUtilBase64`도 실행되지만 OpenRewrite가 JDK 21에서 코드를 읽기 때문에
      `sun.misc.BASE64Encoder` / `BASE64Decoder` 호출은 대부분 그대로 남습니다. JDK 21에서 타입을 찾을 수 없는 코드는 자동 수정 단계에서
      `java.util.Base64` 등으로 옮기고, 결과가 달라질 수 있는 곳에는 MIGRATION-TODO 주석을 남깁니다.
    followup_ko: >-
      옮긴 JDK API 호출을 검토해 주세요. `sun.misc.BASE64Encoder`를 `java.util.Base64.getEncoder()`로 바꾸면 JDK 8
      인코더가 76자마다 넣던 줄바꿈이 없어집니다. 저장하거나 비교하는 값이 줄바꿈을 포함해야 하면 `Base64.getMimeEncoder()`를 써
      주세요(`BASE64Decoder` 대신 쓰는 `Base64.getMimeDecoder()`는 줄바꿈이 있어도 읽습니다). `sun.misc.Unsafe`는 아직
      컴파일되므로(jdk.unsupported) 그대로 두되, VarHandle / FFM으로 옮길 계획을 세워 주세요. JAXB는
      `jakarta.xml.bind:jakarta.xml.bind-api`와 실행용 `org.glassfish.jaxb:jaxb-runtime`이 필요합니다(둘 다 Spring
      Boot 4 BOM에 버전이 있습니다). `javax.annotation.*`은 `jakarta.annotation:jakarta.annotation-api`로,
      `javax.activation`은 `jakarta.activation-api`로 바꿔 주세요. `_`는 더 이상 식별자로 쓸 수 없어 이름을 바꿨습니다.
      `Thread.stop` / `suspend` / `resume`은 `UnsupportedOperationException`을 던지므로 interrupt 방식으로 취소하도록
      바꿔 주세요. `com.sun.image.codec.jpeg`는 `javax.imageio.ImageIO`로 바꿔 주세요.
    replacement_ko: "`java.util.Base64` / `javax.imageio` / `java.security` 같은 JDK 대체 API와 jakarta.* API jar"
    docs:
      - https://openjdk.org/jeps/320
      - https://openjdk.org/jeps/403
      - https://docs.openrewrite.org/recipes/java/migrate/java8tojava11
    notes: knowledge/notes/jdk21.md

  # ------------------------------------------------------------------ persistence (Korean legacy Spring 2/3 apps)
  - id: ibatis2
    library: ibatis2
    status: incompatible
    title: iBATIS 2 (SqlMapClient) — Spring 4+ removed org.springframework.orm.ibatis
    summary: >-
      Spring 3.2 was the last line with org.springframework.orm.ibatis. iBATIS 2 itself is retired since 2010; its
      artifacts stay on Maven Central, so the jar still resolves, but every SqlMapClientDaoSupport /
      SqlMapClientTemplate / SqlMapClientFactoryBean reference fails to compile after the Spring 7 upgrade. No
      OpenRewrite recipe ports it; the build-fix loop ports the DAOs with this guidance.
    replacement: org.mybatis:mybatis + org.mybatis:mybatis-spring
    replacement_version: mybatis 3.5.19 + mybatis-spring 4.1.0 (Spring 7 line; mybatis-spring-boot-starter 4.1.0 on Boot)
    followup: >-
      Where the build-fix loop could not port the DAOs they still use iBATIS 2 and the build stays red until the
      owning team ports them to MyBatis (DAOs a fix script did port carry MIGRATION-TODO lines — re-test those):
      SqlMapClient / SqlMapClientTemplate → SqlSessionTemplate or mapper interfaces;
      sqlmap XML → MyBatis mapper XML (#name# → #{name}, $name$ → ${name}, queryForList / queryForObject / insert /
      update / delete → selectList / selectOne / insert / update / delete, <sqlMapConfig> → <configuration>);
      result maps and dynamic SQL tags (<isNotEmpty>, <iterate>, <dynamic> → <if>, <foreach>, <where>) differ —
      a mechanical but manual port per DAO; re-test every statement against the database and drop the iBATIS jars.
    title_ko: "iBATIS 2(SqlMapClient)는 Spring 4부터 지원되지 않습니다(org.springframework.orm.ibatis 삭제)"
    summary_ko: >-
      `org.springframework.orm.ibatis`가 있는 마지막 Spring 버전은 3.2입니다. iBATIS 2는 2010년에 개발이 끝났지만 Maven
      Central에 jar가 남아 있어 의존성은 받아집니다. 다만 Spring 7로 올리면 `SqlMapClientDaoSupport` /
      `SqlMapClientTemplate` / `SqlMapClientFactoryBean`을 쓰는 코드는 모두 컴파일 오류가 납니다. OpenRewrite 레시피가 없어
      DAO는 자동 수정 단계에서 이 안내에 따라 옮깁니다.
    followup_ko: >-
      자동 수정 단계에서 옮기지 못한 DAO는 iBATIS 2를 그대로 쓰므로, 담당 팀이 MyBatis로 옮기기 전까지 빌드가 실패합니다(자동으로 옮긴 DAO에는
      MIGRATION-TODO 주석이 있으니 다시 테스트해 주세요). `SqlMapClient` / `SqlMapClientTemplate`은
      `SqlSessionTemplate`이나 mapper 인터페이스로 바꿔 주세요. sqlmap XML은 MyBatis mapper XML로 옮겨야 합니다. `#name#`은
      `#{name}`, `$name$`은 `${name}`, `queryForList` / `queryForObject` / `insert` / `update` /
      `delete`는 `selectList` / `selectOne` / `insert` / `update` / `delete`, `<sqlMapConfig>`는
      `<configuration>`으로 바꿉니다. result map과 동적 SQL 태그(`<isNotEmpty>`, `<iterate>`, `<dynamic>`을
      `<if>`, `<foreach>`, `<where>`로)도 달라서 DAO마다 손으로 옮겨야 합니다. 모든 SQL을 실제 데이터베이스에서 다시 테스트하고 iBATIS
      jar를 빼 주세요.
    replacement_ko: "`org.mybatis:mybatis`와 `org.mybatis:mybatis-spring`"
    docs:
      - https://mybatis.org/mybatis-3/
      - https://mybatis.org/spring/
    notes: knowledge/notes/ibatis2.md

  # ------------------------------------------------------------------ JDK 9 generified APIs (pre-Java-9 Swing tree code)
  - id: jdk-generified-apis
    library: jdk-generified-apis
    status: incompatible
    title: JDK 9 generified javax.swing.tree (children() returns Enumeration<TreeNode>)
    summary: >-
      JDK 9 generified javax.swing.tree: DefaultMutableTreeNode.children() / preorderEnumeration() /
      depthFirstEnumeration() / breadthFirstEnumeration() / pathFromAncestorEnumeration() return
      Enumeration<TreeNode> (TreeNode.children() too). Pre-Java-9 code that assigned them to a raw Enumeration or to
      Enumeration<DefaultMutableTreeNode> fails on javac 21 with "incompatible types: inference variable T has
      incompatible equality constraints" or "incompatible types: Enumeration<TreeNode> cannot be converted". The
      fix is a source change the build-fix loop makes with this guidance; no dependency is involved.
    replacement: Enumeration<TreeNode> / Enumeration<? extends TreeNode> with a cast per element (JDK API)
    replacement_version: JDK 9+
    followup: >-
      Review the ported tree code: Enumeration<DefaultMutableTreeNode> e = node.children() →
      Enumeration<TreeNode> e = node.children() and cast each element ((DefaultMutableTreeNode) e.nextElement()),
      or iterate node.children().asIterator(); Collections.list(node.children()) is a List<TreeNode> now.
    title_ko: "JDK 9에서 javax.swing.tree에 제네릭이 적용되었습니다(children()이 Enumeration<TreeNode>를 반환합니다)"
    summary_ko: >-
      JDK 9부터 `DefaultMutableTreeNode.children()` / `preorderEnumeration()` /
      `depthFirstEnumeration()` / `breadthFirstEnumeration()` / `pathFromAncestorEnumeration()`과
      `TreeNode.children()`은 `Enumeration<TreeNode>`를 반환합니다. Java 9 이전 코드처럼 raw `Enumeration`이나
      `Enumeration<DefaultMutableTreeNode>`에 대입하면 javac 21에서 "incompatible types: inference variable T
      has incompatible equality constraints" 또는 "incompatible types: Enumeration<TreeNode> cannot be
      converted" 오류가 납니다. 의존성과는 관계없는 소스 수정이며, 자동 수정 단계에서 이 안내에 따라 바꿉니다.
    followup_ko: >-
      옮긴 트리 코드를 검토해 주세요. `Enumeration<DefaultMutableTreeNode> e = node.children()`은
      `Enumeration<TreeNode> e = node.children()`으로 바꾸고 요소마다 `(DefaultMutableTreeNode)
      e.nextElement()`로 캐스트하거나, `node.children().asIterator()`로 순회합니다.
      `Collections.list(node.children())`는 이제 `List<TreeNode>`입니다.
    replacement_ko: "`Enumeration<TreeNode>` 또는 `Enumeration<? extends TreeNode>`로 받고 요소마다 캐스트(JDK API)"
    docs:
      - https://docs.oracle.com/en/java/javase/21/docs/api/java.desktop/javax/swing/tree/DefaultMutableTreeNode.html
    notes: knowledge/notes/jdk21.md

  # ------------------------------------------------------------------ Hibernate Commons Annotations (gone in ORM 7)
  - id: hibernate-commons-annotations
    library: hibernate-commons-annotations
    status: incompatible
    title: hibernate-commons-annotations (org.hibernate.annotations.common.*) is gone from Hibernate ORM 7 / Boot 4
    summary: >-
      Hibernate ORM 3.x–6.x pulled org.hibernate.common:hibernate-commons-annotations (HCANN) in transitively, so
      project code could import org.hibernate.annotations.common.* (typically LoggerFactory / Log from ...util.impl,
      or the XClass / ReflectionManager reflection API) without declaring the jar. Hibernate ORM 7.0 — every
      Spring Boot 4.x line — dropped it (hibernate-models replaced it internally): "package
      org.hibernate.annotations.common.util.impl does not exist" at compile time, typically only in the final
      package build of a company run. No OpenRewrite recipe; the build-fix loop ports the usages with this guidance.
    replacement: org.jboss.logging.Logger.getLogger(Foo.class) for LoggerFactory / Log (or SLF4J); java.lang.reflect for XClass / ReflectionManager
    replacement_version: jboss-logging via hibernate-core 7.x (Boot-managed); HCANN 7.0.3.Final only as an explicit EOL fallback
    followup: >-
      Review the ported logger / reflection code (jboss-logging Logger keeps the BasicLogger calls, SLF4J needs
      format changes for infof / debugv); if a module still declares org.hibernate.common:hibernate-commons-annotations
      7.0.3.Final explicitly (EOL, not managed by Boot 4), plan its removal.
    title_ko: "hibernate-commons-annotations(org.hibernate.annotations.common.*)는 Hibernate ORM 7 / Spring Boot 4에 없습니다"
    summary_ko: >-
      Hibernate ORM 3.x~6.x는 `org.hibernate.common:hibernate-commons-annotations`(HCANN)를 전이 의존성으로
      가져왔기 때문에, jar를 선언하지 않고도 `org.hibernate.annotations.common.*`(주로 `...util.impl`의 `LoggerFactory`
      / `Log`, 또는 `XClass` / `ReflectionManager` 리플렉션 API)를 import할 수 있었습니다. Spring Boot 4.x가 쓰는
      Hibernate ORM 7.0부터 이 jar가 빠져(내부는 hibernate-models로 대체) "package
      org.hibernate.annotations.common.util.impl does not exist" 컴파일 오류가 나며, 사내 실행에서는 보통 마지막 패키지 빌드에서만
      나타납니다. OpenRewrite 레시피가 없어 자동 수정 단계에서 이 안내에 따라 옮깁니다.
    followup_ko: >-
      옮긴 로거 / 리플렉션 코드를 검토해 주세요. jboss-logging `Logger`는 `BasicLogger` 호출을 그대로 쓸 수 있고, SLF4J로 옮겼다면
      `infof` / `debugv`의 포맷을 바꿔야 합니다. 아직 `org.hibernate.common:hibernate-commons-annotations`
      7.0.3.Final을 직접 선언한 모듈이 있다면, 이 버전은 지원이 종료되었고 Spring Boot 4 BOM에도 없으니 제거할 계획을 세워 주세요.
    replacement_ko: "`LoggerFactory` / `Log`는 `org.jboss.logging.Logger.getLogger(Foo.class)`(또는 SLF4J)로, `XClass` / `ReflectionManager`는 `java.lang.reflect`로"
    docs:
      - https://docs.jboss.org/hibernate/orm/7.0/migration-guide/migration-guide.html
      - https://repo1.maven.org/maven2/org/hibernate/common/hibernate-commons-annotations/
    notes: knowledge/notes/hibernate-7.md

  # ==================================================================================================================
  # 2026-10-22 era libraries (2013–2020 Korean enterprise Maven projects; web-verified research: Maven Central
  # listings, jar bytecode, the Spring Boot 4.1.0 BOM, the pinned recipe jars). Same-coordinate jakarta releases live in
  # knowledge/libraries/jakarta_libraries.yml (plain coordinate moves are the recipes' / the fix loop's); these
  # are the ones that need source / configuration work by the owning team. Fix-loop guidance:
