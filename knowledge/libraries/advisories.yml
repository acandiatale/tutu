    summary: >-
      No HLRC release after 7.17.29; the Boot 4.1 BOM manages co.elastic.clients:elasticsearch-java 9.4.2 instead, so
      after the parent swap the dependency loses its version ("dependencies.dependency.version is missing") or, pinned,
      drags org.elasticsearch:elasticsearch 7.x onto the classpath. Spring Data Elasticsearch 6.1 uses the Java API client.
    replacement: co.elastic.clients:elasticsearch-java (Boot-managed)
    replacement_version: 9.4.2 (Boot 4.1 managed)
    followup: >-
      Port RestHighLevelClient calls (SearchRequest / SearchSourceBuilder / QueryBuilders) to ElasticsearchClient
      builders; short-term fallback: pin 7.17.29 explicitly (compiles; cluster compatibility is the owners' call).
    title_ko: "Elasticsearch RestHighLevelClient는 지원이 종료되었고(마지막 7.17.29) Spring Boot 4 BOM에 없습니다"
    summary_ko: >-
      7.17.29 이후 HLRC 릴리스가 없고, Spring Boot 4.1 BOM에는 대신 `co.elastic.clients:elasticsearch-java` 9.4.2가
      있습니다. 그래서 부모 pom을 바꾸면 이 의존성은 버전이 없어지거나("dependencies.dependency.version is missing"), 버전을 직접 적으면
      `org.elasticsearch:elasticsearch` 7.x가 classpath에 함께 들어옵니다. Spring Data Elasticsearch 6.1은 Java
      API client를 씁니다.
    followup_ko: >-
      `RestHighLevelClient` 호출(`SearchRequest` / `SearchSourceBuilder` / `QueryBuilders`)을
      `ElasticsearchClient` 빌더로 옮겨 주세요. 당장은 7.17.29를 pom에 직접 적어 두는 방법도 있습니다(컴파일은 되며, 클러스터 호환성은 담당 팀이
      판단해 주세요).
    replacement_ko: "`co.elastic.clients:elasticsearch-java`(Spring Boot BOM에 버전 있음)"
    docs:
      - https://www.elastic.co/guide/en/elasticsearch/client/java-api-client/current/migrate-hlrc.html
      - https://repo1.maven.org/maven2/co/elastic/clients/elasticsearch-java/

  - id: solr-legacy
