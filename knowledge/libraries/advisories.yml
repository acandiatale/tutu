# Library advisories — EOL / no-longer-managed / runtime-incompatible libraries that still COMPILE after the
# migration and would otherwise leave the run looking green. Read by sbmig/advisory (docs/ADVISORIES.md).
#
# Policies (there is NO "block" on purpose — 500 projects cannot all be perfect; the build goes as far as it can
# and the owners get a compressed handover):
#   guide  : build, then tell the owning team in the report's Handover section + manual follow-ups + ledger
#   recipe : additionally run the listed OpenRewrite recipe(s) in spring.rewrite (ids must exist in
#            knowledge/recipes/catalog.yml); falls back to guide when unavailable
#
# Schema (version 1): see LibraryAdvisory in sbmig/core/models.py — id, library (analyzer rule name) and/or
# artifacts (g:a globs), status (eol|unmanaged|incompatible|superseded), title, summary, replacement,
# replacement_version, policy, recipes, followup, docs, applies_to, applies_when_version_below,
# resolved_min_version, notes.
#
# Company additions / overrides: advisories.extra_files (same schema, merged by id, later wins),
# advisories.policy_overrides {id: guide|recipe|off}.
version: 1
advisories:
  # ------------------------------------------------------------------ API docs
  - id: springfox
    library: springfox
    artifacts: ["io.swagger:swagger-annotations"]
    status: eol
    title: Springfox (Swagger 2) is discontinued
    summary: >-
      Springfox has had no release since 3.0.0 (2020) and does not work with Spring Framework 6+/7 at runtime
      (path matching, jakarta). springdoc-openapi is the maintained replacement.
    replacement: org.springdoc:springdoc-openapi-starter-webmvc-ui
    replacement_version: "3.x (Boot 4)"
    policy: recipe
    recipes:
      - org.openrewrite.java.springdoc.SpringFoxToSpringDoc
      - org.openrewrite.java.springdoc.UpgradeSpringDoc_3_0
    followup: >-
      Review the generated GroupedOpenApi beans and the TODO comments the recipe left on complex Docket code,
      then check /swagger-ui/index.html and /v3/api-docs (springdoc.* properties replace springfox.*).
    docs:
      - https://springdoc.org/#migrating-from-springfox
      - https://docs.openrewrite.org/recipes/java/springdoc/springfoxtospringdoc
    notes: knowledge/notes/spring-cloud.md

  # ------------------------------------------------------------------ Spring Cloud Netflix / Sleuth
  - id: sleuth
    library: sleuth
    status: eol
    title: Spring Cloud Sleuth is discontinued (Micrometer Tracing replaces it)
    summary: >-
      Sleuth ended with Spring Cloud 2021.0.x; Boot 3+/4 trace through Micrometer Tracing (Brave or OpenTelemetry
      bridge), which the Boot BOM manages.
    replacement: io.micrometer:micrometer-tracing-bridge-brave
    replacement_version: managed by the Boot 4 BOM
    policy: recipe
    recipes:
      - org.openrewrite.java.spring.cloud2022.MigrateCloudSleuthToMicrometerTracing
    followup: >-
      Remove the explicit micrometer-tracing 1.0.x version if the recipe left one (the Boot BOM manages it), then
      check management.tracing.sampling.probability, the exporter (zipkin/otlp) and the traceId/spanId log pattern.
    docs:
      - https://github.com/micrometer-metrics/tracing/wiki/Spring-Cloud-Sleuth-3.1-Migration-Guide
      - https://docs.spring.io/spring-boot/reference/actuator/tracing.html
    notes: knowledge/notes/spring-cloud.md

  - id: hystrix
    library: hystrix
    status: eol
    title: Netflix Hystrix is discontinued (not in any current Spring Cloud train)
    summary: >-
      Hystrix is in maintenance-only mode since 2018 and was removed from Spring Cloud 2020.0. It may still compile
      against the pinned 2.2.x starter, but it is unsupported on Boot 3+/4. The project recipe swaps the starter for
      spring-cloud-starter-circuitbreaker-resilience4j and @HystrixCommand for Resilience4j @CircuitBreaker (name from
      commandKey, else "default"; fallbackMethod kept; Hystrix-only attributes and @EnableHystrix/@EnableCircuitBreaker
      dropped).
    replacement: org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j
    replacement_version: managed by the Spring Cloud BOM
    policy: recipe
    recipes:
      - com.company.migrate.HystrixToResilience4j
    followup: >-
      Configure the circuit breakers by name (instance "default" unless a commandKey existed:
      resilience4j.circuitbreaker.instances.<name> or configs.default), move hystrix.command.* timeouts to
      resilience4j.timelimiter.*, give every fallback method a trailing Throwable parameter (Resilience4j does not find
      fallbacks without it) and re-test failure paths: thread-pool isolation, groupKey/threadPoolKey,
      commandProperties and ignoreExceptions were removed, and the @CircuitBreaker aspect needs
      spring-boot-starter-aspectj at runtime. HystrixCommand subclasses are rewritten by the LLM in the build-fix
      loop with Resilience4j guidance (the Handover lists those files — review them); dashboards/Turbine stay manual.
    docs:
      - https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker-resilience4j.html
      - https://resilience4j.readme.io/docs/getting-started-3
    notes: knowledge/notes/spring-cloud.md

  - id: ribbon
    library: ribbon
    status: eol
    title: Netflix Ribbon is discontinued (Spring Cloud LoadBalancer replaces it)
    summary: Ribbon was removed from Spring Cloud 2020.0; client-side load balancing is Spring Cloud LoadBalancer.
    replacement: org.springframework.cloud:spring-cloud-starter-loadbalancer
    replacement_version: managed by the Spring Cloud BOM
    policy: guide
    followup: >-
      Replace the Ribbon starter with spring-cloud-starter-loadbalancer, delete IRule/IPing beans and
      <client>.ribbon.* properties, and configure spring.cloud.loadbalancer.* (or a ServiceInstanceListSupplier).
    docs:
      - https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/loadbalancer.html
    notes: knowledge/notes/spring-cloud.md

  - id: zuul
    library: zuul
    status: eol
    title: Netflix Zuul 1 is discontinued (Spring Cloud Gateway replaces it)
    summary: Zuul 1 was removed from Spring Cloud 2020.0 and does not run on jakarta servlets.
    replacement: org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc
    replacement_version: managed by the Spring Cloud BOM
    policy: guide
    followup: >-
      Rebuild the zuul.routes.* as Spring Cloud Gateway (server-webmvc) routes and port ZuulFilter subclasses to
      gateway filter functions; test every route, header and timeout.
    docs:
      - https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webmvc.html
    notes: knowledge/notes/spring-cloud.md

  - id: netflix-feign
    library: netflix-feign
    status: eol
    title: Netflix Feign / spring-cloud-starter-feign are discontinued (OpenFeign replaces them)
    summary: >-
      com.netflix.feign stopped at 8.18 (2016) and spring-cloud-starter-feign was renamed to
      spring-cloud-starter-openfeign. The Boot umbrella recipe renames the starter; com.netflix.feign code stays.
    replacement: org.springframework.cloud:spring-cloud-starter-openfeign
    replacement_version: managed by the Spring Cloud BOM
    policy: guide
    followup: >-
      Move com.netflix.feign imports to io.github.openfeign (feign.*) and use
      org.springframework.cloud.openfeign.@FeignClient/@EnableFeignClients; check the starter rename in the pom.
    docs:
      - https://docs.spring.io/spring-cloud-openfeign/reference/
    notes: knowledge/notes/spring-cloud.md

  - id: spring-cloud-bom
    library: spring-cloud-bom
    status: superseded
    title: Spring Cloud release train older than the Boot 4 train
    summary: >-
      The spring-cloud-dependencies BOM (or spring-cloud-starter-parent) pins a train built for an older Boot line.
      Spring Cloud 2025.1 is the Boot 4.0 train.
    replacement: org.springframework.cloud:spring-cloud-dependencies
    replacement_version: "2025.1.x"
    policy: recipe
    recipes:
      - org.openrewrite.java.spring.cloud2025.UpgradeSpringCloud_2025_1
    applies_when_version_below: "2025.1"
    resolved_min_version: "2025.1"
    followup: >-
      Verify the Spring Cloud train matches the Boot line (2025.1.x is the Boot 4.0 train — check the Spring Cloud
      compatibility matrix for Boot 4.1) and that every org.springframework.cloud:* dependency is BOM-managed.
    docs:
      - https://spring.io/projects/spring-cloud#overview
      - https://github.com/spring-cloud/spring-cloud-release/wiki/Supported-Versions
    notes: knowledge/notes/spring-cloud.md

  # ------------------------------------------------------------------ security
  - id: spring-security-oauth2-legacy
    library: spring-security-oauth2-legacy
    status: eol
    title: Spring Security OAuth (spring-security-oauth2 / oauth2-autoconfigure) is discontinued
    summary: >-
      The legacy org.springframework.security.oauth project reached end of life in 2022 and does not work with
      Spring Security 6/7. Client and resource-server support live in Spring Security itself; authorization servers
      move to Spring Authorization Server.
    replacement: org.springframework.boot:spring-boot-starter-oauth2-resource-server (or -oauth2-client)
    replacement_version: managed by the Boot 4 BOM (authorization servers → spring-boot-starter-oauth2-authorization-server)
    policy: guide
    followup: >-
      Replace @EnableResourceServer/@EnableOAuth2Sso/@EnableAuthorizationServer and OAuth2RestTemplate with
      http.oauth2ResourceServer()/oauth2Login() and WebClient/RestClient OAuth2 support; re-test token validation.
    docs:
      - https://github.com/spring-projects/spring-security/wiki/OAuth-2.0-Migration-Guide
      - https://docs.spring.io/spring-authorization-server/reference/
    notes: knowledge/notes/spring-security-7.md

  # ------------------------------------------------------------------ logging / commons / http
  - id: log4j1
    library: log4j1
    status: eol
    title: Log4j 1.x is end of life (since 2015, unpatched CVEs)
    summary: log4j:log4j 1.2.x is EOL and has known vulnerabilities; Boot logs through Logback (or Log4j 2).
    replacement: ch.qos.logback:logback-classic (Boot default; or log4j-core 2.x)
    replacement_version: managed by the Boot 4 BOM
    policy: guide
    followup: >-
      Remove log4j:log4j, log through SLF4J (org.slf4j.Logger), convert log4j.properties/xml to logback-spring.xml
      (or add log4j-1.2-api only as a temporary bridge).
    docs:
      - https://logging.apache.org/log4j/2.x/migrate-from-log4j1.html
    notes: knowledge/notes/boot2-to-3.md

  - id: commons-lang2
    library: commons-lang2
    status: eol
    title: Apache Commons Lang 2.x is end of life
    summary: commons-lang:commons-lang 2.6 (2011) is unmaintained; Commons Lang 3 is the supported line.
    replacement: org.apache.commons:commons-lang3
    replacement_version: "3.x"
    policy: guide
    followup: >-
      Replace org.apache.commons.lang.* imports with org.apache.commons.lang3.* (StringEscapeUtils moved to
      commons-text) and drop commons-lang:commons-lang.
    docs:
      - https://commons.apache.org/proper/commons-lang/article3_0.html

  # round 10: Spring cases run UpgradeApacheHttpClient_5 anyway (UpgradeSpringFramework_6_0, reached by the Framework 7
  # recipe and the Boot umbrella; rewrite-apache 2.30.0) → policy recipe, the Handover reports what was migrated.
  # Plain Java / servlet projects keep the 4.5.x client (it still compiles, carried-over version) → httpclient4-direct.
  - id: httpclient4
    library: httpclient4
    applies_to: [spring_legacy, spring_boot, msa]
    status: superseded
    title: Apache HttpClient 4.x is superseded by HttpClient 5 (Boot 4 RestTemplate/RestClient use 5)
    summary: >-
      Spring Framework 6+/7 HttpComponentsClientHttpRequestFactory only supports HttpClient 5; 4.5.x keeps working
      only for direct use and is no longer managed by the Boot BOM. The Spring Framework 6.0 recipe chain runs
      UpgradeApacheHttpClient_5 (dependencies, org.apache.http → org.apache.hc.client5 / hc.core5 class mapping,
      deprecated methods, TimeUnit timeouts); what it cannot map is ported in the build-fix loop.
    replacement: org.apache.httpcomponents.client5:httpclient5
    replacement_version: managed by the Boot 4 BOM
    policy: recipe
    recipes:
      - org.openrewrite.apache.httpclient5.UpgradeApacheHttpClient_5
    followup: >-
      Re-test the migrated HTTP client code: timeouts (TimeUnit / Timeout), connection pooling
      (PoolingHttpClientConnectionManagerBuilder), TLS / SSLContext setup and retry handling; drop any explicit
      httpclient 4.x version left in the poms.
    docs:
      - https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/
      - https://docs.openrewrite.org/recipes/apache/httpclient5/upgradeapachehttpclient_5

  - id: httpclient4-direct
    library: httpclient4
    applies_to: [pure_java, servlet_tomcat, unknown]
    status: superseded
    title: Apache HttpClient 4.x is superseded by HttpClient 5 (no Spring recipe chain migrates it here)
    summary: >-
      4.5.x keeps working for direct use but is no longer managed by the Boot BOM (the as-is version is carried
      over). Non-Spring projects get no automatic HttpClient 5 migration.
    replacement: org.apache.httpcomponents.client5:httpclient5
    replacement_version: managed by the Boot 4 BOM
    policy: guide
    followup: >-
      Move org.apache.http.* client code to org.apache.hc.client5/hc.core5 (or RestClient), drop the explicit
      httpclient 4.x version and re-test timeouts, connection pooling and TLS settings.
    docs:
      - https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/

  # ------------------------------------------------------------------ servlet containers (round 10)
  - id: undertow
    library: undertow
    status: incompatible
    title: Undertow is not supported by Spring Boot 4 (spring-boot-starter-undertow is gone)
    summary: >-
      spring-boot-starter-undertow ends at 4.0.0-M1 on Maven Central and the spring-boot-dependencies 4.1.0 BOM manages
      neither the starter nor io.undertow. The handler dependency-relocation swaps the starter for
      spring-boot-starter-tomcat (Boot's default container) when the build names it; code against io.undertow.* or
      Boot's Undertow customizers (UndertowServletWebServerFactory, UndertowBuilderCustomizer …) no longer compiles.
    replacement: org.springframework.boot:spring-boot-starter-tomcat (or spring-boot-starter-jetty)
    replacement_version: managed by the Boot 4 BOM
    policy: guide
    followup: >-
      Remove the Undertow customizer beans, move server.undertow.* properties to server.tomcat.* (threads, max
      connections, access log) and re-test HTTP/2, WebSocket and buffer settings under Tomcat; exclusions of
      spring-boot-starter-tomcat on the web starter can go.
    docs:
      - https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
      - https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-starter-undertow/
    notes: knowledge/notes/boot3-to-4.md

  # ------------------------------------------------------------------ JDK-internal / removed JDK APIs (pre-Java-8 code)
  - id: jdk-removed-apis
    library: jdk-removed-apis
    status: incompatible
    title: JDK-internal or removed JDK APIs (sun.misc, sun.security, com.sun.image, javax.activation)
    summary: >-
      The as-is code imports JDK-internal packages or Java EE modules that JDK 11 removed (JEP 320) or JDK 17
      encapsulated (JEP 403). javac 21 with --release 21 does not see them. UpgradeToJava21 (Java8toJava11) adds the
      JAXB / JAX-WS / common-annotations dependencies and rewrites what it can resolve (UseJavaUtilBase64,
      RenameUnderscoreIdentifier, Thread.stop/destroy); code whose types no longer resolve on JDK 21 is ported by the
      LLM in the build-fix loop with this guidance — except sun.misc.BASE64Encoder / BASE64Decoder and
      com.sun.org.apache.xerces.internal.impl.dv.util.Base64, which the handler jdk-base64-shim (round 10) points at
      generated drop-in classes (sbmig.compat.*, same output as the JDK 8 originals, call sites unchanged).
    replacement: java.util.Base64 / javax.imageio / java.security, jakarta.* API jars (JDK replacements)
    replacement_version: JDK 21 (jakarta.xml.bind-api, jakarta.annotation-api, jakarta.activation-api are Boot-managed)
    policy: guide
    followup: >-
      Review the ported JDK API calls: sun.misc.BASE64Encoder/Decoder (now the generated sbmig.compat shims, which
      keep the 76-character line breaks) → java.util.Base64 when convenient (MIME line breaks:
      Base64.getMimeEncoder()); sun.misc.Unsafe still compiles (jdk.unsupported) — keep it, but plan VarHandle / FFM;
      JAXB needs jakarta.xml.bind:jakarta.xml.bind-api plus runtime org.glassfish.jaxb:jaxb-runtime (Boot 4 manages
      both); javax.annotation.* → jakarta.annotation:jakarta.annotation-api; javax.activation →
      jakarta.activation-api; `_` is no longer an identifier (renamed); Thread.stop/suspend/resume throw
      UnsupportedOperationException — use interrupt-based cancellation; com.sun.image.codec.jpeg → javax.imageio.ImageIO.
    docs:
      - https://openjdk.org/jeps/320
      - https://openjdk.org/jeps/403
      - https://docs.openrewrite.org/recipes/java/migrate/java8tojava11
    notes: knowledge/notes/jdk21.md

  # ------------------------------------------------------------------ persistence (Korean legacy Spring 2/3 apps)
  - id: ibatis2
    library: ibatis2
    status: incompatible
    title: iBATIS 2 (SqlMapClient) — Spring 4+ removed org.springframework.orm.ibatis
    summary: >-
      Spring 3.2 was the last line with org.springframework.orm.ibatis. iBATIS 2 itself is retired since 2010; its
      artifacts stay on Maven Central, so the jar still resolves, but every SqlMapClientDaoSupport /
      SqlMapClientTemplate / SqlMapClientFactoryBean reference fails to compile after the Spring 7 upgrade. No
      OpenRewrite recipe ports it; the build-fix loop ports the DAOs with this guidance.
    replacement: org.mybatis:mybatis + org.mybatis:mybatis-spring
    replacement_version: mybatis 3.5.19 + mybatis-spring 4.1.0 (Spring 7 line; mybatis-spring-boot-starter 4.1.0 on Boot)
    policy: guide
    followup: >-
      Review every ported DAO: SqlMapClient / SqlMapClientTemplate → SqlSessionTemplate or mapper interfaces;
      sqlmap XML → MyBatis mapper XML (#name# → #{name}, $name$ → ${name}, queryForList / queryForObject / insert /
      update / delete → selectList / selectOne / insert / update / delete, <sqlMapConfig> → <configuration>);
      result maps and dynamic SQL tags (<isNotEmpty>, <iterate>, <dynamic> → <if>, <foreach>, <where>) differ —
      a mechanical but manual port per DAO; re-test every statement against the database and drop the iBATIS jars.
    docs:
      - https://mybatis.org/mybatis-3/
      - https://mybatis.org/spring/
    notes: knowledge/notes/ibatis2.md

  # ------------------------------------------------------------------ JDK 9 generified APIs (pre-Java-9 Swing tree code)
  - id: jdk-generified-apis
    library: jdk-generified-apis
    status: incompatible
    title: JDK 9 generified javax.swing.tree (children() returns Enumeration<TreeNode>)
    summary: >-
      JDK 9 generified javax.swing.tree: DefaultMutableTreeNode.children() / preorderEnumeration() /
      depthFirstEnumeration() / breadthFirstEnumeration() / pathFromAncestorEnumeration() return
      Enumeration<TreeNode> (TreeNode.children() too). Pre-Java-9 code that assigned them to a raw Enumeration or to
      Enumeration<DefaultMutableTreeNode> fails on javac 21 with "incompatible types: inference variable T has
      incompatible equality constraints" or "incompatible types: Enumeration<TreeNode> cannot be converted". The
      fix is a source change the build-fix loop makes with this guidance; no dependency is involved.
    replacement: Enumeration<TreeNode> / Enumeration<? extends TreeNode> with a cast per element (JDK API)
    replacement_version: JDK 9+
    policy: guide
    followup: >-
      Review the ported tree code: Enumeration<DefaultMutableTreeNode> e = node.children() →
      Enumeration<TreeNode> e = node.children() and cast each element ((DefaultMutableTreeNode) e.nextElement()),
      or iterate node.children().asIterator(); Collections.list(node.children()) is a List<TreeNode> now.
    docs:
      - https://docs.oracle.com/en/java/javase/21/docs/api/java.desktop/javax/swing/tree/DefaultMutableTreeNode.html
    notes: knowledge/notes/jdk21.md

  # ------------------------------------------------------------------ Hibernate Commons Annotations (gone in ORM 7)
  - id: hibernate-commons-annotations
    library: hibernate-commons-annotations
    status: incompatible
    title: hibernate-commons-annotations (org.hibernate.annotations.common.*) is gone from Hibernate ORM 7 / Boot 4
    summary: >-
      Hibernate ORM 3.x–6.x pulled org.hibernate.common:hibernate-commons-annotations (HCANN) in transitively, so
      project code could import org.hibernate.annotations.common.* (typically LoggerFactory / Log from ...util.impl,
      or the XClass / ReflectionManager reflection API) without declaring the jar. Hibernate ORM 7.0 — every
      Spring Boot 4.x line — dropped it (hibernate-models replaced it internally): "package
      org.hibernate.annotations.common.util.impl does not exist" at compile time, typically only in the final
      package build of a company run. No OpenRewrite recipe; the build-fix loop ports the usages with this guidance.
    replacement: org.jboss.logging.Logger.getLogger(Foo.class) for LoggerFactory / Log (or SLF4J); java.lang.reflect for XClass / ReflectionManager
    replacement_version: jboss-logging via hibernate-core 7.x (Boot-managed); HCANN 7.0.3.Final only as an explicit EOL fallback
    policy: guide
    followup: >-
      Review the ported logger / reflection code (jboss-logging Logger keeps the BasicLogger calls, SLF4J needs
      format changes for infof / debugv); if a module still declares org.hibernate.common:hibernate-commons-annotations
      7.0.3.Final explicitly (EOL, not managed by Boot 4), plan its removal.
    docs:
      - https://docs.jboss.org/hibernate/orm/7.0/migration-guide/migration-guide.html
      - https://repo1.maven.org/maven2/org/hibernate/common/hibernate-commons-annotations/
    notes: knowledge/notes/hibernate-7.md

  # ==================================================================================================================
  # 2026-10-22 era libraries (2013–2020 Korean enterprise Maven projects; web-verified research: Maven Central
  # listings, jar bytecode, the Spring Boot 4.1.0 BOM, the pinned recipe jars). Same-coordinate jakarta releases live in
  # knowledge/libraries/jakarta_libraries.yml, plain coordinate moves in sbmig/triage/handlers/relocations.yml; these
  # are the ones that need source / configuration work by the owning team. Fix-loop guidance:
  # knowledge/notes/era-libraries.md (`## fix-loop: <library>`). docs/ADVISORIES.md "2026-10-22 era libraries".
  # ==================================================================================================================
  # ------------------------------------------------------------------ view layers / web
  - id: tiles
    library: tiles
    status: eol
    title: Apache Tiles is retired and Spring Framework 6+ has no Tiles view support
    summary: >-
      Last release 3.0.8 (2017); the project is in the Apache Attic and javax.servlet-only. Spring 6.0 removed
      org.springframework.web.servlet.view.tiles3 (TilesConfigurer, TilesViewResolver, TilesView; Spring 5.0 already
      dropped tiles2): Java config naming TilesConfigurer fails to compile, XML config fails at startup.
    replacement: Thymeleaf + thymeleaf-layout-dialect (Boot-managed), SiteMesh 3 (org.sitemesh:sitemesh) or JSP includes
    replacement_version: thymeleaf-layout-dialect 4.0.1 (Boot 4.1 managed) / org.sitemesh:sitemesh 3.3.0
    policy: guide
    followup: >-
      Replace the Tiles definitions (tiles*.xml) with layout templates (Thymeleaf layout:decorate or SiteMesh 3
      decorators), remove the TilesConfigurer / TilesViewResolver beans; JSPs can keep <jsp:include> fragments.
    docs:
      - https://attic.apache.org/projects/tiles.html
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-6.0-Release-Notes
      - https://repo1.maven.org/maven2/org/apache/tiles/tiles-core/
    notes: knowledge/notes/era-libraries.md

  - id: velocity
    library: velocity
    status: incompatible
    title: Spring 5+ dropped Velocity support; velocity-tools-view has no Jakarta build
    summary: >-
      Spring 5.0 removed VelocityConfigurer, VelocityViewResolver, VelocityLayoutViewResolver and
      org.springframework.ui.velocity.VelocityEngineUtils (common for mail templates). org.apache.velocity:velocity
      stops at 1.7 (2010); the engine continues as velocity-engine-core 2.4.1 (no servlet dependency);
      velocity-tools-view 3.1 is javax.servlet with no Jakarta release.
    replacement: Thymeleaf or FreeMarker for web views; org.apache.velocity:velocity-engine-core for non-web templating
    replacement_version: velocity-engine-core 2.4.1 / velocity-tools-generic 3.1
    policy: guide
    followup: >-
      Port .vm web views to Thymeleaf / FreeMarker; for mail / text templates switch to velocity-engine-core 2.4.1 and
      replace VelocityEngineUtils.mergeTemplateIntoString(...) with engine.getTemplate(name, encoding).merge(...);
      retest template loading (Velocity 2 renamed configuration keys such as resource.loader).
    docs:
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-5.0-Release-Notes
      - https://repo1.maven.org/maven2/org/apache/velocity/velocity-engine-core/
      - https://velocity.apache.org/engine/2.4/upgrading.html
    notes: knowledge/notes/era-libraries.md

  - id: thymeleaf-legacy
    artifacts: ["org.thymeleaf:thymeleaf-spring3", "org.thymeleaf:thymeleaf-spring4",
                "org.thymeleaf.extras:thymeleaf-extras-springsecurity4", "net.sourceforge.nekohtml:nekohtml",
                "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect"]
    status: superseded
    title: Thymeleaf 2.x / thymeleaf-spring4 / Layout Dialect 1.x-2.x need the Thymeleaf 3.1 + spring6 line
    summary: >-
      Boot 4.1 manages thymeleaf, thymeleaf-spring6, thymeleaf-extras-springsecurity6 (3.1.5.RELEASE) and
      thymeleaf-layout-dialect 4.0.1. The pinned recipe MigrateThymeleafDependencies covers only spring5 → spring6;
      thymeleaf-spring4 / extras-springsecurity4 keep their org.thymeleaf.spring4 imports. Thymeleaf 2.x templates
      (LEGACYHTML5 / nekohtml) and custom dialects need the 3.x API; Layout Dialect 3.0 removed layout:decorator and
      moved its package to nz.net.ultraq.thymeleaf.layoutdialect. Thymeleaf 3.1 removed #request / #session /
      #servletContext expression objects (runtime).
    replacement: org.thymeleaf:thymeleaf-spring6 / thymeleaf-extras-springsecurity6 / thymeleaf-layout-dialect (Boot-managed)
    replacement_version: 3.1.5.RELEASE / layout dialect 4.0.1 (Boot 4.1 managed)
    policy: guide
    followup: >-
      Swap thymeleaf-spring4 → thymeleaf-spring6 (imports org.thymeleaf.spring4 → org.thymeleaf.spring6), drop
      spring.thymeleaf.mode=LEGACYHTML5 and nekohtml, replace layout:decorator="x" with layout:decorate="~{x}", fix the
      LayoutDialect import (or delete the bean — Boot configures it) and move ${#request…} / ${#session…} values into
      the model.
    docs:
      - https://www.thymeleaf.org/doc/articles/thymeleaf31whatsnew.html
      - https://www.thymeleaf.org/doc/articles/thymeleaf3migration.html
      - https://ultraq.github.io/thymeleaf-layout-dialect/migrating-to-3.0/
      - https://ultraq.github.io/thymeleaf-layout-dialect/migrating-to-4.0/

  - id: commons-fileupload
    library: commons-fileupload
    status: incompatible
    title: CommonsMultipartResolver is gone (Spring 6) and FileUpload 2 Jakarta is a milestone with new packages
    summary: >-
      Spring 6.0 removed org.springframework.web.multipart.commons.CommonsMultipartResolver (only
      StandardServletMultipartResolver remains); commons-fileupload 1.x is javax only. The pinned recipe
      FileuploadToFileUpload2 (inside JavaxMigrationToJakarta) swaps the dependency to commons-fileupload2-jakarta
      2.0.0-M4, but its package renames are misspelled `org.apache.commons.fileload…`, so the
      org.apache.commons.fileupload.* imports stay and fail to compile ("package org.apache.commons.fileupload does not
      exist"); FileUpload 2 (packages org.apache.commons.fileupload2.core / .jakarta.servlet6) has milestones only.
    replacement: StandardServletMultipartResolver / Boot multipart (spring.servlet.multipart.*) with MultipartFile; or org.apache.commons:commons-fileupload2-jakarta-servlet6
    replacement_version: commons-fileupload2-jakarta-servlet6 2.0.0-M5 (milestone)
    policy: guide
    followup: >-
      Delete the CommonsMultipartResolver bean and move maxUploadSize / maxInMemorySize to
      spring.servlet.multipart.max-file-size / max-request-size / file-size-threshold; port direct ServletFileUpload
      code to MultipartFile / Part, or accept the FileUpload 2 milestone (JakartaServletFileUpload,
      DiskFileItemFactory.builder().get()).
    docs:
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-6.0-Release-Notes
      - https://docs.openrewrite.org/recipes/java/migrate/jakarta/fileuploadtofileupload2
      - https://repo1.maven.org/maven2/org/apache/commons/commons-fileupload2-jakarta-servlet6/
