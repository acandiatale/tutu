  # ------------------------------------------------------------------ security
  - id: shiro-legacy
    artifacts: ["org.apache.shiro:*"]
    applies_when_version_below: "3.0.0"
    status: eol
    title: Apache Shiro 1.x / 2.x are EOL; 3.0.1 is Jakarta-only (and the pinned recipe adds a classifier 3.x lacks)
    summary: >-
      Shiro 1.x is javax only; 2.0–2.2 publish an extra `jakarta` classifier jar; 3.0.0 / 3.0.1 (2026) are
      Jakarta-only main jars without classifier jars, built on Spring 7.0.8 / Boot 4.1.0 (JDK 17), and the Shiro team
      declares 1.x / 2.x EOL. The pinned recipe UpdateApacheShiroDependencies (JakartaEE10) sets org.apache.shiro:* to
      2.0.x WITH classifier jakarta and renames org.apache.shiro.codec / util.ByteSource / StringUtils to
      org.apache.shiro.lang.*. Moving on to 3.0.1 requires removing that classifier (a 3.0.1-jakarta jar does not
      exist → resolution failure) — which is why Shiro is not in jakarta_libraries.yml.
    replacement: org.apache.shiro:shiro-* 3.0.1 (no classifier)
    replacement_version: 3.0.1
    policy: guide
    followup: >-
      Either stay on what the recipe leaves (2.0.x + classifier jakarta, EOL) or move every org.apache.shiro:* to
      3.0.1 and delete the <classifier>jakarta</classifier>; then check the 3.0 breaking changes (immutable default
      PrincipalCollection, case-insensitive path matching).
    docs:
      - https://shiro.apache.org/blog/2026/06/apache-shiro-300-released.html
      - https://shiro.apache.org/migration-guide.html
      - https://repo1.maven.org/maven2/org/apache/shiro/shiro-web/

  # ------------------------------------------------------------------ persistence / ORM
  - id: hibernate-template
    library: hibernate-template
    status: incompatible
    title: Spring 7 moved org.springframework.orm.hibernate5 to orm.jpa.hibernate and dropped HibernateTemplate / HibernateDaoSupport
    summary: >-
      Spring Framework 7.0 moved the native Hibernate support to org.springframework.orm.jpa.hibernate and kept only
      LocalSessionFactoryBean / LocalSessionFactoryBuilder, HibernateTransactionManager, SpringBeanContainer and
      SpringSessionContext. HibernateTemplate, HibernateCallback, HibernateDaoSupport and the orm.hibernate3 / 4
      packages are gone (spring-orm 7.0.8 jar checked): typical Spring 3/4 DAOs fail with "package
      org.springframework.orm.hibernate5 does not exist" / "cannot find symbol HibernateTemplate". No pinned recipe.
    replacement: org.springframework.orm.jpa.hibernate.LocalSessionFactoryBean / HibernateTransactionManager + SessionFactory.getCurrentSession() (or JPA EntityManager)
    replacement_version: spring-orm 7.0.x (Boot-managed)
    policy: guide
    followup: >-
      Review the ported DAOs: imports org.springframework.orm.hibernate5.{LocalSessionFactoryBean,
      HibernateTransactionManager, SpringSessionContext} (and hibernate3 / 4) → org.springframework.orm.jpa.hibernate.*,
      also in Spring XML class="…"; HibernateTemplate / HibernateDaoSupport DAOs → an injected SessionFactory with
      getCurrentSession() (Hibernate 7 Query API, knowledge/notes/hibernate-7.md); re-test transactions.
    docs:
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-7.0-Release-Notes
      - https://repo1.maven.org/maven2/org/springframework/spring-orm/7.0.8/
    notes: knowledge/notes/era-libraries.md

  - id: hibernate-entitymanager
    artifacts: ["org.hibernate:hibernate-entitymanager"]
    status: superseded
    title: hibernate-entitymanager was merged into hibernate-core (last release 5.6.15.Final)
    summary: >-
      No Final after 5.6.15.Final; since 5.2 it is an empty shell depending on hibernate-core 5.x
      (javax.persistence), so leaving it in a Boot 4 pom pulls hibernate-core 5.x next to 7.x.
    replacement: remove it — org.hibernate.orm:hibernate-core (Boot-managed, via spring-boot-starter-data-jpa)
    replacement_version: 7.4.1.Final (Boot 4.1 managed)
    policy: guide
    followup: Remove the hibernate-entitymanager dependency (no new coordinates) and check dependency:tree for a leftover hibernate-core 5.x.
    docs:
      - https://repo1.maven.org/maven2/org/hibernate/hibernate-entitymanager/

  - id: hibernate-ehcache
    artifacts: ["org.hibernate:hibernate-ehcache"]
    status: eol
    title: hibernate-ehcache (Ehcache 2 region factory) ended with Hibernate 5.6
    summary: >-
      No Final release after 5.6.15.Final. Hibernate 6 / 7 cache second-level data through JCache only
      (org.hibernate.orm:hibernate-jcache, Boot-managed) with a provider such as org.ehcache:ehcache (classifier
      jakarta); hibernate.cache.region.factory_class=…EhCacheRegionFactory and the Ehcache 2 ehcache.xml must change.
    replacement: org.hibernate.orm:hibernate-jcache + org.ehcache:ehcache (classifier jakarta)
    replacement_version: 7.4.1.Final + 3.12.0 (both Boot 4.1 managed)
    policy: guide
    followup: >-
      Set hibernate.cache.region.factory_class=jcache, hibernate.javax.cache.provider=
      org.ehcache.jsr107.EhcacheCachingProvider and convert ehcache.xml to the Ehcache 3 schema (runtime only).
    docs:
      - https://repo1.maven.org/maven2/org/hibernate/hibernate-ehcache/
      - https://repo1.maven.org/maven2/org/hibernate/orm/hibernate-jcache/

  - id: hypersistence-utils
    artifacts: ["com.vladmihalcea:hibernate-types-*", "io.hypersistence:hypersistence-utils-hibernate-5*",
                "io.hypersistence:hypersistence-utils-hibernate-6*", "io.hypersistence:hypersistence-utils-hibernate-70",
                "io.hypersistence:hypersistence-utils-hibernate-71"]
    status: superseded
    title: hibernate-types (com.vladmihalcea) ended at 2.21.1; Hibernate 7.3 / 7.4 need hypersistence-utils-hibernate-73
    summary: >-
      com.vladmihalcea:hibernate-types-* stopped at 2.21.1 (2022) and covers Hibernate 5.x / 6.0 only. The successor
      publishes one artifact per Hibernate line: -73 = Hibernate 7.3 / 7.4 (Boot 4.1 = 7.4.1), -71 = 7.1 / 7.2, -70 =
      7.0, -6x = Hibernate 6 (no -72 / -74). Packages moved to io.hypersistence.utils.hibernate.type.*; with Hibernate
      6+ @TypeDef is gone (use @Type(JsonType.class)).
    replacement: io.hypersistence:hypersistence-utils-hibernate-73
    replacement_version: 3.16.0
    policy: guide
    followup: >-
      Swap the dependency, change imports com.vladmihalcea.hibernate.type.* → io.hypersistence.utils.hibernate.type.*,
      replace @TypeDef / @Type(type="jsonb") by @Type(JsonBinaryType.class) or @JdbcTypeCode(SqlTypes.JSON).
    docs:
      - https://github.com/vladmihalcea/hypersistence-utils
      - https://repo1.maven.org/maven2/io/hypersistence/hypersistence-utils-hibernate-73/

  - id: hibernate-search-legacy
    artifacts: ["org.hibernate:hibernate-search-orm", "org.hibernate.search:hibernate-search-mapper-orm*",
                "org.hibernate.search:hibernate-search-backend-*"]
    applies_when_version_below: "8.4.0"
    status: incompatible
    title: Hibernate Search 5 / 6 → 8.4 for Hibernate ORM 7.4 (new API, new coordinates, reindex)
    summary: >-
      Search 5 (org.hibernate:hibernate-search-orm, last 5.11.12.Final, javax, Lucene 5) has no Jakarta build; its API
      (FullTextEntityManager, QueryBuilder, @Field / @Indexed) was replaced in Search 6
      (org.hibernate.search:hibernate-search-mapper-orm, @FullTextField, SearchSession). Hibernate Search 8.4 is the
      line for ORM 7.4 (8.3 = 7.3, 8.2 = 7.2); the index format changes → full reindex. No recipe.
    replacement: org.hibernate.search:hibernate-search-mapper-orm + hibernate-search-backend-lucene (or -backend-elasticsearch)
    replacement_version: 8.4.0.Final
    policy: guide
    followup: >-
      Port mappings (@Field → @FullTextField / @KeywordField / @GenericField), queries (FullTextEntityManager →
      Search.session(em).search(...)) and configuration keys (hibernate.search.backend.*), then reindex with the
      MassIndexer.
    docs:
      - https://hibernate.org/search/releases/8.4/
      - https://docs.jboss.org/hibernate/search/6.0/migration/html_single/

  - id: querydsl-hibernate-native
    library: querydsl-hibernate-native
    status: incompatible
    title: QueryDSL's Hibernate-native API (com.querydsl.jpa.hibernate.*) does not link against Hibernate 6 / 7
    summary: >-
      The Boot-managed com.querydsl 5.1.0 (classifier jakarta, handler querydsl-jakarta-classifier) is fine for
      JPAQuery / JPAQueryFactory, but com.querydsl.jpa.hibernate.* (HibernateQueryFactory, HibernateQuery,
      HibernateUtil) and the com.querydsl.jpa.support Q*Dialect classes reference org.hibernate.Query /
      org.hibernate.type.*Type / old dialects that Hibernate 7.4 removed. The OpenFeign fork keeps the com.querydsl.*
      packages under new coordinates and supports Hibernate 7 (not managed by Boot; not a blanket relocation because
      plain JPAQueryFactory users stay on the Boot-managed line).
    replacement: io.github.openfeign.querydsl:querydsl-jpa / querydsl-apt (no classifier)
    replacement_version: "7.7"
    policy: guide
    followup: >-
      Either port HibernateQueryFactory / HibernateQuery code to JPAQueryFactory (stay on com.querydsl 5.1.0:jakarta) or
      swap every com.querydsl:* artifact for io.github.openfeign.querydsl:* 7.7 (same packages, drop the jakarta
      classifier, regenerate the Q-classes).
    docs:
      - https://github.com/OpenFeign/querydsl/releases
      - https://repo1.maven.org/maven2/io/github/openfeign/querydsl/querydsl-jpa/

  # ------------------------------------------------------------------ cache / pools / transactions
  - id: ehcache2
    library: ehcache2
    status: eol
    title: Ehcache 2 — Spring 6+ removed org.springframework.cache.ehcache (EhCacheCacheManager)
    summary: >-
      net.sf.ehcache:ehcache stopped at 2.10.9.2 (2021) and is not managed by Boot 4. spring-context-support 7.0.8 has
      only cache/caffeine, cache/jcache, cache/transaction, so EhCacheCacheManager / EhCacheManagerFactoryBean fail:
      "package org.springframework.cache.ehcache does not exist" in Java config, ClassNotFound for XML bean classes.
    replacement: org.ehcache:ehcache (classifier jakarta) through JCache (javax.cache:cache-api) — or Caffeine
    replacement_version: 3.12.0 + cache-api 1.1.1 (both Boot 4.1 managed)
    policy: guide
    followup: >-
      Replace EhCacheCacheManager with JCacheCacheManager (or spring.cache.type=jcache +
      spring.cache.jcache.config=classpath:ehcache.xml), rewrite ehcache.xml to the Ehcache 3 schema (<cache alias> /
      <heap> / <expiry>) and drop net.sf.ehcache; direct net.sf.ehcache.CacheManager use is ported to javax.cache.
    docs:
      - https://www.ehcache.org/documentation/3.10/107.html
      - https://repo1.maven.org/maven2/net/sf/ehcache/ehcache/
    notes: knowledge/notes/era-libraries.md

  - id: hazelcast-legacy
    artifacts: ["com.hazelcast:hazelcast", "com.hazelcast:hazelcast-spring", "com.hazelcast:hazelcast-all",
                "com.hazelcast:hazelcast-client"]
    applies_when_version_below: "4.0"
    status: incompatible
    title: Hazelcast 3.x → 5.x (Boot-managed 5.5.0) moved core APIs (IMap etc.)
    summary: >-
