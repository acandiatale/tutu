# Library advisories — EOL / no-longer-managed / runtime-incompatible libraries that still COMPILE after the
# migration and would otherwise leave the run looking green. Read by sbmig/advisory (docs/ADVISORIES.md).
#
# Advisories are guide-only (business decision, PLAN-v2 §2): they never add a recipe and never block (500 projects
# cannot all be perfect; the build goes as far as it can and the owners get a compressed handover). A matching
# advisory gives the fix loop's LLM a "what to migrate TO" hint (+ the `## fix-loop: <library>` section of its notes
# file) and the owning team a line in the report's Handover section.
#
# Schema (version 1): see LibraryAdvisory in sbmig/core/models.py — id, library (analyzer rule name) and/or
# artifacts (g:a globs), status (eol|unmanaged|incompatible|superseded), title, summary, replacement,
# replacement_version, followup, docs, applies_to, applies_when_version_below, resolved_min_version, notes, and the
# Korean texts of the report: title_ko, summary_ko, followup_ko, and replacement_ko where `replacement` is free text
# rather than a plain coordinate (empty = the guide shows the English text; identifiers stay as they are).
# (`policy` / `recipes` keys are no longer read.)
#
# Company additions / overrides: advisories.extra_files (same schema, merged by id, later wins);
# advisories.policy_overrides {id: off} switches an entry off.
version: 1
advisories:
  # ------------------------------------------------------------------ API docs
  - id: springfox
    library: springfox
    artifacts: ["io.swagger:swagger-annotations"]
    status: eol
    title: Springfox (Swagger 2) is discontinued
    summary: >-
      Springfox has had no release since 3.0.0 (2020) and does not work with Spring Framework 6+/7 at runtime
      (path matching, jakarta). springdoc-openapi is the maintained replacement.
    replacement: org.springdoc:springdoc-openapi-starter-webmvc-ui
    replacement_version: "3.x (Boot 4)"
    followup: >-
      Review the generated GroupedOpenApi beans and the TODO comments the recipe left on complex Docket code,
      then check /swagger-ui/index.html and /v3/api-docs (springdoc.* properties replace springfox.*).
    title_ko: "Springfox(Swagger 2)는 개발이 중단되었습니다"
    summary_ko: >-
      Springfox는 2020년 3.0.0 이후 새 릴리스가 없고, Spring Framework 6 이상에서는 실행 중에 동작하지 않습니다(경로 매칭, jakarta).
      지금도 개발되고 있는 springdoc-openapi로 바꿔야 합니다.
    followup_ko: >-
      자동 변환으로 만든 `GroupedOpenApi` 빈과, 복잡한 `Docket` 설정에 레시피가 남긴 TODO 주석을 확인해 주세요. 그다음
      `/swagger-ui/index.html`과 `/v3/api-docs`가 열리는지 확인해 주세요. 설정은 `springfox.*` 대신 `springdoc.*` 속성을
      씁니다.
    docs:
      - https://springdoc.org/#migrating-from-springfox
      - https://docs.openrewrite.org/recipes/java/springdoc/springfoxtospringdoc
    notes: knowledge/notes/spring-cloud.md

  # ------------------------------------------------------------------ Spring Cloud Netflix / Sleuth
  - id: sleuth
    library: sleuth
    status: eol
    title: Spring Cloud Sleuth is discontinued (Micrometer Tracing replaces it)
    summary: >-
      Sleuth ended with Spring Cloud 2021.0.x; Boot 3+/4 trace through Micrometer Tracing (Brave or OpenTelemetry
      bridge), which the Boot BOM manages.
    replacement: io.micrometer:micrometer-tracing-bridge-brave
    replacement_version: managed by the Boot 4 BOM
    followup: >-
      Remove the explicit micrometer-tracing 1.0.x version if the recipe left one (the Boot BOM manages it), then
      check management.tracing.sampling.probability, the exporter (zipkin/otlp) and the traceId/spanId log pattern.
    title_ko: "Spring Cloud Sleuth는 지원이 종료되었습니다(Micrometer Tracing으로 대체)"
    summary_ko: >-
      Sleuth는 Spring Cloud 2021.0.x를 끝으로 지원이 종료되었습니다. Spring Boot 3 이상에서는 Micrometer Tracing(Brave 또는
      OpenTelemetry 브리지)으로 추적하며, 버전은 Spring Boot BOM이 정합니다.
    followup_ko: >-
      레시피가 micrometer-tracing 1.0.x 버전을 pom에 직접 남겼다면 지워 주세요(버전은 Spring Boot BOM이 정합니다). 그다음
      `management.tracing.sampling.probability`, exporter 설정(zipkin / otlp), 로그 패턴의 traceId / spanId를
      확인해 주세요.
    docs:
      - https://github.com/micrometer-metrics/tracing/wiki/Spring-Cloud-Sleuth-3.1-Migration-Guide
      - https://docs.spring.io/spring-boot/reference/actuator/tracing.html
    notes: knowledge/notes/spring-cloud.md

  - id: hystrix
    library: hystrix
    status: eol
    title: Netflix Hystrix is discontinued (not in any current Spring Cloud train)
    summary: >-
      Hystrix is in maintenance-only mode since 2018, was removed from Spring Cloud 2020.0 and does not work on Boot
      3+/4. The recipe com.company.migrate.HystrixToResilience4j replaces it with Resilience4j:
      spring-cloud-starter-netflix-hystrix / spring-cloud-starter-hystrix become
      spring-cloud-starter-circuitbreaker-resilience4j (no version of its own: the Spring Cloud BOM manages it),
      @HystrixCommand becomes @CircuitBreaker (name from commandKey, else "default"; fallbackMethod kept; Hystrix-only
      attributes and nested @HystrixProperty removed), @EnableHystrix / @EnableCircuitBreaker /
      @EnableHystrixDashboard are deleted and hystrix-javanica / hystrix-core / the dashboard starter are removed. Code
      the recipe cannot port (HystrixCommand / HystrixObservableCommand subclasses, HystrixRequestContext) is ported by
      the fix loop.
    replacement: org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j
    replacement_version: managed by the Spring Cloud BOM
    followup: >-
      Review the circuit breakers at runtime: configure them by name (instance "default" unless a commandKey existed:
      resilience4j.circuitbreaker.instances.<name> or configs.default), move hystrix.command.* timeouts to
      resilience4j.timelimiter.*, give every fallback method a trailing Throwable parameter (Resilience4j does not
      find fallbacks without it) and add spring-boot-starter-aspectj so the @CircuitBreaker aspect runs.
      Thread-pool isolation, groupKey / threadPoolKey, commandProperties and ignoreExceptions are gone (a Resilience4j
      bulkhead replaces isolation where it mattered): re-test the failure paths. Review the classes the fix loop
      ported (they carry a MIGRATION-TODO comment); dashboards / Turbine streams are not migrated — move them to
      Micrometer / Actuator metrics.
    title_ko: "Netflix Hystrix는 지원이 종료되었습니다"
    summary_ko: >-
      Hystrix는 2018년부터 유지보수만 하다가 Spring Cloud 2020.0에서 삭제되었고, Spring Boot 3 이상에서는 동작하지 않습니다.
      그래서 레시피로 Resilience4j로 바꿨습니다. Hystrix starter는
      `org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j`로 바꿨고, 버전은 Spring Cloud BOM이
      정합니다. `@HystrixCommand`는 `@CircuitBreaker`로 바꿨습니다(이름은 commandKey를 쓰고 없으면 `default`입니다.
      fallbackMethod는 그대로 둡니다). Hystrix 전용 속성과 `@HystrixProperty`, `@EnableHystrix` / `@EnableCircuitBreaker` /
      `@EnableHystrixDashboard`, `hystrix-javanica` / `hystrix-core` / 대시보드 starter는 지웠습니다. `HystrixCommand`를
      상속한 클래스처럼 레시피가 바꾸지 못하는 코드는 자동 수정 단계에서 Resilience4j로 옮겼습니다.
    followup_ko: >-
      실행 환경에서 서킷 브레이커 동작을 확인해 주세요. 서킷 브레이커는 이름별로 설정합니다(commandKey가 없었다면 인스턴스
      이름은 `default`입니다: `resilience4j.circuitbreaker.instances.<name>` 또는 `configs.default`).
      `hystrix.command.*`의 타임아웃은 `resilience4j.timelimiter.*`로 옮겨 주세요. fallback 메서드에는 마지막 파라미터로
      `Throwable`을 추가해야 합니다(없으면 Resilience4j가 fallback을 찾지 못합니다). `@CircuitBreaker`가 동작하려면
      `spring-boot-starter-aspectj`를 의존성에 추가해 주세요. 스레드 풀 격리, groupKey / threadPoolKey, commandProperties,
      ignoreExceptions는 더 이상 없으므로(격리가 필요했다면 Resilience4j bulkhead를 씁니다) 실패 상황을 다시 테스트해
      주세요. 자동 수정 단계에서 옮긴 클래스에는 `MIGRATION-TODO` 주석이 있으니 검토해 주세요. 대시보드와 Turbine은 옮기지
      않았으므로 Micrometer / Actuator 지표로 직접 옮겨 주세요.
    docs:
      - https://docs.spring.io/spring-cloud-circuitbreaker/reference/spring-cloud-circuitbreaker-resilience4j.html
      - https://resilience4j.readme.io/docs/getting-started-3
    notes: knowledge/notes/spring-cloud.md

  - id: ribbon
    library: ribbon
    status: eol
    title: Netflix Ribbon is discontinued (Spring Cloud LoadBalancer replaces it)
    summary: Ribbon was removed from Spring Cloud 2020.0; client-side load balancing is Spring Cloud LoadBalancer.
    replacement: org.springframework.cloud:spring-cloud-starter-loadbalancer
    replacement_version: managed by the Spring Cloud BOM
    followup: >-
      Replace the Ribbon starter with spring-cloud-starter-loadbalancer, delete IRule/IPing beans and
      <client>.ribbon.* properties, and configure spring.cloud.loadbalancer.* (or a ServiceInstanceListSupplier).
    title_ko: "Netflix Ribbon은 지원이 종료되었습니다(Spring Cloud LoadBalancer로 대체)"
    summary_ko: >-
      Ribbon은 Spring Cloud 2020.0에서 삭제되었습니다. 클라이언트 측 로드 밸런싱에는 Spring Cloud LoadBalancer를 씁니다.
    followup_ko: >-
      Ribbon starter를 `spring-cloud-starter-loadbalancer`로 바꾸고, `IRule` / `IPing` 빈과
      `<client>.ribbon.*` 속성을 지워 주세요. 설정은 `spring.cloud.loadbalancer.*`(또는
      `ServiceInstanceListSupplier`)로 다시 해 주세요.
    docs:
      - https://docs.spring.io/spring-cloud-commons/reference/spring-cloud-commons/loadbalancer.html
    notes: knowledge/notes/spring-cloud.md

  - id: zuul
    library: zuul
    status: eol
    title: Netflix Zuul 1 is discontinued (Spring Cloud Gateway replaces it)
    summary: Zuul 1 was removed from Spring Cloud 2020.0 and does not run on jakarta servlets.
    replacement: org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc
    replacement_version: managed by the Spring Cloud BOM
    followup: >-
      Rebuild the zuul.routes.* as Spring Cloud Gateway (server-webmvc) routes and port ZuulFilter subclasses to
      gateway filter functions; test every route, header and timeout.
    title_ko: "Netflix Zuul 1은 지원이 종료되었습니다(Spring Cloud Gateway로 대체)"
    summary_ko: >-
      Zuul 1은 Spring Cloud 2020.0에서 삭제되었고 jakarta 서블릿에서는 동작하지 않습니다. Spring Cloud
      Gateway(server-webmvc)로 옮겨야 합니다.
    followup_ko: >-
      `zuul.routes.*` 설정을 Spring Cloud Gateway(server-webmvc) 라우트로 다시 만들고, `ZuulFilter` 하위 클래스는
      gateway 필터 함수로 옮겨 주세요. 라우트, 헤더, 타임아웃은 모두 테스트해 주세요.
    docs:
      - https://docs.spring.io/spring-cloud-gateway/reference/spring-cloud-gateway-server-webmvc.html
    notes: knowledge/notes/spring-cloud.md

  - id: netflix-feign
    library: netflix-feign
    status: eol
    title: Netflix Feign / spring-cloud-starter-feign are discontinued (OpenFeign replaces them)
    summary: >-
      com.netflix.feign stopped at 8.18 (2016) and spring-cloud-starter-feign was renamed to
      spring-cloud-starter-openfeign. The Boot umbrella recipe renames the starter; com.netflix.feign code stays.
    replacement: org.springframework.cloud:spring-cloud-starter-openfeign
    replacement_version: managed by the Spring Cloud BOM
    followup: >-
      Move com.netflix.feign imports to io.github.openfeign (feign.*) and use
      org.springframework.cloud.openfeign.@FeignClient/@EnableFeignClients; check the starter rename in the pom.
    title_ko: "Netflix Feign과 spring-cloud-starter-feign은 지원이 종료되었습니다(OpenFeign으로 대체)"
    summary_ko: >-
      `com.netflix.feign`은 2016년 8.18이 마지막이고, `spring-cloud-starter-feign`은
      `spring-cloud-starter-openfeign`으로 이름이 바뀌었습니다. starter 이름은 Spring Boot 레시피가 바꾸지만
      `com.netflix.feign` 코드는 그대로 남습니다.
    followup_ko: >-
      `com.netflix.feign` import를 `io.github.openfeign`(`feign.*`)으로 옮기고,
      `org.springframework.cloud.openfeign`의 `@FeignClient` / `@EnableFeignClients`를 써 주세요. pom에서
      starter 이름이 바뀌었는지도 확인해 주세요.
    docs:
      - https://docs.spring.io/spring-cloud-openfeign/reference/
    notes: knowledge/notes/spring-cloud.md

  - id: spring-cloud-bom
    library: spring-cloud-bom
    status: superseded
    title: Spring Cloud release train older than the Boot 4 train
    summary: >-
      The spring-cloud-dependencies BOM (or spring-cloud-starter-parent) pins a train built for an older Boot line.
      Spring Cloud 2025.1 is the Boot 4.0 train.
    replacement: org.springframework.cloud:spring-cloud-dependencies
    replacement_version: "2025.1.x"
    applies_when_version_below: "2025.1"
    resolved_min_version: "2025.1"
    followup: >-
      Verify the Spring Cloud train matches the Boot line (2025.1.x is the Boot 4.0 train — check the Spring Cloud
      compatibility matrix for Boot 4.1) and that every org.springframework.cloud:* dependency is BOM-managed.
    title_ko: "Spring Cloud 릴리스 트레인이 Spring Boot 4보다 오래된 버전입니다"
    summary_ko: >-
      `spring-cloud-dependencies` BOM(또는 `spring-cloud-starter-parent`)이 이전 Spring Boot용 트레인을 지정하고
      있습니다. Spring Boot 4.0에 맞는 트레인은 Spring Cloud 2025.1입니다.
    followup_ko: >-
      Spring Cloud 트레인이 Spring Boot 버전과 맞는지 확인해 주세요. 2025.1.x는 Spring Boot 4.0용이므로, Spring Boot 4.1은
      Spring Cloud 호환 표에서 확인해야 합니다. `org.springframework.cloud:*` 의존성의 버전을 모두 BOM이 정하는지도 확인해 주세요.
    docs:
      - https://spring.io/projects/spring-cloud#overview
      - https://github.com/spring-cloud/spring-cloud-release/wiki/Supported-Versions
    notes: knowledge/notes/spring-cloud.md

  # ------------------------------------------------------------------ security
  - id: spring-security-oauth2-legacy
    library: spring-security-oauth2-legacy
    status: eol
    title: Spring Security OAuth (spring-security-oauth2 / oauth2-autoconfigure) is discontinued
    summary: >-
      The legacy org.springframework.security.oauth project reached end of life in 2022 and does not work with
      Spring Security 6/7. Client and resource-server support live in Spring Security itself; authorization servers
      move to Spring Authorization Server.
    replacement: org.springframework.boot:spring-boot-starter-oauth2-resource-server (or -oauth2-client)
    replacement_version: managed by the Boot 4 BOM (authorization servers → spring-boot-starter-oauth2-authorization-server)
    followup: >-
      Replace @EnableResourceServer/@EnableOAuth2Sso/@EnableAuthorizationServer and OAuth2RestTemplate with
      http.oauth2ResourceServer()/oauth2Login() and WebClient/RestClient OAuth2 support; re-test token validation.
    title_ko: "Spring Security OAuth(spring-security-oauth2 / oauth2-autoconfigure)는 지원이 종료되었습니다"
    summary_ko: >-
      기존 `org.springframework.security.oauth` 프로젝트는 2022년에 지원이 종료되었고 Spring Security 6/7에서는 동작하지 않습니다.
      클라이언트와 리소스 서버 기능은 Spring Security에 들어 있고, 인가 서버는 Spring Authorization Server로 옮겨야 합니다.
    followup_ko: >-
      `@EnableResourceServer` / `@EnableOAuth2Sso` / `@EnableAuthorizationServer`와
      `OAuth2RestTemplate`을 `http.oauth2ResourceServer()` / `oauth2Login()`, 그리고 WebClient /
      RestClient의 OAuth2 지원으로 바꿔 주세요. 바꾼 뒤에는 토큰 검증을 다시 테스트해 주세요.
    replacement_ko: "`org.springframework.boot:spring-boot-starter-oauth2-resource-server`(또는 `-oauth2-client`)"
    docs:
      - https://github.com/spring-projects/spring-security/wiki/OAuth-2.0-Migration-Guide
      - https://docs.spring.io/spring-authorization-server/reference/
    notes: knowledge/notes/spring-security-7.md

  # ------------------------------------------------------------------ logging / commons / http
  - id: log4j1
    library: log4j1
    status: eol
    title: Log4j 1.x is end of life (since 2015, unpatched CVEs)
    summary: log4j:log4j 1.2.x is EOL and has known vulnerabilities; Boot logs through Logback (or Log4j 2).
    replacement: ch.qos.logback:logback-classic (Boot default; or log4j-core 2.x)
    replacement_version: managed by the Boot 4 BOM
    followup: >-
      Owning team: remove log4j:log4j, log through SLF4J (org.slf4j.Logger), convert log4j.properties/xml to
      logback-spring.xml (or add log4j-1.2-api only as a temporary bridge); the build keeps the as-is jar meanwhile.
    title_ko: "Log4j 1.x는 지원이 종료되었습니다(2015년부터, 보안 취약점이 고쳐지지 않음)"
    summary_ko: >-
      `log4j:log4j` 1.2.x는 지원이 종료되었고 알려진 보안 취약점이 있습니다. Spring Boot는 Logback(또는 Log4j 2)으로 로그를 남깁니다.
    followup_ko: >-
      `log4j:log4j`를 빼고 SLF4J(`org.slf4j.Logger`)로 로그를 남기도록 바꿔 주세요. `log4j.properties` / `log4j.xml`은
      `logback-spring.xml`로 옮겨 주세요(`log4j-1.2-api`는 임시 브리지로만 추가할 수 있습니다). 그때까지는 기존 jar로 빌드합니다.
    replacement_ko: "`ch.qos.logback:logback-classic`(Spring Boot 기본값) 또는 log4j-core 2.x"
    docs:
      - https://logging.apache.org/log4j/2.x/migrate-from-log4j1.html
    notes: knowledge/notes/era-libraries.md

  - id: commons-lang2
    library: commons-lang2
    status: eol
    title: Apache Commons Lang 2.x is end of life
    summary: commons-lang:commons-lang 2.6 (2011) is unmaintained; Commons Lang 3 is the supported line.
    replacement: org.apache.commons:commons-lang3
    replacement_version: "3.x"
    followup: >-
      Owning team: replace org.apache.commons.lang.* imports with org.apache.commons.lang3.* (StringEscapeUtils moved
      to commons-text) and drop commons-lang:commons-lang; the build keeps commons-lang 2 meanwhile.
    title_ko: "Apache Commons Lang 2.x는 지원이 종료되었습니다"
    summary_ko: >-
      `commons-lang:commons-lang` 2.6(2011)은 더 이상 유지보수되지 않습니다. 지원되는 버전은 Commons Lang 3입니다.
    followup_ko: >-
      `org.apache.commons.lang.*` import를 `org.apache.commons.lang3.*`로 바꾸고(`StringEscapeUtils`는
      commons-text로 옮겨졌습니다) `commons-lang:commons-lang`을 빼 주세요. 그때까지는 commons-lang 2로 빌드합니다.
    docs:
      - https://commons.apache.org/proper/commons-lang/article3_0.html
    notes: knowledge/notes/era-libraries.md

  # round 10: the Boot umbrella (and an opted-in Framework 7 set) runs UpgradeApacheHttpClient_5 (UpgradeSpringFramework_6_0;
  # rewrite-apache 2.30.0). Plain Java / servlet projects keep the 4.5.x client (it still compiles, carried-over
  # version) → httpclient4-direct.
  - id: httpclient4
    library: httpclient4
    applies_to: [spring_legacy, spring_boot, msa]
    status: superseded
    title: Apache HttpClient 4.x is superseded by HttpClient 5 (Boot 4 RestTemplate/RestClient use 5)
    summary: >-
      Spring Framework 6+/7 HttpComponentsClientHttpRequestFactory only supports HttpClient 5; 4.5.x keeps working
      only for direct use and is no longer managed by the Boot BOM. The Spring Framework 6.0 recipe chain runs
      UpgradeApacheHttpClient_5 (dependencies, org.apache.http → org.apache.hc.client5 / hc.core5 class mapping,
      deprecated methods, TimeUnit timeouts); what it cannot map is ported in the build-fix loop.
    replacement: org.apache.httpcomponents.client5:httpclient5
    replacement_version: managed by the Boot 4 BOM
    followup: >-
      Re-test the migrated HTTP client code: timeouts (TimeUnit / Timeout), connection pooling
      (PoolingHttpClientConnectionManagerBuilder), TLS / SSLContext setup and retry handling; drop any explicit
      httpclient 4.x version left in the poms.
    title_ko: "Apache HttpClient 4.x는 HttpClient 5로 대체되었습니다(Spring Boot 4의 RestTemplate / RestClient는 5를 씁니다)"
    summary_ko: >-
      Spring Framework 6 이상의 `HttpComponentsClientHttpRequestFactory`는 HttpClient 5만 지원합니다. 4.5.x는 직접
      호출하는 코드에서만 동작하고 Spring Boot BOM에는 버전이 없습니다. Spring Framework 6.0 레시피가
      `UpgradeApacheHttpClient_5`를 실행해 의존성, 클래스(`org.apache.http`에서 `org.apache.hc.client5` /
      `hc.core5`로), deprecated 메서드, `TimeUnit` 타임아웃을 바꾸고, 레시피가 바꾸지 못한 부분은 자동 수정 단계에서 옮깁니다.
    followup_ko: >-
      옮긴 HTTP 클라이언트 코드를 다시 테스트해 주세요. 타임아웃(`TimeUnit` / `Timeout`), 커넥션
      풀(`PoolingHttpClientConnectionManagerBuilder`), TLS / `SSLContext` 설정, 재시도 처리를 확인해야 합니다. pom에
      httpclient 4.x 버전이 직접 남아 있으면 지워 주세요.
    docs:
      - https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/
      - https://docs.openrewrite.org/recipes/apache/httpclient5/upgradeapachehttpclient_5

