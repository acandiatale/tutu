  - id: poi-legacy
    library: poi
    applies_when_version_below: "5.0.0"
    status: superseded
    title: Apache POI 3.x / 4.x APIs removed in POI 5
    summary: >-
      POI 5.5.1 removed the int / short constants deprecated in 3.15–3.17: Cell.CELL_TYPE_* (→ CellType),
      CellStyle.ALIGN_* / VERTICAL_* (→ HorizontalAlignment / VerticalAlignment), BORDER_* (→ BorderStyle), fill
      patterns (→ FillPatternType), Hyperlink.LINK_* (→ HyperlinkType), Font.setBoldweight (→ setBold),
      setCellType(int); poi-ooxml-schemas → poi-ooxml-lite, ooxml-schemas → poi-ooxml-full. The rewrite-apache recipe
      UpgradeApachePoi_5 covers these but is type-attributed (it must run while the old POI still resolves) and is not
      in the recipe catalog yet; HSSFColor.* inner classes are not covered.
    replacement: org.apache.poi:poi / poi-ooxml
    replacement_version: 5.5.1
    policy: guide
    followup: >-
      Review the ported constants / style calls and HSSFColor / IndexedColors use, then re-test the generated Excel
      files (fonts, borders, merged cells).
    docs:
      - https://docs.openrewrite.org/recipes/apache/poi/upgradeapachepoi_5
      - https://poi.apache.org/changes.html
    notes: knowledge/notes/era-libraries.md

  - id: jxls1
    artifacts: ["net.sf.jxls:*"]
    status: incompatible
    title: JXLS 1.x (XLSTransformer) is built for POI 3.x and unmaintained
    summary: >-
      net.sf.jxls:jxls-core 1.0.6 (2014) depends on poi 3.9; once POI is 5.x XLSTransformer fails at runtime against
      the removed POI 3 APIs. JXLS 2 (org.jxls:jxls-poi 2.14.0, POI 5.2.2, Java 8) and JXLS 3 (3.2.0, Java 17) use a
      different template syntax (jx:area comments) and API.
    replacement: org.jxls:jxls-poi (2.x for minimal change, 3.x current)
    replacement_version: 2.14.0 / 3.2.0
    policy: guide
    followup: Keep POI 3.x pinned for the JXLS 1 modules (if the owners accept it) or port the templates to jx:area markup and JxlsHelper (2.x).
    docs:
      - https://jxls.sourceforge.net/
      - https://repo1.maven.org/maven2/org/jxls/jxls-poi/

  - id: jexcelapi
    artifacts: ["net.sourceforge.jexcelapi:jxl"]
    status: eol
    title: JExcelApi (jxl) is end of life (2.6.12; .xls only)
    summary: No javax EE references; it compiles and runs on Java 21 but is unmaintained and reads / writes only BIFF8 .xls.
    replacement: org.apache.poi:poi (HSSF / XSSF)
    replacement_version: 5.5.1
    policy: guide
    followup: Port Workbook / WritableWorkbook code to POI when the module is next touched.
    docs:
      - https://jexcelapi.sourceforge.net/

  # ------------------------------------------------------------------ logging / test
  - id: slf4j-1-pin
    artifacts: ["org.slf4j:slf4j-log4j12", "org.slf4j:jcl-over-slf4j"]
    status: incompatible
    title: SLF4J 1.7 pins / bindings silently disable or duplicate logging under Boot 4 (SLF4J 2 + Logback 1.5)
    summary: >-
      Boot 4.1 manages every org.slf4j artifact at 2.0.18. An explicit slf4j-api 1.7.x overrides it and finds no
      provider in Logback 1.5 (NOP logging, build green; the restructure drops explicit versions the new parent
      manages, so this advisory keys on the bindings). slf4j-log4j12 2.x is a relocation to slf4j-reload4j (Log4j 1);
      Spring Framework 7 uses commons-logging 1.3 directly, so jcl-over-slf4j next to it gives two copies of
      org.apache.commons.logging.*.
    replacement: org.slf4j:slf4j-api (Boot-managed) + spring-boot-starter-logging
    replacement_version: 2.0.18 (Boot 4.1 managed)
    policy: guide
    followup: >-
      Drop explicit versions on org.slf4j:* and logback, remove slf4j-log4j12 / slf4j-jdk14 / slf4j-simple bindings and
      jcl-over-slf4j; keep log4j-over-slf4j only for leftover Log4j 1 calls.
    docs:
      - https://www.slf4j.org/faq.html#changesInVersion200
      - https://www.slf4j.org/codes.html#noProviders
    notes: knowledge/notes/era-libraries.md

  - id: mockito-legacy
    artifacts: ["org.mockito:mockito-all"]
    status: superseded
    title: Mockito 1.x / 2.x tests do not compile against the managed Mockito 5
    summary: >-
      Boot 4.1 manages mockito 5.23.0; mockito-all stopped at 1.10.19 / 2.0.2-beta and is not managed. The verified
      recipe Mockito1to5Migration exists; Boot 4 also removed @MockBean / @SpyBean (→ @MockitoBean / @MockitoSpyBean).
      Irrelevant while build.skip_test_compile is true (company runs).
    replacement: org.mockito:mockito-core (+ mockito-junit-jupiter)
    replacement_version: 5.23.0 (Boot 4.1 managed)
    policy: guide
    followup: Replace mockito-all with mockito-core and run Mockito1to5Migration when the tests come back into scope.
    docs:
      - https://docs.openrewrite.org/recipes/java/testing/mockito/mockito1to5migration

  - id: powermock
    artifacts: ["org.powermock:*"]
    status: eol
    title: PowerMock is unmaintained (last 2.0.9, 2020) and supports only Mockito 2 / JUnit 4
    summary: >-
      powermock-api-mockito2 2.0.9 depends on Mockito 2 APIs and has no JUnit 5 runner; with the managed Mockito 5 the
      tests fail. The verified recipe ReplacePowerMockito rewrites mockStatic / when / spy / Whitebox to plain Mockito.
    replacement: org.mockito:mockito-core (MockedStatic / MockedConstruction)
    replacement_version: 5.23.0 (Boot 4.1 managed)
    policy: guide
    followup: Remove PowerMock and rewrite private / final / static mocking with Mockito 5 (or refactor the code under test) when the tests come back into scope.
    docs:
      - https://docs.openrewrite.org/recipes/java/testing/mockito/replacepowermockito
      - https://github.com/powermock/powermock
