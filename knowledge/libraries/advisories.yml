  # ------------------------------------------------------------------ view layers / web
  - id: tiles
    library: tiles
    status: eol
    title: Apache Tiles is retired and Spring Framework 6+ has no Tiles view support
    summary: >-
      Last release 3.0.8 (2017); the project is in the Apache Attic and javax.servlet-only. Spring 6.0 removed
      org.springframework.web.servlet.view.tiles3 (TilesConfigurer, TilesViewResolver, TilesView; Spring 5.0 already
      dropped tiles2): Java config naming TilesConfigurer fails to compile, XML config fails at startup.
    replacement: Thymeleaf + thymeleaf-layout-dialect (Boot-managed), SiteMesh 3 (org.sitemesh:sitemesh) or JSP includes
    replacement_version: thymeleaf-layout-dialect 4.0.1 (Boot 4.1 managed) / org.sitemesh:sitemesh 3.3.0
    followup: >-
      Replace the Tiles definitions (tiles*.xml) with layout templates (Thymeleaf layout:decorate or SiteMesh 3
      decorators), remove the TilesConfigurer / TilesViewResolver beans; JSPs can keep <jsp:include> fragments.
    title_ko: "Apache Tiles는 개발이 중단되었고 Spring Framework 6부터 Tiles 뷰를 지원하지 않습니다"
    summary_ko: >-
      마지막 릴리스는 3.0.8(2017)이고, Apache Attic으로 옮겨진 javax.servlet 전용 프로젝트입니다. Spring 6.0에서
      `org.springframework.web.servlet.view.tiles3`(`TilesConfigurer`, `TilesViewResolver`,
      `TilesView`)가 삭제되었습니다(tiles2는 Spring 5.0에서 이미 삭제). `TilesConfigurer`를 쓰는 Java 설정은 컴파일 오류가 나고,
      XML 설정은 기동할 때 실패합니다.
    followup_ko: >-
      Tiles 정의(`tiles*.xml`)를 레이아웃 템플릿(Thymeleaf `layout:decorate` 또는 SiteMesh 3 데코레이터)으로 바꾸고
      `TilesConfigurer` / `TilesViewResolver` 빈을 지워 주세요. JSP는 `<jsp:include>` 조각을 그대로 써도 됩니다.
    replacement_ko: "Thymeleaf와 thymeleaf-layout-dialect(Spring Boot BOM에 버전 있음), SiteMesh 3(`org.sitemesh:sitemesh`) 또는 JSP include"
    docs:
      - https://attic.apache.org/projects/tiles.html
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-6.0-Release-Notes
      - https://repo1.maven.org/maven2/org/apache/tiles/tiles-core/
    notes: knowledge/notes/era-libraries.md

  - id: velocity
    library: velocity
    status: incompatible
    title: Spring 5+ dropped Velocity support; velocity-tools-view has no Jakarta build
    summary: >-
      Spring 5.0 removed VelocityConfigurer, VelocityViewResolver, VelocityLayoutViewResolver and
      org.springframework.ui.velocity.VelocityEngineUtils (common for mail templates). org.apache.velocity:velocity
      stops at 1.7 (2010); the engine continues as velocity-engine-core 2.4.1 (no servlet dependency);
      velocity-tools-view 3.1 is javax.servlet with no Jakarta release.
    replacement: Thymeleaf or FreeMarker for web views; org.apache.velocity:velocity-engine-core for non-web templating
    replacement_version: velocity-engine-core 2.4.1 / velocity-tools-generic 3.1
    followup: >-
      Port .vm web views to Thymeleaf / FreeMarker; for mail / text templates switch to velocity-engine-core 2.4.1 and
      replace VelocityEngineUtils.mergeTemplateIntoString(...) with engine.getTemplate(name, encoding).merge(...);
      retest template loading (Velocity 2 renamed configuration keys such as resource.loader).
    title_ko: "Spring 5부터 Velocity를 지원하지 않고, velocity-tools-view에는 Jakarta 버전이 없습니다"
    summary_ko: >-
      Spring 5.0에서 `VelocityConfigurer`, `VelocityViewResolver`, `VelocityLayoutViewResolver`와 메일 템플릿에
      자주 쓰던 `org.springframework.ui.velocity.VelocityEngineUtils`가 삭제되었습니다.
      `org.apache.velocity:velocity`는 1.7(2010)이 마지막이고, 엔진은 서블릿 의존성이 없는 velocity-engine-core 2.4.1로
      이어집니다. velocity-tools-view 3.1은 javax.servlet 기반이며 Jakarta 릴리스가 없습니다.
    followup_ko: >-
      `.vm` 웹 화면은 Thymeleaf나 FreeMarker로 옮겨 주세요. 메일이나 텍스트 템플릿은 velocity-engine-core 2.4.1로 바꾸고
      `VelocityEngineUtils.mergeTemplateIntoString(...)`을 `engine.getTemplate(name,
      encoding).merge(...)`로 바꿔 주세요. Velocity 2에서 `resource.loader` 같은 설정 키 이름이 바뀌었으니 템플릿 로딩을 다시 테스트해
      주세요.
    replacement_ko: "웹 화면은 Thymeleaf나 FreeMarker, 웹이 아닌 템플릿은 `org.apache.velocity:velocity-engine-core`"
    docs:
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-5.0-Release-Notes
      - https://repo1.maven.org/maven2/org/apache/velocity/velocity-engine-core/
      - https://velocity.apache.org/engine/2.4/upgrading.html
    notes: knowledge/notes/era-libraries.md

  - id: thymeleaf-legacy
    artifacts: ["org.thymeleaf:thymeleaf-spring3", "org.thymeleaf:thymeleaf-spring4",
                "org.thymeleaf.extras:thymeleaf-extras-springsecurity4", "net.sourceforge.nekohtml:nekohtml",
                "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect"]
    status: superseded
    title: Thymeleaf 2.x / thymeleaf-spring4 / Layout Dialect 1.x-2.x need the Thymeleaf 3.1 + spring6 line
    summary: >-
      Boot 4.1 manages thymeleaf, thymeleaf-spring6, thymeleaf-extras-springsecurity6 (3.1.5.RELEASE) and
      thymeleaf-layout-dialect 4.0.1. The pinned recipe MigrateThymeleafDependencies covers only spring5 → spring6;
      thymeleaf-spring4 / extras-springsecurity4 keep their org.thymeleaf.spring4 imports. Thymeleaf 2.x templates
      (LEGACYHTML5 / nekohtml) and custom dialects need the 3.x API; Layout Dialect 3.0 removed layout:decorator and
      moved its package to nz.net.ultraq.thymeleaf.layoutdialect. Thymeleaf 3.1 removed #request / #session /
      #servletContext expression objects (runtime).
    replacement: org.thymeleaf:thymeleaf-spring6 / thymeleaf-extras-springsecurity6 / thymeleaf-layout-dialect (Boot-managed)
    replacement_version: 3.1.5.RELEASE / layout dialect 4.0.1 (Boot 4.1 managed)
    followup: >-
      Swap thymeleaf-spring4 → thymeleaf-spring6 (imports org.thymeleaf.spring4 → org.thymeleaf.spring6), drop
      spring.thymeleaf.mode=LEGACYHTML5 and nekohtml, replace layout:decorator="x" with layout:decorate="~{x}", fix the
      LayoutDialect import (or delete the bean — Boot configures it) and move ${#request…} / ${#session…} values into
      the model.
    title_ko: "Thymeleaf 2.x / thymeleaf-spring4 / Layout Dialect 1.x~2.x는 Thymeleaf 3.1 + spring6 버전으로 올려야 합니다"
    summary_ko: >-
      Spring Boot 4.1 BOM에는 thymeleaf, thymeleaf-spring6,
      thymeleaf-extras-springsecurity6(3.1.5.RELEASE)와 thymeleaf-layout-dialect 4.0.1이 있습니다. 레시피
      `MigrateThymeleafDependencies`는 spring5에서 spring6으로만 바꾸므로 thymeleaf-spring4 /
      extras-springsecurity4의 `org.thymeleaf.spring4` import는 그대로 남습니다. Thymeleaf 2.x 템플릿(LEGACYHTML5
      / nekohtml)과 커스텀 dialect는 3.x API로 바꿔야 하고, Layout Dialect 3.0에서 `layout:decorator`가 삭제되고 패키지가
      `nz.net.ultraq.thymeleaf.layoutdialect`로 옮겨졌습니다. Thymeleaf 3.1에서는 `#request` / `#session` /
      `#servletContext` 표현식 객체가 삭제되어 실행 중에 오류가 납니다.
    followup_ko: >-
      thymeleaf-spring4를 thymeleaf-spring6으로 바꾸고(import `org.thymeleaf.spring4`를
      `org.thymeleaf.spring6`으로), `spring.thymeleaf.mode=LEGACYHTML5`와 nekohtml을 빼 주세요.
      `layout:decorator="x"`는 `layout:decorate="~{x}"`로 바꾸고, `LayoutDialect` import를 고치거나 빈을 지워
      주세요(Spring Boot가 설정합니다). `${#request…}` / `${#session…}` 값은 model에 담아 넘겨 주세요.
    replacement_ko: "`org.thymeleaf:thymeleaf-spring6` / `thymeleaf-extras-springsecurity6` / `thymeleaf-layout-dialect`(Spring Boot BOM에 버전 있음)"
    docs:
      - https://www.thymeleaf.org/doc/articles/thymeleaf31whatsnew.html
      - https://www.thymeleaf.org/doc/articles/thymeleaf3migration.html
      - https://ultraq.github.io/thymeleaf-layout-dialect/migrating-to-3.0/
      - https://ultraq.github.io/thymeleaf-layout-dialect/migrating-to-4.0/

  - id: commons-fileupload
    library: commons-fileupload
    status: incompatible
    title: CommonsMultipartResolver is gone (Spring 6) and FileUpload 2 Jakarta is a milestone with new packages
    summary: >-
      Spring 6.0 removed org.springframework.web.multipart.commons.CommonsMultipartResolver (only
      StandardServletMultipartResolver remains); commons-fileupload 1.x is javax only. The pinned recipe
      FileuploadToFileUpload2 (inside JavaxMigrationToJakarta) swaps the dependency to commons-fileupload2-jakarta
      2.0.0-M4, but its package renames are misspelled `org.apache.commons.fileload…`, so the
      org.apache.commons.fileupload.* imports stay and fail to compile ("package org.apache.commons.fileupload does not
      exist"); FileUpload 2 (packages org.apache.commons.fileupload2.core / .jakarta.servlet6) has milestones only.
    replacement: StandardServletMultipartResolver / Boot multipart (spring.servlet.multipart.*) with MultipartFile; or org.apache.commons:commons-fileupload2-jakarta-servlet6
    replacement_version: commons-fileupload2-jakarta-servlet6 2.0.0-M5 (milestone)
    followup: >-
      Delete the CommonsMultipartResolver bean and move maxUploadSize / maxInMemorySize to
      spring.servlet.multipart.max-file-size / max-request-size / file-size-threshold; port direct ServletFileUpload
      code to MultipartFile / Part, or accept the FileUpload 2 milestone (JakartaServletFileUpload,
      DiskFileItemFactory.builder().get()).
    title_ko: "CommonsMultipartResolver는 Spring 6에서 삭제되었고, FileUpload 2 Jakarta는 패키지가 바뀐 마일스톤 버전뿐입니다"
    summary_ko: >-
      Spring 6.0에서 `org.springframework.web.multipart.commons.CommonsMultipartResolver`가 삭제되어
      `StandardServletMultipartResolver`만 남았고, commons-fileupload 1.x는 javax 전용입니다.
      `JavaxMigrationToJakarta`에 들어 있는 레시피 `FileuploadToFileUpload2`가 의존성을 commons-fileupload2-jakarta
      2.0.0-M4로 바꾸지만, 패키지 이름을 `org.apache.commons.fileload…`로 잘못 적어 두어
      `org.apache.commons.fileupload.*` import가 그대로 남고 컴파일 오류("package org.apache.commons.fileupload
      does not exist")가 납니다. FileUpload 2(패키지 `org.apache.commons.fileupload2.core` /
      `.jakarta.servlet6`)는 마일스톤 버전만 있습니다.
    followup_ko: >-
      `CommonsMultipartResolver` 빈을 지우고 `maxUploadSize` / `maxInMemorySize`를
      `spring.servlet.multipart.max-file-size` / `max-request-size` / `file-size-threshold`로 옮겨 주세요.
      `ServletFileUpload`를 직접 쓰는 코드는 `MultipartFile` / `Part`로 옮기거나, FileUpload 2
      마일스톤(`JakartaServletFileUpload`, `DiskFileItemFactory.builder().get()`)을 쓰기로 정해 주세요.
    replacement_ko: "`StandardServletMultipartResolver` / Spring Boot multipart(`spring.servlet.multipart.*`)와 `MultipartFile`, 또는 `org.apache.commons:commons-fileupload2-jakarta-servlet6`"
    docs:
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-6.0-Release-Notes
      - https://docs.openrewrite.org/recipes/java/migrate/jakarta/fileuploadtofileupload2
      - https://repo1.maven.org/maven2/org/apache/commons/commons-fileupload2-jakarta-servlet6/
    notes: knowledge/notes/era-libraries.md

  - id: jersey1
    artifacts: ["com.sun.jersey:*", "com.sun.jersey.contribs:*"]
    status: eol
    title: Jersey 1.x (com.sun.jersey) has no Jakarta release
    summary: >-
      Last release 1.19.4 (2017); javax.ws.rs 1.1 / javax.servlet; the com.sun.jersey.* packages have no successor
      under the same names.
    replacement: Jersey 4 (org.glassfish.jersey.*, Boot-managed, spring-boot-starter-jersey) or Spring MVC @RestController
    replacement_version: 4.0.2 (Boot 4.1 managed)
    followup: >-
      Port com.sun.jersey.spi.* / ClientConfig / WebResource client code to jakarta.ws.rs.client or RestClient;
      resource classes keep their JAX-RS annotations (jakarta.ws.rs).
    title_ko: "Jersey 1.x(com.sun.jersey)에는 Jakarta 릴리스가 없습니다"
    summary_ko: >-
      마지막 릴리스는 1.19.4(2017)이고 javax.ws.rs 1.1 / javax.servlet 기반입니다. `com.sun.jersey.*` 패키지를 같은 이름으로
      잇는 후속 버전은 없습니다.
    followup_ko: >-
      `com.sun.jersey.spi.*` / `ClientConfig` / `WebResource` 클라이언트 코드를 `jakarta.ws.rs.client`나
      RestClient로 옮겨 주세요. 리소스 클래스의 JAX-RS 어노테이션(`jakarta.ws.rs`)은 그대로 씁니다.
    replacement_ko: "Jersey 4(`org.glassfish.jersey.*`, Spring Boot BOM에 버전 있음, `spring-boot-starter-jersey`) 또는 Spring MVC `@RestController`"
    docs:
      - https://repo1.maven.org/maven2/com/sun/jersey/jersey-server/

  - id: spring-hateoas-legacy
    artifacts: ["org.springframework.hateoas:spring-hateoas"]
    applies_when_version_below: "1.0"
    status: superseded
    title: Spring HATEOAS 0.x → 1.0+ renamed the representation-model types
    summary: >-
      Boot 4.1 manages 3.1.1, but code written for 0.2x (Boot 1.x / 2.0–2.1) does not compile: ResourceSupport →
      RepresentationModel, Resource → EntityModel, Resources → CollectionModel, PagedResources → PagedModel,
      ResourceAssembler → RepresentationModelAssembler (toResource → toModel), ControllerLinkBuilder → WebMvcLinkBuilder.
      No OpenRewrite recipe in the pinned rewrite-spring.
    replacement: org.springframework.hateoas:spring-hateoas (Boot-managed) / spring-boot-starter-hateoas
    replacement_version: 3.1.1 (Boot 4.1 managed)
    followup: Apply the 1.0 type renames (the project's migrate-to-1.0 script or the fix loop), then rebuild; HAL output is unchanged.
    title_ko: "Spring HATEOAS 1.0부터 representation model 타입 이름이 바뀌었습니다"
    summary_ko: >-
      Spring Boot 4.1 BOM의 버전은 3.1.1이지만, 0.2x(Spring Boot 1.x / 2.0~2.1)용 코드는 컴파일되지 않습니다.
      `ResourceSupport`는 `RepresentationModel`, `Resource`는 `EntityModel`, `Resources`는
      `CollectionModel`, `PagedResources`는 `PagedModel`, `ResourceAssembler`는
      `RepresentationModelAssembler`(`toResource`는 `toModel`), `ControllerLinkBuilder`는
      `WebMvcLinkBuilder`로 바뀌었습니다. sbmig가 쓰는 rewrite-spring에는 이 변환 레시피가 없습니다.
    followup_ko: >-
      1.0의 타입 이름 변경을 적용하고(프로젝트의 migrate-to-1.0 스크립트나 자동 수정 단계) 다시 빌드해 주세요. HAL 출력은 바뀌지 않습니다.
    replacement_ko: "`org.springframework.hateoas:spring-hateoas`(Spring Boot BOM에 버전 있음) / `spring-boot-starter-hateoas`"
    docs:
      - https://docs.spring.io/spring-hateoas/docs/1.0.0.RELEASE/reference/html/#migrate-to-1.0

  - id: spring-portlet
    artifacts: ["org.springframework:spring-webmvc-portlet", "javax.portlet:portlet-api"]
    status: eol
    title: Spring Portlet MVC was removed in Spring 5.0
    summary: >-
      Last release 4.3.30.RELEASE (2020). Spring 5.0 no longer supports Portlet; javax.portlet has no Jakarta successor
      in Spring and is not covered by the jakarta package sweep.
    replacement: Spring MVC controllers (servlet) — the portal integration must be redesigned
    replacement_version: n/a
    followup: Port the portlet controllers (@RenderMapping / @ActionMapping) to servlet MVC or the portal vendor's current API.
    title_ko: "Spring Portlet MVC는 Spring 5.0에서 삭제되었습니다"
    summary_ko: >-
      마지막 릴리스는 4.3.30.RELEASE(2020)입니다. Spring 5.0부터 Portlet을 지원하지 않고, `javax.portlet`은 Spring에
      Jakarta 후속 버전이 없으며 jakarta 패키지 변환 대상도 아닙니다.
    followup_ko: >-
      포틀릿 컨트롤러(`@RenderMapping` / `@ActionMapping`)를 서블릿 MVC나 포털 제품의 현재 API로 옮겨 주세요.
    replacement_ko: "Spring MVC 컨트롤러(서블릿)로 옮기고, 포털 연동은 새로 설계해야 합니다"
    docs:
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-5.0-Release-Notes
      - https://repo1.maven.org/maven2/org/springframework/spring-webmvc-portlet/

  - id: spring-mobile
    artifacts: ["org.springframework.mobile:*"]
    status: eol
    title: Spring Mobile is end of life with no Spring 5+ / Jakarta release
    summary: >-
      Last release 1.1.5.RELEASE (2016), repository archived in spring-attic; javax.servlet based
      (DeviceResolverHandlerInterceptor, DeviceUtils).
    replacement: User-Agent parsing in an own HandlerInterceptor (e.g. ua-parser) or a responsive front end
    replacement_version: n/a
    followup: Replace Device / DeviceUtils / SitePreference usages with a small in-house User-Agent check and remove the interceptor beans.
    title_ko: "Spring Mobile은 지원이 종료되었고 Spring 5 이상 / Jakarta 릴리스가 없습니다"
    summary_ko: >-
      마지막 릴리스는 1.1.5.RELEASE(2016)이고 저장소는 spring-attic에 보관 처리되었습니다. javax.servlet
      기반입니다(`DeviceResolverHandlerInterceptor`, `DeviceUtils`).
    followup_ko: >-
      `Device` / `DeviceUtils` / `SitePreference`를 쓰는 곳을 간단한 User-Agent 확인 코드로 바꾸고 인터셉터 빈을 지워 주세요.
    replacement_ko: "직접 만든 `HandlerInterceptor`에서 User-Agent를 해석(예: ua-parser)하거나 반응형 화면으로 전환"
    notes: knowledge/notes/spring-mobile.md
    docs:
      - https://github.com/spring-attic/spring-mobile

  - id: jasperreports6
    artifacts: ["net.sf.jasperreports:jasperreports"]
    applies_when_version_below: "7.0.0"
    status: incompatible
    title: JasperReports 7 is the Jakarta line but breaks .jrxml / .jasper compatibility and splits the jar
    summary: >-
      The 6.x core jar contains javax.servlet viewer classes. 7.0.0 (2024) refactored for Jakarta: optional features
      moved to separate artifacts (jasperreports-pdf / -openpdf, -excel-poi, -jdt, -servlets, -spring …), some
      packages changed, .jasper files must be recompiled and .jrxml / .jrtx files from 6 can no longer be loaded.
      Spring's JasperReportsView family was removed in Spring 5.0.
    replacement: net.sf.jasperreports:jasperreports 7.1.0 + the extension artifacts for the exporters used
    replacement_version: 7.1.0
    followup: >-
      Convert every .jrxml / .jrtx with Jaspersoft Studio 7, recompile .jasper at build time, add the exporter
      artifacts (PDF / XLSX) and replace JasperReportsPdfView / JasperReportsMultiFormatView with a controller that
      calls JasperExportManager (staying on 6.21.x compiles only without Jasper's javax servlet classes).
    title_ko: "JasperReports 7은 Jakarta 버전이지만 .jrxml / .jasper 호환성이 깨지고 jar가 나뉘었습니다"
    summary_ko: >-
      6.x core jar에는 javax.servlet 기반 뷰어 클래스가 들어 있습니다. 7.0.0(2024)은 Jakarta 기준으로 바뀌면서 선택 기능이 별도
      아티팩트(jasperreports-pdf / -openpdf, -excel-poi, -jdt, -servlets, -spring 등)로 나뉘고 일부 패키지가 바뀌었습니다.
      `.jasper` 파일은 다시 컴파일해야 하며, 6에서 만든 `.jrxml` / `.jrtx` 파일은 더 이상 읽을 수 없습니다. Spring의
      `JasperReportsView` 계열은 Spring 5.0에서 삭제되었습니다.
    followup_ko: >-
      모든 `.jrxml` / `.jrtx`를 Jaspersoft Studio 7로 변환하고, `.jasper`는 빌드할 때 컴파일되게 해 주세요. 쓰는 exporter
      아티팩트(PDF / XLSX)를 추가하고, `JasperReportsPdfView` / `JasperReportsMultiFormatView`는
      `JasperExportManager`를 호출하는 컨트롤러로 바꿔 주세요. 6.21.x에 머무르면 Jasper의 javax 서블릿 클래스를 쓰지 않는 경우에만 컴파일됩니다.
    replacement_ko: "`net.sf.jasperreports:jasperreports` 7.1.0과 사용하는 exporter의 확장 아티팩트"
    docs:
      - https://github.com/Jaspersoft/jasperreports/releases
      - https://repo1.maven.org/maven2/net/sf/jasperreports/jasperreports/

  - id: struts2
    library: struts2
    applies_when_version_below: "7.0.0"
    status: incompatible
    title: Struts 2 needs 7.x for Jakarta; 7.x moves com.opensymphony.xwork2 to org.apache.struts2
    summary: >-
      Struts 6.x (last 6.12.0) is javax.servlet. Struts 7.0+ (7.4.0, 2026-10) requires Java 17 and Jakarta Servlet 6;
      com.opensymphony.xwork2.* moved to org.apache.struts2.*, FreeMarker themes use `attributes` instead of
      `parameters`, security constants changed defaults; struts2-sitemesh-plugin stops at 6.12.0. No Struts 7 recipe
      in the pinned recipe jars.
    replacement: org.apache.struts:struts2-core 7.4.0 (+ same-version plugins); long term Spring MVC
    replacement_version: 7.4.0
    followup: >-
      Upgrade every struts2-* artifact to 7.4.0, rename com.opensymphony.xwork2.* imports (ActionSupport,
      ActionContext, Preparable, ModelDriven …) to org.apache.struts2.*, fix custom FreeMarker themes, review struts.xml
      constants (allowlist / static access) and replace the sitemesh plugin with a SiteMesh 3 filter.
    title_ko: "Struts 2를 Jakarta로 옮기려면 7.x가 필요하고, 7.x에서 com.opensymphony.xwork2가 org.apache.struts2로 옮겨졌습니다"
    summary_ko: >-
      Struts 6.x(마지막 6.12.0)는 javax.servlet 기반입니다. Struts 7.0 이상(7.4.0, 2026-10)은 Java 17과 Jakarta
      Servlet 6이 필요하고, `com.opensymphony.xwork2.*`가 `org.apache.struts2.*`로 옮겨졌으며, FreeMarker 테마는
      `parameters` 대신 `attributes`를 쓰고 보안 상수의 기본값도 바뀌었습니다. struts2-sitemesh-plugin은 6.12.0이 마지막이고,
      sbmig가 쓰는 레시피에는 Struts 7 변환이 없습니다.
    followup_ko: >-
      모든 struts2-* 아티팩트를 7.4.0으로 올리고 `com.opensymphony.xwork2.*` import(`ActionSupport`,
      `ActionContext`, `Preparable`, `ModelDriven` 등)를 `org.apache.struts2.*`로 바꿔 주세요. 커스텀 FreeMarker
      테마를 고치고, `struts.xml` 상수(allowlist / static access)를 검토하고, sitemesh 플러그인은 SiteMesh 3 필터로 바꿔 주세요.
    replacement_ko: "`org.apache.struts:struts2-core` 7.4.0(플러그인도 같은 버전). 장기적으로는 Spring MVC"
    docs:
      - https://cwiki.apache.org/confluence/display/WW/Struts+6.x.x+to+7.x.x+migration
      - https://repo1.maven.org/maven2/org/apache/struts/struts2-core/

  - id: struts1
    artifacts: ["struts:struts", "org.apache.struts:struts-core", "org.apache.struts:struts-taglib",
                "org.apache.struts:struts-tiles", "org.apache.struts:struts-extras"]
    status: eol
    title: Struts 1 is EOL (1.3.10, 2008); only a community fork has a Jakarta release candidate
    summary: >-
      org.apache.struts:struts-core stops at 1.3.10 (javax). The fork io.github.weblegacy:struts-core is javax up to
      1.4.5; 1.5.0-RC2 (2024, release candidate only) is Jakarta.
    replacement: Spring MVC (preferred) or io.github.weblegacy:struts-* 1.5.0-RC2 (RC, unsupported)
    replacement_version: io.github.weblegacy:struts-core 1.5.0-RC2
    followup: >-
      Decide between a rewrite to Spring MVC and the weblegacy RC; Action / ActionForm code compiles against the fork
      only after the javax → jakarta sweep.
    title_ko: "Struts 1은 지원이 종료되었습니다(1.3.10, 2008). Jakarta 버전은 커뮤니티 포크의 릴리스 후보뿐입니다"
    summary_ko: >-
      `org.apache.struts:struts-core`는 1.3.10(javax)이 마지막입니다. 포크인 `io.github.weblegacy:struts-core`는
      1.4.5까지 javax이고, 1.5.0-RC2(2024, 릴리스 후보)만 Jakarta입니다.
    followup_ko: >-
      Spring MVC로 다시 만들지, weblegacy RC를 쓸지 정해 주세요. Action / ActionForm 코드는 javax를 jakarta로 바꾼 뒤에야 포크
      버전으로 컴파일됩니다.
    replacement_ko: "Spring MVC(권장) 또는 `io.github.weblegacy:struts-*` 1.5.0-RC2(릴리스 후보, 지원 없음)"
    docs:
      - https://repo1.maven.org/maven2/io/github/weblegacy/struts-core/

  - id: commons-chain
    artifacts: ["commons-chain:commons-chain"]
    status: unmanaged
    title: Commons Chain is dormant; its servlet / portlet web layer is javax only
    summary: >-
      Last release 1.2; the core (org.apache.commons.chain: Command, Chain, Context, Catalog) has no EE dependency and
      compiles, org.apache.commons.chain.web.* uses javax.servlet / javax.portlet / javax.faces. The fork
      io.github.weblegacy:commons-chain-web-jakarta-servlet 1.3.0 has the Jakarta web layer
      (package org.apache.commons.chain.web.jakarta.servlet).
    replacement: keep commons-chain 1.2 for the core; web layer → io.github.weblegacy:commons-chain-web-jakarta-servlet
    replacement_version: 1.3.0
    followup: Only when org.apache.commons.chain.web.servlet.* is used — switch to the weblegacy Jakarta artifact and rename the package.
    title_ko: "Commons Chain은 개발이 멈췄고, 서블릿 / 포틀릿 웹 계층은 javax 전용입니다"
    summary_ko: >-
      마지막 릴리스는 1.2입니다. 코어(`org.apache.commons.chain`: `Command`, `Chain`, `Context`, `Catalog`)는 EE
      의존성이 없어 컴파일되지만, `org.apache.commons.chain.web.*`은 javax.servlet / javax.portlet / javax.faces를
      씁니다. 포크 `io.github.weblegacy:commons-chain-web-jakarta-servlet` 1.3.0에 Jakarta 웹 계층(패키지
      `org.apache.commons.chain.web.jakarta.servlet`)이 있습니다.
    followup_ko: >-
      `org.apache.commons.chain.web.servlet.*`을 쓰는 경우에만 weblegacy Jakarta 아티팩트로 바꾸고 패키지 이름을 바꿔 주세요.
    replacement_ko: "코어는 commons-chain 1.2를 그대로 쓰고, 웹 계층은 `io.github.weblegacy:commons-chain-web-jakarta-servlet`"
    docs:
      - https://commons.apache.org/dormant/index.html
      - https://repo1.maven.org/maven2/io/github/weblegacy/commons-chain-web-jakarta-servlet/

  - id: egovframe
    library: egovframe
    status: incompatible
    title: eGovFrame 3.x / 4.x are javax + Spring 4/5; 5.0.x is Jakarta but built on Spring 6.2 / Boot 3.5, not Spring 7
    summary: >-
      Served by maven.egovframe.go.kr (not Maven Central). 3.x (egovframework.rte:*, packages egovframework.rte.*,
      Spring 4.3) → 4.x (org.egovframe.rte:org.egovframe.rte.*, packages org.egovframe.rte.*, Spring 5.3, javax) →
      5.0.x (org.egovframe.rte:egovframe-rte-*, artifactIds renamed again, Java 17, Spring 6.2.11, jakarta.servlet 6.0).
      No eGovFrame release targets Spring 7 / Boot 4 yet: a Boot 4.1 build mixes eGovFrame 5 with Spring 7 (compiles
      in most cases, runtime compatibility unverified).
    replacement: org.egovframe.rte:egovframe-rte-* 5.0.2 (Jakarta)
    replacement_version: 5.0.2
    followup: >-
      3.x projects rename egovframework.rte.* imports to org.egovframe.rte.* (EgovAbstractServiceImpl,
      EgovAbstractMapper, EgovPropertyService …) and take the 5.0 artifactIds (egovframe-rte-fdl-cmmn, -ptl-mvc,
      -psl-dataaccess …); add the eGovFrame repository (or the company Nexus proxy); take copied common-component
      sources from the 5.0 distribution; test on Spring 7 or keep the project on Boot 3.5 until a Spring 7 line ships.
    title_ko: "전자정부 표준프레임워크 3.x / 4.x는 javax + Spring 4/5 기반이고, 5.0.x는 Jakarta지만 Spring 7이 아닌 Spring 6.2 / Spring Boot 3.5 기반입니다"
    summary_ko: >-
      maven.egovframe.go.kr에서 받습니다(Maven Central에는 없습니다). 3.x(`egovframework.rte:*`, 패키지
      `egovframework.rte.*`, Spring 4.3), 4.x(`org.egovframe.rte:org.egovframe.rte.*`, 패키지
      `org.egovframe.rte.*`, Spring 5.3, javax), 5.0.x(`org.egovframe.rte:egovframe-rte-*`, artifactId
      다시 변경, Java 17, Spring 6.2.11, jakarta.servlet 6.0) 순서로 바뀌었습니다. Spring 7 / Spring Boot 4용
      eGovFrame 릴리스는 아직 없어서, Spring Boot 4.1로 빌드하면 eGovFrame 5와 Spring 7이 섞입니다(대부분 컴파일은 되지만 실행 호환성은
      확인되지 않았습니다).
    followup_ko: >-
      3.x 프로젝트는 `egovframework.rte.*` import를 `org.egovframe.rte.*`로 바꾸고(`EgovAbstractServiceImpl`,
      `EgovAbstractMapper`, `EgovPropertyService` 등) 5.0의 artifactId(egovframe-rte-fdl-cmmn, -ptl-mvc,
      -psl-dataaccess 등)를 써야 합니다. eGovFrame 저장소(또는 사내 Nexus 프록시)를 추가하고, 복사해 쓰던 공통 컴포넌트 소스는 5.0 배포본에서
      다시 가져와 주세요. Spring 7에서 테스트할지, Spring 7용 버전이 나올 때까지 Spring Boot 3.5에 머무를지 정해 주세요.
    replacement_ko: "`org.egovframe.rte:egovframe-rte-*` 5.0.2(Jakarta 버전)"
    docs:
      - https://github.com/eGovFramework/egovframe-runtime/releases
      - https://raw.githubusercontent.com/eGovFramework/egovframe-runtime/v5.0.2-Final/pom.xml
      - https://www.egovframe.go.kr/home/sub.do?menuNo=12

  - id: webjars-locator-core
    artifacts: ["org.webjars:webjars-locator-core", "org.webjars:webjars-locator"]
    status: superseded
    title: Spring 7 dropped webjars-locator-core support — use webjars-locator-lite
    summary: >-
      Spring Framework 7.0 removed WebJars support through webjars-locator-core in favour of webjars-locator-lite;
      spring-webmvc 7.0.8 has only LiteWebJarsResourceResolver (WebJarsResourceResolver is gone — Java config naming it
      fails to compile). The pinned UpgradeSpringBoot_3_4 recipe already swaps the dependency.
    replacement: org.webjars:webjars-locator-lite (Boot-managed)
    replacement_version: 1.1.3 (Boot 4.1 managed)
    followup: >-
      Replace `new WebJarsResourceResolver()` with `new LiteWebJarsResourceResolver()` in the resource-handler
      configuration; version-less /webjars/… URLs keep working with -lite.
    title_ko: "Spring 7은 webjars-locator-core를 지원하지 않습니다. webjars-locator-lite를 써 주세요"
    summary_ko: >-
      Spring Framework 7.0에서 webjars-locator-core 기반 WebJars 지원이 빠지고 webjars-locator-lite만 남았습니다.
      spring-webmvc 7.0.8에는 `LiteWebJarsResourceResolver`만 있어서 `WebJarsResourceResolver`를 쓰는 Java 설정은
      컴파일 오류가 납니다. 의존성은 레시피 `UpgradeSpringBoot_3_4`가 이미 바꿉니다.
    followup_ko: >-
      리소스 핸들러 설정에서 `new WebJarsResourceResolver()`를 `new LiteWebJarsResourceResolver()`로 바꿔 주세요. 버전 없는
      `/webjars/…` URL은 -lite에서도 그대로 동작합니다.
    replacement_ko: "`org.webjars:webjars-locator-lite`(Spring Boot BOM에 버전 있음)"
    docs:
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-7.0-Release-Notes
      - https://repo1.maven.org/maven2/org/webjars/webjars-locator-lite/

  # ------------------------------------------------------------------ security
  - id: shiro-legacy
    artifacts: ["org.apache.shiro:*"]
    applies_when_version_below: "3.0.0"
    status: eol
    title: Apache Shiro 1.x / 2.x are EOL; 3.0.1 is Jakarta-only (and the pinned recipe adds a classifier 3.x lacks)
    summary: >-
      Shiro 1.x is javax only; 2.0–2.2 publish an extra `jakarta` classifier jar; 3.0.0 / 3.0.1 (2026) are
      Jakarta-only main jars without classifier jars, built on Spring 7.0.8 / Boot 4.1.0 (JDK 17), and the Shiro team
      declares 1.x / 2.x EOL. The pinned recipe UpdateApacheShiroDependencies (JakartaEE10) sets org.apache.shiro:* to
      2.0.x WITH classifier jakarta and renames org.apache.shiro.codec / util.ByteSource / StringUtils to
      org.apache.shiro.lang.*. Moving on to 3.0.1 requires removing that classifier (a 3.0.1-jakarta jar does not
      exist → resolution failure) — which is why Shiro is not in jakarta_libraries.yml.
    replacement: org.apache.shiro:shiro-* 3.0.1 (no classifier)
    replacement_version: 3.0.1
    followup: >-
      Either stay on what the recipe leaves (2.0.x + classifier jakarta, EOL) or move every org.apache.shiro:* to
      3.0.1 and delete the <classifier>jakarta</classifier>; then check the 3.0 breaking changes (immutable default
      PrincipalCollection, case-insensitive path matching).
    title_ko: "Apache Shiro 1.x / 2.x는 지원이 종료되었고, 3.0.1은 Jakarta 전용입니다(레시피는 3.x에 없는 classifier를 붙입니다)"
    summary_ko: >-
      Shiro 1.x는 javax 전용이고 2.0~2.2는 `jakarta` classifier jar를 따로 배포합니다. 3.0.0 / 3.0.1(2026)은
      classifier 없는 Jakarta 전용 jar로 Spring 7.0.8 / Spring Boot 4.1.0(JDK 17) 기반이며, Shiro 팀은 1.x / 2.x
      지원 종료를 발표했습니다. 레시피 `UpdateApacheShiroDependencies`(JakartaEE10)는 `org.apache.shiro:*`를 2.0.x +
      classifier `jakarta`로 바꾸고 `org.apache.shiro.codec` / `util.ByteSource` / `StringUtils`를
      `org.apache.shiro.lang.*`으로 옮깁니다. 3.0.1로 올리려면 이 classifier를 지워야 하고(3.0.1-jakarta jar가 없어 의존성을 받지
      못합니다), 그래서 Shiro는 jakarta_libraries.yml에 넣지 않았습니다.
    followup_ko: >-
      레시피가 남긴 상태(2.0.x + classifier `jakarta`, 지원 종료)를 그대로 쓸지, 모든 `org.apache.shiro:*`를 3.0.1로 올리고
      `<classifier>jakarta</classifier>`를 지울지 정해 주세요. 3.0으로 올리면 바뀐 동작(기본 `PrincipalCollection`이 불변이
      되고, 경로 매칭이 대소문자를 구분하지 않음)을 확인해 주세요.
    replacement_ko: "`org.apache.shiro:shiro-*` 3.0.1(classifier 없음)"
    docs:
      - https://shiro.apache.org/blog/2026/06/apache-shiro-300-released.html
      - https://shiro.apache.org/migration-guide.html
      - https://repo1.maven.org/maven2/org/apache/shiro/shiro-web/

  # ------------------------------------------------------------------ persistence / ORM
  - id: hibernate-template
    library: hibernate-template
    status: incompatible
    title: Spring 7 moved org.springframework.orm.hibernate5 to orm.jpa.hibernate and dropped HibernateTemplate / HibernateDaoSupport
    summary: >-
      Spring Framework 7.0 moved the native Hibernate support to org.springframework.orm.jpa.hibernate and kept only
      LocalSessionFactoryBean / LocalSessionFactoryBuilder, HibernateTransactionManager, SpringBeanContainer and
      SpringSessionContext. HibernateTemplate, HibernateCallback, HibernateDaoSupport and the orm.hibernate3 / 4
      packages are gone (spring-orm 7.0.8 jar checked): typical Spring 3/4 DAOs fail with "package
      org.springframework.orm.hibernate5 does not exist" / "cannot find symbol HibernateTemplate". No pinned recipe.
    replacement: org.springframework.orm.jpa.hibernate.LocalSessionFactoryBean / HibernateTransactionManager + SessionFactory.getCurrentSession() (or JPA EntityManager)
    replacement_version: spring-orm 7.0.x (Boot-managed)
    followup: >-
      Review the ported DAOs: imports org.springframework.orm.hibernate5.{LocalSessionFactoryBean,
      HibernateTransactionManager, SpringSessionContext} (and hibernate3 / 4) → org.springframework.orm.jpa.hibernate.*,
      also in Spring XML class="…"; HibernateTemplate / HibernateDaoSupport DAOs → an injected SessionFactory with
      getCurrentSession() (Hibernate 7 Query API, knowledge/notes/hibernate-7.md); re-test transactions.
    title_ko: "Spring 7에서 org.springframework.orm.hibernate5가 orm.jpa.hibernate로 옮겨졌고 HibernateTemplate / HibernateDaoSupport가 삭제되었습니다"
    summary_ko: >-
      Spring Framework 7.0은 Hibernate 네이티브 지원을 `org.springframework.orm.jpa.hibernate`로 옮기고
      `LocalSessionFactoryBean` / `LocalSessionFactoryBuilder`, `HibernateTransactionManager`,
      `SpringBeanContainer`, `SpringSessionContext`만 남겼습니다. `HibernateTemplate`, `HibernateCallback`,
      `HibernateDaoSupport`와 `orm.hibernate3` / `4` 패키지는 삭제되었습니다(spring-orm 7.0.8 jar에서 확인). Spring
      3/4 시절의 DAO는 보통 "package org.springframework.orm.hibernate5 does not exist"나 "cannot find symbol
      HibernateTemplate" 오류가 나며, 이를 바꾸는 레시피는 없습니다.
    followup_ko: >-
      옮긴 DAO를 검토해 주세요. `org.springframework.orm.hibernate5.{LocalSessionFactoryBean,
      HibernateTransactionManager, SpringSessionContext}` import(hibernate3 / 4 포함)는
      `org.springframework.orm.jpa.hibernate.*`로 바꾸고, Spring XML의 `class="…"`도 같이 바꿔야 합니다.
      `HibernateTemplate` / `HibernateDaoSupport`를 쓰는 DAO는 `SessionFactory`를 주입받아
      `getCurrentSession()`을 쓰도록 바꿉니다(Hibernate 7 Query API, knowledge/notes/hibernate-7.md). 트랜잭션은 다시
      테스트해 주세요.
    replacement_ko: "`org.springframework.orm.jpa.hibernate.LocalSessionFactoryBean` / `HibernateTransactionManager`와 `SessionFactory.getCurrentSession()`(또는 JPA `EntityManager`)"
    docs:
      - https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-7.0-Release-Notes
      - https://repo1.maven.org/maven2/org/springframework/spring-orm/7.0.8/
    notes: knowledge/notes/era-libraries.md

  - id: hibernate-entitymanager
    artifacts: ["org.hibernate:hibernate-entitymanager"]
    status: superseded
    title: hibernate-entitymanager was merged into hibernate-core (last release 5.6.15.Final)
    summary: >-
      No Final after 5.6.15.Final; since 5.2 it is an empty shell depending on hibernate-core 5.x
      (javax.persistence), so leaving it in a Boot 4 pom pulls hibernate-core 5.x next to 7.x.
    replacement: remove it — org.hibernate.orm:hibernate-core (Boot-managed, via spring-boot-starter-data-jpa)
    replacement_version: 7.4.1.Final (Boot 4.1 managed)
    followup: Remove the hibernate-entitymanager dependency (no new coordinates) and check dependency:tree for a leftover hibernate-core 5.x.
    title_ko: "hibernate-entitymanager는 hibernate-core에 합쳐졌습니다(마지막 릴리스 5.6.15.Final)"
    summary_ko: >-
      5.6.15.Final 이후 Final 릴리스가 없고, 5.2부터는 hibernate-core 5.x(javax.persistence)에 의존하는 빈 껍데기입니다.
      Spring Boot 4 pom에 남겨 두면 hibernate-core 7.x 옆에 5.x가 함께 들어옵니다.
    followup_ko: >-
      hibernate-entitymanager 의존성을 지워 주세요(대신 추가할 좌표는 없습니다). `dependency:tree`에 hibernate-core 5.x가 남아
      있는지도 확인해 주세요.
    replacement_ko: "의존성을 지웁니다. `org.hibernate.orm:hibernate-core`(Spring Boot BOM에 버전 있음)는 `spring-boot-starter-data-jpa`로 들어옵니다"
    docs:
      - https://repo1.maven.org/maven2/org/hibernate/hibernate-entitymanager/

  - id: hibernate-ehcache
    artifacts: ["org.hibernate:hibernate-ehcache"]
    status: eol
    title: hibernate-ehcache (Ehcache 2 region factory) ended with Hibernate 5.6
    summary: >-
      No Final release after 5.6.15.Final. Hibernate 6 / 7 cache second-level data through JCache only
      (org.hibernate.orm:hibernate-jcache, Boot-managed) with a provider such as org.ehcache:ehcache (classifier
      jakarta); hibernate.cache.region.factory_class=…EhCacheRegionFactory and the Ehcache 2 ehcache.xml must change.
    replacement: org.hibernate.orm:hibernate-jcache + org.ehcache:ehcache (classifier jakarta)
    replacement_version: 7.4.1.Final + 3.12.0 (both Boot 4.1 managed)
    followup: >-
      Set hibernate.cache.region.factory_class=jcache, hibernate.javax.cache.provider=
      org.ehcache.jsr107.EhcacheCachingProvider and convert ehcache.xml to the Ehcache 3 schema (runtime only).
    title_ko: "hibernate-ehcache(Ehcache 2 region factory)는 Hibernate 5.6을 끝으로 지원이 종료되었습니다"
    summary_ko: >-
      5.6.15.Final 이후 Final 릴리스가 없습니다. Hibernate 6 / 7의 2차 캐시는
      JCache(`org.hibernate.orm:hibernate-jcache`, Spring Boot BOM에 버전 있음)와
      `org.ehcache:ehcache`(classifier `jakarta`) 같은 provider로만 동작합니다.
      `hibernate.cache.region.factory_class=…EhCacheRegionFactory` 설정과 Ehcache 2용 ehcache.xml을 바꿔야
      합니다.
    followup_ko: >-
      `hibernate.cache.region.factory_class=jcache`,
      `hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider`로 설정하고 ehcache.xml을
      Ehcache 3 스키마로 바꿔 주세요. 실행할 때만 드러나는 문제라 빌드로는 확인되지 않습니다.
    replacement_ko: "`org.hibernate.orm:hibernate-jcache`와 `org.ehcache:ehcache`(classifier `jakarta`)"
    docs:
      - https://repo1.maven.org/maven2/org/hibernate/hibernate-ehcache/
      - https://repo1.maven.org/maven2/org/hibernate/orm/hibernate-jcache/

  - id: hypersistence-utils
    artifacts: ["com.vladmihalcea:hibernate-types-*", "io.hypersistence:hypersistence-utils-hibernate-5*",
                "io.hypersistence:hypersistence-utils-hibernate-6*", "io.hypersistence:hypersistence-utils-hibernate-70",
                "io.hypersistence:hypersistence-utils-hibernate-71"]
    status: superseded
    title: hibernate-types (com.vladmihalcea) ended at 2.21.1; Hibernate 7.3 / 7.4 need hypersistence-utils-hibernate-73
    summary: >-
      com.vladmihalcea:hibernate-types-* stopped at 2.21.1 (2022) and covers Hibernate 5.x / 6.0 only. The successor
      publishes one artifact per Hibernate line: -73 = Hibernate 7.3 / 7.4 (Boot 4.1 = 7.4.1), -71 = 7.1 / 7.2, -70 =
      7.0, -6x = Hibernate 6 (no -72 / -74). Packages moved to io.hypersistence.utils.hibernate.type.*; with Hibernate
      6+ @TypeDef is gone (use @Type(JsonType.class)).
    replacement: io.hypersistence:hypersistence-utils-hibernate-73
    replacement_version: 3.16.0
    followup: >-
      Swap the dependency, change imports com.vladmihalcea.hibernate.type.* → io.hypersistence.utils.hibernate.type.*,
      replace @TypeDef / @Type(type="jsonb") by @Type(JsonBinaryType.class) or @JdbcTypeCode(SqlTypes.JSON).
    title_ko: "hibernate-types(com.vladmihalcea)는 2.21.1이 마지막입니다. Hibernate 7.3 / 7.4에는 hypersistence-utils-hibernate-73이 필요합니다"
    summary_ko: >-
      `com.vladmihalcea:hibernate-types-*`는 2.21.1(2022)이 마지막이고 Hibernate 5.x / 6.0만 지원합니다. 후속 라이브러리는
      Hibernate 버전마다 아티팩트를 따로 냅니다. -73은 Hibernate 7.3 / 7.4(Spring Boot 4.1은 7.4.1), -71은 7.1 / 7.2,
      -70은 7.0, -6x는 Hibernate 6용입니다(-72 / -74는 없습니다). 패키지는 `io.hypersistence.utils.hibernate.type.*`로
      옮겨졌고, Hibernate 6부터 `@TypeDef`가 없어 `@Type(JsonType.class)`를 써야 합니다.
    followup_ko: >-
      의존성을 바꾸고 `com.vladmihalcea.hibernate.type.*` import를 `io.hypersistence.utils.hibernate.type.*`로
      바꿔 주세요. `@TypeDef` / `@Type(type="jsonb")`는 `@Type(JsonBinaryType.class)`나
      `@JdbcTypeCode(SqlTypes.JSON)`으로 바꿔 주세요.
    docs:
      - https://github.com/vladmihalcea/hypersistence-utils
      - https://repo1.maven.org/maven2/io/hypersistence/hypersistence-utils-hibernate-73/

  - id: hibernate-search-legacy
    artifacts: ["org.hibernate:hibernate-search-orm", "org.hibernate.search:hibernate-search-mapper-orm*",
                "org.hibernate.search:hibernate-search-backend-*"]
    applies_when_version_below: "8.4.0"
    status: incompatible
    title: Hibernate Search 5 / 6 → 8.4 for Hibernate ORM 7.4 (new API, new coordinates, reindex)
    summary: >-
      Search 5 (org.hibernate:hibernate-search-orm, last 5.11.12.Final, javax, Lucene 5) has no Jakarta build; its API
      (FullTextEntityManager, QueryBuilder, @Field / @Indexed) was replaced in Search 6
      (org.hibernate.search:hibernate-search-mapper-orm, @FullTextField, SearchSession). Hibernate Search 8.4 is the
      line for ORM 7.4 (8.3 = 7.3, 8.2 = 7.2); the index format changes → full reindex. No recipe.
    replacement: org.hibernate.search:hibernate-search-mapper-orm + hibernate-search-backend-lucene (or -backend-elasticsearch)
    replacement_version: 8.4.0.Final
    followup: >-
      Port mappings (@Field → @FullTextField / @KeywordField / @GenericField), queries (FullTextEntityManager →
      Search.session(em).search(...)) and configuration keys (hibernate.search.backend.*), then reindex with the
      MassIndexer.
    title_ko: "Hibernate ORM 7.4에는 Hibernate Search 8.4가 필요합니다(5 / 6과 API, 좌표가 다르고 재색인이 필요합니다)"
    summary_ko: >-
      Search 5(`org.hibernate:hibernate-search-orm`, 마지막 5.11.12.Final, javax, Lucene 5)에는 Jakarta 버전이
      없고, 그 API(`FullTextEntityManager`, `QueryBuilder`, `@Field` / `@Indexed`)는 Search
      6(`org.hibernate.search:hibernate-search-mapper-orm`, `@FullTextField`, `SearchSession`)에서
      바뀌었습니다. ORM 7.4에 맞는 버전은 Hibernate Search 8.4입니다(8.3은 7.3, 8.2는 7.2용). 인덱스 형식이 바뀌어 전체 재색인이 필요하고,
      변환 레시피는 없습니다.
    followup_ko: >-
      매핑(`@Field`를 `@FullTextField` / `@KeywordField` / `@GenericField`로), 쿼리(`FullTextEntityManager`를
      `Search.session(em).search(...)`로), 설정 키(`hibernate.search.backend.*`)를 옮긴 뒤 `MassIndexer`로 재색인해
      주세요.
    replacement_ko: "`org.hibernate.search:hibernate-search-mapper-orm`과 `hibernate-search-backend-lucene`(또는 `-backend-elasticsearch`)"
    docs:
      - https://hibernate.org/search/releases/8.4/
      - https://docs.jboss.org/hibernate/search/6.0/migration/html_single/

  - id: querydsl-hibernate-native
    library: querydsl-hibernate-native
    status: incompatible
    title: QueryDSL's Hibernate-native API (com.querydsl.jpa.hibernate.*) does not link against Hibernate 6 / 7
    summary: >-
      The Boot-managed com.querydsl 5.1.0 (classifier jakarta, as jakarta.md names it) is fine for
      JPAQuery / JPAQueryFactory, but com.querydsl.jpa.hibernate.* (HibernateQueryFactory, HibernateQuery,
      HibernateUtil) and the com.querydsl.jpa.support Q*Dialect classes reference org.hibernate.Query /
      org.hibernate.type.*Type / old dialects that Hibernate 7.4 removed. The OpenFeign fork keeps the com.querydsl.*
      packages under new coordinates and supports Hibernate 7 (not managed by Boot; not a blanket relocation because
      plain JPAQueryFactory users stay on the Boot-managed line).
    replacement: io.github.openfeign.querydsl:querydsl-jpa / querydsl-apt (no classifier)
    replacement_version: "7.7"
    followup: >-
      Either port HibernateQueryFactory / HibernateQuery code to JPAQueryFactory (stay on com.querydsl 5.1.0:jakarta) or
      swap every com.querydsl:* artifact for io.github.openfeign.querydsl:* 7.7 (same packages, drop the jakarta
      classifier, regenerate the Q-classes).
    title_ko: "QueryDSL의 Hibernate 네이티브 API(com.querydsl.jpa.hibernate.*)는 Hibernate 6 / 7에서 동작하지 않습니다"
    summary_ko: >-
      Spring Boot BOM의 com.querydsl 5.1.0(classifier `jakarta`)은 `JPAQuery` / `JPAQueryFactory`에는 문제가
      없습니다. 하지만 `com.querydsl.jpa.hibernate.*`(`HibernateQueryFactory`, `HibernateQuery`,
      `HibernateUtil`)와 `com.querydsl.jpa.support`의 `Q*Dialect` 클래스는 Hibernate 7.4에서 삭제된
      `org.hibernate.Query` / `org.hibernate.type.*Type` / 예전 dialect를 참조합니다. OpenFeign 포크는
      `com.querydsl.*` 패키지를 새 좌표로 유지하면서 Hibernate 7을 지원합니다(Spring Boot BOM에는 없고, `JPAQueryFactory`만 쓰는
      프로젝트는 BOM 버전을 그대로 쓰므로 일괄 교체 대상은 아닙니다).
    followup_ko: >-
      `HibernateQueryFactory` / `HibernateQuery` 코드를 `JPAQueryFactory`로 옮기거나(com.querydsl
      5.1.0:jakarta 유지), 모든 `com.querydsl:*` 아티팩트를 `io.github.openfeign.querydsl:*` 7.7로 바꿔 주세요. 바꾸는
      경우 패키지는 같고, `jakarta` classifier를 지우고 Q 클래스를 다시 생성해야 합니다.
    replacement_ko: "`io.github.openfeign.querydsl:querydsl-jpa` / `querydsl-apt`(classifier 없음)"
    docs:
      - https://github.com/OpenFeign/querydsl/releases
      - https://repo1.maven.org/maven2/io/github/openfeign/querydsl/querydsl-jpa/

  # ------------------------------------------------------------------ cache / pools / transactions
  - id: ehcache2
    library: ehcache2
    status: eol
    title: Ehcache 2 — Spring 6+ removed org.springframework.cache.ehcache (EhCacheCacheManager)
    summary: >-
      net.sf.ehcache:ehcache stopped at 2.10.9.2 (2021) and is not managed by Boot 4. spring-context-support 7.0.8 has
      only cache/caffeine, cache/jcache, cache/transaction, so EhCacheCacheManager / EhCacheManagerFactoryBean fail:
      "package org.springframework.cache.ehcache does not exist" in Java config, ClassNotFound for XML bean classes.
    replacement: org.ehcache:ehcache (classifier jakarta) through JCache (javax.cache:cache-api) — or Caffeine
    replacement_version: 3.12.0 + cache-api 1.1.1 (both Boot 4.1 managed)
    followup: >-
      Replace EhCacheCacheManager with JCacheCacheManager (or spring.cache.type=jcache +
      spring.cache.jcache.config=classpath:ehcache.xml), rewrite ehcache.xml to the Ehcache 3 schema (<cache alias> /
      <heap> / <expiry>) and drop net.sf.ehcache; direct net.sf.ehcache.CacheManager use is ported to javax.cache.
    title_ko: "Ehcache 2: Spring 6부터 org.springframework.cache.ehcache(EhCacheCacheManager)가 삭제되었습니다"
    summary_ko: >-
      `net.sf.ehcache:ehcache`는 2.10.9.2(2021)가 마지막이고 Spring Boot 4 BOM에 없습니다. spring-context-support
      7.0.8에는 cache/caffeine, cache/jcache, cache/transaction만 있어서, `EhCacheCacheManager` /
      `EhCacheManagerFactoryBean`을 쓰면 Java 설정은 "package org.springframework.cache.ehcache does not
      exist" 오류가, XML 빈 클래스는 ClassNotFound 오류가 납니다.
    followup_ko: >-
      `EhCacheCacheManager`를 `JCacheCacheManager`로 바꾸거나 `spring.cache.type=jcache`와
      `spring.cache.jcache.config=classpath:ehcache.xml`을 설정해 주세요. ehcache.xml은 Ehcache 3 스키마(`<cache
      alias>` / `<heap>` / `<expiry>`)로 다시 쓰고 `net.sf.ehcache`를 빼 주세요. `net.sf.ehcache.CacheManager`를
      직접 쓰는 코드는 `javax.cache`로 옮깁니다.
    replacement_ko: "JCache(`javax.cache:cache-api`)를 통한 `org.ehcache:ehcache`(classifier `jakarta`) 또는 Caffeine"
    docs:
      - https://www.ehcache.org/documentation/3.10/107.html
      - https://repo1.maven.org/maven2/net/sf/ehcache/ehcache/
    notes: knowledge/notes/era-libraries.md

  - id: hazelcast-legacy
    artifacts: ["com.hazelcast:hazelcast", "com.hazelcast:hazelcast-spring", "com.hazelcast:hazelcast-all",
                "com.hazelcast:hazelcast-client"]
    applies_when_version_below: "4.0"
    status: incompatible
    title: Hazelcast 3.x → 5.x (Boot-managed 5.5.0) moved core APIs (IMap etc.)
    summary: >-
      Boot 4.1 manages com.hazelcast:hazelcast 5.5.0, so 4.x / 5.x projects are fine. 3.x code breaks on the BOM bump:
      com.hazelcast.core.IMap moved to com.hazelcast.map.IMap, hazelcast-client and hazelcast-all were merged into
      hazelcast, the config XML schema changed. Boot 4 no longer supports Spring Session Hazelcast itself.
    replacement: com.hazelcast:hazelcast (Boot-managed)
    replacement_version: 5.5.0
    followup: Port the 3.x API usages (IMap / ITopic / ILock packages, client config) and hazelcast.xml; drop hazelcast-client / hazelcast-all.
    title_ko: "Hazelcast 3.x에서 5.x(Spring Boot BOM의 5.5.0)로 올리면 핵심 API(IMap 등)의 위치가 바뀝니다"
    summary_ko: >-
      Spring Boot 4.1 BOM에는 `com.hazelcast:hazelcast` 5.5.0이 있어 4.x / 5.x 프로젝트는 문제가 없습니다. 3.x 코드는 BOM
      버전으로 올라가면서 깨집니다. `com.hazelcast.core.IMap`이 `com.hazelcast.map.IMap`으로 옮겨졌고, hazelcast-client와
      hazelcast-all은 hazelcast에 합쳐졌으며, 설정 XML 스키마도 바뀌었습니다. Spring Boot 4는 Spring Session Hazelcast를 더
      이상 직접 지원하지 않습니다.
    followup_ko: >-
      3.x API를 쓰는 코드(`IMap` / `ITopic` / `ILock` 패키지, 클라이언트 설정)와 hazelcast.xml을 옮기고 hazelcast-client /
      hazelcast-all을 빼 주세요.
    replacement_ko: "`com.hazelcast:hazelcast`(Spring Boot BOM에 버전 있음)"
    docs:
      - https://docs.hazelcast.com/hazelcast/5.5/migrate/upgrading-from-imdg-3

  - id: commons-dbcp1
    library: dbcp1
    status: eol
    title: Commons DBCP 1.4 is EOL — commons-dbcp2 renames the package and the pool properties
    summary: >-
      commons-dbcp:commons-dbcp stopped at 1.4 and is not managed by Boot 4; it has no javax EE dependency and still
      runs. dbcp2 moves org.apache.commons.dbcp → org.apache.commons.dbcp2 and renames BasicDataSource properties
      (maxActive → maxTotal, maxWait → maxWaitMillis, removeAbandoned → removeAbandonedOnBorrow /
      removeAbandonedOnMaintenance). eGov-style Spring XML (<bean class="org.apache.commons.dbcp.BasicDataSource">
      with <property name="maxActive">) fails only at runtime after a package swap — the build stays green.
    replacement: org.apache.commons:commons-dbcp2 (Boot-managed) — or HikariCP (Boot default)
    replacement_version: 2.14.0 (Boot 4.1 managed)
    followup: >-
      Swap the dependency, rename the class in XML / Java (org.apache.commons.dbcp.BasicDataSource →
      org.apache.commons.dbcp2.BasicDataSource) and the renamed properties, check validationQuery / testOnBorrow and
      start the application once against the real database.
    title_ko: "Commons DBCP 1.4는 지원이 종료되었습니다. commons-dbcp2에서는 패키지와 풀 속성 이름이 바뀝니다"
    summary_ko: >-
      `commons-dbcp:commons-dbcp`는 1.4가 마지막이고 Spring Boot 4 BOM에 없지만, javax EE 의존성이 없어 지금도 동작합니다.
      dbcp2는 패키지가 `org.apache.commons.dbcp`에서 `org.apache.commons.dbcp2`로 바뀌고 `BasicDataSource` 속성 이름도
      바뀝니다(`maxActive`는 `maxTotal`, `maxWait`는 `maxWaitMillis`, `removeAbandoned`는
      `removeAbandonedOnBorrow` / `removeAbandonedOnMaintenance`). eGov 방식 Spring XML(`<bean
      class="org.apache.commons.dbcp.BasicDataSource">`에 `<property name="maxActive">`)은 패키지만 바꾸면 빌드는
      성공하고 실행할 때 실패합니다.
    followup_ko: >-
      의존성을 바꾸고 XML / Java의 클래스 이름(`org.apache.commons.dbcp.BasicDataSource`를
      `org.apache.commons.dbcp2.BasicDataSource`로)과 이름이 바뀐 속성을 고쳐 주세요. `validationQuery` /
      `testOnBorrow`를 확인하고, 실제 데이터베이스에 연결해 애플리케이션을 한 번 기동해 주세요.
    replacement_ko: "`org.apache.commons:commons-dbcp2`(Spring Boot BOM에 버전 있음) 또는 HikariCP(Spring Boot 기본값)"
    docs:
      - https://commons.apache.org/proper/commons-dbcp/
      - https://repo1.maven.org/maven2/org/apache/commons/commons-dbcp2/
    notes: knowledge/notes/era-libraries.md

  - id: druid
    artifacts: ["com.alibaba:druid", "com.alibaba:druid-spring-boot-starter", "com.alibaba:druid-spring-boot-3-starter"]
    status: incompatible
    title: Druid's web monitor is javax.servlet in support.http; Boot 4 needs druid-spring-boot-4-starter
    summary: >-
      com.alibaba:druid 1.2.28 ships com.alibaba.druid.support.http.{StatViewServlet,WebStatFilter} (javax.servlet)
      and, since 1.2.18, com.alibaba.druid.support.jakarta.* (jakarta.servlet). The Boot starters follow the Boot
      generation: druid-spring-boot-starter (Boot 2), -3-starter (Boot 3), -4-starter (1.2.28 only, built against a
      Boot 4.0 milestone).
    replacement: com.alibaba:druid-spring-boot-4-starter (Boot) / com.alibaba:druid 1.2.28 + com.alibaba.druid.support.jakarta.*
    replacement_version: 1.2.28
    followup: >-
      Swap the starter artifactId, change StatViewServlet / WebStatFilter imports and web.xml classes from
      com.alibaba.druid.support.http to com.alibaba.druid.support.jakarta and verify /druid/* on Boot 4.1.
    title_ko: "Druid 웹 모니터(support.http)는 javax.servlet 기반이고, Spring Boot 4에는 druid-spring-boot-4-starter가 필요합니다"
    summary_ko: >-
      `com.alibaba:druid` 1.2.28에는
      `com.alibaba.druid.support.http.{StatViewServlet,WebStatFilter}`(javax.servlet)와, 1.2.18부터 들어간
      `com.alibaba.druid.support.jakarta.*`(jakarta.servlet)가 함께 있습니다. Spring Boot starter는 Spring
      Boot 세대별로 나뉩니다. druid-spring-boot-starter는 Boot 2, -3-starter는 Boot 3, -4-starter는 Boot 4용이며
      -4-starter는 1.2.28만 있고 Spring Boot 4.0 마일스톤으로 빌드되었습니다.
    followup_ko: >-
      starter의 artifactId를 바꾸고, `StatViewServlet` / `WebStatFilter` import와 web.xml의 클래스를
      `com.alibaba.druid.support.http`에서 `com.alibaba.druid.support.jakarta`로 바꿔 주세요. Spring Boot
      4.1에서 `/druid/*`가 열리는지 확인해 주세요.
    replacement_ko: "`com.alibaba:druid-spring-boot-4-starter`(Spring Boot) 또는 `com.alibaba:druid` 1.2.28과 `com.alibaba.druid.support.jakarta.*`"
    docs:
      - https://github.com/alibaba/druid
      - https://repo1.maven.org/maven2/com/alibaba/druid-spring-boot-4-starter/

  - id: jasypt-spring-boot
    artifacts: ["com.github.ulisesbocchio:jasypt-spring-boot*"]
    status: unmanaged
    title: jasypt-spring-boot has no Spring Boot 4 release (4.0.4 is built for Boot 3.5)
    summary: >-
      3.0.x = Boot 2, 4.0.x = Boot 3.5+ (Java 17); no Boot 4 build (upstream issue #429 open). Users report 4.0.4
      mostly works on Boot 4 but ENC(...) replacement in environment variables did not. A failure is a runtime
      decryption failure (DB passwords), not a build error.
    replacement: com.github.ulisesbocchio:jasypt-spring-boot-starter (latest)
    replacement_version: 4.0.4
    followup: >-
      Bump to 4.0.4, start the application once and confirm the ENC(...) values decrypt; values encrypted with the old
      PBEWithMD5AndDES default need jasypt.encryptor.algorithm=PBEWithMD5AndDES and
      iv-generator-classname=org.jasypt.iv.NoIvGenerator.
    title_ko: "jasypt-spring-boot에는 Spring Boot 4용 릴리스가 없습니다(4.0.4는 Spring Boot 3.5용)"
    summary_ko: >-
      3.0.x는 Spring Boot 2용, 4.0.x는 Spring Boot 3.5 이상(Java 17)용이고, Spring Boot 4용 빌드는 없습니다(upstream
      이슈 #429 진행 중). 4.0.4는 Spring Boot 4에서 대체로 동작하지만 환경 변수의 `ENC(...)` 값은 복호화되지 않았다는 보고가 있습니다. 문제가
      생기면 빌드 오류가 아니라 실행 중 복호화 실패(DB 비밀번호 등)로 나타납니다.
    followup_ko: >-
      4.0.4로 올리고 애플리케이션을 한 번 기동해 `ENC(...)` 값이 복호화되는지 확인해 주세요. 예전 기본값 PBEWithMD5AndDES로 암호화한 값은
      `jasypt.encryptor.algorithm=PBEWithMD5AndDES`와
      `iv-generator-classname=org.jasypt.iv.NoIvGenerator`를 설정해야 합니다.
    replacement_ko: "`com.github.ulisesbocchio:jasypt-spring-boot-starter`(최신 버전)"
    docs:
      - https://github.com/ulisesbocchio/jasypt-spring-boot
      - https://github.com/ulisesbocchio/jasypt-spring-boot/issues/429

  - id: atomikos
    artifacts: ["com.atomikos:*", "org.springframework.boot:spring-boot-starter-jta-atomikos"]
    applies_when_version_below: "6.0.0"
    status: unmanaged
    title: Atomikos — Boot no longer ships JTA auto-configuration; use Atomikos 6.0.x (jakarta) + its own Boot 4 starter
    summary: >-
      spring-boot-starter-jta-atomikos (Boot 2) has no Boot 3 / 4 equivalent in the 4.1.0 BOM. Atomikos publishes
      com.atomikos:transactions-spring-boot4-starter 6.0.1; transactions-jta 6.0.1 has a `jakarta` classifier jar,
      4.x / 5.x are javax.transaction.
    replacement: com.atomikos:transactions-spring-boot4-starter
    replacement_version: 6.0.1
    followup: >-
      Replace spring-boot-starter-jta-atomikos with transactions-spring-boot4-starter 6.0.1 (or transactions-jta /
      -jdbc 6.0.1 with classifier jakarta for plain Spring), rename the spring.jta.atomikos.* properties per the
      Atomikos starter and verify the XA datasources at startup.
    title_ko: "Spring Boot는 더 이상 Atomikos JTA 자동 설정을 제공하지 않습니다. Atomikos 6.0.x(jakarta)와 Atomikos의 Spring Boot 4 starter를 써 주세요"
    summary_ko: >-
      `spring-boot-starter-jta-atomikos`(Spring Boot 2)에 해당하는 starter가 4.1.0 BOM에는 없습니다. Atomikos가
      `com.atomikos:transactions-spring-boot4-starter` 6.0.1을 배포하며, transactions-jta 6.0.1에는 `jakarta`
      classifier jar가 있고 4.x / 5.x는 javax.transaction 기반입니다.
    followup_ko: >-
      `spring-boot-starter-jta-atomikos`를 `transactions-spring-boot4-starter` 6.0.1로 바꿔 주세요(Spring
      Boot를 쓰지 않는 Spring 프로젝트는 classifier `jakarta`를 붙인 transactions-jta / -jdbc 6.0.1).
      `spring.jta.atomikos.*` 속성 이름은 Atomikos starter 기준으로 바꾸고, 기동할 때 XA 데이터소스가 정상인지 확인해 주세요.
    docs:
      - https://repo1.maven.org/maven2/com/atomikos/transactions-spring-boot4-starter/
      - https://repo1.maven.org/maven2/com/atomikos/transactions-jta/6.0.1/

  - id: bitronix
    artifacts: ["org.codehaus.btm:*", "org.springframework.boot:spring-boot-starter-jta-bitronix"]
    status: eol
    title: Bitronix Transaction Manager is EOL (2.1.4, 2014) and javax.transaction-only
    summary: >-
      org.codehaus.btm:btm stopped at 2.1.4 and implements javax.transaction; there is no Jakarta build and Boot
      dropped its starter, so it cannot serve jakarta.transaction code.
