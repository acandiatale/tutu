      Convert every .jrxml / .jrtx with Jaspersoft Studio 7, recompile .jasper at build time, add the exporter
      artifacts (PDF / XLSX) and replace JasperReportsPdfView / JasperReportsMultiFormatView with a controller that
      calls JasperExportManager (staying on 6.21.x compiles only without Jasper's javax servlet classes).
    docs:
      - https://github.com/Jaspersoft/jasperreports/releases
      - https://repo1.maven.org/maven2/net/sf/jasperreports/jasperreports/

