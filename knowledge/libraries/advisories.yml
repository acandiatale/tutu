      ActionContext, Preparable, ModelDriven …) to org.apache.struts2.*, fix custom FreeMarker themes, review struts.xml
      constants (allowlist / static access) and replace the sitemesh plugin with a SiteMesh 3 filter.
    docs:
      - https://cwiki.apache.org/confluence/display/WW/Struts+6.x.x+to+7.x.x+migration
