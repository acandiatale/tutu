  # round 10: Spring cases run CodehausToFasterXML anyway (UpgradeSpringFramework_7_0 → UpgradeJackson_2_3, also in the
  # Boot umbrella; rewrite-jackson 1.28.4) → policy recipe; plain Java / servlet projects → jackson1-direct (guide)
  - id: jackson1
    library: jackson1
    applies_to: [spring_legacy, spring_boot, msa]
    status: eol
    title: Jackson 1.x (org.codehaus.jackson) is end of life
    summary: >-
      Last release 1.9.13 (2013). The Framework 7 / Boot 4 chains run CodehausToFasterXML, but it maps only 11 types
      (ObjectMapper, JsonSerializer, map.annotate.JsonSerialize(+Inclusion), AnnotationIntrospector(+Pair),
      Jaxb / Jackson / NopAnnotationIntrospector, Serialization / DeserializationConfig$Feature) and 3 packages
      (annotate, map.ext, map.ser). org.codehaus.jackson.JsonNode / JsonParser / JsonGenerator / JsonFactory,
      type.TypeReference, map.JsonMappingException, map.JsonDeserializer and node.* are NOT mapped and end up as
      "package org.codehaus.jackson… does not exist" in the fix loop.
    replacement: tools.jackson.core:jackson-databind (Jackson 3; Boot 4 default) or com.fasterxml.jackson.core:jackson-databind
    replacement_version: Boot 4.1 managed (Jackson 3.1.4 / Jackson 2 2.21.4)
    policy: recipe
    recipes:
      - org.openrewrite.java.jackson.CodehausToFasterXML
    followup: >-
      Review the remaining org.codehaus.jackson.* code the fix loop ported (JsonNode, TypeReference, custom
      (de)serializers) and @JsonSerialize(include=...) behaviour.
    docs:
      - https://docs.openrewrite.org/recipes/java/jackson/codehaustofasterxml
      - https://repo1.maven.org/maven2/org/codehaus/jackson/jackson-mapper-asl/
    notes: knowledge/notes/era-libraries.md

