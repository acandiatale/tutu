    summary: >-
      Boot 4.1 manages 3.1.1, but code written for 0.2x (Boot 1.x / 2.0–2.1) does not compile: ResourceSupport →
      RepresentationModel, Resource → EntityModel, Resources → CollectionModel, PagedResources → PagedModel,
      ResourceAssembler → RepresentationModelAssembler (toResource → toModel), ControllerLinkBuilder → WebMvcLinkBuilder.
