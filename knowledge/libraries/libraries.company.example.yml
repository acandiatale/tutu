# 회사 라이브러리 표 예시 (v2.1d). 이 파일을 <kb dir>/libraries.yml (기본 kb-v2/libraries.yml, 설정 libraries.company_file)
# 로 복사해 고칩니다. 재배포 없이 다음 실행부터 적용되고, 같은 key(또는 old_keys)의 기본 표
# (knowledge/libraries/jakarta_libraries.yml) 항목을 대신합니다. 형식은 기본 표와 같고 allow_major 만 추가됩니다.
#
# 언제 무엇을 쓰나:
#   - 같은 메이저에 jakarta 빌드가 있으면 version 만 적습니다 (allow_major 없음) → LLM 은 그 버전으로만 올립니다.
#   - 같은 메이저에 jakarta 빌드가 없어 메이저를 올려야 하면, 담당자가 확인한 뒤 allow_major: true 를 적습니다.
#     LLM 이 그 메이저(version)로 옮겨도 승인된 변경으로 표시되지만, 보고서 "운영자 확인 필요"에는 계속 나옵니다.
version: 1
libraries:
  # 같은 메이저(2.x)의 jakarta 릴리스로 고정: 패키지 com.opensymphony.* 와 web.xml 필터 클래스가 2.x 와 같습니다.
  - key: opensymphony:sitemesh
    jakarta_since: "2.6.0"
    version: "2.6.0"
    requires_java: 17
    note: SiteMesh 2.6.0 is the jakarta.servlet build of the 2.x line; packages and the filter class are unchanged.
    docs:
      - https://repo1.maven.org/maven2/opensymphony/sitemesh/

  # 메이저 업그레이드 승인 (SiteMesh 3): 설정 파일(sitemesh3.xml)·필터 등록·데코레이터가 바뀌므로 담당자 확인 후에만.
  - key: org.sitemesh:sitemesh
    jakarta_since: "3.2.0"
    version: "3.3.0"
    requires_java: 17
    allow_major: true
    note: Approved by the web team for projects that already planned the SiteMesh 3 port; check sitemesh3.xml and the filter.
    docs:
      - https://repo1.maven.org/maven2/org/sitemesh/sitemesh/
