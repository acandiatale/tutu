# Library-conditional plan recipes (round 10) — read by sbmig/plan/planner.py::spring_recipes.
#
# Spring Boot projects get these through UpgradeSpringBoot_4_0 (verified in rewrite-spring 6.37.0:
# UpgradeSpringBoot_3_0 → MigrateThymeleafDependencies, SpringBatch4To5Migration, MigrateToHibernate61;
# 3_1 / 3_2 / 3_3 → MigrateToHibernate62 / 64 / 65; 4_0 → SpringBatch5To6Migration, MigrateToHibernate71). Plans
# WITHOUT the Boot umbrella — spring_legacy, MSA library roots (planned as spring_legacy), servlet_tomcat, pure_java —
# got none of them, so e.g. Spring Batch 4 code met the Batch 6 jars that `layout.drop_managed_versions` let the Boot
# 4.1 BOM pick (org.springframework.batch.item → org.springframework.batch.infrastructure.item) and every batch class
# failed to compile. Each rule appends its recipes to the case's spring.rewrite step when the analyzer detected the
# library (sbmig/analyze/libraries.py rule names) and the step's case is listed.
#
#   library   : LibraryUsage name (analyzer rule)
#   cases     : spring.rewrite case types the rule applies to (Boot cases never: the umbrella runs them)
#   recipes   : recipe ids, in order — every id needs a catalog entry whose `sets` lists `library.<library>`
#               (`sbmig recipes check` verifies both directions)
#   note      : plan note text
#   caveats   : optional {artifact: "g:a", note: "..."} — a plan note when the as-is poms declare that artifact
#               (what the recipes do NOT migrate)
#
# Company additions: edit this file (knowledge, not code); remove a rule to switch it off.
version: 1
rules:
  - library: spring-batch
    cases: [spring_legacy]
    # SpringBatch5To6Migration chains SpringBatch4To5Migration first (both Singleton); verified in
    # rewrite-spring 6.37.0 spring-batch-6.0.yml / spring-batch-5.0.yml
    recipes: [org.openrewrite.java.spring.batch.SpringBatch5To6Migration]
    note: >-
      Spring Batch 4 → 5 → 6 (JobBuilderFactory / StepBuilderFactory → JobBuilder / StepBuilder with a JobRepository,
      ItemWriter.write(Chunk), org.springframework.batch.item → …infrastructure.item, core.explore → core.repository.explore)
  - library: hibernate
    cases: [spring_legacy, servlet_tomcat, pure_java]
    # rewrite-hibernate 2.25.0 (runtime dependency of rewrite-spring 6.37.0): 71 → 70 → 66 → 65 → … → 60
    recipes: [org.openrewrite.hibernate.MigrateToHibernate71]
    note: >-
      Hibernate 5 → 6.0 … 7.1 (org.hibernate → org.hibernate.orm coordinates, Session.save/delete/get/load → persist /
      remove / find / getReference, @Type / UserType / Criteria API changes the recipes can rewrite)
  - library: thymeleaf
    cases: [spring_legacy]
    recipes: [org.openrewrite.java.spring.boot3.MigrateThymeleafDependencies]
    note: thymeleaf-spring5 / thymeleaf-extras-springsecurity5 → *-spring6 / *-springsecurity6 (package org.thymeleaf.spring5 → spring6)
    caveats:
      - artifact: "org.thymeleaf:thymeleaf-spring4"
        note: >-
          thymeleaf-spring4 is not migrated by MigrateThymeleafDependencies (spring5 only): move it to
          org.thymeleaf:thymeleaf-spring6 (package org.thymeleaf.spring4 → org.thymeleaf.spring6) by hand; Thymeleaf
          2.1 template resolvers / dialect APIs changed in 3.x (advisory thymeleaf-legacy)
      - artifact: "org.thymeleaf.extras:thymeleaf-extras-springsecurity4"
        note: >-
          thymeleaf-extras-springsecurity4 is not migrated by the recipe: use
          org.thymeleaf.extras:thymeleaf-extras-springsecurity6 (Boot-managed) and the sec: dialect namespace stays
