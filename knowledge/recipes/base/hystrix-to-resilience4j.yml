# Project-owned declarative OpenRewrite recipe: Netflix Hystrix → Resilience4j via Spring Cloud Circuit Breaker.
# Referenced by the `hystrix` library advisory (knowledge/libraries/advisories.yml, policy recipe); the planner
# prepends it to spring.rewrite, so it runs BEFORE UpgradeSpringBoot_4_0 / UpgradeSpringCloud_2025_1 in the same pass.
# Scope = the build passes. Runtime behaviour (instance names, timeouts, fallback signatures, thread-pool isolation)
# is handed over to the owning team through the advisory's follow-up text (report Handover section).
# Not covered (stay manual, see docs/ADVISORIES.md): programmatic HystrixCommand / HystrixObservableCommand
# subclasses, HystrixRequestContext, dashboards / Turbine streams.
---
type: specs.openrewrite.org/v1beta/recipe
name: com.company.migrate.HystrixToResilience4j
displayName: Migrate Netflix Hystrix to Resilience4j (Spring Cloud Circuit Breaker)
description: >
  Replaces @HystrixCommand with Resilience4j @CircuitBreaker and the Hystrix starters with
  spring-cloud-starter-circuitbreaker-resilience4j. commandKey becomes the circuit breaker name; when no commandKey
  existed, name = "default" is used (configure resilience4j.circuitbreaker.instances.default or configs.default).
  fallbackMethod is kept. Hystrix-only attributes (groupKey, threadPoolKey, commandProperties with their
  @HystrixProperty values, threadPoolProperties, ignoreExceptions, observableExecutionMode, defaultFallback,
  raiseHystrixExceptions) are removed, @EnableHystrix / @EnableCircuitBreaker / @EnableHystrixDashboard are dropped,
  and hystrix-javanica / hystrix-core / the Hystrix dashboard starter are removed from the pom. The new starter is
  managed by the Spring Cloud BOM (an explicit version is dropped when managed; 5.0.x = Spring Cloud 2025.1 otherwise).
recipeList:
  # --- annotations: attributes first (while the type is still HystrixCommand), then the type swap
  - org.openrewrite.java.ChangeAnnotationAttributeName:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      oldAttributeName: commandKey
      newAttributeName: name
  # nested @HystrixProperty values go first: RemoveAnnotation also drops their import (RemoveAnnotationAttribute does not)
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@com.netflix.hystrix.contrib.javanica.annotation.HystrixProperty"
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      attributeName: groupKey
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      attributeName: threadPoolKey
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      attributeName: commandProperties
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      attributeName: threadPoolProperties
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      attributeName: ignoreExceptions
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      attributeName: observableExecutionMode
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      attributeName: defaultFallback
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      attributeName: raiseHystrixExceptions
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.netflix.hystrix.contrib.javanica.annotation.HystrixCommand
      newFullyQualifiedTypeName: io.github.resilience4j.circuitbreaker.annotation.CircuitBreaker
  # @CircuitBreaker.name is mandatory. It runs after ChangeType: the new type is a shallow type without attribute
  # metadata (resilience4j is not on the parse classpath), so the value is inserted verbatim (quotes included) and
  # addOnly keeps a name that came from commandKey.
  - org.openrewrite.java.AddOrUpdateAnnotationAttribute:
      annotationType: io.github.resilience4j.circuitbreaker.annotation.CircuitBreaker
      attributeName: name
      attributeValue: '"default"'
      addOnly: true
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@org.springframework.cloud.netflix.hystrix.EnableHystrix"
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@org.springframework.cloud.client.circuitbreaker.EnableCircuitBreaker"
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@org.springframework.cloud.netflix.hystrix.dashboard.EnableHystrixDashboard"
  # --- pom: swap the starters, drop the plain Hystrix artifacts and the dashboard
  # The old starter's explicit version (2.2.x) does not exist for the new artifact. Setting the 2025.1 train's line
  # first keeps the pom resolvable, so RemoveRedundantDependencyVersions below can drop it when a BOM manages it.
  - org.openrewrite.xml.ChangeTagValue:
      elementName: "/project/dependencies/dependency[artifactId='spring-cloud-starter-netflix-hystrix']/version"
      newValue: 5.0.3
  - org.openrewrite.xml.ChangeTagValue:
      elementName: "/project/dependencies/dependency[artifactId='spring-cloud-starter-hystrix']/version"
      newValue: 5.0.3
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-starter-netflix-hystrix
      newGroupId: org.springframework.cloud
      newArtifactId: spring-cloud-starter-circuitbreaker-resilience4j
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.springframework.cloud
      oldArtifactId: spring-cloud-starter-hystrix
      newGroupId: org.springframework.cloud
      newArtifactId: spring-cloud-starter-circuitbreaker-resilience4j
  - org.openrewrite.maven.RemoveDependency:
      groupId: com.netflix.hystrix
      artifactId: hystrix-javanica
  - org.openrewrite.maven.RemoveDependency:
      groupId: com.netflix.hystrix
      artifactId: hystrix-core
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-starter-netflix-hystrix-dashboard
  # No newVersion on the swaps on purpose: a newVersion makes the swap download maven-metadata first, and on a failed
  # download (HTTP 429 seen through the cloud proxy) it silently leaves the Hystrix starter in place. The maven
  # (not java.dependencies) swap refreshes the pom model, so this step sees the new starter: when a Spring Cloud BOM
  # manages it (every train since Hoxton does; UpgradeSpringCloud_2025_1 then moves the BOM to 2025.1.x) the explicit
  # version goes; a pom without a BOM keeps 5.0.3 (the 2025.1 train's line, set above).
  - org.openrewrite.maven.RemoveRedundantDependencyVersions:
      groupPattern: org.springframework.cloud
      artifactPattern: spring-cloud-starter-circuitbreaker-resilience4j
      onlyIfManagedVersionIs: ANY
