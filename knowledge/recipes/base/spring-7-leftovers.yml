# Project-owned declarative recipes for what the pinned upstream chains (rewrite-spring 6.37.0, recipe BOM 3.37.0)
# leave behind on Spring Framework 7 / Spring Boot 4.1 (round 10, verified 2026-10-26 against the jars in ~/.m2:
# spring-boot 3.3.13 vs 4.1.0 class lists, spring-web / spring-webmvc 5.3.31 vs 7.0.8 javap, and one
# rewrite-maven-plugin 6.46.1 probe run). Core building blocks only (ChangeType, ChangeMethodName,
# RemoveMethodInvocations): no network, no recipe jar. They run on the as-is classpath (type attribution), right
# after the Boot umbrella / Framework recipe in spring.rewrite.
---
type: specs.openrewrite.org/v1beta/recipe
name: com.company.migrate.Boot4TypeRelocations
displayName: Spring Boot 4 type moves the 4.0 umbrella does not cover
description: >
  UpgradeSpringBoot_4_0 (rewrite-spring 6.37.0) relocates the autoconfigure packages and the embedded web server
  classes, but not these servlet / error / converter types (verified: absent from every rewrite-spring 6.37.0 yml;
  old FQCN in spring-boot 3.3.13, new FQCN in spring-boot 4.1.0 — spring-boot, spring-boot-webmvc,
  spring-boot-web-server, spring-boot-servlet, spring-boot-http-converter, all reached through
  spring-boot-starter-webmvc). The same table drives the handler boot4-type-relocation-sweep for files the
  recipe skipped (sbmig/triage/handlers/boot4_types.yml — keep both in sync).
recipeList:
  # org.springframework.boot.web.servlet.error → org.springframework.boot.webmvc.error (spring-boot-webmvc)
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.error.ErrorController
      newFullyQualifiedTypeName: org.springframework.boot.webmvc.error.ErrorController
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.error.ErrorAttributes
      newFullyQualifiedTypeName: org.springframework.boot.webmvc.error.ErrorAttributes
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.error.DefaultErrorAttributes
      newFullyQualifiedTypeName: org.springframework.boot.webmvc.error.DefaultErrorAttributes
  # org.springframework.boot.web.server.ErrorPage* → org.springframework.boot.web.error (spring-boot)
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.server.ErrorPage
      newFullyQualifiedTypeName: org.springframework.boot.web.error.ErrorPage
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.server.ErrorPageRegistrar
      newFullyQualifiedTypeName: org.springframework.boot.web.error.ErrorPageRegistrar
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.server.ErrorPageRegistry
      newFullyQualifiedTypeName: org.springframework.boot.web.error.ErrorPageRegistry
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.server.ErrorPageRegistrarBeanPostProcessor
      newFullyQualifiedTypeName: org.springframework.boot.web.error.ErrorPageRegistrarBeanPostProcessor
  # org.springframework.boot.web.servlet.server → org.springframework.boot.web.server.servlet (spring-boot-web-server)
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.server.ConfigurableServletWebServerFactory
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.ConfigurableServletWebServerFactory
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.server.ServletWebServerFactory
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.ServletWebServerFactory
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.server.CookieSameSiteSupplier
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.CookieSameSiteSupplier
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.server.DocumentRoot
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.DocumentRoot
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.server.Jsp
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.Jsp
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.server.Session
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.Session
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.server.SessionStoreDirectory
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.SessionStoreDirectory
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.server.StaticResourceJars
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.StaticResourceJars
  # org.springframework.boot.web.servlet.ServletComponentScan → …web.server.servlet.context (spring-boot-web-server)
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.ServletComponentScan
      newFullyQualifiedTypeName: org.springframework.boot.web.server.servlet.context.ServletComponentScan
  # org.springframework.boot.web.servlet.MultipartConfigFactory / .filter.* → org.springframework.boot.servlet (spring-boot-servlet)
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.MultipartConfigFactory
      newFullyQualifiedTypeName: org.springframework.boot.servlet.MultipartConfigFactory
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.filter.OrderedCharacterEncodingFilter
      newFullyQualifiedTypeName: org.springframework.boot.servlet.filter.OrderedCharacterEncodingFilter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.filter.OrderedFormContentFilter
      newFullyQualifiedTypeName: org.springframework.boot.servlet.filter.OrderedFormContentFilter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.filter.OrderedHiddenHttpMethodFilter
      newFullyQualifiedTypeName: org.springframework.boot.servlet.filter.OrderedHiddenHttpMethodFilter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.filter.OrderedRequestContextFilter
      newFullyQualifiedTypeName: org.springframework.boot.servlet.filter.OrderedRequestContextFilter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.filter.OrderedFilter
      newFullyQualifiedTypeName: org.springframework.boot.servlet.filter.OrderedFilter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.web.servlet.filter.ApplicationContextHeaderFilter
      newFullyQualifiedTypeName: org.springframework.boot.servlet.filter.ApplicationContextHeaderFilter
  # autoconfigure types that moved into the technology modules
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.autoconfigure.web.ServerProperties
      newFullyQualifiedTypeName: org.springframework.boot.web.server.autoconfigure.ServerProperties
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.autoconfigure.http.HttpMessageConverters
      newFullyQualifiedTypeName: org.springframework.boot.http.converter.autoconfigure.HttpMessageConverters
---
type: specs.openrewrite.org/v1beta/recipe
name: com.company.migrate.Spring7RemovedApis
displayName: Spring Framework 7 removed MVC path-matching options and the HttpHeaders Map view
description: >
  Spring Framework 7.0 removed PathMatchConfigurer.setUseSuffixPatternMatch / setUseTrailingSlashMatch /
  setUseRegisteredSuffixPatternMatch and ContentNegotiationConfigurer.favorPathExtension /
  ignoreUnknownPathExtensions (javap: present in spring-webmvc 5.3.31, absent in 7.0.8) — the calls are deleted
  (PathPatternParser is the only matcher; suffix / trailing-slash matching is gone, see
  knowledge/notes/spring-framework-7.md). HttpHeaders no longer implements MultiValueMap: containsKey →
  containsHeader, keySet → headerNames, entrySet → headerSet (same return types in 7.0.8). Not in
  UpgradeSpringFramework_7_0 (rewrite-spring 6.37.0).
recipeList:
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.springframework.web.servlet.config.annotation.PathMatchConfigurer setUseSuffixPatternMatch(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.springframework.web.servlet.config.annotation.PathMatchConfigurer setUseTrailingSlashMatch(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.springframework.web.servlet.config.annotation.PathMatchConfigurer setUseRegisteredSuffixPatternMatch(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.springframework.web.servlet.config.annotation.ContentNegotiationConfigurer favorPathExtension(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: org.springframework.web.servlet.config.annotation.ContentNegotiationConfigurer ignoreUnknownPathExtensions(..)
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.http.HttpHeaders containsKey(..)
      newMethodName: containsHeader
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.http.HttpHeaders keySet()
      newMethodName: headerNames
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.springframework.http.HttpHeaders entrySet()
      newMethodName: headerSet
---
type: specs.openrewrite.org/v1beta/recipe
name: com.company.migrate.Jackson3SpringConverters
displayName: Spring's Jackson 2 converters / views → their Jackson 3 twins
description: >
  The Framework 7 chain (UpgradeJackson_2_3) moves the project's own Jackson code to tools.jackson.*, but keeps
  Spring's Jackson 2 classes, whose constructors take com.fasterxml.jackson.databind.ObjectMapper. The Jackson 3
  twins (javap, spring-web / spring-webmvc 7.0.8) take tools.jackson JsonMapper / XmlMapper (or a builder) — a
  `new …(objectMapper)` call may still need `JsonMapper` instead of `ObjectMapper` (knowledge/notes/spring-framework-7.md).
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.http.converter.json.MappingJackson2HttpMessageConverter
      newFullyQualifiedTypeName: org.springframework.http.converter.json.JacksonJsonHttpMessageConverter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.web.servlet.view.json.MappingJackson2JsonView
      newFullyQualifiedTypeName: org.springframework.web.servlet.view.json.JacksonJsonView
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.http.converter.xml.MappingJackson2XmlHttpMessageConverter
      newFullyQualifiedTypeName: org.springframework.http.converter.xml.JacksonXmlHttpMessageConverter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.web.servlet.view.xml.MappingJackson2XmlView
      newFullyQualifiedTypeName: org.springframework.web.servlet.view.xml.JacksonXmlView
