# Project-owned declarative OpenRewrite recipes, always composed into the run's rewrite.yml.
# UpgradeSpringBoot_4_0 stops at 4.0.x; this bumps every Boot coordinate to the configured 4.1 line.
# NOTE: the version strings below are templated by sbmig.rewrite.runner from config.target.spring_boot_version.
---
type: specs.openrewrite.org/v1beta/recipe
name: com.company.migrate.SpringBoot41Version
displayName: Pin Spring Boot coordinates to 4.1.x
description: After the 4.0 umbrella recipe, move parent / BOM / plugin / direct spring-boot dependencies to 4.1.x.
recipeList:
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: "{{SPRING_BOOT_VERSION}}"
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-dependencies
      newVersion: "{{SPRING_BOOT_VERSION}}"
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: "*"
      newVersion: "{{SPRING_BOOT_VERSION}}"
      overrideManagedVersion: false
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-maven-plugin
      newVersion: "{{SPRING_BOOT_VERSION}}"
---
type: specs.openrewrite.org/v1beta/recipe
name: com.company.migrate.ServletToJakartaAndBoot
displayName: Servlet/Tomcat project preparation
description: javax → jakarta for raw servlet projects, the Servlet 6 API removals, plus servlet-api dependency swap.
recipeList:
  - org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta
  # round 10: encodeUrl → encodeURL, HttpSession.getValue / putValue → getAttribute / setAttribute,
  # setStatus(int, String), UnavailableException constructors (rewrite-migrate-java 3.42.0; Spring projects get it
  # through UpgradeFramework_6_0 → JakartaEE10)
  - org.openrewrite.java.migrate.jakarta.RemovalsServletJakarta10
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: javax.servlet
      oldArtifactId: javax.servlet-api
      newGroupId: jakarta.servlet
      newArtifactId: jakarta.servlet-api
      newVersion: 6.1.x
---
type: specs.openrewrite.org/v1beta/recipe
name: com.company.migrate.Boot4JacksonTwins
displayName: Rename Spring Boot Jackson support types to their Boot 4 / Jackson 3 twins
description: >
  UpgradeSpringBoot_4_0 already migrates serializer bodies from com.fasterxml.jackson.* to tools.jackson.*
  (JsonSerializer → ValueSerializer, SerializerProvider → SerializationContext, JacksonException), but leaves
  Boot's own annotations/base classes behind. These are pure renames (verified in spring-boot-jackson-4.1.0.jar):
  JsonComponent → JacksonComponent, JsonMixin → JacksonMixin, JsonObjectSerializer → ObjectValueSerializer,
  JsonObjectDeserializer → ObjectValueDeserializer. Jackson2ObjectMapperBuilderCustomizer is NOT renamed
  (JsonMapperBuilderCustomizer has a different API) — the LLM fixer handles it with the boot3-to-4 note.
  Code that explicitly wants to stay on Jackson 2 can import org.springframework.boot.jackson2.* instead;
  the add-known-dependency handler then adds the deprecated spring-boot-jackson2 module.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.jackson.JsonComponent
      newFullyQualifiedTypeName: org.springframework.boot.jackson.JacksonComponent
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.jackson.JsonMixin
      newFullyQualifiedTypeName: org.springframework.boot.jackson.JacksonMixin
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.jackson.JsonObjectSerializer
      newFullyQualifiedTypeName: org.springframework.boot.jackson.ObjectValueSerializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.boot.jackson.JsonObjectDeserializer
      newFullyQualifiedTypeName: org.springframework.boot.jackson.ObjectValueDeserializer
