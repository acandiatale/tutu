# Recipe catalog — the single managed list of every recipe id sbmig knows about.
#
# Read by sbmig/plan/catalog.py (`RecipeCatalog`): the planner derives the LLM advisor whitelist
# (ADVISOR_CATALOG), the composite coverage (ADVISOR_COVERAGE) and the profile gates (ADVISOR_GATES) from it,
# and `sbmig recipes list|show|check|sets` reads it. See docs/RECIPES.md.
#
# The catalog does NOT decide what the rule-based planner runs — that is config/default.yml
# `openrewrite.recipes.*` (plan sets; a company config may opt into the framework / security / junit5 sets or add
# `extra` ids). The catalog describes every id those may reference, and `sbmig recipes check` fails when they drift
# apart. v2 runs OpenRewrite recipes only: no project recipes, no library recipes, no KB recipes.
#
# Schema (version 1), one entry per recipe id:
#   id:          fully-qualified recipe name (unique)
#   origin:      openrewrite (the only supported origin; `check` flags anything else)
#   artifact:    Maven groupId:artifactId of the recipe jar; null for core recipes that ship with
#                rewrite-maven-plugin itself (org.openrewrite.java.ChangeType, org.openrewrite.maven.*)
#   provided_by: optional — a configured recipe artifact that brings `artifact` in transitively
#                (`check` accepts the entry when either is listed in openrewrite.recipe_artifacts;
#                `recipes check --jars` verifies that `artifact` is on provided_by's transitive classpath)
#   phase:       default phase when the recipe is added: jdk21 | spring | restructure (informational)
#   description: one line (advisor entries: shown verbatim to the LLM advisor)
#   docs:        upstream documentation URL
#   covers:      recipes this composite already includes (the advisor never adds them on top)
#   gate:        named profile predicate (sbmig/plan/catalog.py GATES) or null = always allowed
#   advisor:     may the LLM plan advisor add it? (false for internal / pinning / building-block recipes)
#   sets:        config/default.yml openrewrite.recipes sets that reference it              (informational, checked)
#   verified:    when the id was verified against docs.openrewrite.org / a recipe jar (YYYY-MM)
#   notes:       optional pointer to a knowledge/notes/*.md migration note
#
# Order matters for the advisor: advisor entries are shown to the LLM in file order.
version: 1
recipes:
  # ------------------------------------------------------------------ JDK 21
  - id: org.openrewrite.java.migrate.UpgradeToJava21
    origin: openrewrite
    artifact: org.openrewrite.recipe:rewrite-migrate-java
    phase: jdk21
    description: Java 8/11/17 → 21 (language level, removed JDK APIs, JAXB/JAX-WS dependencies, plugin versions)
    docs: https://docs.openrewrite.org/recipes/java/migrate/upgradetojava21
    covers:
      - org.openrewrite.java.migrate.javax.AddJaxbDependenciesWithRuntime   # JAXB handling is part of the JDK 11+ chain
    gate: null
    advisor: false
    sets: [jdk21]
    verified: "2026-10"
    notes: knowledge/notes/jdk21.md

  # ------------------------------------------------------------------ javax → jakarta
  - id: org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta
    origin: openrewrite
