[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbmig"
version = "0.1.0"
description = "In-house Spring Boot 4.1 / JDK 21 migration agent: OpenRewrite + triage + LLM build-fix loop + file-based knowledge base"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "lxml>=5.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "requests>=2.31",
  "typer>=0.12",
  "rich>=13.0",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
sbmig = "sbmig.cli:app"

[tool.setuptools.packages.find]
include = ["sbmig*"]

[tool.setuptools.package-data]
sbmig = ["**/*.yml", "**/*.yaml", "**/*.md", "**/*.j2", "**/*.json", "**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs mvn/java/network (deselect with -m 'not integration')",
  "llm: needs a real LLM endpoint",
]

[tool.ruff]
line-length = 110
target-version = "py310"
