<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sbmig — JDK 21 · Spring Boot 4.1 마이그레이션</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F5BD8'/%3E%3Cpath d='M9 22V10l7 7 7-7v12' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* 회사 메인 컬러가 파란색이라 파랑 하나만 뜻을 가진다: 지금 하는 일(현재 단계, 주 버튼, 올려놓을 자리).
     나머지는 잉크색·회색. 그림자·그라데이션 없음, 선과 여백으로만 나눈다. 사내망(오프라인)이라 웹 폰트는 쓰지 않는다. */
  :root {
    --blue: #1F5BD8; --blue-deep: #0E2E6E; --blue-mid: #3C73E3; --blue-tint: #E9F0FD; --blue-soft: #F3F7FE;
    --paper: #F4F7FC; --card: #FFFFFF; --line: #D5DEEE; --line-soft: #E6ECF6;
    --ink: #13213A; --muted: #5E6E8C; --faint: #8A98B3;
    --ok: #1E8A4C; --ok-tint: #E6F5EC; --warn: #B8730E; --warn-tint: #FCF2E3; --bad: #C9372C; --bad-tint: #FCEBE9;
    --log-bg: #0F1B33; --log-ink: #C9D6EE;
    --radius: 12px; --radius-s: 8px;
    --sans: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Pretendard", system-ui, -apple-system, sans-serif;
    --mono: Consolas, "Cascadia Mono", "D2Coding", Menlo, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---- 머리띠 */
  .top { background: var(--blue-deep); color: #fff; }
  .top .in { max-width: 960px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: baseline; gap: 14px; }
  .top .name { font-weight: 700; font-size: 17px; letter-spacing: .01em; }
  .top .what { color: rgba(255,255,255,.72); font-size: 13px; }
  .top .right { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.6); }

  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 56px; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .muted { color: var(--muted); } .small { font-size: 12.5px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }

  /* ---- 1. 올리는 자리(첫 화면의 주인공) */
  .intake { padding: 22px 22px 18px; }
  .drop { display: block; position: relative; border: 2px dashed var(--blue-mid); border-radius: var(--radius); background: var(--blue-soft);
          padding: 44px 24px 40px; text-align: center; transition: background .15s, border-color .15s; cursor: pointer; }
  .drop:hover, .drop.over { background: var(--blue-tint); border-color: var(--blue); }
  .drop.over { border-style: solid; }
  .drop input[type=file] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .drop .icon { width: 44px; height: 44px; margin: 0 auto 14px; display: block; }
  .drop .lead { font-size: 18px; font-weight: 700; color: var(--blue-deep); margin: 0 0 6px; }
  .drop .or { color: var(--muted); margin: 0; }
  .drop .or b { display: inline-block; margin: 0 4px; padding: 6px 14px; border: 1px solid var(--blue); border-radius: var(--radius-s);
                background: #fff; color: var(--blue); font-weight: 600; }
  .drop .limit { margin: 14px 0 0; color: var(--faint); font-size: 12.5px; }
  .drop.has { border-style: solid; background: #fff; padding: 20px 24px; text-align: left; display: flex; align-items: center; gap: 16px; }
  .drop.has .icon { margin: 0; width: 36px; height: 36px; flex: none; }
  .drop.has .lead { font-size: 15px; margin: 0; word-break: break-all; }
  .drop.has .or, .drop.has .limit { display: none; }
  .drop.has .meta { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
  .drop.has .change { margin-left: auto; flex: none; color: var(--blue); font-weight: 600; font-size: 13px; position: relative; z-index: 1; }
  .drop.busy { pointer-events: none; opacity: .6; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .actions .note { color: var(--muted); font-size: 12.5px; }
  .actions .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-s); border: 1px solid var(--blue);
         background: var(--blue); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: #1A4FC0; border-color: #1A4FC0; text-decoration: none; }
  .btn:disabled, .btn[aria-disabled=true] { opacity: .45; cursor: default; pointer-events: none; }
  .btn.quiet { background: #fff; color: var(--blue); }
  .btn.quiet:hover { background: var(--blue-tint); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn.ghost:hover { background: var(--paper); }
  .btn.big { padding: 13px 22px; font-size: 15px; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  details.adv { margin-top: 14px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
                                transform: rotate(-45deg); transition: transform .15s; margin-left: 2px; }
  details.adv[open] summary::before { transform: rotate(45deg); }
  .advgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; margin-top: 12px; }
  .advgrid label.head { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
  .advgrid select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-s); background: #fff; }
  .cfgs label { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
  .cfgs input { margin: 0; accent-color: var(--blue); }
  .advgrid .help { color: var(--faint); font-size: 12px; margin: 6px 0 0; }

  /* ---- 2. 실행 카드 */
  .run { padding: 20px 22px; }
  .runhead { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .runhead .title { font-size: 20px; font-weight: 700; margin: 0; line-height: 1.3; }
  .runhead .title.ok { color: var(--ok); } .runhead .title.bad { color: var(--bad); } .runhead .title.warn { color: var(--warn); }
  .runhead .sub { color: var(--muted); margin: 4px 0 0; font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
  .runhead .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); vertical-align: 1px; margin-right: 8px;
           box-shadow: 0 0 0 0 rgba(31,91,216,.45); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(31,91,216,.45); } 100% { box-shadow: 0 0 0 9px rgba(31,91,216,0); } }

  /* 단계 레일: 이 화면에서 유일하게 힘을 준 요소. 점 = 그래프 노드, 선 = 지난 길. */
  .rail { margin: 22px 0 6px; display: flex; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
  .rail .step { position: relative; flex: 1 1 0; min-width: 72px; text-align: center; }
  .rail .step::before { content: ""; position: absolute; top: 9px; left: 0; right: 0; height: 2px; background: var(--line); }
  .rail .step:first-child::before { left: 50%; } .rail .step:last-child::before { right: 50%; }
  .rail .step.done::before { background: var(--blue); }
  .rail .step.current::before { background: linear-gradient(90deg, var(--blue) 50%, var(--line) 50%); }
  .rail .dot { position: relative; z-index: 1; width: 20px; height: 20px; margin: 0 auto; border-radius: 50%; background: #fff; border: 2px solid var(--line); }
  .rail .step.done .dot { background: var(--blue); border-color: var(--blue); }
  .rail .step.done .dot::after { content: ""; position: absolute; left: 5px; top: 2px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .rail .step.current .dot { border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-tint); }
  .rail .step.current .dot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--blue); animation: blink 1.2s ease-in-out infinite; }
  .rail .step.failed .dot { background: var(--bad); border-color: var(--bad); }
  .rail .step.failed .dot::after { content: ""; position: absolute; left: 8px; top: 4px; width: 2px; height: 10px; background: #fff; transform: rotate(45deg); box-shadow: 0 0 0 0; }
  .rail .step.failed .dot::before { content: ""; position: absolute; left: 8px; top: 4px; width: 2px; height: 10px; background: #fff; transform: rotate(-45deg); }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .rail .label { margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.3; padding: 0 4px; }
  .rail .step.current .label { color: var(--blue-deep); font-weight: 700; }
  .rail .step.done .label { color: var(--ink); }
  .rail .label .en { display: block; color: var(--faint); font-family: var(--mono); font-size: 11px; margin-top: 1px; }
  .railnote { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; min-height: 1.4em; }

  /* 진행 기록 / 로그 탭 */
  .tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line-soft); margin-top: 18px; }
  .tabs button { background: none; border: 0; padding: 8px 12px; margin-bottom: -1px; color: var(--muted); font-weight: 600; cursor: pointer;
                 border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button[aria-selected=true] { color: var(--blue-deep); border-bottom-color: var(--blue); }
  .tabs .tools { margin-left: auto; display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12.5px; }
  .tabs .tools label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; white-space: nowrap; }
  .tabs .tools input { margin: 0; accent-color: var(--blue); }
  .pane { margin-top: 12px; }
  .timeline { max-height: 320px; overflow: auto; border: 1px solid var(--line-soft); border-radius: var(--radius-s); font-size: 13px; }
  .timeline:empty::before { content: "아직 기록이 없습니다."; display: block; padding: 14px; color: var(--faint); }
  .timeline .row { display: grid; grid-template-columns: 64px 18px 150px 1fr; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
  .timeline .row:last-child { border-bottom: 0; }
  .timeline .t { color: var(--faint); font-family: var(--mono); font-size: 12px; }
  .timeline .ev { font-weight: 600; font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .timeline .d { color: var(--muted); word-break: break-all; }
  .timeline .ok { color: var(--ok); } .timeline .bad { color: var(--bad); } .timeline .llm { color: var(--blue); }
  .logbox { background: var(--log-bg); color: var(--log-ink); font: 12px/1.5 var(--mono); padding: 12px 14px; border-radius: var(--radius-s);
            height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .logbox:empty::before { content: "아직 로그가 없습니다."; color: #6D7FA3; }
  .logbox .ERROR, .logbox .CRITICAL, .logbox .runerror { color: #FF9A8F; } .logbox .runerror { font-weight: 700; }
  .logbox .WARNING { color: #FFD48A; } .logbox .DEBUG { color: #7E90B5; } .logbox .console { color: #9FB3D9; }
  .logfoot { display: flex; gap: 14px; color: var(--faint); font-size: 12px; margin-top: 8px; }

  /* ---- 3. 결과 카드 */
  .result { padding: 20px 22px; }
  .result .line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; background: var(--paper); color: var(--muted); border: 1px solid var(--line-soft); }
  .chip.ok { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
  .chip.warn { background: var(--warn-tint); color: var(--warn); border-color: transparent; }
  .chip.bad { background: var(--bad-tint); color: var(--bad); border-color: transparent; }
  .downloads { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .downloads .btn .sub { font-weight: 400; opacity: .8; font-size: 12.5px; }
  .otherfiles { margin-top: 12px; color: var(--muted); font-size: 12.5px; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
  .otherfiles a { font-family: var(--mono); font-size: 12px; }
  details.preview { margin-top: 16px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
  details.preview summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .report { margin-top: 10px; white-space: pre-wrap; font: 12.5px/1.5 var(--mono); max-height: 420px; overflow: auto;
            background: var(--paper); border: 1px solid var(--line-soft); border-radius: var(--radius-s); padding: 12px 14px; }

  /* ---- 4. 지난 실행 */
  details.history summary { cursor: pointer; padding: 14px 22px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; }
  details.history summary .n { color: var(--muted); font-weight: 400; font-size: 13px; }
  details.history summary .refresh { margin-left: auto; color: var(--blue); font-weight: 600; font-size: 13px; background: none; border: 0; cursor: pointer; }
  .runs { list-style: none; margin: 0; padding: 0 10px 10px; max-height: 360px; overflow: auto; }
  .runs li { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 10px 12px; border-radius: var(--radius-s); cursor: pointer; align-items: center; }
  .runs li:hover { background: var(--paper); } .runs li.active { background: var(--blue-tint); }
  .runs .id { font-family: var(--mono); font-size: 12.5px; color: var(--ink); } .runs .when { color: var(--faint); font-size: 12px; }
  .runs .empty { padding: 10px 12px; color: var(--faint); }
  .runs .state { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .runs .state.ok { color: var(--ok); } .runs .state.bad { color: var(--bad); } .runs .state.warn { color: var(--warn); } .runs .state.running { color: var(--blue); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--radius-s);
           font-size: 13px; max-width: min(640px, 90vw); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--bad); }
  footer { max-width: 960px; margin: 0 auto; padding: 0 20px 28px; color: var(--faint); font-size: 12px; }

  @media (max-width: 640px) {
    .top .in { padding: 12px 16px; } .top .right { display: none; }
    main { padding: 16px 16px 40px; gap: 14px; }
    .intake, .run, .result { padding: 16px; }
    .drop { padding: 32px 16px 28px; }
    .advgrid { grid-template-columns: 1fr; }
    .timeline .row { grid-template-columns: 58px 16px 1fr; } .timeline .d { grid-column: 2 / -1; }
    .rail .label .en { display: none; }
    .tabs { flex-wrap: wrap; } .tabs .tools { width: 100%; margin: 0; padding: 6px 12px 8px; }
    .runhead .right { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .pulse, .rail .step.current .dot::after { animation: none; } .drop { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <span class="name">sbmig</span>
    <span class="what">프로젝트를 JDK 21 과 Spring Boot 4.1 로 옮깁니다</span>
    <span class="right" id="envhint" hidden></span>
  </div>
</header>

<main>
  <!-- 1. 올리는 자리 -->
  <section class="card intake" aria-labelledby="intake-title">
    <h2 id="intake-title" class="muted small" style="font-weight:600; margin-bottom:12px;">새 마이그레이션</h2>
    <label class="drop" id="drop" for="zip">
      <input type="file" id="zip" accept=".zip,application/zip,application/x-zip-compressed" aria-label="프로젝트 zip 파일">
      <svg class="icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
        <rect x="6" y="14" width="32" height="24" rx="4" stroke="#1F5BD8" stroke-width="2"/>
        <path d="M6 20h32" stroke="#1F5BD8" stroke-width="2"/>
        <path d="M14 14V9a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v5" stroke="#1F5BD8" stroke-width="2"/>
        <path d="M22 34V25m0 0-4 4m4-4 4 4" stroke="#1F5BD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="lead" id="droplead">프로젝트 zip 파일을 여기에 놓으세요</p>
      <p class="or">또는 <b>파일 선택</b></p>
      <p class="meta" id="dropmeta" hidden></p>
      <p class="limit" id="droplimit">pom.xml(또는 build.xml)이 든 프로젝트 폴더를 zip 으로 묶은 파일</p>
      <span class="change" id="dropchange" hidden>다른 파일 선택</span>
    </label>
    <div class="actions">
      <span class="note" id="cfgnote"></span>
      <span class="spacer"></span>
      <button class="btn big" id="start" disabled>
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5-9-5.5z"/></svg>
        마이그레이션 시작
      </button>
    </div>
    <details class="adv" id="adv">
      <summary>고급 설정</summary>
      <div class="advgrid">
        <div>
          <label class="head">설정 파일 (config/*.yml, 뒤의 것이 우선)</label>
          <div class="cfgs" id="cfgs"><span class="muted small">불러오는 중…</span></div>
          <p class="help" id="cfghelp"></p>
        </div>
        <div>
          <label class="head" for="llm">LLM</label>
          <select id="llm">
            <option value="">설정대로 (기본: 사내 게이트웨이)</option>
            <option value="fake">fake — LLM 없이 (레시피와 재구성만)</option>
          </select>
          <label class="head" for="stop_after" style="margin-top:14px;">여기까지만 실행</label>
          <select id="stop_after">
            <option value="">끝까지 (빌드 검증과 수정 루프 포함)</option>
            <option value="analyze">analyze — 분석까지</option>
            <option value="plan">plan — 계획까지</option>
            <option value="transform">transform — 레시피 적용까지</option>
            <option value="restructure">restructure — 재구성과 구조 검토까지</option>
          </select>
          <p class="help">개발자·진단용입니다. 담당자는 보통 바꿀 것이 없습니다.</p>
        </div>
      </div>
    </details>
  </section>

  <!-- 2. 실행 카드: 실행이 하나 붙으면 보인다 -->
  <section class="card run" id="runcard" hidden aria-live="polite">
    <div class="runhead">
      <div>
        <p class="title" id="title"></p>
        <p class="sub"><span class="mono" id="runid"></span><span id="summary"></span></p>
      </div>
      <div class="right">
        <button class="btn ghost" id="stop" disabled>중단</button>
      </div>
    </div>
    <div class="rail" id="rail" role="list" aria-label="진행 단계"></div>
    <p class="railnote" id="railnote"></p>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-journal" aria-selected="true" aria-controls="pane-journal">진행 기록</button>
      <button role="tab" id="tab-log" aria-selected="false" aria-controls="pane-log">로그 <span class="muted" id="logcount"></span></button>
      <div class="tools" id="logtools" hidden>
        <label><input type="checkbox" id="showdebug"> DEBUG 줄도</label>
        <label><input type="checkbox" id="autoscroll" checked> 자동 스크롤</label>
      </div>
    </div>
    <div class="pane" id="pane-journal" role="tabpanel">
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="pane" id="pane-log" role="tabpanel" hidden>
      <div class="logbox" id="log"></div>
      <div class="logfoot"><span id="logfoot"></span><a id="logfull" href="#" hidden>전체 로그 파일 열기 (sbmig.log)</a></div>
    </div>
  </section>

  <!-- 3. 결과 카드: 끝나면 보인다 -->
  <section class="card result" id="resultcard" hidden>
    <div class="line">
      <h2>결과 파일</h2>
      <span class="counts" id="counts"></span>
    </div>
    <div class="downloads">
      <a class="btn big" id="dl-report" aria-disabled="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13M6 8h4M6 10.5h4"/></svg>
        <span>보고서 받기 <span class="sub">report.md</span></span>
      </a>
      <a class="btn big quiet" id="dl-zip" aria-disabled="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 4.5h12v9H2z"/><path d="M2 4.5l1.5-2.5h9L14 4.5M8 7v4m0 0-2-2m2 2 2-2"/></svg>
        <span>변환된 프로젝트 받기 <span class="sub">result.zip</span></span>
      </a>
    </div>
    <div class="otherfiles" id="otherfiles"></div>
    <details class="preview" id="preview">
      <summary>보고서 미리보기</summary>
      <div class="report" id="report"></div>
    </details>
  </section>

  <!-- 4. 지난 실행 -->
  <details class="card history" id="history">
    <summary>지난 실행 <span class="n" id="runcount"></span><button class="refresh" id="refresh" type="button">새로 고침</button></summary>
    <ul class="runs" id="runs"></ul>
  </details>
</main>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad2 = (n) => String(n).padStart(2, '0');
  const fmtTime = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
  const fmtWhen = (sec) => { try { return new Date(sec * 1000).toLocaleString('ko-KR', {hour12:false, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}); } catch (e) { return ''; } };
  const fmtMB = (bytes) => bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + ' KB' : (bytes / 1048576).toFixed(bytes > 100 * 1048576 ? 0 : 1) + ' MB';

  // 화면이 아는 서버 사실들 (/api/configs)
  let maxUploadMb = 0;          // 0 = 한도 없음
  let defaultConfigs = [];      // 서버가 정한 설정 파일들: 담당자는 고르지 않는다
  let es = null, current = null, file = null;

  // ---------------------------------------------------------------- 알림
  let toastTimer = null;
  function toast(msg, bad) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast'; }, bad ? 8000 : 4000);
  }
  // 접근 토큰: 서버가 SBMIG_WEB_TOKEN 으로 떠 있으면 /?token=<토큰> 으로 한 번 열 때 HttpOnly 쿠키가 심어지고,
  // 그 뒤의 fetch / EventSource 는 같은 출처라 쿠키가 자동으로 붙는다. 401 / 403 이면 안내만 한다.
  function authProblem(r, d) {
    if (r.status !== 401 && r.status !== 403) return false;
    toast(r.status === 401 ? '접근 토큰이 필요합니다. 주소 뒤에 ?token=<토큰> 을 붙여 한 번 여세요 (서버의 SBMIG_WEB_TOKEN).'
                           : '이 서버는 서버 PC(127.0.0.1)에서만 열립니다. ' + ((d && d.error) || ''), true);
    return true;
  }

  // ---------------------------------------------------------------- 1. 올리는 자리
  async function loadConfigs() {
    const r = await fetch('/api/configs'); const d = await r.json();
    if (authProblem(r, d)) return;
    maxUploadMb = Number(d.max_upload_mb) || 0;
    defaultConfigs = Array.isArray(d.default) ? d.default : [];
    const box = $('cfgs'); box.innerHTML = '';
    for (const c of d.configs) {
      const id = 'cfg-' + c.replace(/\W/g, '_');
      box.insertAdjacentHTML('beforeend', `<label><input type="checkbox" value="${esc(c)}" id="${id}" ${defaultConfigs.includes(c) ? 'checked' : ''}>${esc(c)}</label>`);
    }
    if (!d.configs.length) box.innerHTML = '<span class="muted small">config/ 에 default.yml 밖의 yml 이 없습니다.</span>';
    $('cfghelp').textContent = defaultConfigs.length ? `서버 기본값: ${defaultConfigs.join(', ')} (sbmig serve --config / SBMIG_WEB_CONFIGS)`
                                                     : '서버에 기본 설정이 없습니다 — default.yml 만으로 돕니다. sbmig serve --config <이름> 으로 정하세요.';
    $('droplimit').textContent = 'pom.xml(또는 build.xml)이 든 프로젝트 폴더를 zip 으로 묶은 파일' + (maxUploadMb ? ` · 최대 ${maxUploadMb} MB` : '');
    $('envhint').textContent = d.out_dir ? `결과 폴더 ${d.out_dir}` : '';
    $('foot').textContent = `설정 ${d.repo_root}/config` + (defaultConfigs.length ? ` (${defaultConfigs.join(', ')})` : '') + ` · 결과 ${d.out_dir}`;
    describeConfigs();
  }
  function chosenConfigs() {
    const ticked = [...document.querySelectorAll('#cfgs input:checked')].map((i) => i.value);
    return ticked;
  }
  function describeConfigs() {
    const c = chosenConfigs();
    const same = c.length === defaultConfigs.length && c.every((x, i) => x === defaultConfigs[i]);
    let s = c.length ? `설정 ${c.join(', ')}` : '설정 default.yml 만';
    if (!same) s += ' (고급 설정에서 바꿈)';
    if ($('llm').value) s += ` · LLM ${$('llm').value}`;
    if ($('stop_after').value) s += ` · ${$('stop_after').value} 까지만`;
    $('cfgnote').textContent = s;
  }
  $('cfgs').addEventListener('change', describeConfigs);
  $('llm').addEventListener('change', describeConfigs);
  $('stop_after').addEventListener('change', describeConfigs);

  function setFile(f) {
    file = f || null;
    const drop = $('drop');
    if (!file) {
      drop.classList.remove('has'); $('droplead').textContent = '프로젝트 zip 파일을 여기에 놓으세요';
      $('dropmeta').hidden = true; $('dropchange').hidden = true; $('start').disabled = true; return;
    }
    drop.classList.add('has');
    $('droplead').textContent = file.name;
    $('dropmeta').textContent = fmtMB(file.size) + (maxUploadMb && file.size > maxUploadMb * 1048576 ? ` — 업로드 한도 ${maxUploadMb} MB 를 넘습니다` : '');
    $('dropmeta').hidden = false; $('dropchange').hidden = false;
    $('start').disabled = !!(maxUploadMb && file.size > maxUploadMb * 1048576);
  }
  function pickZip(list) {
    const f = list && list[0];
    if (!f) return;
    if (!/\.zip$/i.test(f.name) && !/zip/.test(f.type)) { toast(`${f.name} 은(는) zip 파일이 아닙니다. 프로젝트 폴더를 zip 으로 묶어 올려 주세요.`, true); return; }
    setFile(f);
  }
  $('zip').addEventListener('change', (e) => pickZip(e.target.files));
  const drop = $('drop');
  for (const ev of ['dragenter', 'dragover']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); });
  for (const ev of ['dragleave', 'drop']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); });
  drop.addEventListener('drop', (e) => pickZip(e.dataTransfer && e.dataTransfer.files));
  // 페이지 어디에 떨어뜨려도 브라우저가 파일을 열어 버리지 않게
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); if (!drop.contains(e.target)) pickZip(e.dataTransfer && e.dataTransfer.files); });

  $('start').addEventListener('click', async () => {
    if (!file) return;
    const q = new URLSearchParams({ name: file.name });
    const cfgs = chosenConfigs();
    const same = cfgs.length === defaultConfigs.length && cfgs.every((x, i) => x === defaultConfigs[i]);
    if (!same) q.set('configs', cfgs.join(','));            // 서버 기본값 그대로면 보내지 않는다 (서버가 정한다)
    if ($('stop_after').value) q.set('stop_after', $('stop_after').value);
    if ($('llm').value) q.set('llm_provider', $('llm').value);
    $('start').disabled = true; drop.classList.add('busy');
    $('start').lastChild.textContent = ' 올리는 중…';
    try {
      const r = await fetch('/api/runs?' + q.toString(), { method: 'POST', headers: { 'Content-Type': 'application/zip' }, body: file });
      let d = {}; try { d = await r.json(); } catch (e) {}
      if (authProblem(r, d)) return;
      if (!r.ok) { toast('시작하지 못했습니다: ' + (d.error || r.status), true); return; }
      toast(d.status && d.status.state === 'queued' ? '올렸습니다. 앞의 실행이 끝나면 시작합니다.' : '올렸습니다. 마이그레이션을 시작합니다.');
      setFile(null); $('zip').value = '';
      attach(d.run_id);
      $('runcard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      toast('서버에 보내지 못했습니다: ' + e, true);
    } finally {
      drop.classList.remove('busy'); $('start').lastChild.textContent = ' 마이그레이션 시작'; $('start').disabled = !file;
    }
  });

  // ---------------------------------------------------------------- 2. 실행 카드
  // 상태 한 줄: 담당자가 읽는 말로. (state / success / exit_code 는 /api/runs 의 status dict)
  function describe(st) {
    if (st.state === 'queued') return { cls: '', text: '대기 중 — 앞의 실행이 끝나면 시작합니다', short: '대기' };
    if (st.state === 'running') return { cls: '', text: '마이그레이션 진행 중', short: '진행 중' };
    if (st.state === 'finished') {
      if (st.stop_requested && st.exit_code === 3) return { cls: 'bad', text: '중단되었습니다', short: '중단' };
      if (st.success === true) return { cls: 'ok', text: '빌드에 성공했습니다', short: '성공' };
      if (st.success === false) {
        const open = st.open ?? st.unresolved ?? 0, blocked = st.blocked || 0;
        if (st.exit_code === 3) return { cls: 'bad', text: '실행이 중간에 끊겼습니다' + (st.error ? '. ' + st.error : ''), short: '끊김' };
        const parts = []; if (open) parts.push(`남은 오류 ${open}건`); if (blocked) parts.push(`막힌 항목 ${blocked}건`);
        return { cls: 'warn', text: '빌드가 끝까지 가지 못했습니다' + (parts.length ? `. ${parts.join(', ')}` : ''), short: '미완료' };
      }
      if (st.exit_code === 0) return { cls: 'ok', text: '끝났습니다', short: '끝' };
      if (st.exit_code == null) return { cls: '', text: '끝났습니다 (이전 서버의 실행)', short: '끝' };
      return { cls: 'bad', text: `끝났습니다. 종료 코드 ${st.exit_code}` + (st.error ? '. ' + st.error : ''), short: `코드 ${st.exit_code}` };
    }
    return { cls: '', text: st.state || '', short: st.state || '' };
  }
  function setStatus(st) {
    const d = describe(st);
    const live = st.state === 'running' || st.state === 'queued';
    $('title').className = 'title ' + d.cls;
    $('title').innerHTML = (live ? '<span class="pulse" aria-hidden="true"></span>' : '') + esc(d.text);
    const bits = [];
    if (st.llm_calls != null) bits.push(`LLM 호출 ${st.llm_calls}회`);
    if (st.resolved) bits.push(`해결한 오류 ${st.resolved}건`);
    $('summary').textContent = bits.join(' · ');
    $('stop').disabled = !live || !!st.stop_requested;
    $('stop').hidden = !live;
    $('stop').textContent = st.stop_requested ? '중단 요청됨' : '중단';
    if (st.state === 'finished') { setCurrent(null); showResult(st, d); }
    else if (st.state === 'running' && !railSteps().some((n) => n.classList.contains('done'))) setCurrent(railSteps()[0]);
    if (st.state === 'queued') $('railnote').textContent = '한 번에 한 프로젝트만 옮깁니다 (지식 베이스를 함께 쓰기 때문). 차례가 오면 자동으로 시작합니다.';
    if (st.mode === 'k8s-job') jobStep();                       // 쿠버네티스 Job 모드: 접수 앞에 '파드' 단계
  }
  function jobStep() {
    const rail = $('rail');
    let el = rail.querySelector('.step[data-node="job"]');
    if (!el) { rail.insertAdjacentHTML('afterbegin', stepHtml('job', 'job')); el = rail.firstElementChild; }
    return el;
  }

  // ---- 단계 레일: intake → analyze → plan → phase × N → finalize. `node` 이벤트가 켠다.
  const KO = { job: '파드', intake: '접수', analyze: '분석', plan: '계획', finalize: '마무리',
               transform: '레시피 적용', restructure: '재구성', verify: '빌드 검증', report: '보고서', jdk21: 'JDK 21', spring: 'Spring' };
  const FIXED = ['intake', 'analyze', 'plan'];
  function stepHtml(node, label, extra) {
    const ko = KO[node] || label;
    return `<div class="step" role="listitem" data-node="${esc(node)}"${extra || ''}><div class="dot"></div><div class="label">${esc(ko)}<span class="en">${esc(label)}</span></div></div>`;
  }
  function resetRail() {
    const g = $('rail'); g.innerHTML = '';
    for (const n of FIXED) g.insertAdjacentHTML('beforeend', stepHtml(n, n));
    g.insertAdjacentHTML('beforeend', stepHtml('phase', 'phases', ' data-pending="1" data-placeholder="1"'));
    g.insertAdjacentHTML('beforeend', stepHtml('finalize', 'finalize'));
    $('railnote').textContent = '';
  }
  function railSteps() { return [...$('rail').querySelectorAll('.step')]; }
  function setCurrent(el) {
    for (const n of railSteps()) n.classList.remove('current');
    if (el) el.classList.add('current');
  }
  function phaseStep(phase, pending) {
    const fin = $('rail').querySelector('.step[data-node="finalize"]');
    const html = stepHtml(phase || 'phase', phase || 'phase', (pending ? ' data-pending="1"' : '') + ` data-phase="${esc(phase || '')}"`);
    fin.insertAdjacentHTML('beforebegin', html);
    return fin.previousElementSibling;
  }
  function onNode(ev) {
    const name = ev.node, u = (ev.update && typeof ev.update === 'object') ? ev.update : {};
    const rail = $('rail');
    let el;
    if (name === 'job') {                                       // 쿠버네티스 Job 모드: 파드 생성 중 → 준비됨
      el = jobStep();
      const s = u.state || '';
      if (s === 'running') { el.classList.add('done'); setCurrent(railSteps()[1]); $('railnote').textContent = '파드가 준비됐습니다. 이관을 시작합니다.'; }
      else if (s === 'failed' || s === 'missing') { el.classList.add('failed'); setCurrent(null); $('railnote').textContent = `파드 실패: ${u.message || s}`; }
      else if (s === 'succeeded') { el.classList.add('done'); }
      else { setCurrent(el); $('railnote').textContent = s === 'created' ? '파드 생성 중…' : `파드 생성 중 (${s}${u.message ? ': ' + u.message : ''})`; }
      return;
    }
    if (name === 'plan' && Array.isArray(u.phases)) {          // 계획이 단계 묶음을 정한다: 하나씩 점으로
      for (const p of rail.querySelectorAll('.step[data-phase], .step[data-placeholder]')) p.remove();
      for (const ph of u.phases) phaseStep(ph, true);
    }
    if (name === 'phase') {
      const placeholder = rail.querySelector('.step[data-placeholder]');
      if (placeholder) placeholder.remove();
      const pending = [...rail.querySelectorAll('.step[data-pending]')];
      el = (u.phase && pending.find((n) => n.dataset.phase === u.phase)) || pending[0] || phaseStep(u.phase, false);
      delete el.dataset.pending;
      if (Array.isArray(u.phases)) {                            // 남은 단계가 점보다 많으면 더 그린다
        const left = rail.querySelectorAll('.step[data-pending]').length;
        for (const ph of u.phases.slice(left)) phaseStep(ph, true);
      }
    } else {
      el = railSteps().find((n) => n.dataset.node === name);
      if (!el) { rail.insertAdjacentHTML('beforeend', stepHtml(name, name)); el = rail.lastElementChild; }
    }
    el.classList.add(u.aborted ? 'failed' : 'done');
    if (u.aborted) $('railnote').textContent = `중단: ${u.aborted}`;
    else if (u.stopped) $('railnote').textContent = '요청한 단계까지만 실행하고 멈췄습니다.';
    const steps = railSteps(); let last = -1;
    steps.forEach((n, i) => { if (n.classList.contains('done') || n.classList.contains('failed')) last = i; });
    setCurrent(name === 'finalize' || u.aborted ? null : steps[last + 1]);
  }

  // ---- 진행 기록(journal): 화면에는 마지막 MAX_ROWS 줄만 둔다
  const MAX_ROWS = 400;
  const SKIP = new Set(['ts', 'run_id', 'event', 'path', 'project_dir', 'source', 'record']);
  const ICON = { phase_start: ['▶', ''], step_start: ['▶', ''], loop_start: ['▶', ''], llm_script: ['◆', 'llm'], llm_call: ['◆', 'llm'],
                 attempt: ['▪', ''], attempt_scored: ['▪', ''], decision: ['▪', ''], triage: ['▪', ''], rewrite: ['↻', ''], restructure: ['▣', ''],
                 handover: ['≡', ''], report: ['≡', ''], analyze: ['●', ''], plan: ['●', ''], intake: ['●', ''], preflight: ['●', ''] };
  function journalRow(ev) {
    const name = ev.event || '?';
    let [icon, cls] = ICON[name] || ['·', ''];
    if (['phase_end', 'step_end', 'loop_end', 'build', 'verify'].includes(name)) {
      icon = ev.ok === false ? '✗' : (ev.ok === true ? '✓' : '■'); cls = ev.ok === false ? 'bad' : (ev.ok === true ? 'ok' : '');
    }
    const bits = [];
    for (const [k, v] of Object.entries(ev)) {
      if (SKIP.has(k)) continue;
      let s = (v && typeof v === 'object') ? JSON.stringify(v) : String(v);
      if (s.length > 160) s = s.slice(0, 160) + '…';
      bits.push(`${k}=${s}`);
    }
    if (name === 'phase_start' && ev.phase) $('railnote').textContent = `지금 단계: ${KO[ev.phase] || ev.phase}`;
    if (name === 'phase_end' && ev.phase) {
      $('railnote').textContent = `${KO[ev.phase] || ev.phase} ${ev.ok === false ? '단계가 실패로 끝났습니다' : '단계 끝'}`;
      const step = $('rail').querySelector(`.step[data-phase="${CSS.escape(ev.phase)}"]`);
      if (step && ev.ok === false) { step.classList.remove('done'); step.classList.add('failed'); }
    }
    const tl = $('timeline');
    const div = document.createElement('div'); div.className = 'row';
    div.innerHTML = `<span class="t">${fmtTime(ev.ts)}</span><span class="${cls}">${icon}</span><span class="ev ${cls}">${esc(name)}</span><span class="d">${esc(bits.join('  '))}</span>`;
    tl.appendChild(div);
    while (tl.childElementCount > MAX_ROWS) tl.removeChild(tl.firstElementChild);
    tl.scrollTop = tl.scrollHeight;
  }

  // ---- 로그(sbmig.log): 줄은 메모리 버퍼에만 쌓고(최대 LOG_KEEP), 화면에는 보이는 탭일 때 마지막 LOG_SHOW 줄만
  //      한 프레임에 한 번 그린다. 몇 만 줄이 DOM 에 쌓여 브라우저가 느려지던 문제의 답. 전체는 sbmig.log 파일로.
  const LOG_KEEP = 20000, LOG_SHOW = 1500;
  let logBuf = [], logTotal = 0, logDropped = 0, pendingRender = false, logTab = false;
  function parseLog(kind, line) {
    // sbmig.log: "<date> <time> LEVEL   [stage] logger: message"
    const m = /^\S+ \S+ (DEBUG|INFO|WARNING|ERROR|CRITICAL)\s+(\[[^\]]*\] )?(\S+): (.*)$/.exec(line);
    const level = m ? m[1] : 'INFO';
    return { cls: kind === 'error' ? 'runerror' : level + (kind === 'console' ? ' console' : ''), level,
             text: (m ? `${line.slice(11, 19)} ${level.padEnd(7)} ${m[2] || ''}${m[4]}` : line), debug: level === 'DEBUG' && kind !== 'error' };
  }
  function logLine(kind, line) {
    logBuf.push(parseLog(kind, line)); logTotal++;
    if (logBuf.length > LOG_KEEP) { logBuf.splice(0, logBuf.length - LOG_KEEP); logDropped = logTotal - logBuf.length; }
    scheduleLog();
  }
  function scheduleLog() {
    if (pendingRender) return;
    pendingRender = true;
    requestAnimationFrame(() => { pendingRender = false; renderLog(); });
  }
  function renderLog() {
    $('logcount').textContent = logTotal ? `${logTotal.toLocaleString('ko-KR')}줄` : '';
    if (!logTab) return;
    const showDebug = $('showdebug').checked;
    const rows = showDebug ? logBuf : logBuf.filter((r) => !r.debug);
    const shown = rows.slice(-LOG_SHOW);
    const frag = document.createDocumentFragment();
    for (const r of shown) { const s = document.createElement('span'); s.className = r.cls; s.textContent = r.text + '\n'; frag.appendChild(s); }
    const box = $('log');
    const stick = $('autoscroll').checked || box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
    box.replaceChildren(frag);
    const hidden = rows.length - shown.length + logDropped;
    $('logfoot').textContent = hidden > 0 ? `화면에는 마지막 ${shown.length.toLocaleString('ko-KR')}줄만 보입니다 (앞의 ${hidden.toLocaleString('ko-KR')}줄은 파일에).`
                                          : (showDebug ? '' : 'DEBUG 줄은 숨겼습니다.');
    if (stick) box.scrollTop = box.scrollHeight;
  }
  $('showdebug').addEventListener('change', renderLog);
  function selectTab(which) {
    logTab = which === 'log';
    $('tab-journal').setAttribute('aria-selected', String(!logTab)); $('tab-log').setAttribute('aria-selected', String(logTab));
    $('pane-journal').hidden = logTab; $('pane-log').hidden = !logTab; $('logtools').hidden = !logTab;
    if (logTab) renderLog();
  }
  $('tab-journal').addEventListener('click', () => selectTab('journal'));
  $('tab-log').addEventListener('click', () => selectTab('log'));

  // ---------------------------------------------------------------- 3. 결과 카드
  function fileUrl(name, download) { return `/api/runs/${encodeURIComponent(current)}/files/${name}` + (download ? '?download=1' : ''); }
  function showResult(st, d) {
    const files = st.files || [];
    $('resultcard').hidden = false;
    const chips = [];
    if (st.resolved) chips.push(`<span class="chip ok">해결 ${st.resolved}건</span>`);
    const open = st.open ?? st.unresolved; if (open) chips.push(`<span class="chip warn">남은 오류 ${open}건</span>`);
    if (st.blocked) chips.push(`<span class="chip bad">막힌 항목 ${st.blocked}건</span>`);
    if (st.llm_calls != null) chips.push(`<span class="chip">LLM 호출 ${st.llm_calls}회</span>`);
    $('counts').innerHTML = chips.join('');
    const set = (id, name) => {
      const a = $(id), has = files.includes(name);
      a.setAttribute('aria-disabled', String(!has));
      if (has) { a.href = fileUrl(name, true); a.setAttribute('download', name); } else { a.removeAttribute('href'); a.removeAttribute('download'); }
    };
    set('dl-report', 'report.md'); set('dl-zip', 'result.zip');
    const others = files.filter((f) => f !== 'report.md' && f !== 'result.zip');
    $('otherfiles').innerHTML = others.length ? '<span>그 밖의 파일</span>' + others.map((f) => `<a href="${fileUrl(f)}" target="_blank" rel="noopener">${esc(f)}</a>`).join('') : '';
    if (!files.includes('result.zip')) $('otherfiles').insertAdjacentHTML('afterbegin', '<span class="muted">변환 결과 zip 이 없습니다 (중단되었거나 report.zip_result 가 꺼져 있음).</span>');
    if (files.includes('sbmig.log')) { $('logfull').href = fileUrl('sbmig.log'); $('logfull').hidden = false; }
  }

  // ---------------------------------------------------------------- 실행에 붙기 (SSE)
  function attach(runId) {
    if (es) { es.close(); es = null; }
    current = runId;
    logBuf = []; logTotal = 0; logDropped = 0; renderLog();
    $('runcard').hidden = false; $('resultcard').hidden = true;
    $('runid').textContent = runId; $('summary').textContent = '';
    $('timeline').innerHTML = ''; $('log').replaceChildren(); $('report').textContent = ''; $('logfull').hidden = true;
    $('title').textContent = '연결하는 중…'; $('title').className = 'title';
    resetRail();
    try { history.replaceState(null, '', '#' + encodeURIComponent(runId)); } catch (e) {}
    es = new EventSource(`/api/runs/${encodeURIComponent(runId)}/events`);
    es.addEventListener('status', (e) => setStatus(JSON.parse(e.data)));
    es.addEventListener('node', (e) => onNode(JSON.parse(e.data)));
    es.addEventListener('journal', (e) => journalRow(JSON.parse(e.data)));
    es.addEventListener('log', (e) => logLine('log', JSON.parse(e.data)));
    es.addEventListener('console', (e) => logLine('console', JSON.parse(e.data)));
    es.addEventListener('report', (e) => { $('report').textContent = JSON.parse(e.data); });
    es.addEventListener('end', () => { es.close(); es = null; loadRuns(); });
    // `error` 는 서버의 실행 오류 이벤트(data 있음)이기도, EventSource 의 연결 오류(data 없음)이기도 하다
    es.addEventListener('error', (e) => {
      if (e.data) { logLine('error', '[실행 오류] ' + JSON.parse(e.data).message); toast('실행 오류: ' + JSON.parse(e.data).message, true); return; }
      logLine('console', '[연결이 끊겼습니다 — 서버가 내려갔거나 네트워크 문제입니다. 지난 실행에서 다시 고르면 다시 붙습니다]');
      $('title').textContent = '연결이 끊겼습니다'; $('title').className = 'title warn';
      if (es) { es.close(); es = null; }
    });
    loadRuns();
  }
  $('stop').addEventListener('click', async () => {
    if (!current) return;
    const r = await fetch(`/api/runs/${encodeURIComponent(current)}/stop`, { method: 'POST' });
    $('stop').disabled = true; $('stop').textContent = '중단 요청됨';
    logLine('error', '[중단 요청 — 지금 돌고 있는 단계(빌드 또는 LLM 호출)가 끝나면 멈춥니다]');
    toast(r.ok ? '중단을 요청했습니다. 지금 돌고 있는 단계가 끝나면 멈춥니다.' : '중단 요청이 실패했습니다.', !r.ok);
  });

  // ---------------------------------------------------------------- 4. 지난 실행
  async function loadRuns() {
    const r = await fetch('/api/runs'); const d = await r.json();
    if (authProblem(r, d)) return;
    const ul = $('runs'); ul.innerHTML = '';
    $('runcount').textContent = d.runs.length ? `${d.runs.length}건` : '';
    if (!d.runs.length) { ul.innerHTML = '<li class="empty">아직 실행이 없습니다.</li>'; return; }
    for (const run of d.runs) {
      const li = document.createElement('li');
      li.className = (run.run_id === current) ? 'active' : '';
      const s = describe(run);
      const cls = run.state === 'running' || run.state === 'queued' ? 'running' : s.cls;
      li.innerHTML = `<span><span class="id">${esc(run.run_id)}</span><br><span class="when">${esc(fmtWhen(run.started || 0))}</span></span>` +
                     `<span class="state ${cls}">${esc(s.short)}</span>`;
      li.onclick = () => { attach(run.run_id); $('runcard').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      ul.appendChild(li);
    }
  }
  $('refresh').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); loadRuns(); });

  // ---------------------------------------------------------------- 시작
  resetRail(); loadConfigs(); loadRuns(); setInterval(loadRuns, 15000);
  if (location.hash.length > 1) attach(decodeURIComponent(location.hash.slice(1)));   // #<run id> = 공유할 수 있는 주소
})();
</script>
</body>
