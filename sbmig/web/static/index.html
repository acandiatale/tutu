<body>
<header class="top">
  <div class="in">
    <span class="name">panacea-remediating-oss</span>
    <span class="right" id="envhint" hidden></span>
  </div>
</header>

<main>
  <!-- 1. 업로드 영역 -->
  <section class="card intake" aria-labelledby="intake-title">
    <h2 id="intake-title" class="muted small" style="font-weight:600; margin-bottom:12px;">새 작업</h2>
    <p class="busynote" id="busynote" role="status"></p>
    <!-- 서버 기본 설정이 사내 프레임워크를 지정하면 올리기 전에 적용 범위를 항상 보여 준다 -->
    <div class="fwnote" id="fwupload" role="note" hidden>
      <div class="fwtext"><p class="fwhead" id="fwupload-head"></p><p class="fwbody" id="fwupload-body"></p></div>
    </div>
    <fieldset class="flowpick" id="flowpick">
      <legend>진행 방식</legend>
      <label class="flowopt on" for="flow-full">
        <input type="radio" name="flow" id="flow-full" value="full" checked>
        <span><span class="nm">전체 진행</span><span class="ds">이관 후 취약점 조치까지 진행합니다</span></span>
      </label>
      <label class="flowopt" for="flow-remediation">
        <input type="radio" name="flow" id="flow-remediation" value="remediation">
        <span><span class="nm">취약점 해결</span><span class="ds">이미 이관된 프로젝트의 취약점만 조치합니다</span></span>
      </label>
    </fieldset>
    <label class="drop" id="drop" for="zip">
      <input type="file" id="zip" accept=".zip,application/zip,application/x-zip-compressed" aria-label="프로젝트 ZIP 파일">
      <svg class="icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
        <rect x="6" y="14" width="32" height="24" rx="4" stroke="#1F5BD8" stroke-width="2"/>
        <path d="M6 20h32" stroke="#1F5BD8" stroke-width="2"/>
        <path d="M14 14V9a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v5" stroke="#1F5BD8" stroke-width="2"/>
        <path d="M22 34V25m0 0-4 4m4-4 4 4" stroke="#1F5BD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="lead" id="droplead">프로젝트 ZIP 파일을 여기에 놓으세요</p>
      <p class="or">또는 <b>파일 선택</b></p>
      <p class="meta" id="dropmeta" hidden></p>
      <p class="limit" id="droplimit">pom.xml이 든 프로젝트 폴더를 ZIP으로 묶은 파일</p>
      <span class="change" id="dropchange" hidden>다른 파일 선택</span>
    </label>
    <div class="actions">
      <span class="note" id="cfgnote"></span>
      <span class="spacer"></span>
      <button class="btn big" id="start" disabled>
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5-9-5.5z"/></svg>
        <span id="startlabel">마이그레이션 시작</span>
      </button>
    </div>
    <details class="adv" id="adv">
      <summary>고급 설정</summary>
      <div class="advgrid">
        <div>
          <label class="head">설정 파일 (config/*.yml, 뒤의 것이 우선)</label>
          <div class="cfgs" id="cfgs"><span class="muted small">불러오는 중…</span></div>
          <p class="help" id="cfghelp"></p>
        </div>
        <div>
          <label class="head" for="llm">LLM</label>
          <select id="llm">
            <option value="">설정대로 (기본: 사내 게이트웨이)</option>
            <option value="fake">fake — LLM 없이 (레시피와 재구성만)</option>
          </select>
          <label class="head" for="stop_after" style="margin-top:14px;">여기까지만 실행</label>
          <select id="stop_after">
            <option value="">끝까지 (빌드 검증과 수정 루프 포함)</option>
            <option value="analyze">analyze — 분석까지</option>
            <option value="plan">plan — 계획까지</option>
            <option value="transform">transform — 레시피 적용까지</option>
            <option value="restructure">restructure — 재구성과 구조 검토까지</option>
          </select>
          <p class="help">개발자·진단용입니다. 담당자는 보통 바꿀 것이 없습니다.</p>
        </div>
      </div>
    </details>
  </section>

  <!-- 2. 실행 카드: 실행에 연결되면 표시한다 -->
  <section class="card run" id="runcard" hidden aria-live="polite">
    <div class="runhead">
      <div class="who">
        <p class="fname" id="runname" hidden></p>
        <p class="title" id="title"></p>
        <p class="sub"><span class="mono" id="runid"></span><span id="summary"></span></p>
      </div>
      <div class="right">
        <button class="btn ghost" id="stop" disabled>중단</button>
      </div>
    </div>
    <!-- 사내 프레임워크 프로젝트 안내. 분석이나 계획 저널에서 줄인 범위를 알게 되면 표시한다 -->
    <div class="fwnote" id="fwnote" role="note" hidden>
      <div class="fwtext"><p class="fwhead" id="fwnote-head"></p><p class="fwbody" id="fwnote-body"></p></div>
    </div>
    <div class="rail" id="rail" role="list" aria-label="진행 단계"></div>
    <!-- 빌드 파드가 시작하지 못하고 있을 때만 표시한다. 문장은 서버가 이유에 맞게 만든다 -->
    <div class="podwait" id="podwait" role="status" hidden>
      <p class="pwhint" id="podwaithint"></p>
      <p class="pwraw" id="podwaitraw" hidden></p>
      <p class="pwstop">중단을 누르면 이 실행을 바로 정리합니다.</p>
    </div>
    <p class="railnote" id="railnote"></p>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-journal" aria-selected="true" aria-controls="pane-journal">진행 기록</button>
      <button role="tab" id="tab-log" aria-selected="false" aria-controls="pane-log">로그 <span class="muted" id="logcount"></span></button>
      <div class="tools" id="logtools" hidden>
        <label><input type="checkbox" id="showdebug"> DEBUG 줄도</label>
        <label><input type="checkbox" id="autoscroll" checked> 자동 스크롤</label>
      </div>
    </div>
    <div class="pane" id="pane-journal" role="tabpanel">
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="pane" id="pane-log" role="tabpanel" hidden>
      <div class="logbox" id="log"></div>
      <div class="logfoot"><span id="logfoot"></span><a id="logfull" href="#" hidden>전체 로그 파일 열기 (sbmig.log)</a></div>
    </div>
  </section>

  <!-- 3. 결과 카드: 실행이 끝나면 표시한다 -->
  <section class="card result" id="resultcard" hidden>
    <!-- 진행하지 못한 실행(종료 코드 3)의 사유 한 문장. 접수 거절("Maven 변환 후 신청 부탁드립니다." 등)이 로그 탭에 묻히지 않도록 여기에 표시한다 -->
    <div class="abort" id="abortbox" role="alert" hidden>
      <p class="h">사유</p>
      <p class="why" id="aborttext"></p>
    </div>
    <!-- 사내 프레임워크 프로젝트 안내. 상태의 framework 값으로 표시하므로 지난 실행을 열어도 보인다 -->
    <div class="fwnote" id="fwresult" role="note" hidden>
      <div class="fwtext"><p class="fwhead" id="fwresult-head"></p><p class="fwbody" id="fwresult-body"></p></div>
    </div>
    <div class="line" id="mainline">
      <h2>결과 파일</h2>
      <span class="counts" id="counts"></span>
    </div>
    <div class="downloads" id="maindl">
      <a class="btn big" id="dl-report" aria-disabled="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13M6 8h4M6 10.5h4"/></svg>
        <span>보고서 받기 <span class="sub">report.md</span></span>
      </a>
      <a class="btn big quiet" id="dl-zip" aria-disabled="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 4.5h12v9H2z"/><path d="M2 4.5l1.5-2.5h9L14 4.5M8 7v4m0 0-2-2m2 2 2-2"/></svg>
        <span>변환된 프로젝트 받기 <span class="sub">result.zip</span></span>
      </a>
    </div>
    <div class="otherfiles" id="otherfiles"></div>
    <!-- 취약점 조치: 이 실행에 조치가 있을 때만 표시한다(/api/remediations/<실행 id>가 404면 숨김). 전체 진행에서는 이관 뒤에 이어서 실행한 조치이고,
         취약점 해결 실행에서는 이 영역이 곧 결과다(.solo, 이관 결과 버튼은 숨긴다) -->
    <div class="remed" id="remed" hidden>
      <div class="line">
        <h2>취약점 조치</h2>
        <span class="chip" id="remed-status" role="status"></span>
        <span class="counts" id="remed-counts"></span>
      </div>
      <p class="remnote" id="remed-note" role="note" hidden></p>
      <p class="msg" id="remed-msg"></p>
      <div class="counts reasons" id="remed-reasons"></div>
      <div class="downloads" id="remed-dl"></div>
      <!-- 상태별 동작: 승인 대기는 체크한 항목을 한 번에 적용, 업로드 확인 대기는 두 가지 중 선택, 중지는 이어서 진행 -->
      <div class="act" id="remed-act"></div>
    </div>
    <!-- 코드 변경: 상태에 code_diff가 있을 때만 표시한다. 닫혀 있는 동안에는 아무것도 받아 오지 않는다 -->
    <div class="cdblock" id="cdblock" hidden>
      <div class="line">
        <h2>코드 변경</h2>
        <span class="counts" id="cd-counts"></span>
        <button class="btn quiet" id="cd-toggle" type="button" aria-expanded="false" aria-controls="cd-host">변경 내용 보기</button>
      </div>
      <p class="cdlead">변환 전 프로젝트와 비교해 바뀐 파일을 옮긴 뒤의 위치 기준으로 보여 줍니다.</p>
      <div class="cdhost" id="cd-host" hidden></div>
    </div>
    <details class="preview" id="preview">
      <summary>보고서 미리보기</summary>
      <div class="report" id="report"></div>
    </details>
  </section>

  <!-- 4. 지난 실행 -->
  <details class="card history" id="history">
    <summary>지난 실행 <span class="n" id="runcount"></span><button class="refresh" id="refresh" type="button">새로 고침</button></summary>
    <ul class="runs" id="runs"></ul>
  </details>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad2 = (n) => String(n).padStart(2, '0');
  const fmtTime = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
  const fmtWhen = (sec) => { try { return new Date(sec * 1000).toLocaleString('ko-KR', {hour12:false, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}); } catch (e) { return ''; } };
  const fmtMB = (bytes) => bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + ' KB' : (bytes / 1048576).toFixed(bytes > 100 * 1048576 ? 0 : 1) + ' MB';

  // 서버에서 받아 오는 설정 정보(/api/configs)
  let maxUploadMb = 0;          // 0이면 한도 없음
  let defaultConfigs = [];      // 서버가 정한 설정 파일 목록. 사용자가 고르지 않는다
  let es = null, current = null, file = null;
  let lastState = '';           // 현재 실행의 마지막 status.state. 연결이 끊겼을 때 다시 연결할지 판단한다(끝난 실행이면 연결하지 않음)
  // 진행 방식: full은 이관 후 취약점 조치까지(전체 진행), remediation은 이관 없이 취약점 조치만(취약점 해결)
  const FLOW_FULL = 'full', FLOW_REM = 'remediation';
  let runFlow = FLOW_FULL;      // 현재 실행의 진행 방식(status.flow). 결과 영역과 제목이 이 값을 따른다
  let uploading = false;

  // ---------------------------------------------------------------- 알림
  let toastTimer = null;
  function toast(msg, bad, ms) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast'; }, ms || (bad ? 8000 : 4000));
  }
  // status가 여러 번 와도 깜빡이거나 화면 낭독기가 같은 말을 반복하지 않도록 같은 값이면 다시 쓰지 않는다
  function setText(id, s) { const el = $(id); if (el.textContent !== s) el.textContent = s; }

  // ---------------------------------------------------------------- 동시 실행 중인 이관
  // 서버는 slots 건까지 동시에 실행하고 나머지는 업로드 순서대로 대기시킨다. 이전 서버는 parallel / queue를 보내지 않으므로(null)
  // 그때는 기존 문구를 그대로 쓴다
  function par(p) {                                  // parallel {slots, running, waiting}
    if (!p || typeof p !== 'object') return null;
    const slots = Number(p.slots), running = Number(p.running), waiting = Number(p.waiting);
    if (!Number.isInteger(slots) || slots < 1 || !Number.isFinite(running) || running < 0) return null;
    return { slots, running, waiting: Number.isFinite(waiting) && waiting > 0 ? waiting : 0 };
  }
  function qpos(q) {                                 // queue {position, ahead}: position 1은 다음 차례, ahead는 앞에서 대기 중인 건수
    const position = q && typeof q === 'object' ? Number(q.position) : NaN;
    if (!Number.isInteger(position) || position < 1) return null;
    const ahead = Number(q.ahead);
    return { position, ahead: Number.isInteger(ahead) && ahead >= 0 ? ahead : position - 1 };
  }
  // 업로드 영역 위의 안내. 슬롯이 모두 사용 중이면 업로드 전에 미리 알린다(막지는 않음). /api/runs(15초마다)와 status 이벤트에서 호출한다
  function setParallel(p0) {
    const p = par(p0);
    let s = '';
    if (p && p.running >= p.slots) {
      s = (p.slots > 1 ? `지금 ${p.running}건이 이관 중입니다(동시에 최대 ${p.slots}건). ` : '지금 다른 프로젝트를 이관 중입니다. ')
        + `지금 올리면 대기 ${p.waiting + 1}번째로 기다렸다가 자동으로 시작합니다.`;
    }
    setText('busynote', s);
  }
  function uploadToast(st) {
    if (!st || st.state !== 'queued') return st && st.flow === FLOW_REM ? '올렸습니다. 취약점 조치를 시작합니다.' : '올렸습니다. 마이그레이션을 시작합니다.';
    const p = par(st.parallel), q = qpos(st.queue);
    if (!p || !q) return '올렸습니다. 앞의 실행이 끝나면 시작합니다.';
    // 슬롯이 막 비어 이관 중인 건이 0건이면 '0건이 이관 중이라'라고 표시하지 않는다
    const busy = p.running > 0 ? `지금 ${p.running}건이 이관 중이라 기다립니다. ` : '';
    return '올렸습니다. ' + busy + (q.ahead > 0 ? `앞에 ${q.ahead}건이 있습니다. 차례가 오면 자동으로 시작합니다.`
                                                : '다음 차례입니다. 자리가 나면 자동으로 시작합니다.');
  }
  // 대기 중인 실행의 레일 아래 안내. 대기열 순서는 업로드 시 서버(start_file)에서 정해지므로 창을 닫아도 유지된다
  function queueNote(st) {
    const p = par(st.parallel);
    if (p && p.slots > 1) return `동시에 ${p.slots}건까지 이관합니다. 지금 ${p.running}건이 진행 중이고, 자리가 나면 올린 순서대로 자동으로 시작합니다. 이 창을 닫아도 차례는 유지됩니다.`;
    return '한 번에 한 프로젝트만 옮깁니다. 차례가 오면 자동으로 시작합니다.';
  }
  // 접근 토큰: 서버가 SBMIG_WEB_TOKEN으로 실행 중이면 /?token=<토큰>으로 한 번 접속할 때 HttpOnly 쿠키가 설정되고,
  // 이후 fetch / EventSource는 같은 출처라 쿠키가 자동으로 붙는다. 401 / 403이면 안내만 한다.
  function authProblem(r, d) {
    if (r.status !== 401 && r.status !== 403) return false;
    toast(r.status === 401 ? '접근 토큰이 필요합니다. 주소 뒤에 ?token=<토큰>을 붙여 한 번 여세요(서버의 SBMIG_WEB_TOKEN).'
                           : '이 서버는 서버 PC(127.0.0.1)에서만 열립니다. ' + ((d && d.error) || ''), true);
    return true;
  }

  // ---------------------------------------------------------------- 1. 업로드 영역
  async function loadConfigs() {
    const r = await fetch('/api/configs'); const d = await r.json();
    if (authProblem(r, d)) return;
    maxUploadMb = Number(d.max_upload_mb) || 0;
    defaultConfigs = Array.isArray(d.default) ? d.default : [];
    const box = $('cfgs'); box.innerHTML = '';
    for (const c of d.configs) {
      const id = 'cfg-' + c.replace(/\W/g, '_');
      box.insertAdjacentHTML('beforeend', `<label><input type="checkbox" value="${esc(c)}" id="${id}" ${defaultConfigs.includes(c) ? 'checked' : ''}>${esc(c)}</label>`);
    }
    if (!d.configs.length) box.innerHTML = '<span class="muted small">config/에 default.yml 말고는 yml 파일이 없습니다.</span>';
    $('cfghelp').textContent = defaultConfigs.length ? `서버 기본값: ${defaultConfigs.join(', ')} (sbmig serve --config / SBMIG_WEB_CONFIGS)`
                                                     : '서버에 기본 설정이 없어 default.yml만으로 돕니다. sbmig serve --config <이름>으로 정하세요.';
    setDropLimit();
    fwRemAlways = !!(d.framework && d.framework.remediation_always === true);
    setUploadFramework(d.framework);
    renderFramework();
    $('envhint').textContent = d.out_dir ? `결과 폴더 ${d.out_dir}` : '';
    describeConfigs();
  }
  function chosenConfigs() {
    const ticked = [...document.querySelectorAll('#cfgs input:checked')].map((i) => i.value);
    return ticked;
  }
  function describeConfigs() {
    const c = chosenConfigs();
    const same = c.length === defaultConfigs.length && c.every((x, i) => x === defaultConfigs[i]);
    let s = c.length ? `설정 ${c.join(', ')}` : '설정 default.yml만';
    if (!same) s += ' (고급 설정에서 바꿈)';
    if ($('llm').value) s += ` · LLM ${$('llm').value}`;
    if ($('stop_after').value && chosenFlow() === FLOW_FULL) s += ` · ${$('stop_after').value}까지만`;
    $('cfgnote').textContent = s;
  }
  $('cfgs').addEventListener('change', describeConfigs);
  $('llm').addEventListener('change', describeConfigs);
  $('stop_after').addEventListener('change', describeConfigs);

  // ---- 진행 방식: 전체 진행(기본) / 취약점 해결. 시작 버튼, 안내 문구, 단계 레일이 이 선택을 따른다
  function chosenFlow() { const r = document.querySelector('input[name="flow"]:checked'); return r && r.value === FLOW_REM ? FLOW_REM : FLOW_FULL; }
  function startLabel() { return chosenFlow() === FLOW_REM ? '취약점 조치 시작' : '마이그레이션 시작'; }
  function setDropLimit() {
    const what = chosenFlow() === FLOW_REM ? '이관을 마친 프로젝트 폴더(pom.xml 포함)를 ZIP으로 묶은 파일' : 'pom.xml이 든 프로젝트 폴더를 ZIP으로 묶은 파일';
    $('droplimit').textContent = what + (maxUploadMb ? ` · 최대 ${maxUploadMb} MB` : '');
  }
  function syncFlow() {
    for (const r of document.querySelectorAll('input[name="flow"]')) r.closest('.flowopt').classList.toggle('on', r.checked);
    if (!uploading) $('startlabel').textContent = startLabel();
    $('stop_after').disabled = chosenFlow() === FLOW_REM;    // 취약점 해결 실행에는 멈출 이관 단계가 없다(서버도 이 값을 받지 않는다)
    setDropLimit(); describeConfigs();
  }
  for (const r of document.querySelectorAll('input[name="flow"]')) r.addEventListener('change', syncFlow);

  function setFile(f) {
    file = f || null;
    const drop = $('drop');
    if (!file) {
      drop.classList.remove('has'); $('droplead').textContent = '프로젝트 ZIP 파일을 여기에 놓으세요';
      $('dropmeta').hidden = true; $('dropchange').hidden = true; $('start').disabled = true; return;
    }
    drop.classList.add('has');
    $('droplead').textContent = file.name;
    $('dropmeta').textContent = fmtMB(file.size) + (maxUploadMb && file.size > maxUploadMb * 1048576 ? ` — 업로드 한도 ${maxUploadMb} MB를 넘습니다` : '');
    $('dropmeta').hidden = false; $('dropchange').hidden = false;
    $('start').disabled = !!(maxUploadMb && file.size > maxUploadMb * 1048576);
  }
  function pickZip(list) {
    const f = list && list[0];
    if (!f) return;
    if (!/\.zip$/i.test(f.name) && !/zip/.test(f.type)) { toast(`${f.name}은(는) ZIP 파일이 아닙니다. 프로젝트 폴더를 ZIP으로 묶어 올려 주세요.`, true); return; }
    setFile(f);
  }
  $('zip').addEventListener('change', (e) => pickZip(e.target.files));
  const drop = $('drop');
  for (const ev of ['dragenter', 'dragover']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); });
  for (const ev of ['dragleave', 'drop']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); });
  drop.addEventListener('drop', (e) => pickZip(e.dataTransfer && e.dataTransfer.files));
  // 페이지 어디에 파일을 놓아도 브라우저가 파일을 열지 않도록 막는다
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); if (!drop.contains(e.target)) pickZip(e.dataTransfer && e.dataTransfer.files); });

  $('start').addEventListener('click', async () => {
    if (!file) return;
    const upName = file.name;                                // setFile(null) 이후에도 실행 카드에 파일 이름을 바로 표시하기 위해 보관한다
    const q = new URLSearchParams({ name: upName });
    const cfgs = chosenConfigs();
    const same = cfgs.length === defaultConfigs.length && cfgs.every((x, i) => x === defaultConfigs[i]);
    if (!same) q.set('configs', cfgs.join(','));            // 서버 기본값과 같으면 보내지 않는다(서버가 정한다)
    const flow = chosenFlow();
    q.set('flow', flow);                                     // full | remediation
    if ($('stop_after').value && flow === FLOW_FULL) q.set('stop_after', $('stop_after').value);
    if ($('llm').value) q.set('llm_provider', $('llm').value);
    $('start').disabled = true; drop.classList.add('busy');
    uploading = true; $('flowpick').disabled = true; $('flowpick').classList.add('locked');
    $('startlabel').textContent = '올리는 중…';
    try {
      const r = await fetch('/api/runs?' + q.toString(), { method: 'POST', headers: { 'Content-Type': 'application/zip' }, body: file });
      let d = {}; try { d = await r.json(); } catch (e) {}
      if (authProblem(r, d)) return;
      // 서버 볼륨의 여유 공간이 하한(fleet.min_free_gb)보다 작아 거절된 업로드는 요청자가 할 일을 한국어로 알린다
      if (r.status === 507) { toast('서버의 저장 공간이 부족해 시작하지 못했습니다. 운영 담당자에게 알려 주세요.', true); return; }
      if (!r.ok) { toast('시작하지 못했습니다: ' + (d.error || r.status), true); return; }
      const st = d.status || {};
      if (st.parallel) setParallel(st.parallel);
      toast(uploadToast(st), false, st.state === 'queued' ? 8000 : 0);   // 대기 안내는 조금 더 오래 보여 준다(화면에도 남는다)
      setFile(null); $('zip').value = '';
      attach(d.run_id, false, st.flow || flow, st.upload || upName);
      if (st.state) setStatus(st);                     // SSE 연결 전에도 '대기 중'을 바로 표시한다(같은 status가 다시 와도 결과는 같다)
      $('runcard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      toast('서버에 보내지 못했습니다: ' + e, true);
    } finally {
      uploading = false; $('flowpick').disabled = false; $('flowpick').classList.remove('locked');
      drop.classList.remove('busy'); $('startlabel').textContent = startLabel(); $('start').disabled = !file;
    }
  });

  // ---------------------------------------------------------------- 2. 실행 카드
  // 상태 한 줄을 사용자가 읽기 쉬운 문장으로 만든다(state / success / exit_code는 /api/runs의 status dict)
  function describe(st) {
    if (st.state === 'queued') {
      const q = qpos(st.queue);
      if (!q) return { cls: '', text: '대기 중 — 앞의 실행이 끝나면 시작합니다', short: '대기' };   // 이전 서버
      return { cls: '', text: q.ahead > 0 ? `대기 중 — 앞에 ${q.ahead}건이 기다립니다` : '대기 중 — 다음 차례입니다', short: `대기 ${q.position}번` };
    }
    const remOnly = st.flow === FLOW_REM;
    if (st.state === 'running') return { cls: '', text: remOnly ? '취약점 조치 진행 중' : '마이그레이션 진행 중', short: '진행 중' };
    if (st.state === 'finished') {
      if (st.stop_requested && st.exit_code === 3) return { cls: 'bad', text: '중단되었습니다', short: '중단' };
      // 진행하지 못한 실행(접수 거절, 조치 환경 미비 등): 사유는 결과 영역 맨 위에 문장으로 표시하고(abortText) 제목은 짧게 쓴다
      if (st.exit_code === 3 && abortText(st)) return { cls: 'bad', text: '진행하지 못했습니다', short: '진행 못 함' };
      if (remOnly) {
        if (st.success === true) return { cls: 'ok', text: '조치를 마쳤습니다', short: '조치 완료' };
        const r = remTitle(st.remediation && st.remediation.status);
        if (r) return r;
      }
      if (st.success === true) return { cls: 'ok', text: '빌드에 성공했습니다', short: '성공' };
      if (st.success === false) {
        const open = st.open ?? st.unresolved ?? 0, blocked = st.blocked || 0;
        if (st.exit_code === 3) return { cls: 'bad', text: '실행이 중간에 끊겼습니다' + (st.error ? '. ' + st.error : ''), short: '끊김' };
        const parts = []; if (open) parts.push(`남은 오류 ${open}건`); if (blocked) parts.push(`막힌 항목 ${blocked}건`);
        return { cls: 'warn', text: '빌드가 끝까지 가지 못했습니다' + (parts.length ? `. ${parts.join(', ')}` : ''), short: '미완료' };
      }
      if (st.exit_code === 0) return { cls: 'ok', text: '끝났습니다', short: '끝' };
      if (st.exit_code == null) return { cls: '', text: '끝났습니다 (이전 서버의 실행)', short: '끝' };
      return { cls: 'bad', text: `끝났습니다. 종료 코드 ${st.exit_code}` + (st.error ? '. ' + st.error : ''), short: `코드 ${st.exit_code}` };
    }
    return { cls: '', text: st.state || '', short: st.state || '' };
  }
  // 취약점 해결 실행의 제목. 조치 상태별로 한 문장(조치 보고서의 결과 문장과 같음)이고, 모르는 상태면 null
  const REM_TITLE = { SUCCEEDED: ['ok', '조치를 마쳤습니다', '조치 완료'], INCOMPLETE: ['warn', '일부만 조치되었습니다', '일부 조치'],
                      AWAITING_APPROVAL: ['warn', '승인을 기다리고 있습니다', '승인 대기'], AWAITING_CONFIRMATION: ['warn', '확인이 필요합니다', '확인 필요'],
                      STOPPED: ['warn', '조치를 멈췄습니다', '멈춤'], INTERRUPTED: ['bad', '조치가 중단되었습니다', '중단'],
                      FAILED: ['bad', '조치하지 못했습니다', '실패'], QUEUED: ['', '취약점 조치 진행 중', '진행 중'], RUNNING: ['', '취약점 조치 진행 중', '진행 중'] };
  function remTitle(status) { const t = REM_TITLE[status]; return t ? { cls: t[0], text: t[1], short: t[2] } : null; }
  // 전체 진행에 이어서 한 취약점 조치의 결과를 짧게 쓴다. 조치를 시작하지 않았거나 끝나지 않은 실행이면 빈 문자열이다
  const REM_SHORT = { SUCCEEDED: '조치 완료', INCOMPLETE: '일부만 조치', AWAITING_APPROVAL: '승인 대기', AWAITING_CONFIRMATION: '확인 필요',
                      STOPPED: '조치 멈춤', INTERRUPTED: '조치 중단', FAILED: '조치 실패' };
  // 빌드가 실패한 프로젝트에 이어서 한 조치가 고칠 것은 다 고치고 빌드 확인만 남았는지 확인한다(사유가 조치 전 빌드 실패 하나뿐)
  function remBuildOnly(r, tolerated) {
    return !!r && tolerated === true && r.status === 'INCOMPLETE' && Array.isArray(r.reasons)
      && r.reasons.length === 1 && r.reasons[0] === 'baseline_build_failed';
  }
  function remShort(st) {
    const r = st && st.remediation;
    if (!r || typeof r !== 'object' || st.flow === FLOW_REM || st.state !== 'finished' || r.status === 'skipped') return '';
    if (remBuildOnly(r, r.baseline_tolerated === true)) return '취약점 조치함(빌드 미확인)';
    return REM_SHORT[r.status] ? `취약점 ${REM_SHORT[r.status]}` : '';
  }
  // 진행하지 못한 사유 한 문장. 엔진의 중단 사유(접수 거절 등), 시작하지 못한 조치, 웹에서 알고 있는 오류 순으로 찾는다
  function abortText(st) {
    // 서버가 보고서와 같은 번역표로 옮긴 한국어(abort_reason_ko)를 먼저 쓰고, 없으면 엔진의 문장을 그대로 쓴다
    if (st.abort_reason_ko || st.abort_reason) return String(st.abort_reason_ko || st.abort_reason);
    const r = st.remediation;
    if (r && r.status === 'skipped' && st.flow === FLOW_REM) {
      const missing = Array.isArray(r.missing) && r.missing.length ? ` (필요한 값: ${r.missing.join(', ')})` : '';
      return '취약점 조치를 시작하지 못했습니다. 실행 환경이 갖춰지지 않았습니다' + missing + '.';
    }
    return st.error ? String(st.error) : '';
  }
  // 열린 실행의 맨 위에 업로드한 파일 이름을 표시한다(길면 말줄임, title에 전체 이름). 이름이 없는 이전 실행이면 숨긴다
  function setRunName(name) {
    const n = $('runname');
    if (!name) { n.hidden = true; n.textContent = ''; n.removeAttribute('title'); return; }
    if (n.textContent !== name) { n.textContent = name; n.title = name; }
    n.hidden = false;
  }
  function setTitle(cls, text, live) {
    const t = $('title'), key = `${cls}|${live ? 1 : 0}|${text}`;
    if (t.dataset.key === key) return;               // 같은 제목이면 그대로 둔다(점 애니메이션이 처음부터 다시 시작되지 않도록)
    t.dataset.key = key; t.className = 'title ' + cls;
    t.innerHTML = (live ? '<span class="pulse" aria-hidden="true"></span>' : '') + esc(text);
  }
  // status는 한 연결에서 여러 번 온다(처음, 대기 순서가 바뀌거나 시작할 때, 끝). 몇 번 와도 레일, 기록, 로그를 되돌리지 않는다
  let queueText = '', statusKey = '';
  function setStatus(st) {
    lastState = st.state || '';
    if (st.upload) setRunName(st.upload);
    // 진행 방식이 정해지면 레일을 그에 맞게 그린다. 이미 그린 진행을 지우지 않도록 엔진 단계가 아직 오지 않았을 때만 한다
    if (st.flow === FLOW_REM || st.flow === FLOW_FULL) {
      runFlow = st.flow;
      if (railFlow !== runFlow && !engineSeen()) resetRail(runFlow);
    }
    // 줄인 범위로 실행한 실행이면 서버가 보고서나 저널에서 찾은 framework 값으로 안내를 보여 준다
    if (st.framework && typeof st.framework === 'object' && st.framework.scope === 'jdk-jakarta') setFramework(fwFrom(st.framework, fwInfo));
    const d = describe(st);
    const live = st.state === 'running' || st.state === 'queued';
    setTitle(d.cls, d.text, live);
    const bits = [];
    if (st.llm_calls != null) bits.push(`LLM 호출 ${st.llm_calls}회`);
    // 이관 결과는 제목에 두고, 이어서 한 취약점 조치의 결과는 그 뒤에 붙인다(빌드가 실패해도 조치가 있을 수 있다)
    const remS = remShort(st); if (remS) bits.push(remS);
    if (st.resolved) bits.push(`해결한 오류 ${st.resolved}건`);
    setText('summary', bits.join(' · '));
    $('stop').disabled = !live || !!st.stop_requested;
    setPodWait(live && st.job ? st.job.pending : null);
    $('stop').hidden = !live;
    setText('stop', st.stop_requested ? '중단 요청됨' : '중단');
    if (st.parallel) setParallel(st.parallel);
    if (st.mode === 'k8s-job' || st.mode === 'local-job') jobStep();   // Job 모드(개발 PC의 local-job 포함)에서는 첫 current보다 먼저 접수 앞에 '파드' 단계를 넣는다
    if (st.state === 'finished') { setCurrent(null); showResult(st, d); }
    else if (st.state === 'running' && !railSteps().some((n) => n.classList.contains('done'))) setCurrent(railSteps()[0]);
    // 대기 안내는 대기 중에만 보인다. 시작하거나 끝나면 이 안내만 지운다(그 사이 다른 안내로 바뀌었으면 그대로 둔다)
    if (st.state === 'queued') { queueText = queueNote(st); setText('railnote', queueText); }
    else if (queueText) { if ($('railnote').textContent === queueText) $('railnote').textContent = ''; queueText = ''; }
    // 대기 순서가 바뀌었거나 시작했으면 지난 실행 목록의 '대기 N번'도 갱신한다(끝났을 때는 end 이벤트에서 목록을 다시 읽는다)
    const q = qpos(st.queue), key = `${st.state}|${q ? q.position : ''}`;
    if (statusKey && key !== statusKey && st.state !== 'finished') loadRuns();
    statusKey = key;
  }
  // 빌드 파드가 시작하지 못한 이유를 보여 준다. 서버가 만든 한국어 문장과 쿠버네티스 원문 한 줄이며, 없으면 숨긴다
  function setPodWait(p) {
    const box = $('podwait');
    if (!p || !p.hint_ko) { box.hidden = true; return; }
    setText('podwaithint', String(p.hint_ko));
    const raw = p.reason ? String(p.reason) + (p.message ? ': ' + String(p.message) : '') : '';
    setText('podwaitraw', raw); $('podwaitraw').hidden = !raw;
    box.hidden = false;
  }
  function readyText() { return runFlow === FLOW_REM ? '준비를 마쳤습니다. 취약점 조치를 시작합니다.' : '준비를 마쳤습니다. 이관을 시작합니다.'; }
  function jobStep() {
    const rail = $('rail');
    let el = rail.querySelector('.step[data-node="job"]');
    if (!el) { rail.insertAdjacentHTML('afterbegin', stepHtml('job', 'job')); el = rail.firstElementChild; }
    return el;
  }

  // ---- 단계 레일: intake -> analyze -> plan -> phase × N -> finalize. `node` 이벤트가 오면 해당 단계를 켠다.
  const KO = { job: '파드', intake: '접수', analyze: '분석', plan: '계획', finalize: '마무리',
               transform: '레시피 적용', restructure: '재구성', verify: '빌드 검증', report: '보고서', jdk21: 'JDK 21', spring: 'Spring',
               remediation: '취약점 조치', review: '구조 검토' };
  const FIXED = ['intake', 'analyze', 'plan'];
  function stepHtml(node, label, extra) {
    const ko = KO[node] || label;
    return `<div class="step" role="listitem" data-node="${esc(node)}"${extra || ''}><div class="dot"></div><div class="label">${esc(ko)}<span class="en">${esc(label)}</span></div></div>`;
  }
  // 엔진의 중단 사유(`중단: …`)는 끝까지 남긴다. 뒤에 오는 파드 안내(ending, api-back)가 덮어쓰면 중단 사유를 알 수 없게 된다
  let abortNote = '';
  // 취약점 해결 실행의 단계: 접수 -> 취약점 조치 -> 마무리(엔진 노드 intake -> remediation -> finalize)
  const REM_STEPS = ['intake', FLOW_REM, 'finalize'];
  let railFlow = FLOW_FULL;
  function resetRail(flow) {
    const g = $('rail'); g.innerHTML = ''; abortNote = '';
    railFlow = flow === FLOW_REM ? FLOW_REM : FLOW_FULL;
    if (railFlow === FLOW_REM) {
      for (const n of REM_STEPS) g.insertAdjacentHTML('beforeend', stepHtml(n, n));
    } else {
      for (const n of FIXED) g.insertAdjacentHTML('beforeend', stepHtml(n, n));
      g.insertAdjacentHTML('beforeend', stepHtml('phase', 'phases', ' data-pending="1" data-placeholder="1"'));
      g.insertAdjacentHTML('beforeend', stepHtml('finalize', 'finalize'));
    }
    $('railnote').textContent = ''; queueText = '';
    placeSkipped();                                   // 범위를 이미 알고 있으면 하지 않는 단계를 다시 그린다
  }
  function railSteps() { return [...$('rail').querySelectorAll('.step')]; }
  function engineSeen() { return railSteps().some((n) => n.dataset.node !== 'job' && (n.classList.contains('done') || n.classList.contains('failed'))); }
  function setCurrent(el) {
    for (const n of railSteps()) n.classList.remove('current');
    if (el) el.classList.add('current');
  }
  // 사내 프레임워크 프로젝트는 재구성과 구조 검토를 하지 않는다. 계획에 없는 두 단계를 '하지 않음'으로 레일에 표시해
  // 대기 중인 단계로 남지 않게 한다. 분석(framework_project)이나 계획(plan) 저널, 상태의 framework 값에서 범위를 알게 되면 켠다
  let fwReduced = false;
  let fwInfo = null;            // { name, fixLoop }. 줄인 범위가 아니면 null이다
  const SKIP_STEPS = ['restructure', 'review'];
  // 저널 이벤트나 상태의 framework 값을 { name, fixLoop }로 바꾼다. 없는 값은 앞서 받은 값을 쓴다.
  // 이름과 fix_loop가 없는 이전 실행은 이름 없이, 빌드 오류를 자동으로 수정한 실행으로 본다(그때는 항상 수정했다)
  function fwFrom(src, prev) {
    const p = prev || {};
    const name = typeof src.name === 'string' ? src.name.trim() : (p.name || '');
    const fixLoop = typeof src.fix_loop === 'boolean' ? src.fix_loop : (typeof p.fixLoop === 'boolean' ? p.fixLoop : true);
    return { name, fixLoop };
  }
  // 안내 문장. 이름이 있으면 이름을, 없으면 사내 프레임워크라고 쓴다
  function fwHead(fw) { return fw.name ? `${fw.name} 프레임워크는 JDK 21, Jakarta만 적용합니다.` : '사내 프레임워크 프로젝트는 JDK 21, Jakarta만 적용합니다.'; }
  // 서버 설정상 변환만 하는 프레임워크 프로젝트도 빌드 결과와 관계없이 취약점 조치를 이어서 하는지 여부다(/api/configs)
  let fwRemAlways = false;
  const FW_REM_ALWAYS = '취약점 조치는 빌드 결과와 관계없이 이어서 합니다.';
  function fwBody(fw) {
    const base = fw.fixLoop ? '구조 정리와 구조 검토는 하지 않습니다. 변환한 뒤 빌드하고, 빌드 오류는 자동으로 수정합니다.'
                            : '구조 정리, 구조 검토, 빌드 오류 자동 수정은 하지 않습니다. 변환한 뒤 빌드를 한 번 하고, 남은 오류는 보고서로 알려 드립니다.';
    return !fw.fixLoop && fwRemAlways ? `${base} ${FW_REM_ALWAYS}` : base;
  }
  function fwWho(fw) { return fw && fw.name ? `${fw.name} 프레임워크 프로젝트` : '사내 프레임워크 프로젝트'; }
  function setFramework(fw) {
    // 같은 내용이 여러 번 와도(저널, status) 레일을 다시 그리지 않는다
    if (fw && fwInfo && fw.name === fwInfo.name && fw.fixLoop === fwInfo.fixLoop) return;
    fwInfo = fw || null; fwReduced = !!fwInfo;
    renderFramework();
    placeSkipped();
  }
  // 실행 카드와 결과 카드의 안내 문장을 쓴다. 설정 정보가 늦게 오면 다시 호출한다
  function renderFramework() {
    for (const id of ['fwnote', 'fwresult']) {
      $(id).hidden = !fwReduced;
      setText(id + '-head', fwReduced ? fwHead(fwInfo) : '');
      setText(id + '-body', fwReduced ? fwBody(fwInfo) : '');
    }
  }
  // 올리기 전 안내. /api/configs의 framework가 configured일 때만 보여 준다
  function setUploadFramework(f) {
    const on = !!(f && typeof f === 'object' && f.configured === true);
    $('fwupload').hidden = !on;
    if (!on) return;
    const name = typeof f.name === 'string' ? f.name.trim() : '';
    setText('fwupload-head', name ? `${name} 프레임워크를 쓰는 프로젝트는 JDK 21, Jakarta만 적용합니다.` : '사내 프레임워크를 쓰는 프로젝트는 JDK 21, Jakarta만 적용합니다.');
    setText('fwupload-body', f.fix_loop === true ? '구조 정리와 구조 검토는 하지 않고, 변환한 뒤 빌드 오류까지 자동으로 수정합니다.'
                                                 : '구조 정리와 빌드 오류 자동 수정은 하지 않고, 변환한 프로젝트와 빌드 결과를 보고서와 함께 드립니다.'
                                                   + (fwRemAlways ? ` ${FW_REM_ALWAYS}` : ''));
  }
  function placeSkipped() {
    const rail = $('rail');
    for (const n of rail.querySelectorAll('.step[data-skip]')) n.remove();
    if (!fwReduced || railFlow === FLOW_REM) return;
    const html = SKIP_STEPS.map((n) => `<div class="step skipped" role="listitem" data-node="skip-${n}" data-skip="1"><div class="dot"></div><div class="label">${esc(KO[n])}<span class="en">하지 않음</span></div></div>`).join('');
    // 레시피 적용 바로 뒤, 레시피 단계가 없으면 빌드 검증 앞, 계획 전이면 마무리 앞에 둔다
    const tf = [...rail.querySelectorAll('.step[data-phase="transform"]')].pop();
    const anchor = rail.querySelector('.step[data-phase="verify"]') || rail.querySelector('.step[data-placeholder]') || rail.querySelector('.step[data-node="finalize"]');
    if (tf) tf.insertAdjacentHTML('afterend', html);
    else if (anchor) anchor.insertAdjacentHTML('beforebegin', html);
    // 마우스를 올리면 보이는 설명에도 안내와 같은 이름을 쓴다
    for (const n of rail.querySelectorAll('.step[data-skip]')) n.title = `${fwWho(fwInfo)}라 이 단계는 하지 않습니다`;
  }
  function phaseStep(phase, pending) {
    const fin = $('rail').querySelector('.step[data-node="finalize"]');
    const html = stepHtml(phase || 'phase', phase || 'phase', (pending ? ' data-pending="1"' : '') + ` data-phase="${esc(phase || '')}"`);
    fin.insertAdjacentHTML('beforebegin', html);
    return fin.previousElementSibling;
  }
  function onNode(ev) {
    const name = ev.node, u = (ev.update && typeof ev.update === 'object') ? ev.update : {};
    const rail = $('rail');
    let el;
    if (name === 'job') {                                       // 쿠버네티스 Job 모드: 파드 생성 중 -> 준비됨
      el = jobStep();
      const s = u.state || '';
      // 파드가 시작하지 못한 이유 안내는 단계 표시와 안내 줄을 바꾸지 않는다
      if (s === 'pod-pending') { setPodWait(u.pending); return; }
      if (s === 'pod-started') { setPodWait(null); return; }
      if (s === 'stopped-before-start') { setPodWait(null); $('railnote').textContent = String(u.message_ko || ''); return; }
      if (!['creating', 'pending', 'created', 'api-unavailable', 'api-back'].includes(s)) setPodWait(null);
      // 늦게 온 running은 이미 시작한 엔진 단계의 표시(현재 단계, 안내 줄)를 되돌리지 않는다
      if (s === 'running') { el.classList.add('done'); if (!engineSeen()) { setCurrent(railSteps()[1]); $('railnote').textContent = readyText(); } }
      else if (s === 'failed' || s === 'missing') { el.classList.remove('done'); el.classList.add('failed'); setCurrent(null); $('railnote').textContent = `실행 환경을 준비하지 못했습니다: ${u.message || s}`; }
      // completed는 결과 파일을 받았다는 뜻이므로 파드는 정상 종료한 것이다(이관 종료 코드가 3이어도). 안내 줄과 현재 단계는 엔진 이벤트가 정한다
      else if (s === 'succeeded' || s === 'completed') { el.classList.remove('failed'); el.classList.add('done'); }
      // 아래 세 가지는 단계 표시를 바꾸지 않고 안내 한 줄만 바꾼다. API가 응답하지 않거나 파드 종료를 기다리는 동안에도 실행 표시는 그대로 유지된다
      else if (s === 'api-unavailable') { $('railnote').textContent = `작업 서버(쿠버네티스)가 응답하지 않습니다. 응답할 때까지 이 작업은 자리를 유지합니다${u.message ? ' (' + u.message + ')' : ''}`; }
      else if (s === 'api-back') { $('railnote').textContent = abortNote || '작업 서버(쿠버네티스)가 다시 응답합니다.'; }
      else if (s === 'ending') { $('railnote').textContent = abortNote || '작업이 정리되기를 기다립니다. 끝난 것을 확인한 뒤 기다리는 작업에 자리를 넘깁니다.'; }
      else { setCurrent(el); $('railnote').textContent = s === 'created' ? '실행 환경을 준비하는 중…' : `실행 환경을 준비하는 중 (${s}${u.message ? ': ' + u.message : ''})`; }
      return;
    }
    // 엔진 단계가 왔으면 파드는 실행 중이다. running을 받지 못한 빠른 실행이나 job 이벤트 없이 저널로 다시 보는 끝난 실행도 '파드'를 완료로 표시한다
    const pod = rail.querySelector('.step[data-node="job"]');
    if (pod && !pod.classList.contains('failed') && !pod.classList.contains('done')) {
      if (pod.classList.contains('current')) $('railnote').textContent = readyText();   // '준비하는 중' 안내가 남지 않도록
      pod.classList.add('done');
    }
    if (name === 'plan' && Array.isArray(u.phases)) {          // plan이 정한 phase마다 점을 하나씩 그린다
      for (const p of rail.querySelectorAll('.step[data-phase], .step[data-placeholder]')) p.remove();
      for (const ph of u.phases) phaseStep(ph, true);
      placeSkipped();
    }
    if (name === 'phase') {
      const placeholder = rail.querySelector('.step[data-placeholder]');
      if (placeholder) placeholder.remove();
      const pending = [...rail.querySelectorAll('.step[data-pending]')];
      el = (u.phase && pending.find((n) => n.dataset.phase === u.phase)) || pending[0] || phaseStep(u.phase, false);
      delete el.dataset.pending;
      if (Array.isArray(u.phases)) {                            // 남은 단계가 점보다 많으면 더 그린다
        const left = rail.querySelectorAll('.step[data-pending]').length;
        for (const ph of u.phases.slice(left)) phaseStep(ph, true);
      }
    } else {
      el = railSteps().find((n) => n.dataset.node === name);
      if (!el) { rail.insertAdjacentHTML('beforeend', stepHtml(name, name)); el = rail.lastElementChild; }
    }
    el.classList.add(u.aborted ? 'failed' : 'done');
    if (u.aborted) { abortNote = `중단: ${u.aborted}`; $('railnote').textContent = abortNote; }
    else if (u.stopped) $('railnote').textContent = '요청한 단계까지만 실행하고 멈췄습니다.';
    const steps = railSteps(); let last = -1;
    steps.forEach((n, i) => { if (n.classList.contains('done') || n.classList.contains('failed')) last = i; });
    // finalize 뒤에는 이어서 실행되는 취약점 조치(빌드 파드의 remediation 노드)만 남는다. 이미 시작했으면 그것이 현재 단계다
    const remRunning = rail.querySelector('.step[data-node="remediation"]:not(.done):not(.failed)');
    // 하지 않는 단계(skipped)는 현재 단계가 될 수 없으므로 건너뛴다
    const next = steps.slice(last + 1).find((n) => !n.classList.contains('skipped'));
    setCurrent(u.aborted ? null : (name === 'finalize' ? remRunning : next));
    if (name === 'remediation' && current) loadRemediation(current);
  }

  // ---- 진행 기록(journal): 화면에는 마지막 MAX_ROWS 줄만 둔다
  const MAX_ROWS = 400;
  const SKIP = new Set(['ts', 'run_id', 'event', 'path', 'project_dir', 'source', 'record']);
  const ICON = { phase_start: ['▶', ''], step_start: ['▶', ''], loop_start: ['▶', ''], llm_script: ['◆', 'llm'], llm_call: ['◆', 'llm'],
                 attempt: ['▪', ''], attempt_scored: ['▪', ''], decision: ['▪', ''], triage: ['▪', ''], rewrite: ['↻', ''], restructure: ['▣', ''],
                 handover: ['≡', ''], report: ['≡', ''], analyze: ['●', ''], plan: ['●', ''], intake: ['●', ''], preflight: ['●', ''] };
  function journalRow(ev) {
    const name = ev.event || '?';
    let [icon, cls] = ICON[name] || ['·', ''];
    if (['phase_end', 'step_end', 'loop_end', 'build', 'verify'].includes(name)) {
      icon = ev.ok === false ? '✗' : (ev.ok === true ? '✓' : '■'); cls = ev.ok === false ? 'bad' : (ev.ok === true ? 'ok' : '');
    }
    const bits = [];
    for (const [k, v] of Object.entries(ev)) {
      if (SKIP.has(k)) continue;
      let s = (v && typeof v === 'object') ? JSON.stringify(v) : String(v);
      if (s.length > 160) s = s.slice(0, 160) + '…';
      bits.push(`${k}=${s}`);
    }
    // 범위는 분석의 framework_project와 계획의 plan 저널에 있다. 전체 이관(full)이면 따로 표시하지 않는다
    if ((name === 'framework_project' || name === 'plan') && ev.scope === 'jdk-jakarta') setFramework(fwFrom(ev, fwInfo));
    if (name === 'phase_start' && ev.phase) $('railnote').textContent = `지금 단계: ${KO[ev.phase] || ev.phase}`;
    // 이관 뒤 빌드 파드가 취약점 조치 노드를 시작하면(graph_node … node=remediation) 레일 끝에 단계를 추가하고 현재 단계로 표시한다
    if (name === 'graph_node' && ev.node === 'remediation') {
      const step = remStep();
      if (!step.classList.contains('done')) { setCurrent(step); $('railnote').textContent = REM_RUNNING_NOTE; }
    }
    if (name === 'phase_end' && ev.phase) {
      $('railnote').textContent = `${KO[ev.phase] || ev.phase} ${ev.ok === false ? '단계가 실패로 끝났습니다' : '단계 끝'}`;
      const step = $('rail').querySelector(`.step[data-phase="${CSS.escape(ev.phase)}"]`);
      if (step && ev.ok === false) { step.classList.remove('done'); step.classList.add('failed'); }
    }
    const tl = $('timeline');
    const div = document.createElement('div'); div.className = 'row';
    div.innerHTML = `<span class="t">${fmtTime(ev.ts)}</span><span class="${cls}">${icon}</span><span class="ev ${cls}">${esc(name)}</span><span class="d">${esc(bits.join('  '))}</span>`;
    tl.appendChild(div);
    while (tl.childElementCount > MAX_ROWS) tl.removeChild(tl.firstElementChild);
    tl.scrollTop = tl.scrollHeight;
  }

  // ---- 로그(sbmig.log): 줄은 메모리 버퍼에만 쌓고(최대 LOG_KEEP), 로그 탭이 보일 때만 마지막 LOG_SHOW 줄을
  //      한 프레임에 한 번 그린다. DOM에 수만 줄이 쌓이면 브라우저가 느려지기 때문이다. 전체 로그는 sbmig.log 파일로 받는다.
  const LOG_KEEP = 20000, LOG_SHOW = 1500;
  let logBuf = [], logTotal = 0, logDropped = 0, pendingRender = false, logTab = false;
  function parseLog(kind, line) {
    // sbmig.log: "<date> <time> LEVEL   [stage] logger: message"
    const m = /^\S+ \S+ (DEBUG|INFO|WARNING|ERROR|CRITICAL)\s+(\[[^\]]*\] )?(\S+): (.*)$/.exec(line);
    const level = m ? m[1] : 'INFO';
    return { cls: kind === 'error' ? 'runerror' : level + (kind === 'console' ? ' console' : ''), level,
             text: (m ? `${line.slice(11, 19)} ${level.padEnd(7)} ${m[2] || ''}${m[4]}` : line), debug: level === 'DEBUG' && kind !== 'error' };
  }
  function logLine(kind, line) {
    logBuf.push(parseLog(kind, line)); logTotal++;
    if (logBuf.length > LOG_KEEP) { logBuf.splice(0, logBuf.length - LOG_KEEP); logDropped = logTotal - logBuf.length; }
    scheduleLog();
  }
  function scheduleLog() {
    if (pendingRender) return;
    pendingRender = true;
    requestAnimationFrame(() => { pendingRender = false; renderLog(); });
  }
  function renderLog() {
    $('logcount').textContent = logTotal ? `${logTotal.toLocaleString('ko-KR')}줄` : '';
    if (!logTab) return;
    const showDebug = $('showdebug').checked;
    const rows = showDebug ? logBuf : logBuf.filter((r) => !r.debug);
    const shown = rows.slice(-LOG_SHOW);
    const frag = document.createDocumentFragment();
    for (const r of shown) { const s = document.createElement('span'); s.className = r.cls; s.textContent = r.text + '\n'; frag.appendChild(s); }
    const box = $('log');
    const stick = $('autoscroll').checked || box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
    box.replaceChildren(frag);
    const hidden = rows.length - shown.length + logDropped;
    $('logfoot').textContent = hidden > 0 ? `화면에는 마지막 ${shown.length.toLocaleString('ko-KR')}줄만 보입니다 (앞의 ${hidden.toLocaleString('ko-KR')}줄은 파일에).`
                                          : (showDebug ? '' : 'DEBUG 줄은 숨겼습니다.');
    if (stick) box.scrollTop = box.scrollHeight;
  }
  $('showdebug').addEventListener('change', renderLog);
  function selectTab(which) {
    logTab = which === 'log';
    $('tab-journal').setAttribute('aria-selected', String(!logTab)); $('tab-log').setAttribute('aria-selected', String(logTab));
    $('pane-journal').hidden = logTab; $('pane-log').hidden = !logTab; $('logtools').hidden = !logTab;
    if (logTab) renderLog();
  }
  $('tab-journal').addEventListener('click', () => selectTab('journal'));
  $('tab-log').addEventListener('click', () => selectTab('log'));

  // ---------------------------------------------------------------- 3. 결과 카드
  function fileUrl(name, download) { return `/api/runs/${encodeURIComponent(current)}/files/${name}` + (download ? '?download=1' : ''); }
  function showResult(st, d) {
    const files = st.files || [];
    $('resultcard').hidden = false;
    // 진행하지 못한 실행: 사유 한 문장을 결과 영역 맨 위에 표시한다(로그 탭에 묻히지 않도록)
    // 중단한 실행은 제목(중단되었습니다) 아래에 서버가 준 사유 한 줄만 보여 준다(파드가 시작하기 전에 정리한 경우)
    const why = st.exit_code === 3 && !st.stop_requested ? abortText(st) : (st.stop_requested ? String(st.stop_reason_ko || '') : '');
    $('abortbox').hidden = !why; setText('aborttext', why);
    // 취약점 해결 실행에는 이관 결과(report.md / result.zip 버튼)가 없고 아래 '취약점 조치' 영역이 결과다
    const remOnly = (st.flow || runFlow) === FLOW_REM;
    $('mainline').hidden = remOnly; $('maindl').hidden = remOnly;
    $('remed').classList.toggle('solo', remOnly);
    // 그 밖의 파일은 결과 버튼 아래에 둔다. 취약점 해결 실행이면 조치 영역 뒤, 전체 진행이면 이관 버튼 바로 뒤(조치 영역 앞)
    if (remOnly) $('remed').after($('otherfiles')); else $('remed').before($('otherfiles'));
    const chips = [];
    if (st.resolved) chips.push(`<span class="chip ok">해결 ${st.resolved}건</span>`);
    const open = st.open ?? st.unresolved; if (open) chips.push(`<span class="chip warn">남은 오류 ${open}건</span>`);
    if (st.blocked) chips.push(`<span class="chip bad">막힌 항목 ${st.blocked}건</span>`);
    if (st.llm_calls != null) chips.push(`<span class="chip">LLM 호출 ${st.llm_calls}회</span>`);
    $('counts').innerHTML = chips.join('');
    const set = (id, name) => {
      const a = $(id), has = files.includes(name);
      a.setAttribute('aria-disabled', String(!has));
      if (has) { a.href = fileUrl(name, true); a.setAttribute('download', name); } else { a.removeAttribute('href'); a.removeAttribute('download'); }
    };
    set('dl-report', 'report.md'); set('dl-zip', 'result.zip');
    const others = files.filter((f) => remOnly ? f !== 'result.zip' : f !== 'report.md' && f !== 'result.zip');
    $('otherfiles').innerHTML = others.length ? '<span>그 밖의 파일</span>' + others.map((f) => `<a href="${fileUrl(f)}" target="_blank" rel="noopener">${esc(f)}</a>`).join('') : '';
    if (!remOnly && !why && !files.includes('result.zip')) $('otherfiles').insertAdjacentHTML('afterbegin', '<span class="muted">변환된 프로젝트 ZIP이 없습니다(중단되었거나 report.zip_result 설정이 꺼져 있습니다).</span>');
    if (files.includes('sbmig.log')) { $('logfull').href = fileUrl('sbmig.log'); $('logfull').hidden = false; }
    runRem = st.remediation && typeof st.remediation === 'object' ? st.remediation : null;
    if (current) loadRemediation(current);
    showCodeDiff(st, remOnly);                       // 코드 변경: 상태에 code_diff가 있을 때만 머리 줄을 보인다
  }

  // ---------------------------------------------------------------- 3b. 취약점 조치
  // 이관 뒤 빌드 파드가 이어서 실행한 조치(상태 id는 이관 실행 id). 변환만 한 프레임워크 프로젝트는 빌드가 실패해도 이어서 한다. 서버 문자열(이유 코드, diff, 메시지, 라이브러리 이름)은 모두
  // textContent로만 넣는다. diff에는 '<dependency>' 같은 태그 문자가 그대로 들어 있기 때문이다
  const REM_KO = { QUEUED: '대기', RUNNING: '진행 중', AWAITING_APPROVAL: '승인 대기', AWAITING_CONFIRMATION: '업로드 확인 대기',
                   STOPPED: '중지됨', INTERRUPTED: '중단됨', SUCCEEDED: '조치 완료', INCOMPLETE: '일부만 조치됨', FAILED: '실패' };
  // 고칠 것은 다 고쳤고 빌드로 확인만 하지 못한 조치의 상태 이름이다(remBuildOnly)
  const REM_UNCONFIRMED_KO = '조치함 · 빌드 미확인';
  const REM_CLS = { SUCCEEDED: 'ok', INCOMPLETE: 'warn', AWAITING_APPROVAL: 'warn', AWAITING_CONFIRMATION: 'warn', STOPPED: 'warn',
                    INTERRUPTED: 'bad', FAILED: 'bad' };
  // 이유 코드(sbmig/remediations/models.py R_*)를 사용자가 읽을 문장으로 바꾼다. 모르는 코드는 그대로 보여 준다(칩의 title에는 항상 코드)
  const REM_REASON_KO = {
    baseline_build_failed: '조치 전 빌드 실패', candidate_build_failed: '수정본 빌드 실패', scan_incomplete: 'IVAS 검사 미완료',
    upload_uncertain: '업로드 결과 확인 불가', zip_hash_mismatch: '검사한 파일 불일치', text_only_violation: '버전 표기 외 변경 감지',
    resolution_mismatch: '적용 결과가 계획과 다름', execution_boundary_refused: '빌드 설정 점검에서 중단', not_ready: '실행 환경 미비',
    pending_approval: '승인 대기', rejected_proposals: '적용하지 않은 변경 있음', residual_findings: '남은 취약점 있음',
    manual_review: '직접 확인 필요', no_candidate_version: '올릴 수 있는 버전 없음', rounds_exhausted: '반복 횟수 한도 도달',
    stop_requested: '중지 요청', internal_error: '내부 오류', policy_denied: '정책상 허용되지 않음', unknown_provenance: '버전을 지정한 곳을 찾지 못함',
    stale_location: 'pom이 그 사이 변경됨', inventory_incomplete: '의존성 목록을 다 읽지 못함', chain_budget: '제한 시간 초과',
    inhouse_artifact: '사내 라이브러리 (담당자 요청)' };
  // 제안 종류(K_*)와 위험 표시(RISK_*)
  const KIND_KO = { direct_version: 'pom의 버전 표기 수정', property_version: 'property 값 수정', own_management_version: 'dependencyManagement의 버전 수정',
                    managed_override: 'dependencyManagement에 버전 지정 추가', parent_version: '부모 pom 버전 변경', bom_version: 'BOM 버전 변경' };
  const RISK_KO = { major: '메이저 버전 변경', parent: '부모 pom 변경', bom: 'BOM 변경', managed_override: 'dependencyManagement 항목 추가' };
  const ACTIVE_JOB_DONE = ['succeeded', 'failed', 'completed', 'finished', 'done', 'missing', 'ended'];
  const REM_POLL_MS = 4000;
  const REM_RUNNING_NOTE = '취약점 조치 중 — IVAS 검사와 버전 수정을 진행합니다.';
  // 화면 상태: 제안 id별 체크 여부, 현재 그린 조치 영역의 키(같으면 다시 그리지 않아 체크와 입력 내용이 유지된다),
  // 요청 중 여부(중복 전송 방지), 마지막 오류 한 줄
  const rem = { run: null, sel: new Map(), propKey: '', viewKey: '', busy: false, err: '', resumeErr: '', poll: null, last: null };
  let remSeq = 0;
  // 실행 상태의 조치 요약(report.remediation). 조치 상태에 표시가 없을 때 빌드 실패 프로젝트 여부를 여기서 읽는다
  let runRem = null;
  // 빌드가 실패한 프로젝트에 이어서 한 조치인지 확인한다. 표시가 없는 이전 상태는 지금처럼 보여 준다
  function remTolerated(st) {
    return st.baseline_tolerated === true || (!!runRem && runRem.baseline_tolerated === true);
  }
  // 결과 ZIP이 조치 전과 같은 빌드 오류에서 멈춘 것인지 확인한다(delivery.build_tolerated). 새 오류가 생긴 수정본은 아니다
  function remUnconfirmed(st) {
    return remTolerated(st) && !!(st.delivery && st.delivery.build_tolerated === true);
  }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
  function remUrl(id, tail) { return `/api/remediations/${encodeURIComponent(id)}` + (tail || ''); }
  function stopRemPoll() { clearTimeout(rem.poll); rem.poll = null; }
  function hideRemediation() {
    remSeq++; stopRemPoll(); $('remed').hidden = true; $('remed-act').replaceChildren();
    rem.run = null; rem.sel = new Map(); rem.propKey = ''; rem.viewKey = ''; rem.busy = false; rem.err = ''; rem.resumeErr = ''; rem.last = null;
  }
  function remStep() {
    const rail = $('rail');
    let s = rail.querySelector('.step[data-node="remediation"]');
    if (!s) { rail.insertAdjacentHTML('beforeend', stepHtml('remediation', 'remediation')); s = rail.lastElementChild; }
    return s;
  }
  // 서버가 active를 주면 그 값을 기준으로 한다(resume_job은 끝난 뒤에도 남는다). 없을 때만 state로 판단한다
  function jobActive(j) {
    if (!j || typeof j !== 'object') return false;
    if (typeof j.active === 'boolean') return j.active;
    return !!(j.state && !ACTIVE_JOB_DONE.includes(String(j.state).toLowerCase()));
  }
  function remActive(st) { return st.status === 'RUNNING' || st.status === 'QUEUED' || jobActive(st.resume_job); }
  async function loadRemediation(runId, force) {
    const seq = ++remSeq;
    let r = null, st = null;
    try { r = await fetch(remUrl(runId)); try { st = await r.json(); } catch (e) {} } catch (e) { return; }
    if (seq !== remSeq || current !== runId) return;              // 그 사이 다른 실행을 선택했다
    if (!r.ok || !st || !st.status) { $('remed').hidden = true; return; }   // 404면 이 실행에는 이어서 실행된 조치가 없다
    if (rem.run !== runId) { rem.run = runId; rem.sel = new Map(); rem.propKey = ''; rem.viewKey = ''; rem.err = ''; rem.resumeErr = ''; }
    const step = remStep();
    if (remActive(st)) setCurrent(step);
    else {
      step.classList.add('done'); step.classList.remove('current');
      // 끝난 조치에는 진행 중 안내를 남기지 않는다(저널을 다시 읽을 때 그 문장이 다시 쓰인다)
      if ($('railnote').textContent === REM_RUNNING_NOTE) $('railnote').textContent = '';
    }
    let props = null;
    if (st.status === 'AWAITING_APPROVAL') {
      try { const pr = await fetch(remUrl(runId, '/proposals')); if (pr.ok) props = await pr.json(); } catch (e) {}
      if (seq !== remSeq || current !== runId) return;
    }
    renderRemediation(runId, st, props, force);
    // 새 빌드 파드에서 이어서 실행되는 동안(대기, 진행)에만 몇 초마다 다시 읽는다
    stopRemPoll();
    if (remActive(st)) rem.poll = setTimeout(() => { if (current === runId) loadRemediation(runId); }, REM_POLL_MS);
  }
  function renderRemediation(runId, st, props, force) {
    $('remed').hidden = false;
    rem.last = st;
    const chip = $('remed-status');
    chip.className = 'chip ' + (REM_CLS[st.status] || '');
    setText('remed-status', (remBuildOnly(st, remTolerated(st)) ? REM_UNCONFIRMED_KO : (REM_KO[st.status] || st.status))
      + (st.stale ? ' (작업 종료)' : ''));
    // 취약점 해결 실행은 이 영역이 결과이므로 제목도 현재 조치 상태를 따른다(승인 후 이어서 진행하면 바뀐다)
    const solo = runFlow === FLOW_REM;
    if (solo && lastState === 'finished') { const t = remTitle(st.status); if (t) setTitle(t.cls, t.text, t.text === REM_TITLE.RUNNING[1]); }
    const c = st.counts || {}, counts = $('remed-counts');
    counts.replaceChildren();
    if (c.baseline_findings != null) counts.appendChild(el('span', 'chip', `취약점 ${c.baseline_findings}건 → ${c.final_findings != null ? c.final_findings + '건' : '검사 전'}`));
    if (c.proposals_applied) counts.appendChild(el('span', 'chip ok', `적용 ${c.proposals_applied}건`));
    const pend = Number(st.pending_approvals || 0);
    if (pend) counts.appendChild(el('span', 'chip warn', `승인 대기 ${pend}건`));
    // 빌드가 실패한 프로젝트라면 버전은 바꾸고 다시 검사했지만 빌드로 확인하지 못했다는 것을 한 문장으로 알린다
    const tolerated = remTolerated(st);
    // 버전을 바꾼 결과물이 조치 전과 같은 오류에서만 멈췄을 때만 이 안내를 보인다. 새 오류가 생긴 수정본은 빌드 실패본이다
    const unconfirmed = remUnconfirmed(st) && Number(c.proposals_applied || 0) > 0;
    $('remed-note').hidden = !unconfirmed;
    setText('remed-note', unconfirmed ? '빌드가 실패한 프로젝트라 바꾼 라이브러리 버전을 빌드로 확인하지 못했습니다. 빌드 오류를 고친 뒤 한 번 빌드해서 확인해 주세요.' : '');
    $('remed-msg').textContent = st.message_ko || st.message || '';   // 서버가 추가한 한국어 문장(message_ko)을 먼저 쓴다
    const reasons = $('remed-reasons');
    reasons.replaceChildren();
    const codes = Array.isArray(st.reasons) && st.reasons.length ? st.reasons : (st.reason ? [st.reason] : []);
    for (const code of codes) {
      // 조치 전부터 빌드가 실패한 실행이면 그 사유를 조치의 실패처럼 읽히지 않게 적는다
      const label = tolerated && code === 'baseline_build_failed' ? (unconfirmed ? '빌드로 확인하지 못함' : '조치 전에도 빌드 실패')
        : (REM_REASON_KO[code] || code);
      const ch = el('span', 'chip', label); ch.title = String(code); reasons.appendChild(ch);
    }
    // 다운로드: 조치 보고서, 조치 결과 zip(빌드가 실패한 수정본이면 '빌드 실패본' 표시), 이전 라운드의 검증된 zip
    const files = Array.isArray(st.files) ? st.files : [], dl = $('remed-dl');
    dl.replaceChildren();
    const link = (name, text, cls, badge, badgeCls) => {
      if (!files.includes(name)) return;
      const a = el('a', 'btn ' + cls);
      a.href = remUrl(runId, '/files/' + name); a.setAttribute('download', name);
      const lab = el('span', null, text + ' '); lab.appendChild(el('span', 'sub', name)); a.appendChild(lab);
      if (badge) a.appendChild(el('span', 'badge ' + (badgeCls || 'bad'), badge));
      dl.appendChild(a);
    };
    const failed = !!(st.delivery && st.delivery.build_ok === false);
    link('report.md', '조치 결과 보고서', solo ? 'big' : 'quiet');
    const sameFailure = remUnconfirmed(st);
    // 바꾼 버전이 없는 원본 ZIP은 빌드로 확인할 변경이 없으므로 표시를 붙이지 않는다
    const applied = Number(c.proposals_applied || 0) > 0;
    const badBuild = failed && !(sameFailure && !applied);
    link('result.zip', '결과 ZIP 받기', (badBuild ? 'ghost' : 'quiet') + (solo ? ' big' : ''),
         badBuild ? (sameFailure ? '빌드 미확인' : '빌드 실패본') : '', sameFailure ? 'warn' : 'bad');
    link('result-verified.zip', '검증된 이전 라운드 결과 받기', 'quiet');
    if (st.withheld) dl.appendChild(el('span', 'note', solo ? '실행이 끝나면 받을 수 있습니다.' : '이관 실행이 끝나면(마지막 정제 뒤) 받을 수 있습니다.'));
    // 상태별 동작. 같은 상태가 여러 번 와도 선택한 항목과 열린 확인 영역이 사라지지 않도록 내용이 같으면 다시 그리지 않는다
    const pending = props && Array.isArray(props.proposals) ? props.proposals.filter((p) => p && p.decision === 'pending') : [];
    const rs = (st.resume && typeof st.resume === 'object') ? st.resume : {};
    const j = (st.resume_job && typeof st.resume_job === 'object') ? st.resume_job : {};
    const q = qpos(j.queue);
    const key = JSON.stringify([st.status, !!st.stale, st.reason || '', !!rs.available, rs.note || '', jobActive(j), j.state || '',
                                q ? q.ahead : null, st.queue_position || null, pending.map((p) => p.id + ':' + (p.proposal_hash || ''))]);
    if (rem.busy) return;                                       // 요청 중이면 응답이 온 뒤 다시 그린다
    if (!force && key === rem.viewKey) return;
    rem.viewKey = key;
    const act = $('remed-act');
    if (remActive(st)) act.replaceChildren(goingView(st));
    else if (st.status === 'AWAITING_APPROVAL') act.replaceChildren(pending.length ? approvalsView(runId, pending) : decidedView(runId, rs));
    else if (st.status === 'AWAITING_CONFIRMATION') act.replaceChildren(confirmationView(runId, st, rs));
    else if (st.status === 'STOPPED' || st.status === 'INTERRUPTED') act.replaceChildren(stoppedView(runId, st, rs));
    else act.replaceChildren();
  }

  // ---- 새 빌드 파드에서 이어서 실행 중(대기, 진행)
  function goingView(st) {
    const j = (st.resume_job && typeof st.resume_job === 'object') ? st.resume_job : {};
    const box = el('div', 'going');
    box.appendChild(el('span', 'pulse'));
    const txt = el('div');
    txt.appendChild(el('p', null, '이어서 진행 중'));
    txt.appendChild(el('p', 'small', '적용 · 빌드 · 재검사를 이어서 합니다. 이 창을 닫아도 계속됩니다.'));
    const q = qpos(j.queue);
    const ahead = q ? q.ahead : (st.status === 'QUEUED' && Number.isInteger(st.queue_position) ? st.queue_position - 1 : null);
    if (ahead != null) txt.appendChild(el('p', 'small', `자리가 날 때까지 대기 중 (앞에 ${ahead}건)`));
    box.appendChild(txt);
    return box;
  }

  // ---- 승인 대기: 제안마다 체크박스 하나. 체크하면 적용하고 체크하지 않으면 적용하지 않는다. 버튼 하나로 결정과 이어서 진행을 함께 보낸다
  // 한 라이브러리에 제안이 여러 건(모듈 pom마다 하나)이면 묶음 하나로 보여 준다. 보내는 내용은 묶음과 상관없이 제안 단위다
  function approvalsView(runId, pending) {
    const key = pending.map((p) => p.id + ':' + (p.proposal_hash || '')).join('|');
    if (key !== rem.propKey) { rem.propKey = key; rem.sel = new Map(); }   // 제안이 바뀌면 선택을 초기화한다
    const wrap = el('div');
    wrap.appendChild(el('p', 'head', '적용할 변경을 고르세요'));
    wrap.appendChild(el('p', 'lead', '체크한 변경만 적용하고, 체크하지 않은 변경은 적용하지 않습니다. 적용하면 빌드와 IVAS 재검사까지 이어서 합니다.'));
    // 바로 고르지 않고 검토한 뒤에 정해도 된다는 안내. 실행은 승인 대기 상태로 저장되어 있다
    wrap.appendChild(el('p', 'busynote', '버튼을 누르기 전에는 아무것도 적용하지 않습니다. 이 화면을 닫고 검토한 뒤 다시 와서 골라도 됩니다. 그동안 실행은 승인 대기 상태로 기다립니다.'));
    const bar = el('div', 'selbar');
    const all = el('button', 'btn quiet', '전체 선택'); all.type = 'button'; all.id = 'remed-all';
    const none = el('button', 'btn quiet', '전체 해제'); none.type = 'button'; none.id = 'remed-none';
    const count = el('span', 'count'); count.id = 'remed-selcount'; count.setAttribute('aria-live', 'polite');
    bar.append(all, none, count);
    wrap.appendChild(bar);
    const list = el('div'); list.id = 'remed-props';
    const boxes = [], groups = [];
    pending.forEach((p, i) => {
      const k = groupKey(p);
      let g = groups.find((x) => x.key === k);
      if (!g) { g = { key: k, items: [] }; groups.push(g); }
      g.items.push({ p, i });
    });
    groups.forEach((g, gi) => {
      if (g.items.length === 1) {
        const card = proposalRow(g.items[0].p, g.items[0].i, null);
        boxes[g.items[0].i] = card.querySelector('input');
        list.appendChild(card);
        return;
      }
      const box = groupBox(g, gi);
      g.cb = box.querySelector('input'); g.count = box.querySelector('.gcount');
      const items = el('div', 'gitems');
      for (const { p, i } of g.items) {
        const card = proposalRow(p, i, g.common);
        boxes[i] = card.querySelector('input');
        items.appendChild(card);
      }
      box.appendChild(items);
      list.appendChild(box);
    });
    wrap.appendChild(list);
    const err = el('p', 'err', rem.err); err.setAttribute('role', 'alert'); wrap.appendChild(err);
    const row = el('div', 'actions');
    const apply = el('button', 'btn'); apply.type = 'button'; apply.id = 'remed-apply';
    row.append(apply, el('span', 'note', '체크하지 않은 항목은 적용하지 않고 진행합니다.'));
    wrap.appendChild(row);
    const confirmSlot = el('div'); wrap.appendChild(confirmSlot);
    const chosen = () => pending.filter((p) => rem.sel.get(p.id)).length;
    const sync = () => {
      const n = chosen(), m = pending.length;
      count.textContent = `${n}건 선택 / 전체 ${m}건`;
      apply.textContent = `선택한 ${n}건 적용`;
      boxes.forEach((b, i) => { b.checked = !!rem.sel.get(pending[i].id); b.closest('.prop').classList.toggle('on', b.checked); });
      for (const g of groups) {
        if (!g.cb) continue;
        const k = g.items.filter(({ p }) => rem.sel.get(p.id)).length, t = g.items.length;
        g.cb.checked = k === t; g.cb.indeterminate = k > 0 && k < t;
        g.count.textContent = `${t}건 중 ${k}건 선택`;
      }
    };
    boxes.forEach((b, i) => b.addEventListener('change', () => { rem.sel.set(pending[i].id, b.checked); sync(); }));
    for (const g of groups) {
      if (g.cb) g.cb.addEventListener('change', () => { for (const { p } of g.items) rem.sel.set(p.id, g.cb.checked); sync(); });
    }
    all.addEventListener('click', () => { for (const p of pending) rem.sel.set(p.id, true); sync(); });
    none.addEventListener('click', () => { for (const p of pending) rem.sel.set(p.id, false); sync(); });
    const lock = (on) => { for (const b of [all, none, ...boxes, ...groups.map((g) => g.cb).filter(Boolean), apply]) b.disabled = on; };
    apply.addEventListener('click', () => {
      if (rem.busy || confirmSlot.firstChild) return;
      const n = chosen(), m = pending.length - n;
      const text = n === 0 ? `${pending.length}건 전부 적용하지 않습니다. 적용하지 않은 제안은 이 작업에서 다시 나오지 않습니다.`
                 : (m === 0 ? `${n}건을 모두 적용합니다.` : `${n}건을 적용하고 ${m}건은 적용하지 않습니다. 적용하지 않은 제안은 이 작업에서 다시 나오지 않습니다.`);
      const panel = el('div', 'confirm'); panel.setAttribute('role', 'group'); panel.setAttribute('aria-label', '적용 확인');
      panel.appendChild(el('p', null, text));
      const prow = el('div', 'actions');
      const ok = el('button', 'btn', '적용'), cancel = el('button', 'btn ghost', '취소');
      ok.type = 'button'; cancel.type = 'button'; ok.id = 'remed-confirm-ok';
      prow.append(ok, cancel); panel.appendChild(prow);
      const close = () => { confirmSlot.replaceChildren(); lock(false); apply.focus(); };
      cancel.addEventListener('click', close);
      panel.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !rem.busy) { e.preventDefault(); close(); } });
      ok.addEventListener('click', () => submitDecisions(runId, pending, [ok, cancel]));
      lock(true);
      confirmSlot.replaceChildren(panel);
      ok.focus();
    });
    sync();
    return wrap;
  }
  // 묶는 기준은 라이브러리와 형식, classifier다. classifier가 다른 항목은 dependencyManagement에서 다른 항목이기 때문이다
  function groupKey(p) {
    const o = editOverride(p);
    return [p.ga || p.id || '', o.type || '', o.classifier || ''].join('|');
  }
  function editOverride(p) {
    const e = Array.isArray(p.edits) && p.edits.length ? p.edits[0] : null;
    return e && e.override && typeof e.override === 'object' ? e.override : {};
  }
  // 묶음 머리: 라이브러리, 버전, 묶음 체크박스. 모든 제안에 같은 위험 표시와 근거는 여기에 한 번만 쓴다
  function groupBox(g, gi) {
    const ps = g.items.map((x) => x.p), first = ps[0];
    const box = el('div', 'pgroup'); box.setAttribute('role', 'group');
    const id = 'remed-group-' + gi;
    const head = el('label', 'prophead'); head.htmlFor = id;
    const cb = el('input', 'pick'); cb.type = 'checkbox'; cb.id = id;
    const what = el('span', 'what');
    const ga = el('span', 'ga', first.ga || first.id || ''); ga.id = id + '-name';
    box.setAttribute('aria-labelledby', ga.id);
    what.appendChild(ga);
    const uniq = (f) => [...new Set(ps.map(f).map((v) => String(v || '?')))];
    const froms = uniq((p) => p.from_version), tos = uniq((p) => p.to_version);
    const ver = el('span', 'ver', froms.join(', ') + ' → ');
    ver.appendChild(el('b', null, tos.join(', ')));
    what.appendChild(ver);
    what.appendChild(el('span', 'gcount'));
    head.append(cb, what);
    box.appendChild(head);
    const risks = (p) => (Array.isArray(p.risks) ? p.risks : []);
    const common = { risks: risks(first).filter((r) => ps.every((p) => risks(p).includes(r))), mixedVer: froms.length > 1 || tos.length > 1 };
    common.evidence = !!first.evidence && ps.every((p) => p.evidence === first.evidence);
    const note = (p) => p.note_ko || p.note || '';
    common.note = !!note(first) && ps.every((p) => note(p) === note(first));
    g.common = common;
    const tags = el('div', 'tags');
    const vw = variantWords(editOverride(first).type, editOverride(first).classifier);
    if (vw) tags.appendChild(el('span', 'tag', vw));
    for (const r of common.risks) tags.appendChild(el('span', 'tag risk', RISK_KO[r] || r));
    if (tags.childElementCount) box.appendChild(tags);
    if (common.evidence) box.appendChild(el('p', 'facts', '버전 확인: ' + evidenceText(first.evidence)));
    if (common.note) box.appendChild(el('p', 'pnote', note(first)));
    return box;
  }
  // 제안 한 건. 묶음 안이면(common이 있으면) 라이브러리 대신 수정할 pom을 제목으로 쓰고 묶음 머리에 쓴 내용은 뺀다
  function proposalRow(p, i, common) {
    const card = el('div', 'prop');
    const id = 'remed-pick-' + i;
    const head = el('label', 'prophead'); head.htmlFor = id;
    const cb = el('input', 'pick'); cb.type = 'checkbox'; cb.id = id; cb.value = String(p.id || '');
    const what = el('span', 'what');
    const fresh = Array.isArray(p.sources);                  // sources가 없는 이전 상태 파일은 예전 모양 그대로 보여 준다
    const todo = fresh ? todoText(p) : '';
    if (common && todo) what.appendChild(el('span', 'todo', todo));
    else what.appendChild(el('span', 'ga', p.ga || p.id || ''));
    if (!common || common.mixedVer || !todo) {
      const ver = el('span', 'ver', (p.from_version || '?') + ' → ');
      ver.appendChild(el('b', null, p.to_version || '?'));
      what.appendChild(ver);
    }
    head.append(cb, what);
    card.appendChild(head);
    if (todo && !common) {
      const f = el('p', 'facts'); f.appendChild(el('span', 'k', '할 일')); f.appendChild(document.createTextNode(todo));
      card.appendChild(f);
    }
    const path = fresh ? pathFacts(p, !Object.keys(editOverride(p)).length) : null;
    if (path) { path.id = id + '-path'; cb.setAttribute('aria-describedby', path.id); card.appendChild(path); }
    const tags = el('div', 'tags');
    if (p.kind && !todo) tags.appendChild(el('span', 'tag', KIND_KO[p.kind] || p.kind));
    const o = editOverride(p), vw = variantWords(o.type, o.classifier);
    if (vw && !common) tags.appendChild(el('span', 'tag', vw));
    for (const r of Array.isArray(p.risks) ? p.risks : []) {
      if (!common || !common.risks.includes(r)) tags.appendChild(el('span', 'tag risk', RISK_KO[r] || r));
    }
    if (tags.childElementCount) card.appendChild(tags);
    if (p.evidence && !(common && common.evidence)) card.appendChild(el('p', 'facts', '버전 확인: ' + evidenceText(p.evidence)));
    if ((p.note_ko || p.note) && !(common && common.note)) card.appendChild(el('p', 'pnote', p.note_ko || p.note));
    const det = el('details');
    det.appendChild(el('summary', null, '변경 내용 보기'));
    det.appendChild(diffPre(p.diff || ''));
    card.appendChild(det);
    return card;
  }
  // 무엇을 바꾸는지 한 줄로 쓴다. 값 뒤에는 앞말에 따라 모양이 바뀌는 조사를 붙이지 않는다
  function todoText(p) {
    const ed = Array.isArray(p.edits) ? p.edits.filter((e) => e && e.pom) : [];
    if (!ed.length) return '';
    const e = ed[0], where = e.pom === 'pom.xml' ? '최상위 pom.xml' : String(e.pom);
    const more = ed.length > 1 ? ` 외 ${ed.length - 1}곳` : '';
    if (e.op === 'insert' || p.kind === 'managed_override') return `${where}에 버전 지정 추가${more}`;
    return `${where}${e.line ? ` ${e.line}행` : ''}${more}: ${KIND_KO[p.kind] || p.kind || '버전 표기 수정'}`;
  }
  // 형식과 classifier를 말로 쓴다. 일반 jar는 빈 문자열이다
  function variantWords(type, cls) {
    const w = [];
    if (type && type !== 'jar') w.push('형식 ' + type);
    if (cls) w.push('classifier ' + cls);
    return w.join(' ');
  }
  // 경로 문장으로 쓸 수 없을 때 보여 주는 출처 이름. sbmig/remediations/i18n.py의 ORIGIN_KO와 같다
  const ORIGIN_KO = { transitive: '간접 의존성', direct_literal: '직접 의존성 (pom에 버전 표기)', direct_property: '직접 의존성 (property로 버전 지정)',
                      own_management: '프로젝트의 dependencyManagement', parent_managed: '부모 pom에서 버전 지정', bom_managed: 'BOM에서 버전 지정' };
  // 모듈 하나에 라이브러리가 들어온 경로를 한 줄로 만든다. report.md의 들어온 경로와 같은 문장이다
  function sourceText(s, withVariant) {
    const parts = [], how = String(s.how || '');
    const via = (Array.isArray(s.via) ? s.via : []).filter(Boolean).map(String);
    const d = s.declared && typeof s.declared === 'object' ? s.declared : null;
    const where = d && d.pom ? String(d.pom) + (d.line ? ` ${d.line}행` : '') : '';
    if (via.length) {
      parts.push(via.join(' > ') + ' 경로로 가져옴');
      if (where) parts.push('선언 위치 ' + where);
    } else if (where) {
      if (how === 'direct_literal' || how === 'direct_property') parts.push(where + '에 직접 선언');
      else if (how === 'own_management') parts.push(where + '의 dependencyManagement에서 버전 지정');
      else parts.push(where + '에 선언');
    }
    if (d && d.property) parts.push('버전 property ' + d.property);
    if (s.manager) parts.push(String(s.manager) + '에서 버전 지정');
    if (withVariant) {
      const vs = [...new Set(String(s.variant || '').split(',').map((x) => x.trim()).filter(Boolean)
                  .map((x) => { const [t, c] = x.split('/'); return variantWords(t, c) || '일반 jar'; }))];
      if (vs.length === 1 && vs[0] !== '일반 jar') parts.push(vs[0]);
      else if (vs.length > 1) parts.push(`사용 형태 ${vs.length}가지(${vs.join(', ')})`);
    }
    if (!parts.length && how) parts.push(ORIGIN_KO[how] || how);
    return parts.join(', ');
  }
  // 들어온 경로. 모듈이 모두 같은 경로면 한 줄, 다르면 모듈마다 한 줄씩 쓴다
  function pathFacts(p, withVariant) {
    const groups = new Map();
    for (const s of p.sources) {
      if (!s || typeof s !== 'object') continue;
      const text = sourceText(s, withVariant);
      if (!text) continue;
      const mods = groups.get(text) || [];
      if (s.module && !mods.includes(String(s.module))) mods.push(String(s.module));
      groups.set(text, mods);
    }
    if (!groups.size) return null;
    const box = el('div', 'facts');
    box.appendChild(el('span', 'k', '들어온 경로'));
    if (groups.size === 1) {
      const [[text, mods]] = [...groups];
      box.appendChild(document.createTextNode(text + (mods.length > 1 ? ` (모듈 ${mods.join(', ')})` : '')));
      return box;
    }
    const ul = el('ul', 'paths');
    for (const [text, mods] of groups) ul.appendChild(el('li', null, (mods.length ? `${mods.join(', ')} 모듈: ` : '') + text));
    box.appendChild(ul);
    return box;
  }
  function evidenceText(ev) {
    const s = String(ev);
    if (s === 'policy:pins') return '서버 정책에 지정한 버전';
    if (s.startsWith('policy:')) return '서버 정책 ' + s.slice(7);
    if (s.startsWith('repository:')) return '저장소 ' + s.slice(11);
    return s;
  }
  // diff를 그대로 보여 준다. 줄마다 span 하나(textContent)를 만들고, 첫 문자로 추가된 줄과 삭제된 줄만 색을 입힌다
  function diffPre(text) {
    const pre = el('pre', 'diff');
    pre.setAttribute('tabindex', '0');                          // 가로로 긴 줄을 키보드로도 스크롤할 수 있도록
    const lines = String(text).split('\n');
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    for (const ln of lines) {
      const cls = /^(\+\+\+|---)( |$)/.test(ln) ? 'meta' : ln.startsWith('@@') ? 'hunk' : ln.startsWith('+') ? 'add' : ln.startsWith('-') ? 'del' : '';
      pre.appendChild(el('span', cls || null, ln));
      pre.appendChild(document.createTextNode('\n'));
    }
    return pre;
  }
  // 대기 중인 제안 전부의 결정을 한 번의 요청으로 보낸다(체크하면 approved, 아니면 rejected). 서버는 제안 해시, 원본 트리 해시, 정책 해시, diff가
  // 저장된 제안과 모두 같을 때만 받는다(하나라도 다르면 409 approval_mismatch, 아무것도 기록하지 않음). resume: true면 저장 후 이어서 진행한다
  async function submitDecisions(runId, pending, btns) {
    if (rem.busy) return;
    rem.busy = true; rem.err = '';
    for (const b of btns) b.disabled = true;
    const body = {
      decisions: pending.map((p) => ({ proposal_id: p.id, decision: rem.sel.get(p.id) ? 'approved' : 'rejected', proposal_hash: p.proposal_hash,
                                        source_tree_hash: p.source_tree_hash, policy_hash: p.policy_hash, diff: p.diff })),
      resume: true,
    };
    let r = null, d = {};
    try {
      r = await fetch(remUrl(runId, '/approvals'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      try { d = await r.json(); } catch (e) {}
    } catch (e) {}
    rem.busy = false;
    if (current !== runId) return;
    if (r && authProblem(r, d)) { rem.err = '접근이 거부되었습니다.'; loadRemediation(runId, true); return; }
    if (!r) { rem.err = '서버에 보내지 못했습니다. 연결을 확인하고 다시 눌러 주세요.'; loadRemediation(runId, true); return; }
    if (r.status === 409 && d && d.code === 'approval_mismatch') {
      rem.err = '제안이 바뀌었습니다. 목록을 새로 불러왔습니다.'; rem.sel = new Map(); rem.propKey = '';
      loadRemediation(runId, true); return;
    }
    if (!r.ok) { rem.err = '적용하지 못했습니다: ' + ((d && d.error) || r.status); loadRemediation(runId, true); return; }
    const n = body.decisions.filter((x) => x.decision === 'approved').length;
    if (d.resumed) {
      rem.resumeErr = '';
      toast(`결정을 저장했습니다(적용 ${n}건). 이어서 진행합니다.`);
      if (rem.last) $('remed-act').replaceChildren(goingView({ ...rem.last, status: 'QUEUED' }));   // 다음 상태가 오기 전에도 바로 표시한다
    } else {
      const re = d.resume_error && typeof d.resume_error === 'object' ? d.resume_error : null;
      rem.resumeErr = (re && re.error) || '이어서 진행하지 못했습니다.';
      toast('결정은 저장했습니다. 이어서 진행은 하지 못했습니다.', true);
    }
    loadRemediation(runId, true);
  }

  // ---- 중지됨 / 중단됨(빌드 파드가 사라진 stale, 시간 한도 chain_budget 포함): 사유 한 줄과 이어서 진행 버튼
  function stoppedView(runId, st, rs) {
    let why;
    if (st.stale) why = '실행이 끝나면서 조치가 멈춘 채 남았습니다. 자동으로 다시 보내지 않으니, 이어서 진행하면 멈춘 곳부터 계속합니다.';
    else if (st.reason === 'chain_budget') why = '조치에 쓸 수 있는 시간을 다 써서 멈췄습니다. 이어서 진행하면 멈춘 곳부터 계속합니다.';
    else if (st.reason === 'stop_requested' || st.stop_requested) why = '중지 요청으로 멈췄습니다. 이어서 진행하면 멈춘 곳부터 계속합니다.';
    else if (st.status === 'INTERRUPTED') why = '서버가 다시 시작되면서 조치가 멈췄습니다. 자동으로 다시 보내지 않으니, 이어서 진행하면 멈춘 곳부터 계속합니다.';
    else why = '조치가 멈췄습니다. 이어서 진행하면 멈춘 곳부터 계속합니다.';

  // POST /resume: 새 빌드 파드에서 이어서 진행한다(웹 파드가 Job을 만든다). 응답이 오면 상태를 다시 읽는다
  async function postResume(runId, body, ctrls) {
    if (rem.busy) return;
    rem.busy = true; rem.err = '';
    for (const c of ctrls) c.disabled = true;
    let r = null, d = {};
    try {
      r = await fetch(remUrl(runId, '/resume'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
      try { d = await r.json(); } catch (e) {}
    } catch (e) {}
    rem.busy = false;
    if (current !== runId) return;
    if (r && authProblem(r, d)) { rem.err = '접근이 거부되었습니다.'; }
    else if (!r) rem.err = '서버에 보내지 못했습니다. 연결을 확인하고 다시 눌러 주세요.';
    else if (!r.ok) rem.err = '이어서 진행하지 못했습니다: ' + ((d && d.error) || r.status);

  // ---------------------------------------------------------------- 3c. 코드 변경
  // 변환된 프로젝트의 파일을 옮긴 뒤의 위치 기준으로 원래 파일과 비교해 보여 준다.
  // 페이지의 상태를 쓰지 않고 화면, 상태, 타이머, 요청을 모두 이 안에 두므로 대화상자로 옮길 때는 CodeDiff.mount(대화상자 본문, 실행 id)만 호출하면 된다.
  // 바깥에서 가져다 쓰는 것은 el뿐이고 스타일은 모두 .cdiff 아래에 있다. 서버에서 받은 글자는 모두 textContent로만 넣는다.
  const CodeDiff = (() => {
    const PAGE_FILES = 30;        // 한 번에 그리는 파일 수. 구조를 바꾼 프로젝트는 파일이 수천 개라 나눠서 그린다
    const BIG_LINES = 400;        // 바뀐 줄이 이보다 많은 파일은 접은 채로 시작한다
    const MOVED_ONLY_SHOWN = 200; // 위치만 바뀐 파일이 이 개수 이하면 처음부터 목록에 함께 보인다
    const STEP = 20;              // 펼치기 한 번에 더 보여 주는 줄 수
    const CHUNK = 5000;           // 줄 요청 한 번에 받는 최대 줄 수(서버 한도와 같다)
    const WHOLE_MAX = 50000;      // 파일 전체 보기로 불러오는 최대 줄 수
    const TIMEOUT_MS = 30000;     // 응답이 이보다 늦으면 요청을 끊고 다시 시도 버튼을 보여 준다
    const TREE_OPEN_ALL = 150;    // 목록의 파일이 이보다 적으면 트리의 폴더를 모두 펼쳐 둔다
    const CACHE_MAX = 200;        // 받아 둔 파일 변경 내용을 이 개수까지 기억해 필터를 바꿔도 다시 받지 않는다
    const KINDS = [['all', '전체'], ['modified', '수정'], ['added', '추가'], ['deleted', '삭제'], ['moved', '이동']];
    const NOT_SHOWN = '변환된 프로젝트(result.zip)나 changes.patch에서 확인해 주세요.';
    const nf = (n) => (Number(n) || 0).toLocaleString('ko-KR');
    let S = null;                 // 지금 붙어 있는 화면의 상태. unmount하면 null이 되고, 늦게 온 응답은 자기 상태가 아니면 버린다
    let seq = 0;

    function mount(host, runId) {
      unmount();
      const root = el('div', 'cdiff');
      const s = { host, root, run: String(runId), uid: ++seq, reqs: new Set(), timers: new Set(), io: null, moreIo: null, idx: null, files: [],
                  movedOnly: 0, f: { kind: 'all', q: '', movedOnly: false, move: null }, order: [], shown: 0, fs: new Map(),
                  cache: new Map(), rows: new Map(), cur: null, ui: {} };
      S = s;
      host.replaceChildren(root);
      loadIndex(s);
    }
    // 진행 중인 요청, 타이머, 관찰자를 모두 정리하고 화면을 지운다
    function unmount() {
      const s = S;
      S = null;
      if (!s) return;
      for (const c of s.reqs) c.abort();
      for (const t of s.timers) clearTimeout(t);
      if (s.io) s.io.disconnect();
      if (s.moreIo) s.moreIo.disconnect();
      if (s.pinRo) s.pinRo.disconnect();
      s.root.remove();
    }
    const live = (s) => S === s;
    const apiUrl = (s, tail) => `/api/runs/${encodeURIComponent(s.run)}/codediff` + (tail || '');
    function button(text, cls, fn) { const b = el('button', cls, text); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; }
    // 요청마다 시간 한도를 두어 응답이 없어도 불러오는 중 표시가 계속 남지 않게 한다
    async function getJson(s, url) {
      const c = new AbortController();
      s.reqs.add(c);
      const t = setTimeout(() => c.abort(), TIMEOUT_MS);
      try {
        const r = await fetch(url, { signal: c.signal });
        let d = null;
        try { d = await r.json(); } catch (e) {}
        return { ok: r.ok && d != null && typeof d === 'object', status: r.status, data: d };
      } catch (e) {
        return { ok: false, status: 0, data: null };

        clearTimeout(t); s.reqs.delete(c);
