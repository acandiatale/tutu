<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sbmig — 마이그레이션 테스트</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --text:#1f2328; --muted:#6b7280; --ok:#1a7f37; --bad:#c62828;
          --warn:#b26a00; --accent:#1f5eff; --code:#0f172a; --codetext:#d6e2f0; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         color:var(--text); background:var(--bg); }
  header { padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { margin:0; font-size:18px; } header .sub { color:var(--muted); }
  main { display:grid; grid-template-columns: 340px 1fr; gap:16px; padding:16px 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .panel h2 { margin:0 0 10px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  label { display:block; margin:8px 0 4px; font-weight:600; }
  input[type=file], select { width:100%; padding:6px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .cfgs label { font-weight:normal; margin:2px 0; } .cfgs input { margin-right:6px; }
  button { padding:8px 14px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; cursor:pointer; font-weight:600; }
  button.secondary { background:#fff; color:var(--accent); } button:disabled { opacity:.5; cursor:default; }
  .runs { list-style:none; margin:0; padding:0; max-height:260px; overflow:auto; }
  .runs li { padding:6px 8px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .runs li:hover, .runs li.active { background:#eef3ff; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; color:#fff; background:var(--muted); }
  .badge.running { background:var(--accent); } .badge.ok { background:var(--ok); } .badge.bad { background:var(--bad); } .badge.warn { background:var(--warn); }
  .live { display:grid; grid-template-rows:auto auto 1fr auto; gap:12px; min-height:70vh; }
  .statusbar { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .statusbar .id { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .timeline { max-height:34vh; overflow:auto; border:1px solid var(--line); border-radius:6px; }
  .timeline div { padding:4px 8px; border-bottom:1px solid #f0f2f4; display:grid; grid-template-columns:70px 24px 130px 1fr; gap:6px; font-size:13px; }
  .timeline .t { color:var(--muted); font-family:ui-monospace, monospace; } .timeline .ev { font-weight:600; }
  .timeline .ok { color:var(--ok); } .timeline .bad { color:var(--bad); } .timeline .llm { color:var(--accent); }
  .logbox { background:var(--code); color:var(--codetext); font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            padding:10px; border-radius:6px; overflow:auto; height:36vh; white-space:pre-wrap; word-break:break-all; }
  .logbox .ERROR, .logbox .CRITICAL { color:#ff8a80; } .logbox .WARNING { color:#ffd180; } .logbox .DEBUG { color:#90a4ae; }
  .toolbar { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted); }
  .report { white-space:pre-wrap; font:13px/1.45 ui-monospace, Menlo, Consolas, monospace; max-height:50vh; overflow:auto;
            background:#fafbfc; border:1px solid var(--line); border-radius:6px; padding:10px; }
  .files a { margin-right:12px; }
  .hint { color:var(--muted); font-size:12px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>sbmig</h1>
  <span class="sub">JDK 21 + Spring Boot 4.1 마이그레이션 — zip 업로드 → 실행 → 실시간 진행 (SSE)</span>
</header>
<main>
  <section>
    <div class="panel">
      <h2>새 실행</h2>
      <label for="zip">프로젝트 zip</label>
      <input type="file" id="zip" accept=".zip,application/zip">
      <label>설정 파일 (config/*.yml, 나중 것이 우선)</label>
      <div class="cfgs" id="cfgs"><span class="hint">불러오는 중…</span></div>
      <label for="llm">LLM</label>
      <select id="llm">
        <option value="">설정 파일대로 (예: llm-company.yml → chat_post)</option>
        <option value="fake">fake — LLM 없이 (레시피/핸들러만)</option>
      </select>
      <label for="stop">여기까지만 실행</label>
      <select id="stop">
        <option value="">끝까지 (verify 포함)</option>
        <option value="analyze">analyze</option><option value="plan">plan</option>
        <option value="jdk21">jdk21</option><option value="spring">spring</option><option value="restructure">restructure</option>
      </select>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button id="start">실행</button>
        <button id="stopbtn" class="secondary" disabled>중단</button>
      </div>
      <p class="hint" id="envhint"></p>
    </div>
    <div class="panel" style="margin-top:16px;">
      <h2>실행 목록</h2>
      <ul class="runs" id="runs"></ul>
    </div>
  </section>

  <section class="panel live">
    <div class="statusbar">
      <span class="badge" id="state">대기</span>
      <span class="id" id="runid">—</span>
      <span id="summary" class="hint"></span>
    </div>
    <div>
      <div class="toolbar"><strong>진행 (journal)</strong><span id="phase"></span></div>
      <div class="timeline" id="timeline"></div>
    </div>
    <div>
      <div class="toolbar">
        <strong>로그 (sbmig.log + 콘솔)</strong>
        <label style="margin:0; font-weight:normal;"><input type="checkbox" id="showdebug"> DEBUG 표시</label>
        <label style="margin:0; font-weight:normal;"><input type="checkbox" id="autoscroll" checked> 자동 스크롤</label>
        <span id="logcount"></span>
      </div>
      <div class="logbox" id="log"></div>
    </div>
    <div>
      <div class="toolbar"><strong>결과</strong><span class="files" id="files"></span></div>
      <div class="report" id="report">아직 보고서가 없습니다.</div>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let es = null, current = null, logLines = 0;

  const fmtTime = (ts) => { try { return new Date(ts).toLocaleTimeString('ko-KR', {hour12:false}); } catch (e) { return ''; } };
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  async function loadConfigs() {
    const r = await fetch('/api/configs'); const d = await r.json();
    const box = $('cfgs'); box.innerHTML = '';
    for (const c of d.configs) {
      const id = 'cfg-' + c.replace(/\W/g, '_');
      const checked = (c === 'artifacts.local-e2e.yml') ? 'checked' : '';
      box.insertAdjacentHTML('beforeend', `<label><input type="checkbox" value="${esc(c)}" id="${id}" ${checked}>${esc(c)}</label>`);
    }
    $('envhint').textContent = `설정: ${d.repo_root}/config   실행 결과: ${d.out_dir}`;
  }

  async function loadRuns() {
    const r = await fetch('/api/runs'); const d = await r.json();
    const ul = $('runs'); ul.innerHTML = '';
    for (const run of d.runs) {
      const li = document.createElement('li');
      li.className = (run.run_id === current) ? 'active' : '';
      li.innerHTML = `<span class="id">${esc(run.run_id)}</span>${badgeHtml(run)}`;
      li.onclick = () => attach(run.run_id);
      ul.appendChild(li);
    }
  }

  function badgeHtml(st) {
    let cls = '', text = st.state;
    if (st.state === 'running') { cls = 'running'; text = '실행 중'; }
    else if (st.state === 'finished') {
      if (st.success === true) { cls = 'ok'; text = 'BUILD SUCCESS'; }
      else if (st.success === false) { cls = (st.exit_code === 3) ? 'bad' : 'warn'; text = st.exit_code === 3 ? '중단됨' : `미완료 (blocked ${st.blocked||0}, unresolved ${st.unresolved||0})`; }
      else { cls = st.exit_code === 0 ? 'ok' : 'bad'; text = `종료 코드 ${st.exit_code}`; }
    }
    return `<span class="badge ${cls}">${esc(text)}</span>`;
  }

  function setStatus(st) {
    const b = $('state'); b.className = 'badge'; b.textContent = st.state;
    const html = badgeHtml(st); const tmp = document.createElement('div'); tmp.innerHTML = html;
    b.className = tmp.firstChild.className; b.textContent = tmp.firstChild.textContent;
    $('summary').textContent = st.llm_calls != null ? `LLM 호출 ${st.llm_calls}회` : '';
    $('stopbtn').disabled = st.state !== 'running';
    if (st.files) {
      $('files').innerHTML = st.files.map((f) => `<a href="/api/runs/${encodeURIComponent(current)}/files/${f}" target="_blank">${f}</a>`).join('');
    }
  }

  const SKIP = new Set(['ts', 'run_id', 'event', 'path', 'project_dir', 'source', 'record']);
  function journalRow(ev) {
    const name = ev.event || '?';
    let icon = 'ℹ', cls = '';
    if (name === 'phase_start' || name === 'step_start' || name === 'loop_start') icon = '▶';
    if (name === 'phase_end' || name === 'step_end' || name === 'loop_end' || name === 'build' || name === 'verify') {
      icon = ev.ok === false ? '✗' : (ev.ok === true ? '✓' : '■'); cls = ev.ok === false ? 'bad' : (ev.ok === true ? 'ok' : '');
    }
    if (name === 'llm_fix' || name === 'llm_call') { icon = '🤖'; cls = 'llm'; }
    if (name === 'attempt' || name === 'attempt_scored' || name === 'decision' || name === 'triage') icon = '🧩';
    if (name === 'rewrite') icon = '🔄'; if (name === 'restructure') icon = '📦';
    if (name === 'handover' || name === 'report') icon = '📄'; if (name === 'harvest') icon = '🧠';
    if (name === 'analyze' || name === 'plan' || name === 'intake' || name === 'preflight') icon = '🔍';
    const bits = [];
    for (const [k, v] of Object.entries(ev)) {
      if (SKIP.has(k)) continue;
      let s = (v && typeof v === 'object') ? JSON.stringify(v) : String(v);
      if (s.length > 160) s = s.slice(0, 160) + '…';
      bits.push(`${k}=${s}`);
    }
    if (name === 'phase_start' && ev.phase) $('phase').textContent = ` — 현재 단계: ${ev.phase}`;
    if (name === 'phase_end' && ev.phase) $('phase').textContent = ` — ${ev.phase} ${ev.ok === false ? '실패' : '완료'}`;
    const div = document.createElement('div');
    div.innerHTML = `<span class="t">${fmtTime(ev.ts)}</span><span class="${cls}">${icon}</span><span class="ev ${cls}">${esc(name)}</span><span>${esc(bits.join('  '))}</span>`;
    $('timeline').appendChild(div); $('timeline').scrollTop = $('timeline').scrollHeight;
  }

  function logLine(kind, line) {
    const m = /^\S+ \S+ (DEBUG|INFO|WARNING|ERROR|CRITICAL)\s+(\S+): (.*)$/.exec(line);
    const level = m ? m[1] : (kind === 'console' ? 'INFO' : 'INFO');
    const span = document.createElement('span');
    span.className = level + (kind === 'console' ? ' console' : '');
    span.textContent = (m ? `${line.slice(11, 19)} ${level.padEnd(7)} ${m[3]}` : line) + '\n';
    if (level === 'DEBUG' && !$('showdebug').checked) span.style.display = 'none';
    $('log').appendChild(span); logLines++;
    $('logcount').textContent = `${logLines}줄`;
    if ($('autoscroll').checked) $('log').scrollTop = $('log').scrollHeight;
  }
  $('showdebug').onchange = () => { for (const s of $('log').querySelectorAll('.DEBUG')) s.style.display = $('showdebug').checked ? '' : 'none'; };

  function attach(runId) {
    if (es) { es.close(); es = null; }
    current = runId; logLines = 0;
    $('runid').textContent = runId; $('timeline').innerHTML = ''; $('log').innerHTML = ''; $('report').textContent = '실행 중…'; $('files').innerHTML = ''; $('phase').textContent = '';
    try { history.replaceState(null, '', '#' + encodeURIComponent(runId)); } catch (e) {}
    es = new EventSource(`/api/runs/${encodeURIComponent(runId)}/events`);
    es.addEventListener('status', (e) => setStatus(JSON.parse(e.data)));
    es.addEventListener('journal', (e) => journalRow(JSON.parse(e.data)));
    es.addEventListener('log', (e) => logLine('log', JSON.parse(e.data)));
    es.addEventListener('console', (e) => logLine('console', JSON.parse(e.data)));
    es.addEventListener('report', (e) => { $('report').textContent = JSON.parse(e.data); });
    es.addEventListener('end', () => { es.close(); es = null; loadRuns(); });
    es.onerror = () => { logLine('console', '[연결 끊김 — 서버가 내려갔거나 네트워크 문제입니다. 목록에서 다시 선택하면 재연결됩니다]'); es.close(); es = null; };
    loadRuns();
  }

  $('start').onclick = async () => {
    const f = $('zip').files[0];
    if (!f) { alert('zip 파일을 선택하세요'); return; }
    const configs = [...document.querySelectorAll('#cfgs input:checked')].map((i) => i.value).join(',');
    const q = new URLSearchParams({ name: f.name, configs, stop_after: $('stop').value, llm_provider: $('llm').value });
    $('start').disabled = true;
    try {
      const r = await fetch('/api/runs?' + q.toString(), { method: 'POST', headers: { 'Content-Type': 'application/zip' }, body: f });
      const d = await r.json();
      if (!r.ok) { alert('시작 실패: ' + (d.error || r.status)); return; }
      attach(d.run_id);
    } finally { $('start').disabled = false; }
  };
  $('stopbtn').onclick = async () => { if (current) { await fetch(`/api/runs/${encodeURIComponent(current)}/stop`, { method: 'POST' }); } };

  loadConfigs(); loadRuns(); setInterval(loadRuns, 10000);
  if (location.hash.length > 1) attach(decodeURIComponent(location.hash.slice(1)));   // #<run id> = shareable link
})();
</script>
</body>
</html>
