    }
    function later(s, ms, fn) {
      clearTimeout(s.debounce); s.timers.delete(s.debounce);
      const t = setTimeout(() => { s.timers.delete(t); if (live(s)) fn(); }, ms);
      s.debounce = t; s.timers.add(t);
    }
    function note(text, cls) { return el('div', 'cd-msg' + (cls ? ' ' + cls : ''), text); }
    function waitNote() { const n = note('불러오는 중입니다.', 'wait'); n.setAttribute('role', 'status'); return n; }
    function failNote(status, retry) {
      const n = note(status === 409 ? '결과 파일을 아직 정리하고 있습니다. 잠시 뒤에 다시 시도해 주세요.' : '변경 내용을 불러오지 못했습니다.', 'bad');
      n.setAttribute('role', 'alert');
      if (retry) n.appendChild(button('다시 시도', 'btn quiet', retry));
      return n;
    }

    // ---- 목록(index.json)
    async function loadIndex(s) {
      s.root.replaceChildren(waitNote());
      const r = await getJson(s, apiUrl(s));
      if (!live(s)) return;
      if (r.status === 404) { s.root.replaceChildren(note('이 실행에는 코드 변경 정보가 없습니다.')); return; }
      if (!r.ok || !Array.isArray(r.data.files)) { s.root.replaceChildren(failNote(r.status, () => loadIndex(s))); return; }
      s.idx = r.data;
      s.files = r.data.files.filter((f) => f && typeof f.path === 'string' && Number.isInteger(f.id));
      for (const f of s.files) {
        f.mk = f.status === 'moved' ? moveKey(String(f.old_path || ''), f.path) : null;
        if (movedOnly(f)) s.movedOnly++;
      }
      // 위치만 바뀐 파일이 많지 않으면 처음부터 함께 보인다. 많으면 실제 변경이 묻히므로 표와 체크박스로만 알린다
      s.f.movedOnly = s.movedOnly > 0 && s.movedOnly <= MOVED_ONLY_SHOWN;
      build(s);
    }
    const movedOnly = (f) => f.status === 'moved' && !f.changed;
    // 원래 경로와 옮긴 경로에서 뒤쪽의 같은 부분을 떼어 이동 묶음의 키를 만든다(서버가 moves를 묶는 방법과 같다)
    function moveKey(oldp, newp) {
      const a = oldp.split('/'), b = newp.split('/');
      let i = a.length, j = b.length;
      while (i > 0 && j > 0 && a[i - 1] === b[j - 1]) { i--; j--; }
      const from = a.slice(0, i).join('/'), to = b.slice(0, j).join('/');
      return (from ? from + '/' : '') + '\n' + (to ? to + '/' : '');
    }
    // 긴 경로가 단어 중간이 아니라 / 뒤에서 줄바꿈되도록 wbr을 넣는다
    function pathEl(cls, path) {
      const span = el('span', cls);
      path.split('/').forEach((part, i, all) => { span.append(part + (i < all.length - 1 ? '/' : '')); if (i < all.length - 1) span.appendChild(document.createElement('wbr')); });
      return span;
    }
    const dirLabel = (p) => (p ? String(p) : '(프로젝트 최상위)');
    function stateOf(f) {
      if (f.status === 'moved') return f.changed ? ['mv-mod', '이동 후 수정'] : ['mv', '이동'];
      return ({ modified: ['mod', '수정'], added: ['add', '추가'], deleted: ['del', '삭제'] })[f.status] || ['mod', String(f.status || '')];
    }
    function summaryText(sum, n) {
      const files = Number(sum.files) || n;
      const parts = [];
      if (sum.modified) parts.push(`수정 ${nf(sum.modified)}개`);
      if (sum.added) parts.push(`추가 ${nf(sum.added)}개`);
      if (sum.deleted) parts.push(`삭제 ${nf(sum.deleted)}개`);
      if (sum.moved) parts.push(`위치 이동 ${nf(sum.moved)}개`);
      let t = `파일 ${nf(files)}개가 바뀌었습니다.` + (parts.length ? ` ${parts.join(', ')}입니다.` : '');
      const both = (Number(sum.moved) || 0) - (Number(sum.moved_only) || 0);
      if (sum.moved && both > 0) t += ` 옮긴 파일 가운데 ${nf(both)}개는 내용도 바뀌었습니다.`;
      if (sum.added_lines || sum.removed_lines) t += ` 추가한 줄은 ${nf(sum.added_lines)}줄, 삭제한 줄은 ${nf(sum.removed_lines)}줄입니다.`;
      if (sum.binary) t += ` 바이너리 파일 ${nf(sum.binary)}개는 내용을 비교하지 않습니다.`;
      return t;
    }
    function build(s) {
      const d = s.idx, ui = s.ui, root = s.root;
      const sum = d.summary && typeof d.summary === 'object' ? d.summary : {};
      root.replaceChildren();
      if (!s.files.length) { root.appendChild(el('p', 'cd-empty', '바뀐 파일이 없습니다.')); return; }
      root.appendChild(el('p', 'cd-sum', summaryText(sum, s.files.length)));
      const total = Number(d.files_total) || 0;
      if (total > s.files.length) {
        root.appendChild(el('p', 'cd-note', `바뀐 파일이 많아 ${nf(total)}개 가운데 ${nf(s.files.length)}개만 보여 줍니다. 나머지는 ${NOT_SHOWN}`));
      }
      const moves = Array.isArray(d.moves) ? d.moves.filter((m) => m && Number(m.files) > 0) : [];
      if (moves.length) root.appendChild(movesPanel(s, moves, Number(d.moves_total) || moves.length));
      // 필터 줄: 변경 종류, 경로 검색, 위치만 바뀐 파일
      const bar = el('div', 'cd-bar');
      const seg = el('div', 'cd-seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', '변경 종류');
      ui.kinds = new Map();
      for (const [k, w] of KINDS) {
        const b = button(null, null, () => { s.f.kind = k; refresh(s); });
        b.append(el('span', null, w), el('span', 'n'));
        ui.kinds.set(k, b); seg.appendChild(b);
      }
      const q = el('input', 'cd-search'); q.type = 'search'; q.placeholder = '파일 경로 검색'; q.setAttribute('aria-label', '파일 경로 검색');
      q.spellcheck = false; q.autocomplete = 'off';
      q.addEventListener('input', () => later(s, 200, () => { s.f.q = q.value.trim(); refresh(s); }));
      const chk = el('label', 'cd-chk');
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = s.f.movedOnly;
      cb.addEventListener('change', () => { s.f.movedOnly = cb.checked; refresh(s); });
      chk.append(cb, el('span', null, '위치만 바뀐 파일도 보기'), el('span', 'n', `(${nf(s.movedOnly)}개)`));
      chk.hidden = !s.movedOnly;
      ui.mvCheck = cb;
      bar.append(seg, q, chk);
      root.appendChild(bar);
      ui.active = el('div', 'cd-active'); ui.active.hidden = true; ui.active.setAttribute('role', 'status');
      root.appendChild(ui.active);
      // 트리와 파일 목록
      const main = el('div', 'cd-main');
      const side = el('nav', 'cd-side'); side.setAttribute('aria-label', '바뀐 파일 트리');
      const head = el('div', 'cd-sidehead');
      ui.treeCount = el('span');
      ui.tree = el('div', 'cd-tree'); ui.tree.id = `cdiff-tree-${s.uid}`;
      const tb = button('트리 접기', 'cd-treebtn');
      tb.setAttribute('aria-expanded', 'true'); tb.setAttribute('aria-controls', ui.tree.id);
      tb.addEventListener('click', () => {
        const open = tb.getAttribute('aria-expanded') !== 'true';
        tb.setAttribute('aria-expanded', String(open)); tb.textContent = open ? '트리 접기' : '트리 펼치기';
        side.classList.toggle('folded', !open);
      });
      head.append(ui.treeCount, tb);
      side.append(head, ui.tree);
      const col = el('div');
      col.style.minWidth = '0';
      ui.list = el('div', 'cd-files');
      ui.more = el('div', 'cd-more'); ui.more.hidden = true;
      ui.moreBtn = button('', 'btn quiet', () => renderMore(s));
      ui.moreRest = el('span');
      ui.more.append(ui.moreBtn, ui.moreRest);
      col.append(ui.list, ui.more);
      main.append(side, col);
      root.appendChild(main);
      // 파일 내용은 화면 근처에 왔을 때 받는다. 목록 끝이 가까워지면 다음 파일들을 그린다
      s.io = new IntersectionObserver((list) => {
        if (!live(s)) return;
        for (const e of list) {
          if (!e.isIntersecting) continue;
          s.io.unobserve(e.target);
          const st = s.fs.get(Number(e.target.dataset.id));
          if (st && st.card === e.target && !st.folded) loadBody(s, st);
        }
      }, { rootMargin: '600px 0px' });
      s.moreIo = new IntersectionObserver((list) => { if (live(s) && list.some((e) => e.isIntersecting)) renderMore(s); }, { rootMargin: '400px 0px' });
      refresh(s);
    }
    function movesPanel(s, moves, total) {
      const box = el('section', 'cd-moves'); box.setAttribute('aria-label', '폴더 구조 변경');
      box.appendChild(el('h3', null, '폴더 구조가 바뀌었습니다'));
      box.appendChild(el('p', null, '회사 표준 구조에 맞춰 파일 위치를 옮겼습니다. 원래 위치와 옮긴 위치는 아래 표와 같습니다. 줄을 누르면 그 묶음의 파일만 목록에 보여 줍니다.'));
      const wrap = el('div', 'cd-mwrap'), t = el('table', 'cd-mtable');
      const hr = el('tr');
      hr.append(el('th', null, '원래 위치'), el('th', null, '옮긴 위치'), el('th', 'n', '파일 수'));
      const thead = el('thead'); thead.appendChild(hr);
      const tbody = el('tbody');
      s.ui.mrows = [];
      for (const m of moves) {
        const key = String(m.from || '') + '\n' + String(m.to || '');
        const tr = el('tr');
        tr.append(el('td', m.from ? null : 'root', dirLabel(m.from)), el('td', m.to ? null : 'root', dirLabel(m.to)));
        const td = el('td', 'n');
        const b = button(`${nf(m.files)}개`, 'cd-link');
        b.setAttribute('aria-label', `원래 위치 ${dirLabel(m.from)}, 옮긴 위치 ${dirLabel(m.to)}: 이 묶음의 파일 ${nf(m.files)}개만 보기`);
        b.setAttribute('aria-pressed', 'false');
        td.appendChild(b); tr.appendChild(td);
        // 버튼을 눌러도 click이 줄까지 올라오므로 줄에만 연결한다
        tr.addEventListener('click', () => { s.f.move = s.f.move === key ? null : key; refresh(s); });
        s.ui.mrows.push({ key, tr, b, m });
        tbody.appendChild(tr);
      }
      t.append(thead, tbody); wrap.appendChild(t); box.appendChild(wrap);
      if (total > moves.length) box.appendChild(el('p', 'more', `옮긴 묶음이 많아 ${nf(total)}가지 가운데 ${nf(moves.length)}가지만 표에 실었습니다.`));
      return box;
    }

    // ---- 필터를 적용해 트리와 목록을 다시 그린다
    function refresh(s) {
      const F = s.f, ui = s.ui, q = F.q.toLowerCase();
      const base = [];
      for (const f of s.files) {
        if (F.move != null) { if (f.mk !== F.move) continue; }
        else if (!F.movedOnly && movedOnly(f)) continue;
        if (q && !f.path.toLowerCase().includes(q) && !String(f.old_path || '').toLowerCase().includes(q)) continue;
        base.push(f);
      }
      const n = { all: base.length, modified: 0, added: 0, deleted: 0, moved: 0 };
      for (const f of base) if (n[f.status] != null) n[f.status]++;
      for (const [k, b] of ui.kinds) { b.setAttribute('aria-pressed', String(k === F.kind)); b.lastChild.textContent = nf(n[k]); }
      ui.mvCheck.disabled = F.move != null;           // 이동 묶음을 고르면 위치만 바뀐 파일도 함께 보여 준다
      for (const r of ui.mrows || []) { const on = r.key === F.move; r.tr.classList.toggle('on', on); r.b.setAttribute('aria-pressed', String(on)); }
      paintActive(s);
      const view = F.kind === 'all' ? base : base.filter((f) => f.status === F.kind);
      const tree = buildTree(view);
      s.order = [];
      treeOrder(tree.root, s.order); treeOrder(tree.del, s.order);
      ui.treeCount.textContent = `파일 ${nf(view.length)}개`;
      drawTree(s, tree, view.length);
      if (s.pinRo) { s.pinRo.disconnect(); s.pinRo = null; }
      s.io.disconnect(); s.fs.clear(); s.shown = 0; s.cur = null;
      ui.list.replaceChildren();
      if (!view.length) ui.list.appendChild(el('p', 'cd-empty', '조건에 맞는 파일이 없습니다.'));
      renderMore(s);
    }
    function paintActive(s) {
      const box = s.ui.active, key = s.f.move;
      box.replaceChildren();
      box.hidden = key == null;
      if (key == null) return;
      const [from, to] = key.split('\n');
      box.append(el('span', null, '옮긴 묶음 하나만 보고 있습니다. 원래 위치'), el('code', null, dirLabel(from)),
                 el('span', null, '옮긴 위치'), el('code', null, dirLabel(to)));
      box.appendChild(button('모든 파일 보기', 'btn quiet', () => { s.f.move = null; refresh(s); }));
    }

    // ---- 트리: 최종 경로 기준. 폴더 하나만 든 폴더는 한 줄로 합치고 삭제한 파일은 맨 아래에 따로 모은다
    function buildTree(view) {
      const node = () => ({ name: '', dirs: new Map(), files: [] });
      const root = node(), del = node();
      for (const f of view) {
        const parts = f.path.split('/');
        let n = f.status === 'deleted' ? del : root;
        for (const p of parts.slice(0, -1)) {
          let c = n.dirs.get(p);
          if (!c) { c = node(); c.name = p; n.dirs.set(p, c); }
          n = c;
        }
        n.files.push(f);
      }
      compact(root); compact(del);
      return { root, del };
    }
    const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
    const baseName = (p) => p.slice(p.lastIndexOf('/') + 1);
    function compact(n) {
      const out = [];
      for (let c of n.dirs.values()) {
        while (c.dirs.size === 1 && !c.files.length) {
          const g = c.dirs.values().next().value;
          c = { name: c.name + '/' + g.name, dirs: g.dirs, files: g.files };
        }
        compact(c);
        out.push(c);
      }
      out.sort((a, b) => cmp(a.name, b.name));
      n.dirs = new Map(out.map((c) => [c.name, c]));
      n.files.sort((a, b) => cmp(baseName(a.path), baseName(b.path)));
    }
    // 목록은 트리와 같은 순서(폴더 먼저, 그다음 파일)로 그린다
    function treeOrder(n, acc) { for (const c of n.dirs.values()) treeOrder(c, acc); for (const f of n.files) acc.push(f); }
    function drawTree(s, tree, count) {
      const box = s.ui.tree;
      box.replaceChildren(); s.rows = new Map();
      const all = count <= TREE_OPEN_ALL;
      treeDir(s, tree.root, 0, box, all);
      if (tree.del.dirs.size || tree.del.files.length) { box.appendChild(el('p', 'cd-tgroup', '삭제한 파일')); treeDir(s, tree.del, 0, box, all); }
      if (!count) box.appendChild(el('p', 'cd-tempty', '파일이 없습니다.'));
    }
    // 폴더의 하위 줄은 처음 펼칠 때 만든다. 파일이 수천 개여도 보이는 줄만 화면에 둔다
    function treeDir(s, n, depth, box, all) {
      const pad = (d) => `${10 + d * 14}px`;
      for (const d of n.dirs.values()) {
        const open = all || depth === 0;
        const b = button(null, 'dir'); b.style.paddingLeft = pad(depth); b.title = d.name;
        b.setAttribute('aria-expanded', String(open));
        b.append(el('span', 'chev'), el('span', 'nm', d.name + '/'));
        const kids = el('div'); kids.hidden = !open;
        let built = false;
        const fill = () => { if (!built) { built = true; treeDir(s, d, depth + 1, kids, all); } };
        if (open) fill();
        b.addEventListener('click', () => {
          const on = b.getAttribute('aria-expanded') !== 'true';
          b.setAttribute('aria-expanded', String(on));
          if (on) fill();
          kids.hidden = !on;
        });
        box.append(b, kids);
      }
      for (const f of n.files) {
        const [cls, word] = stateOf(f);
        const b = button(null, null, () => jump(s, f.id)); b.style.paddingLeft = pad(depth); b.title = f.path;
        b.append(el('span', 'dot ' + cls), el('span', 'nm', baseName(f.path)), el('span', 'sr', ` (${word})`));
        if (f.id === s.cur) b.setAttribute('aria-current', 'true');
        s.rows.set(f.id, b);
        box.appendChild(b);
      }
    }
    // 아직 그리지 않은 파일이면 그 파일까지 목록을 그린 뒤 이동한다
    function jump(s, id) {
      const i = s.order.findIndex((f) => f.id === id);
      if (i < 0) return;
      if (i >= s.shown) renderMore(s, i);
      const st = s.fs.get(id);
      if (!st) return;
      const old = s.rows.get(s.cur);
      if (old) old.removeAttribute('aria-current');
      s.cur = id;
      const row = s.rows.get(id);
      if (row) row.setAttribute('aria-current', 'true');
      st.card.scrollIntoView({ block: 'start' });
      st.head.focus({ preventScroll: true });
      if (!st.folded) loadBody(s, st);
      pin(s, st);
    }
    // 이동한 직후 위쪽 파일의 내용이 들어오면 목표 파일이 아래로 밀리므로 잠시 위치를 다시 맞춘다. 사용자가 스크롤하면 멈춘다
    function pin(s, st) {
      if (s.pinRo) s.pinRo.disconnect();
      const stop = () => { if (s.pinRo) { s.pinRo.disconnect(); s.pinRo = null; } s.root.removeEventListener('wheel', stop); s.root.removeEventListener('touchmove', stop); };
      s.pinRo = new ResizeObserver(() => { if (live(s) && st.card.isConnected) st.card.scrollIntoView({ block: 'start' }); });
      s.pinRo.observe(s.ui.list);
      s.root.addEventListener('wheel', stop, { passive: true });
      s.root.addEventListener('touchmove', stop, { passive: true });
      const t = setTimeout(() => { s.timers.delete(t); stop(); }, 1500);
      s.timers.add(t);
    }

    // ---- 파일 목록: PAGE_FILES개씩 그린다
    function renderMore(s, upto) {
      const end = Math.min(s.order.length, Math.max(s.shown + PAGE_FILES, upto == null ? 0 : upto + 1));
      const cards = [];
      for (let i = s.shown; i < end; i++) cards.push(fileCard(s, s.order[i]));
      if (cards.length) s.ui.list.append(...cards);
      s.shown = Math.max(s.shown, end);
      for (const c of cards) if (c.dataset.watch) s.io.observe(c);
      const rest = s.order.length - s.shown, ui = s.ui;
      s.moreIo.unobserve(ui.more);
      ui.more.hidden = rest <= 0;
      if (rest > 0) {
        ui.moreBtn.textContent = `파일 ${nf(Math.min(PAGE_FILES, rest))}개 더 보기`;
        ui.moreRest.textContent = rest > PAGE_FILES ? `남은 파일 ${nf(rest)}개` : '';
        s.moreIo.observe(ui.more);
      }
    }
    function fileCard(s, f) {
      const [cls, word] = stateOf(f);
      const card = el('section', 'cd-file'); card.dataset.id = String(f.id);
      card.setAttribute('aria-label', `${word}: ${f.path}`);
      const head = el('div', 'cd-fhead'); head.tabIndex = -1;
      const line = el('div', 'cd-fl');
      const fold = button(null, 'cd-fold');
      line.append(fold, el('span', 'cd-badge ' + cls, word), pathEl('cd-path', f.path));
      const a = Number(f.added) || 0, r = Number(f.removed) || 0;
      if (!f.binary && (a || r)) {
        const stat = el('span', 'cd-stat');
        stat.setAttribute('aria-label', [a ? `${nf(a)}줄 추가` : '', r ? `${nf(r)}줄 삭제` : ''].filter(Boolean).join(', '));
        if (a) stat.appendChild(el('span', 'a', '+' + nf(a)));
        if (r) stat.appendChild(el('span', 'd', '−' + nf(r)));
        line.appendChild(stat);
      }
      const enc = String(f.encoding || '');
      if (enc && !/^(utf-?8|us-ascii|ascii)$/i.test(enc)) line.appendChild(el('span', 'cd-enc', `인코딩 ${enc}`));
      const whole = button('파일 전체 보기', 'cd-whole'); whole.hidden = true;
      line.appendChild(whole);
      head.appendChild(line);
      if (f.status === 'moved' && f.old_path) {
        const from = el('div', 'cd-from');
        from.append(el('span', 'k', '원래 위치:'), pathEl('p', String(f.old_path)));
        head.appendChild(from);
      }
      const big = el('div', 'cd-bignote'); big.hidden = true;
      const body = el('div', 'cd-body');
      card.append(head, big, body);
      const st = { f, card, head, fold, whole, big, body, folded: false, bigFold: false, loaded: false, loading: false, gaps: [], busy: false };
      s.fs.set(f.id, st);
      fold.addEventListener('click', () => setFold(s, st, !st.folded));
      whole.addEventListener('click', () => wholeFile(s, st));
      // 받을 내용이 없는 파일은 바로 문장을 넣고, 큰 파일은 접어 두고, 나머지는 화면 근처에 오면 받는다
      if (f.binary || f.omitted === 'binary') { st.loaded = true; body.appendChild(note('바이너리 파일이라 내용을 표시하지 않습니다.')); }
      else if (f.omitted === 'too_large' || f.omitted === 'cap') { st.loaded = true; body.appendChild(note(`변경 내용이 커서 화면에 싣지 않았습니다. ${NOT_SHOWN}`)); }
      else if (f.omitted === 'unreadable' || f.omitted === 'unavailable') { st.loaded = true; body.appendChild(note(`이 파일의 변경 내용을 표시할 수 없습니다. ${NOT_SHOWN}`)); }
      else if (a + r > BIG_LINES) {
        st.bigFold = true;
        big.append(el('span', null, `바뀐 줄이 ${nf(a + r)}줄로 많아 접어 두었습니다.`), button('펼쳐 보기', 'btn quiet', () => setFold(s, st, false)));
      } else { body.appendChild(waitNote()); card.dataset.watch = '1'; }
      setFold(s, st, st.bigFold, true);
      return card;
    }
    function setFold(s, st, folded, quiet) {
      st.folded = folded;
      st.body.hidden = folded;
      st.fold.setAttribute('aria-expanded', String(!folded));
      st.fold.setAttribute('aria-label', folded ? '이 파일 펼치기' : '이 파일 접기');
      st.big.hidden = !(folded && st.bigFold);
      // 처음 그릴 때(quiet)는 받지 않는다. 화면 근처에 오면 관찰자가 받는다
      if (!folded && !quiet) {
        if (st.bigFold) { st.bigFold = false; st.fold.focus(); }
        loadBody(s, st);
      }
      syncWhole(st);
    }
    function syncWhole(st) { st.whole.hidden = st.folded || !st.gaps.length; }
    function remember(s, id, d) {
      s.cache.set(id, d);
      if (s.cache.size > CACHE_MAX) s.cache.delete(s.cache.keys().next().value);
    }
    async function loadBody(s, st) {
      if (st.loading || st.loaded) return;
      const id = st.f.id, hit = s.cache.get(id);
      if (hit) { renderBody(s, st, hit); return; }
      st.loading = true;
      st.body.replaceChildren(waitNote());
      const r = await getJson(s, apiUrl(s, `/files/${id}`));
      if (!live(s)) return;
      st.loading = false;
      if (!r.ok || !Array.isArray(r.data.hunks)) { st.body.replaceChildren(failNote(r.status, () => loadBody(s, st))); return; }
      remember(s, id, r.data);
      renderBody(s, st, r.data);
    }

    // ---- 파일 본문: 변경 묶음마다 원래 줄 번호, 바뀐 뒤 줄 번호, 코드를 보여 주고 사이사이에 펼치기 줄을 둔다
    function span(h) {
      const os = Number(h.old_start) || 0, ol = Number(h.old_lines) || 0, ns = Number(h.new_start) || 0, nl = Number(h.new_lines) || 0;
      return { oFirst: ol ? os : os + 1, oLast: ol ? os + ol - 1 : os, nFirst: nl ? ns : ns + 1, nLast: nl ? ns + nl - 1 : ns };
    }
    function renderBody(s, st, d) {
      const f = st.f;
      st.loaded = true; st.gaps = [];
      const hunks = d.hunks.filter((h) => h && Array.isArray(h.lines));
      const done = (node) => { st.body.replaceChildren(node); syncWhole(st); };
      if (d.binary) return done(note('바이너리 파일이라 내용을 표시하지 않습니다.'));
      if (d.omitted === 'too_large' || d.omitted === 'cap') return done(note(`변경 내용이 커서 화면에 싣지 않았습니다. ${NOT_SHOWN}`));
      if (d.omitted === 'unreadable' || d.omitted === 'unavailable') return done(note(`이 파일의 변경 내용을 표시할 수 없습니다. ${NOT_SHOWN}`));
      if (!hunks.length) {
        if (movedOnly(f)) {
          const box = note('내용은 그대로이고 위치만 바뀌었습니다.');
          if (d.expandable) box.appendChild(button('파일 내용 보기', 'btn quiet', () => showContent(s, st, box)));
          return done(box);
        }
        return done(note(f.status === 'added' ? '내용이 없는 빈 파일입니다.' : '줄 단위로 바뀐 내용은 없습니다.'));
      }
      // 삭제한 파일과 새로 만든 파일은 줄을 더 불러올 것이 없다
      const canMore = !!d.expandable && f.status !== 'deleted' && f.status !== 'added';
      const ctx = Math.max(0, Number(s.idx && s.idx.context) || 0);
      const wrap = el('div', 'cd-scroll'); wrap.tabIndex = 0; wrap.setAttribute('aria-label', `${f.path} 변경 내용`);
      const table = el('table', 'cd-code'), tbody = el('tbody');
      table.appendChild(tbody); wrap.appendChild(table);
      st.wrap = wrap;
      let prev = null;
      for (const h of hunks) {
        const r = span(h);
        if (canMore) {
          const lo = prev ? prev.nLast + 1 : 1, hi = r.nFirst - 1;
          if (hi >= lo) addGap(s, st, tbody, { lo, hi, delta: r.oFirst - r.nFirst, where: prev ? 'mid' : 'top', sec: String(h.section || '') });
        } else if (prev || r.nFirst > 1 || r.oFirst > 1) {
          tbody.appendChild(sepRow(String(h.section || '')));
        }
        hunkRows(tbody, h.lines);
        prev = r;
      }
      const nn = d.no_newline && typeof d.no_newline === 'object' ? d.no_newline : {};
      // 마지막 묶음 뒤의 같은 줄이 문맥 줄 수보다 적으면 파일 끝까지 보인 것이다
      const last = hunks[hunks.length - 1].lines;
      let tail = 0;
      for (let i = last.length - 1; i >= 0 && Array.isArray(last[i]) && last[i][0] === ' '; i--) tail++;
      if (canMore && !nn.new && tail >= ctx) addGap(s, st, tbody, { lo: prev.nLast + 1, hi: null, delta: prev.oLast - prev.nLast, where: 'bottom', sec: '' });
      if (nn.new && !nn.old) tbody.appendChild(eofRow('파일 끝에 줄바꿈이 없습니다.'));
      else if (nn.old && !nn.new && f.status !== 'deleted') tbody.appendChild(eofRow('원래 파일 끝에 없던 줄바꿈을 추가했습니다.'));
      done(wrap);
    }
    function row(cls, oldNo, newNo, sign, text, mark) {
      const tr = el('tr', cls || null);
      tr.append(el('td', 'no o', oldNo == null ? '' : oldNo), el('td', 'no n', newNo == null ? '' : newNo), el('td', 'sg', sign));
      const td = el('td', 'cd');
      if (mark && mark[1] > mark[0]) td.append(text.slice(0, mark[0]), el('span', 'x', text.slice(mark[0], mark[1])), text.slice(mark[1]));
      else td.textContent = text;
      tr.appendChild(td);
      return tr;
    }
    function lineRow(ln, mark) {
      const k = ln[0], text = ln[3] == null ? '' : String(ln[3]);
      if (k === '+') return row('a', null, ln[2], '+', text, mark);
      if (k === '-') return row('d', ln[1], null, '−', text, mark);
      return row(null, ln[1], ln[2], '', text, null);
    }
    // 바뀐 줄 쌍에서 앞뒤의 같은 부분을 빼고 달라진 부분만 표시한다
    function diffMark(a, b) {
      if (a.length > 2000 || b.length > 2000) return null;
      let p = 0;
      while (p < a.length && p < b.length && a[p] === b[p]) p++;
      let q = 0;
      while (q < a.length - p && q < b.length - p && a[a.length - 1 - q] === b[b.length - 1 - q]) q++;
      if (!p && !q) return null;
      // 단어 중간에서 끊기면 읽기 어려우므로 표시 범위를 단어 경계까지 넓힌다
      const w = /[A-Za-z0-9_$\uAC00-\uD7A3]/;
      while (p > 0 && w.test(a[p - 1])) p--;
      while (q > 0 && w.test(a[a.length - q]) && w.test(b[b.length - q])) q--;
      return [[p, a.length - q], [p, b.length - q]];
    }
    function hunkRows(tbody, lines) {
      const frag = document.createDocumentFragment();
      const kind = (i) => (Array.isArray(lines[i]) ? lines[i][0] : null);
      const txt = (i) => String(lines[i][3] == null ? '' : lines[i][3]);
      for (let i = 0; i < lines.length;) {
        if (!Array.isArray(lines[i])) { i++; continue; }
        if (kind(i) !== '-') { frag.appendChild(lineRow(lines[i], null)); i++; continue; }
        let j = i; while (j < lines.length && kind(j) === '-') j++;
        let m = j; while (m < lines.length && kind(m) === '+') m++;
        const marks = [];
        for (let p = 0; p < Math.min(j - i, m - j); p++) marks.push(diffMark(txt(i + p), txt(j + p)));
        for (let x = i; x < j; x++) frag.appendChild(lineRow(lines[x], marks[x - i] && marks[x - i][0]));
        for (let x = j; x < m; x++) frag.appendChild(lineRow(lines[x], marks[x - j] && marks[x - j][1]));
        i = m;
      }
      tbody.appendChild(frag);
    }
    function wideRow(cls) {
      const tr = el('tr', cls), td = el('td'), acts = el('div', 'acts');
      td.colSpan = 4; td.appendChild(acts); tr.appendChild(td);
      return { tr, acts };
    }
    function sepRow(sec) { const w = wideRow('gap'); w.acts.appendChild(el('span', null, '⋯')); if (sec) w.acts.appendChild(el('span', 'sec', sec)); return w.tr; }
    function eofRow(text) { const w = wideRow('eof'); w.acts.textContent = text; return w.tr; }

    // ---- 가려진 줄 펼치기. 가려진 범위는 바뀐 뒤 파일의 줄 번호이고 원래 줄 번호는 이웃한 변경 묶음과의 차이(delta)로 구한다
    function addGap(s, st, tbody, g) {
      const w = wideRow('gap');
      g.tr = w.tr; g.acts = w.acts; g.busy = false; g.err = 0; g.how = '';
      st.gaps.push(g);
      tbody.appendChild(g.tr);
      paintGap(s, st, g);
    }
    function paintGap(s, st, g) {
      if (g.hi != null && g.hi < g.lo) {
        g.tr.remove();
        st.gaps = st.gaps.filter((x) => x !== g);
        syncWhole(st);
        return;
      }
      const acts = g.acts;
      acts.replaceChildren();
      if (g.busy) { acts.appendChild(el('span', 'wait', '불러오는 중입니다.')); return; }
      if (g.err === 404) {
        acts.appendChild(el('span', null, '이 파일의 나머지 줄은 불러올 수 없습니다.'));
        st.gaps = st.gaps.filter((x) => x !== g); syncWhole(st);
        return;
      }
      if (g.err) {
        acts.append(el('span', 'bad', g.err === 409 ? '결과 파일을 아직 정리하고 있습니다.' : '줄을 불러오지 못했습니다.'),
                    button('다시 시도', null, () => expand(s, st, g, g.how)));
        return;
      }
      const n = g.hi == null ? null : g.hi - g.lo + 1;
      const add = (t, how) => acts.appendChild(button(t, null, () => expand(s, st, g, how)));
      if (n != null && n <= STEP) add(`가려진 ${nf(n)}줄 모두 보기`, 'all');
      else {
        if (g.where !== 'top') add(`아래로 ${STEP}줄 더 보기`, 'down');
        if (g.where !== 'bottom') add(`위로 ${STEP}줄 더 보기`, 'up');
        if (n != null) add(`가려진 ${nf(n)}줄 모두 보기`, 'all');
      }
      if (g.sec) acts.appendChild(el('span', 'sec', g.sec));
    }
    // 바뀐 뒤 파일의 a..b줄을 받는다. 서버가 한 번에 주는 줄 수를 넘으면 받은 끝 다음 줄부터 다시 요청한다
    async function fetchLines(s, id, a, b) {
      const out = [];
      let total = null, start = a;
      for (let calls = 0; start <= b && calls < Math.ceil(WHOLE_MAX / CHUNK) + 1; calls++) {
        const r = await getJson(s, apiUrl(s, `/files/${id}/lines?start=${start}&end=${Math.min(b, start + CHUNK - 1)}`));
        if (!live(s)) return null;
        if (!r.ok || !Array.isArray(r.data.lines)) return { error: r.status || -1 };
        const d = r.data, s0 = Number(d.start);
        total = Number.isFinite(Number(d.total)) ? Number(d.total) : total;
        d.lines.forEach((t, k) => { const no = s0 + k; if (no >= start && no <= b) out.push({ no, text: String(t) }); });
        const end = Number(d.end);
        if (!d.lines.length || !Number.isFinite(end) || end < start || (total != null && end >= total)) break;
        start = end + 1;
      }
      return { lines: out, total };
    }
    async function expand(s, st, g, how) {
      if (g.busy) return true;
      let a, b;
      if (how === 'up') { b = g.hi; a = Math.max(g.lo, g.hi - STEP + 1); }
      else if (how === 'down') { a = g.lo; b = g.hi == null ? g.lo + STEP - 1 : Math.min(g.hi, g.lo + STEP - 1); }
      else { a = g.lo; b = g.hi == null ? g.lo + WHOLE_MAX - 1 : g.hi; }
      const focused = g.tr.contains(document.activeElement);
      g.busy = true; g.err = 0; g.how = how;
      paintGap(s, st, g);
      const r = await fetchLines(s, st.f.id, a, b);
      if (!live(s) || !r) return false;
      g.busy = false;
      if (r.error) { g.err = r.error; paintGap(s, st, g); return false; }
      if (g.hi == null && r.total != null) g.hi = r.total;
      const rows = r.lines;
      const parent = g.tr.parentNode;
      if (!rows.length) g.hi = g.lo - 1;
      else if (how === 'up') {
        const ref = g.tr.nextSibling;
        for (const x of rows) parent.insertBefore(row(null, x.no + g.delta, x.no, '', x.text, null), ref);
        g.hi = rows[0].no - 1;
      } else {
        for (const x of rows) parent.insertBefore(row(null, x.no + g.delta, x.no, '', x.text, null), g.tr);
        g.lo = rows[rows.length - 1].no + 1;
      }
      paintGap(s, st, g);
      // 키보드로 누른 경우 포커스가 사라지지 않도록 같은 줄의 첫 버튼이나 코드 영역으로 옮긴다
      if (focused) { const nb = g.tr.isConnected && g.tr.querySelector('button'); (nb || st.wrap).focus({ preventScroll: true }); }
      return true;
    }
    async function wholeFile(s, st) {
      if (st.busy) return;
      st.busy = true; st.whole.disabled = true; st.whole.textContent = '불러오는 중입니다.';
      for (const g of [...st.gaps]) {
        const ok = await expand(s, st, g, 'all');
        if (!live(s)) return;
        if (!ok) break;
      }
      st.busy = false; st.whole.disabled = false; st.whole.textContent = '파일 전체 보기';
      syncWhole(st);
    }
    // 위치만 바뀐 파일: 버튼을 누르면 파일 내용을 그대로 보여 준다(원래 줄 번호와 같다)
    async function showContent(s, st, box) {
      const b = box.querySelector('button');
      if (b) { b.disabled = true; b.textContent = '불러오는 중입니다.'; }
      const r = await fetchLines(s, st.f.id, 1, WHOLE_MAX);
      if (!live(s) || !r) return;
      if (r.error) {
        st.body.replaceChildren(box, failNote(r.error, () => { st.body.replaceChildren(box); showContent(s, st, box); }));
        if (b) { b.disabled = false; b.textContent = '파일 내용 보기'; }
        return;
      }
      if (b) b.remove();
      const wrap = el('div', 'cd-scroll'); wrap.tabIndex = 0; wrap.setAttribute('aria-label', `${st.f.path} 내용`);
      const table = el('table', 'cd-code'), tbody = el('tbody');
      const frag = document.createDocumentFragment();
      for (const x of r.lines) frag.appendChild(row(null, x.no, x.no, '', x.text, null));
      tbody.appendChild(frag);
      if (r.total != null && r.total > r.lines.length) tbody.appendChild(eofRow(`앞의 ${nf(r.lines.length)}줄만 보여 줍니다. 전체 ${nf(r.total)}줄입니다.`));
      if (!r.lines.length) tbody.appendChild(eofRow('내용이 없는 빈 파일입니다.'));
      table.appendChild(tbody); wrap.appendChild(table);
      st.wrap = wrap;
      st.body.replaceChildren(box, wrap);
    }

    return { mount, unmount };
  })();

  // 결과 카드의 머리 줄. 요약 칩과 열기 버튼만 페이지가 관리하고 안쪽은 CodeDiff에 맡긴다
  const cdv = { run: null, open: false, mounted: false };
  function showCodeDiff(st, remOnly) {
    const sum = st.code_diff && typeof st.code_diff === 'object' ? st.code_diff : null;
    if (remOnly || !sum || !current) { hideCodeDiff(); return; }
    if (cdv.run !== current) { hideCodeDiff(); cdv.run = current; }
    const nf = (n) => (Number(n) || 0).toLocaleString('ko-KR');
    const chips = [el('span', 'chip', `파일 ${nf(sum.files)}개`)];
    if (sum.added_lines) chips.push(el('span', 'chip ok', `+${nf(sum.added_lines)}줄`));
    if (sum.removed_lines) chips.push(el('span', 'chip bad', `−${nf(sum.removed_lines)}줄`));
    if (sum.moved) chips.push(el('span', 'chip', `위치 이동 ${nf(sum.moved)}개`));
    $('cd-counts').replaceChildren(...chips);
    $('cdblock').hidden = false;
  }
  function hideCodeDiff() {
    CodeDiff.unmount();
    cdv.run = null; cdv.open = false; cdv.mounted = false;
    $('cdblock').hidden = true; $('cd-host').hidden = true; $('cd-host').replaceChildren();
    $('cd-toggle').setAttribute('aria-expanded', 'false'); $('cd-toggle').textContent = '변경 내용 보기';
  }
  // 처음 열 때 화면을 붙이고, 접었다 다시 열면 붙여 둔 화면을 그대로 보여 준다
  $('cd-toggle').addEventListener('click', () => {
    if (!cdv.run) return;
    cdv.open = !cdv.open;
    $('cd-host').hidden = !cdv.open;
    $('cd-toggle').setAttribute('aria-expanded', String(cdv.open));
    $('cd-toggle').textContent = cdv.open ? '접기' : '변경 내용 보기';
    if (cdv.open && !cdv.mounted) { cdv.mounted = true; CodeDiff.mount($('cd-host'), cdv.run); }
  });

  // ---------------------------------------------------------------- 실행에 연결 (SSE)
  // resume은 끊긴 같은 실행에 다시 연결하는 경우다(아래 '다시 연결'). 사용자가 직접 선택한 실행이면 진행 중인 재연결을 멈춘다.
  // 화면(레일, 기록, 로그, 결과)은 매번 비우고 서버가 처음부터 다시 보내는 내용으로 채우므로 다시 연결해도 줄이 겹치지 않는다
  function attach(runId, resume, flowHint, nameHint) {
    if (!resume) cancelRetry();
    if (es) { es.close(); es = null; }
    current = runId; lastState = '';
    runFlow = flowHint === FLOW_REM ? FLOW_REM : FLOW_FULL;   // 실제 값은 첫 status에서 받는다(setStatus)
    $('abortbox').hidden = true; setPodWait(null);
    logBuf = []; logTotal = 0; logDropped = 0; renderLog();
    $('runcard').hidden = false; $('resultcard').hidden = true; hideRemediation(); hideCodeDiff();
    $('runid').textContent = runId; $('summary').textContent = ''; setRunName(nameHint || '');
    $('timeline').innerHTML = ''; $('log').replaceChildren(); $('report').textContent = ''; $('logfull').hidden = true;
    setTitle('', resume ? '다시 연결하는 중…' : '연결하는 중…', false); statusKey = '';
    $('stop').disabled = true;                         // 이전 실행의 상태가 남지 않도록 이 실행의 status가 오기 전에는 비활성화한다
    resetRail(runFlow); setFramework(null); runRem = null;
    try { history.replaceState(null, '', '#' + encodeURIComponent(runId)); } catch (e) {}
    const src = new EventSource(`/api/runs/${encodeURIComponent(runId)}/events`);
    es = src;
    const mine = () => es === src;                   // 닫은 뒤에 늦게 온 이벤트는 버린다
    src.addEventListener('status', (e) => { if (!mine()) return; retry.delay = 0; retry.gone = 0; setStatus(JSON.parse(e.data)); });
    src.addEventListener('node', (e) => { if (mine()) onNode(JSON.parse(e.data)); });
    src.addEventListener('journal', (e) => { if (mine()) journalRow(JSON.parse(e.data)); });
    src.addEventListener('log', (e) => { if (mine()) logLine('log', JSON.parse(e.data)); });
    src.addEventListener('console', (e) => { if (mine()) logLine('console', JSON.parse(e.data)); });
    src.addEventListener('report', (e) => { if (mine()) $('report').textContent = JSON.parse(e.data); });
    // end에 reason이 있으면(웹 파드 재시작 등) 실행이 끝난 것이 아니므로 같은 실행에 다시 연결한다
    src.addEventListener('end', (e) => {
      if (!mine()) return;
      let d = {}; try { d = e.data ? JSON.parse(e.data) : {}; } catch (x) {}
      if (d && d.reason) { lost(runId, 'shutdown'); return; }
      src.close(); es = null; loadRuns();
    });
    // `error`는 서버의 실행 오류 이벤트(data 있음)일 수도 있고 EventSource의 연결 오류(data 없음)일 수도 있다.
    // 연결 오류면 브라우저 자동 재연결을 쓰지 않고 닫는다. 재연결은 retry로만 하므로 중복 연결되지 않는다
    src.addEventListener('error', (e) => {
      if (!mine()) return;
      if (e.data) { logLine('error', '[실행 오류] ' + JSON.parse(e.data).message); toast('실행 오류: ' + JSON.parse(e.data).message, true); return; }
      lost(runId, 'network');
    });
    loadRuns();
  }

  // ---- 다시 연결: 웹 파드가 재시작되면(ConfigMap을 바꿀 때마다) 서버는 같은 실행 id를 복구한다. 2초, 4초, 8초 … 최대 30초 간격으로
  //      GET /api/runs/<id>를 요청해 응답이 오면 다시 연결하고, 연속 RETRY_GONE번 404면 멈춘다. 다른 실행을 선택해도 멈춘다.
  const RETRY_MIN_MS = 2000, RETRY_MAX_MS = 30000, RETRY_GONE = 3;
  const retry = { run: null, timer: null, delay: 0, gone: 0, gen: 0 };
  function cancelRetry() {
    clearTimeout(retry.timer);
    retry.timer = null; retry.run = null; retry.delay = 0; retry.gone = 0; retry.gen++;
  }
  function lost(runId, why) {
    if (es) { es.close(); es = null; }
    if (current !== runId) return;
    if (lastState === 'finished') { loadRuns(); return; }   // 끝난 실행은 결과가 이미 표시돼 있다
    setTitle('warn', why === 'shutdown' ? '서버가 다시 시작되는 중입니다' : '서버와 연결이 끊겼습니다', false);
    $('stop').disabled = true;
    scheduleRetry(runId);
  }
  function scheduleRetry(runId) {
    clearTimeout(retry.timer);
    retry.run = runId;
    retry.delay = retry.delay ? Math.min(retry.delay * 2, RETRY_MAX_MS) : RETRY_MIN_MS;
    setText('railnote', `자동으로 다시 연결합니다 (${Math.round(retry.delay / 1000)}초 뒤).`);
    const gen = retry.gen;
    retry.timer = setTimeout(() => probe(runId, gen), retry.delay);
  }
  async function probe(runId, gen) {
    retry.timer = null;
    if (gen !== retry.gen || current !== runId) return;
    let r = null, st = null;
    try { r = await fetch(`/api/runs/${encodeURIComponent(runId)}`); try { st = await r.json(); } catch (e) {} } catch (e) {}
    if (gen !== retry.gen || current !== runId) return;      // 그 사이 다른 실행을 선택했다
    if (r && authProblem(r, st)) { cancelRetry(); return; }
    if (r && r.status === 404) {
      if (++retry.gone >= RETRY_GONE) {
        cancelRetry();
        setTitle('bad', '서버가 이 실행을 더 이상 알지 못합니다', false);
        setText('railnote', '다시 연결하지 않습니다. 지난 실행 목록에서 확인해 주세요.');
        $('stop').disabled = true; $('stop').hidden = true;
        loadRuns();
        return;
      }
    } else if (r && r.ok) {
      retry.gone = 0;
      attach(runId, true);                          // 결과 파일이 SSE로 오므로 끝난 실행이어도 한 번은 연결한다
      return;
    }
    scheduleRetry(runId);                            // 서버가 아직 준비되지 않았다(연결 실패, 5xx)
  }

  $('stop').addEventListener('click', async () => {
    const runId = current;                           // 응답을 기다리는 사이 다른 실행을 선택해도 그 실행은 건드리지 않는다
    if (!runId) return;
    const wasQueued = lastState === 'queued';
    $('stop').disabled = true;                       // 중복 클릭 방지
    let r = null, d = {};
    try { r = await fetch(`/api/runs/${encodeURIComponent(runId)}/stop`, { method: 'POST' }); try { d = await r.json(); } catch (e) {} } catch (e) {}
    const here = current === runId && !!es;
    if (r && authProblem(r, d)) { if (here) $('stop').disabled = false; return; }
    if (!r || !r.ok) { toast('중단 요청이 실패했습니다.', true); if (here) $('stop').disabled = false; return; }
    if (d && d.stopped === false) {                  // 서버가 중지할 대상이 없다고 응답하면 요청됨으로 표시하지 않는다
      toast('이미 끝난 이관입니다. 중단할 것이 없습니다.');
      loadRuns(); if (current === runId) refreshStatus(runId);
      return;
    }
    if (!here) { toast('중단을 요청했습니다.'); loadRuns(); return; }
    setText('stop', '중단 요청됨');
    if (wasQueued) { toast('중단을 요청했습니다.'); }
    else {
      logLine('error', '[중단 요청 — 지금 돌고 있는 단계(빌드 또는 LLM 호출)가 끝나면 멈춥니다]');
      toast('중단을 요청했습니다. 지금 돌고 있는 단계가 끝나면 멈춥니다.');
    }
  });
  // 현재 실행의 상태를 한 번 다시 읽는다(이미 끝난 실행의 중지 버튼 상태를 바로잡을 때 쓴다)
  async function refreshStatus(runId) {
    try {
      const r = await fetch(`/api/runs/${encodeURIComponent(runId)}`);
      const st = await r.json();
      if (r.ok && current === runId && st && st.state) setStatus(st);
    } catch (e) {}
  }

  // ---------------------------------------------------------------- 4. 지난 실행
  // 여러 곳(15초 주기, status 변화, attach, end)에서 호출한다. RUNS_COALESCE_MS 안의 호출은 한 번으로 묶고,
  // 늦게 온 이전 응답이 새 응답을 덮지 않도록 마지막 요청의 응답만 쓴다
  const RUNS_COALESCE_MS = 300;
  let runsSeq = 0, runsTimer = null;
  function loadRuns() {
    if (runsTimer) return;
    runsTimer = setTimeout(() => { runsTimer = null; fetchRuns(); }, RUNS_COALESCE_MS);
  }
  async function fetchRuns() {
    const seq = ++runsSeq;
    let r, d;
    try { r = await fetch('/api/runs'); d = await r.json(); } catch (e) { return; }   // 서버가 재시작 중이면 다음 주기에 다시 읽는다
    if (seq !== runsSeq) return;
    if (authProblem(r, d)) return;
    if (!d || !Array.isArray(d.runs)) return;
    setParallel(d.parallel);                           // 이전 서버(parallel 없음)면 안내를 숨긴다
    const ul = $('runs'); ul.innerHTML = '';
    $('runcount').textContent = d.runs.length ? `${d.runs.length}건` : '';
    if (!d.runs.length) { ul.innerHTML = '<li class="empty">아직 실행이 없습니다.</li>'; return; }
    for (const run of d.runs) {
      const li = document.createElement('li');
      li.className = (run.run_id === current) ? 'active' : '';
      const s = describe(run);
      const short = s.short + (remShort(run) ? ` · ${remShort(run)}` : '');
      const cls = run.state === 'running' || run.state === 'queued' ? 'running' : s.cls;
      const tag = run.flow === FLOW_REM ? '<span class="flowtag rem">취약점 해결</span>' : '<span class="flowtag">전체 진행</span>';
      // 각 행에 업로드한 파일 이름을 표시한다(이스케이프, 길면 말줄임하고 title에 전체 이름). 이름이 없는 이전 실행이면 실행 id를 쓴다
      const fname = run.upload ? String(run.upload) : run.run_id;
      li.innerHTML = `<span class="who"><span class="fname" title="${esc(fname)}">${esc(fname)}</span>` +
                     `<span class="meta2"><span class="id">${esc(run.run_id)}</span>${tag}<span class="when">${esc(fmtWhen(run.started || 0))}</span></span></span>` +
                     `<span class="state ${cls}">${esc(short)}</span>`;
      li.onclick = () => { attach(run.run_id, false, run.flow, run.upload); $('runcard').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      ul.appendChild(li);
    }
  }
  $('refresh').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); fetchRuns(); });

  // ---------------------------------------------------------------- 시작
  resetRail(FLOW_FULL); syncFlow(); loadConfigs(); loadRuns(); setInterval(loadRuns, 15000);
  if (location.hash.length > 1) attach(decodeURIComponent(location.hash.slice(1)));   // #<run id>는 공유할 수 있는 주소다
})();
</script>
</body>
</html>
