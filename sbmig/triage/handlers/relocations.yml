# dependency-relocation handler table.
#   from/to      : "groupId:artifactId"
#   version      : used only when the old declaration carried an explicit version (else left to dependencyManagement)
#   scope        : forced scope (optional)
#   packages     : a `package <p> does not exist` compile error for one of these (sub)packages triggers the
#                  relocation when the pom still declares `from` (the code was already migrated, the dep was not)
#   min_target_boot: only when the target Spring Boot major version is >= this
# com.fasterxml.jackson.* is intentionally absent: Boot 4 still manages Jackson 2 coordinates (keep as-is).
relocations:
  - { from: "javax.persistence:javax.persistence-api", to: "jakarta.persistence:jakarta.persistence-api", version: 3.2.0, packages: [jakarta.persistence] }
  - { from: "javax.persistence:persistence-api",       to: "jakarta.persistence:jakarta.persistence-api", version: 3.2.0, packages: [jakarta.persistence] }
  - { from: "org.hibernate.javax.persistence:hibernate-jpa-2.1-api", to: "jakarta.persistence:jakarta.persistence-api", version: 3.2.0, packages: [jakarta.persistence] }
  - { from: "javax.validation:validation-api",         to: "jakarta.validation:jakarta.validation-api", version: 3.1.1, packages: [jakarta.validation] }
  - { from: "javax.annotation:javax.annotation-api",   to: "jakarta.annotation:jakarta.annotation-api", version: 3.0.0, packages: [jakarta.annotation] }
  - { from: "javax.inject:javax.inject",               to: "jakarta.inject:jakarta.inject-api", version: 2.0.1, packages: [jakarta.inject] }
  - { from: "javax.transaction:javax.transaction-api", to: "jakarta.transaction:jakarta.transaction-api", version: 2.0.1, packages: [jakarta.transaction] }
  - { from: "javax.transaction:jta",                   to: "jakarta.transaction:jakarta.transaction-api", version: 2.0.1, packages: [jakarta.transaction] }
  - { from: "javax.mail:javax.mail-api",               to: "jakarta.mail:jakarta.mail-api", version: 2.1.3, packages: [jakarta.mail] }
  - { from: "com.sun.mail:javax.mail",                 to: "org.eclipse.angus:jakarta.mail", version: 2.0.3, packages: [jakarta.mail] }
  - { from: "javax.jms:javax.jms-api",                 to: "jakarta.jms:jakarta.jms-api", version: 3.1.0, packages: [jakarta.jms] }
  - { from: "javax.websocket:javax.websocket-api",     to: "jakarta.websocket:jakarta.websocket-api", version: 2.2.0, scope: provided, packages: [jakarta.websocket] }
  - { from: "javax.el:javax.el-api",                   to: "jakarta.el:jakarta.el-api", version: 6.0.1, packages: [jakarta.el] }
  - { from: "org.hibernate:hibernate-core",            to: "org.hibernate.orm:hibernate-core", version: 7.1.0.Final }
  - { from: "org.hibernate:hibernate-jpamodelgen",     to: "org.hibernate.orm:hibernate-processor", version: 7.1.0.Final }
  - { from: "org.hibernate:hibernate-validator",       to: "org.hibernate.validator:hibernate-validator", version: 9.0.1.Final }
  - { from: "org.springframework.boot:spring-boot-starter-web",          to: "org.springframework.boot:spring-boot-starter-webmvc",          min_target_boot: 4 }
  - { from: "org.springframework.boot:spring-boot-starter-aop",          to: "org.springframework.boot:spring-boot-starter-aspectj",         min_target_boot: 4 }
  - { from: "org.springframework.boot:spring-boot-starter-web-services", to: "org.springframework.boot:spring-boot-starter-webservices",    min_target_boot: 4 }
  - { from: "org.springframework.boot:spring-boot-starter-oauth2-client",               to: "org.springframework.boot:spring-boot-starter-security-oauth2-client",               min_target_boot: 4 }
  - { from: "org.springframework.boot:spring-boot-starter-oauth2-resource-server",      to: "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server",      min_target_boot: 4 }
  - { from: "org.springframework.boot:spring-boot-starter-oauth2-authorization-server", to: "org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server", min_target_boot: 4 }
