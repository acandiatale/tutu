  - { package: org.springframework.boot.servlet,                artifact: "org.springframework.boot:spring-boot-servlet",        managed: true }
  - { package: org.springframework.boot.http.converter.autoconfigure, artifact: "org.springframework.boot:spring-boot-http-converter", managed: true }
  # Log4j 1 API users (org.apache.log4j.Logger …) after log4j:log4j went away: the Log4j 2 bridge (log4j-bom 2.25.4,
