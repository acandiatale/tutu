# Spring Boot 4 type moves that UpgradeSpringBoot_4_0 (rewrite-spring 6.37.0) does not make — table of the handler
# `boot4-type-relocation-sweep` (sbmig/triage/handlers/spring7_sources.py). The type-attributed project recipe
# com.company.migrate.Boot4TypeRelocations (knowledge/recipes/base/spring-7-leftovers.yml) does the same renames for
# the files OpenRewrite parsed; the handler covers files it skipped (parse problems, openrewrite.exclusions) and
# wildcard imports of a live package. Keep both lists in sync.
#
# Verified 2026-10-26: old FQCN in spring-boot 3.3.13, new FQCN in the 4.1.0 jars (spring-boot, spring-boot-webmvc,
# spring-boot-web-server, spring-boot-servlet, spring-boot-http-converter); absent from every rewrite-spring 6.37.0 yml.
#
#   packages_gone : old packages that hold no class any more in Boot 4.1 — a wildcard import of one is dropped
#                   (explicit imports of the moved types the file uses replace it)
#   types         : from → to (fully-qualified); nested names follow (`ServerProperties.Servlet` → `…ServerProperties.Servlet`;
#                   whether the nested type still exists is the build's call)
version: 1
packages_gone:
  - org.springframework.boot.web.servlet.error
  - org.springframework.boot.web.servlet.server
  - org.springframework.boot.web.servlet.filter
  - org.springframework.boot.autoconfigure.http
types:
  - {from: org.springframework.boot.web.servlet.error.ErrorController,        to: org.springframework.boot.webmvc.error.ErrorController}
  - {from: org.springframework.boot.web.servlet.error.ErrorAttributes,        to: org.springframework.boot.webmvc.error.ErrorAttributes}
  - {from: org.springframework.boot.web.servlet.error.DefaultErrorAttributes, to: org.springframework.boot.webmvc.error.DefaultErrorAttributes}
  - {from: org.springframework.boot.web.server.ErrorPage,                     to: org.springframework.boot.web.error.ErrorPage}
  - {from: org.springframework.boot.web.server.ErrorPageRegistrar,            to: org.springframework.boot.web.error.ErrorPageRegistrar}
  - {from: org.springframework.boot.web.server.ErrorPageRegistry,             to: org.springframework.boot.web.error.ErrorPageRegistry}
  - {from: org.springframework.boot.web.server.ErrorPageRegistrarBeanPostProcessor, to: org.springframework.boot.web.error.ErrorPageRegistrarBeanPostProcessor}
  - {from: org.springframework.boot.web.servlet.server.ConfigurableServletWebServerFactory, to: org.springframework.boot.web.server.servlet.ConfigurableServletWebServerFactory}
  - {from: org.springframework.boot.web.servlet.server.ServletWebServerFactory, to: org.springframework.boot.web.server.servlet.ServletWebServerFactory}
  - {from: org.springframework.boot.web.servlet.server.CookieSameSiteSupplier, to: org.springframework.boot.web.server.servlet.CookieSameSiteSupplier}
  - {from: org.springframework.boot.web.servlet.server.DocumentRoot,          to: org.springframework.boot.web.server.servlet.DocumentRoot}
  - {from: org.springframework.boot.web.servlet.server.Jsp,                   to: org.springframework.boot.web.server.servlet.Jsp}
  - {from: org.springframework.boot.web.servlet.server.Session,               to: org.springframework.boot.web.server.servlet.Session}
  - {from: org.springframework.boot.web.servlet.server.SessionStoreDirectory, to: org.springframework.boot.web.server.servlet.SessionStoreDirectory}
  - {from: org.springframework.boot.web.servlet.server.StaticResourceJars,    to: org.springframework.boot.web.server.servlet.StaticResourceJars}
  - {from: org.springframework.boot.web.servlet.ServletComponentScan,         to: org.springframework.boot.web.server.servlet.context.ServletComponentScan}
  - {from: org.springframework.boot.web.servlet.MultipartConfigFactory,       to: org.springframework.boot.servlet.MultipartConfigFactory}
  - {from: org.springframework.boot.web.servlet.filter.OrderedCharacterEncodingFilter, to: org.springframework.boot.servlet.filter.OrderedCharacterEncodingFilter}
  - {from: org.springframework.boot.web.servlet.filter.OrderedFormContentFilter, to: org.springframework.boot.servlet.filter.OrderedFormContentFilter}
  - {from: org.springframework.boot.web.servlet.filter.OrderedHiddenHttpMethodFilter, to: org.springframework.boot.servlet.filter.OrderedHiddenHttpMethodFilter}
  - {from: org.springframework.boot.web.servlet.filter.OrderedRequestContextFilter, to: org.springframework.boot.servlet.filter.OrderedRequestContextFilter}
  - {from: org.springframework.boot.web.servlet.filter.OrderedFilter,         to: org.springframework.boot.servlet.filter.OrderedFilter}
  - {from: org.springframework.boot.web.servlet.filter.ApplicationContextHeaderFilter, to: org.springframework.boot.servlet.filter.ApplicationContextHeaderFilter}
  - {from: org.springframework.boot.autoconfigure.web.ServerProperties,       to: org.springframework.boot.web.server.autoconfigure.ServerProperties}
  - {from: org.springframework.boot.autoconfigure.http.HttpMessageConverters, to: org.springframework.boot.http.converter.autoconfigure.HttpMessageConverters}
