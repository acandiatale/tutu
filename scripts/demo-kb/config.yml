# KB demo (v2, see scripts/demo-kb/run.sh): two migrations of the same project with ONE demo KB.
#   run 1: the replayed LLM writes a fix script for the case `compile|cannot_find_symbol|JsonComponent` (Boot 4 renamed
#          @JsonComponent to @JacksonComponent) → stored as kb/scripts/8dc5ebcf6d/v1.py → BUILD SUCCESS → credited
#   run 2: fresh copy, same error → the stored v1 runs first (`reuse`, no fix LLM call) → BUILD SUCCESS → credited again
# The structure review is one LLM call in each run (replay/llm-001.json of the fixture), so run 1 = 2 calls, run 2 = 1.
# Appended after config/artifacts.local-e2e.yml; a real LLM profile given to run.sh is appended after this file.
llm:
  provider: fake
  base_url: "replay:fixtures/projects/boot3/replay"   # run.sh swaps in <fixture>/replay for another fixture
review:
  enabled: true
kb:
  dir: out/demo-kb/kb
