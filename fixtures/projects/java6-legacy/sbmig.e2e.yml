# Per-fixture config override, appended by scripts/e2e.py after config/artifacts.local-e2e.yml
# (`--config config/artifacts.local-e2e.yml --config fixtures/projects/java6-legacy/sbmig.e2e.yml`).
# Replayed ("scripted") LLM so the run is offline and deterministic: replay/llm-001.json ports the removed
# sun.misc.BASE64Encoder/Decoder in Codec.java to java.util.Base64 (the jdk-removed-apis advisory hint is in that
# prompt). Responses are consumed in order; the last one repeats.
llm:
  provider: fake
  base_url: "replay:fixtures/projects/java6-legacy/replay"
# Own KB: every KB candidate is appended to every later plan (kb.try_candidates_in_plan), so a shared KB would leak
# this fixture's harvested case into the other fixtures. scripts/e2e.py clears it before the run (expect.kb.dir).
kb:
  dir: out/e2e/kb-java6-legacy
