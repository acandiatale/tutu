# Per-fixture config override, appended by scripts/e2e.py after config/artifacts.local-e2e.yml
# (`--config config/artifacts.local-e2e.yml --config fixtures/projects/boot2-hystrix-command/sbmig.e2e.yml`).
# Replayed ("scripted") LLM so the run is offline and deterministic: replay/llm-001.json ports the programmatic
# HystrixCommand subclass to Resilience4j (the hystrix advisory hint is in that prompt), replay/llm-002.json answers
# the caller's cluster with "no change needed" (consumed in order; the last response repeats).
llm:
  provider: fake
  base_url: "replay:fixtures/projects/boot2-hystrix-command/replay"
# Own KB: every KB candidate is appended to every later plan (kb.try_candidates_in_plan), so a shared KB would leak
# this fixture's harvested case into the other fixtures. scripts/e2e.py clears it before the run (expect.kb.dir).
kb:
  dir: out/e2e/kb-hystrix-command
