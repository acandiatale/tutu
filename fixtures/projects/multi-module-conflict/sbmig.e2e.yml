# Per-fixture config override, appended by scripts/e2e.py after config/artifacts.local-e2e.yml
# (`--config config/artifacts.local-e2e.yml --config fixtures/projects/multi-module-conflict/sbmig.e2e.yml`).
# Replayed ("scripted") LLM so the run is offline and deterministic: replay/llm-001.json adds farewell() to the kept
# (first-wins, from `core`) module/comp-jar/.../shared/Shared.java — the "Module merge notes" section and the dropped
# `web` copy are in that prompt. replay/llm-002.json answers the KB harvest with NONE. Responses are consumed in
# order; the last one repeats.
llm:
  provider: fake
  base_url: "replay:fixtures/projects/multi-module-conflict/replay"
# Own KB: every KB candidate is appended to every later plan (kb.try_candidates_in_plan), so a shared KB would leak
# this fixture's harvested case into the other fixtures. scripts/e2e.py clears it before the run (expect.kb.dir).
kb:
  dir: out/e2e/kb-multi-module-conflict
