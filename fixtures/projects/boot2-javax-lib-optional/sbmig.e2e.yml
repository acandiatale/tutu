# Per-fixture config override, appended by scripts/e2e.py after config/artifacts.local-e2e.yml
# (`--config config/artifacts.local-e2e.yml --config fixtures/projects/boot2-javax-lib-optional/sbmig.e2e.yml`).
# Lists replace (deep_merge), so this is the complete optional list: still exactly 8 artifacts —
# org.slf4j:slf4j-api is swapped for the in-house com.company.legacy:legacy-web-lib 2.0.0 (jakarta build).
artifacts:
  optional:
    - { group_id: org.apache.commons, artifact_id: commons-lang3,  version: 3.17.0 }
    - { group_id: com.google.guava,   artifact_id: guava,          version: 33.4.8-jre }
    - { group_id: org.projectlombok,  artifact_id: lombok,         version: 1.18.38 }
    - { group_id: org.mapstruct,      artifact_id: mapstruct,      version: 1.6.3 }
    - { group_id: com.fasterxml.jackson.core, artifact_id: jackson-databind, version: 2.19.2 }
    - { group_id: org.apache.commons, artifact_id: commons-collections4, version: 4.5.0 }
    - { group_id: commons-io,         artifact_id: commons-io,     version: 2.19.0 }
    - { group_id: com.company.legacy, artifact_id: legacy-web-lib, version: 2.0.0 }
# v2 replayed LLM (llm.provider fake): replay/llm-001.json answers the structure review (replay_role
# structure_review), the other entries answer fix-script requests by `match` on `case: <case_id>`
# (case_id = sha1(L2)[:10]; first unused match, the last match repeats, no match = "no fix").
llm:
  provider: fake
  base_url: "replay:fixtures/projects/boot2-javax-lib-optional/replay"
# Own KB (v2: stored fix scripts per case, reviews.jsonl, error cases): a shared KB would let one fixture
# reuse another's scripts. scripts/e2e.py clears it before the run (expect.kb.dir).
kb:
  dir: out/e2e/kb-boot2-javax-lib-optional
