# Per-fixture config override (boot2-javax-lib), appended by scripts/e2e.py after config/artifacts.local-e2e.yml
# (`--config config/artifacts.local-e2e.yml --config fixtures/projects/boot2-javax-lib/sbmig.e2e.yml`).
# v2 replayed LLM (llm.provider fake): replay/llm-001.json answers the structure review (replay_role
# structure_review), the other entries answer fix-script requests by `match` on `case: <case_id>`
# (case_id = sha1(L2)[:10]; first unused match, the last match repeats, no match = "no fix").
llm:
  provider: fake
  base_url: "replay:fixtures/projects/boot2-javax-lib/replay"
# Own KB (v2: stored fix scripts per case, reviews.jsonl, error cases): a shared KB would let one fixture
# reuse another's scripts. scripts/e2e.py clears it before the run (expect.kb.dir).
kb:
  dir: out/e2e/kb-boot2-javax-lib
# v2.1z-e (2026-11-02): the jakarta build discovery is OFF here on purpose. `fixtures/libs` also installs
# legacy-web-lib 2.0.0 / 3.0.0 (jakarta builds, for boot2-javax-lib-optional), and the zero-LLM pre-try
# `sbmig-jakarta` would find 2.0.0 in the local repository and fix the two cases without the LLM — this fixture exists
# to keep the "LLM declines → BLOCKED external_javax_api" path under test; servlet-javax-grid covers the discovery.
libraries:
  discover_jakarta_builds: false
